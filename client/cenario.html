<!doctype html><html><head><meta charset="utf-8"><title>Karmika — modelos do Herik</title>
<style>body{margin:0;background:#20242a;color:#ddd;font:12px sans-serif}#g{display:grid;grid-template-columns:repeat(var(--c,8),200px);gap:2px}.c{position:relative;width:200px;height:200px;background:#2a2e34}.c b{position:absolute;left:4px;top:3px;font-weight:600}.c i{position:absolute;left:4px;bottom:3px;font-style:normal;color:#9a9}</style></head><body><div id="g"></div>
<script type="module">
/* página de teste (03/11): todos os modelos de cenário do Herik lado a lado (?p=vegetacao/arvores filtra uma pasta) */
import * as THREE from 'three';
import { artManifest, artReady, artMesh, artGeo } from '/src/arte3d.ts';
const qp = new URLSearchParams(location.search), only = qp.get('p'), cols = +(qp.get('c') || 8); document.body.style.setProperty('--c', cols);
const M = await artManifest(); const L = [...M.values()].filter((e) => !only || e.pasta.startsWith(only));
await artReady(L.map((e) => e.id));
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(1); r.setSize(200, 200); r.outputColorSpace = THREE.SRGBColorSpace;
const sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xdde8ff, 0x3a3020, 1.6)); const d = new THREE.DirectionalLight(0xfff0d0, 2.4); d.position.set(5, 9, 7); sc.add(d);
const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 500); const g = document.getElementById('g');
for (const e of L) { const m = artMesh(e.id); const div = document.createElement('div'); div.className = 'c'; div.innerHTML = `<b>${e.id}</b><i>${e.tris} tris · ${e.size.map((v) => v.toFixed(1)).join('×')}</i>`; g.appendChild(div);
  if (!m) continue; sc.add(m); const G = artGeo(e.id); const R = G.boundingSphere.radius, cy = G.boundingSphere.center.y;
  cam.position.set(R * 2.2, cy + R * 1.2, R * 2.9); cam.lookAt(0, cy, 0); r.render(sc, cam); sc.remove(m);
  const img = new Image(); img.src = r.domElement.toDataURL(); img.style.cssText = 'width:200px;height:200px'; div.prepend(img); }
window.__ready = true;
</script></body></html>
