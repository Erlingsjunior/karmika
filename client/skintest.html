<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block}</style></head><body><canvas id="c" width="1600" height="800"></canvas>
<script type="module">

 window.__curlAx = new URLSearchParams(location.search).get('ax') || 'x'; for (const k of ['bladeSg', 'palmSg', 'shSg', 'mrel', 'curlSg', 'twY', 'swap', 'rollL', 'rollR', 'norel', 'diag']) { const v = new URLSearchParams(location.search).get(k); if (v) window['__' + k] = +v; }
