<!doctype html><html><head><meta charset="utf-8"><title>Karmika — estação com arte</title><style>body{margin:0;background:#2a2e34}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script type="module">
/* página de teste (03/11): a forja ao ar livre montada com as peças do Herik (?v=1) */
import * as THREE from 'three';
import { artPreload, realizeMarkers } from '/src/arte3d.ts';
import { buildStation } from '/src/stations3d.ts';
await artPreload();
const cv = document.getElementById('c'); const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); r.setSize(1200, 800, false); r.outputColorSpace = THREE.SRGBColorSpace;
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x2a2e34); sc.add(new THREE.HemisphereLight(0xdde8ff, 0x3a3020, 1.5)); const d = new THREE.DirectionalLight(0xfff0d0, 2.4); d.position.set(6, 12, 8); sc.add(d);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshToonMaterial({ color: 0x5a5040 })); ground.rotation.x = -Math.PI / 2; sc.add(ground);
const v = +(new URLSearchParams(location.search).get('v') || 1); let s = 0; const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
const o = buildStation(v, rnd); realizeMarkers(o.group); sc.add(o.group);
const cam = new THREE.PerspectiveCamera(35, 1.5, 0.1, 100); cam.position.set(5, 5, 7); cam.lookAt(0, 1, 0); r.render(sc, cam); window.__ready = true;
</script></body></html>
