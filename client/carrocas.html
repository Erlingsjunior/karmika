<!doctype html><html><head><meta charset="utf-8"><title>Karmika — catálogo da flora</title><style>body{margin:0;background:#2a2e34;color:#ddd;font:13px/1.3 Georgia,serif}canvas{display:block}#n{position:fixed;left:8px;top:6px;opacity:.8}</style></head><body><canvas id="c" width="1600" height="900"></canvas><div id="n">carrocas.html — as duas carroças (prancha 35); ?sp=oak,fir para escolher; ?h=7 altura</div>
<script type="module">
import * as THREE from 'three';
import { buildSteamWagon, buildOreCart } from '/src/caravanas.ts';
import { artPreload } from '/src/arte3d.ts';
await artPreload();
const q = new URLSearchParams(location.search);
const ALL = ['steam','dwarf'];
const SP = (q.get('sp') || ALL.join(',')).split(','), H = 1.2;
const cv = document.getElementById('c'); const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); r.setSize(1600, 900, false); r.shadowMap.enabled = true;
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x2a2e34);
sc.add(new THREE.HemisphereLight(0xdde8ff, 0x3a3020, 1.4)); const d = new THREE.DirectionalLight(0xfff0d0, 2.2); d.position.set(6, 12, 8); d.castShadow = true; sc.add(d);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 30), new THREE.MeshToonMaterial({ color: 0x4a5a3a })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; sc.add(ground);
const cols = Math.min(8, SP.length), rows = Math.ceil(SP.length / cols), gap = 7;
SP.forEach((sp, i) => { const g = (sp === 'steam' ? buildSteamWagon() : buildOreCart()).root; g.rotation.y = 0.7; g.position.set((i % cols - (cols - 1) / 2) * gap, 0, Math.floor(i / cols) * -gap * 1.6); g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); sc.add(g); });
const cam = new THREE.PerspectiveCamera(28, 1600 / 900, 0.1, 200); cam.position.set(0, 6 + rows * 2, cols * gap * 0.85 + rows * 5); cam.lookAt(0, 2, -(rows - 1) * gap * 0.8);
let t = 0; function frame() { t += 1 / 60; r.render(sc, cam); window.__ready = true; requestAnimationFrame(frame); } frame();
</script></body></html>
