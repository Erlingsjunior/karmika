<!doctype html><html><head><meta charset="utf-8"><title>Karmika — montarias</title><style>body{margin:0;background:#2a2e34}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script type="module">
/* página de teste (03/11): os cavalos do Herik com sela, andando (?mv=0 parado, 2 passo, 5 trote, 10 galope; ?ph=tempo) */
import * as THREE from 'three';
import { horsesPreload } from '/src/montarias3d.ts';
import { MOUNTS, mountModel } from '/src/companions.ts';
await horsesPreload();
const q = new URLSearchParams(location.search), mv = +(q.get('mv') ?? 2), ph = +(q.get('ph') ?? 0.4);
const cv = document.getElementById('c'); const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); r.setSize(1600, 600, false); r.outputColorSpace = THREE.SRGBColorSpace;
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x2a2e34); sc.add(new THREE.HemisphereLight(0xdde8ff, 0x3a3020, 1.5)); const d = new THREE.DirectionalLight(0xfff0d0, 2.4); d.position.set(6, 12, 8); sc.add(d);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 20), new THREE.MeshToonMaterial({ color: 0x4a5a3a })); ground.rotation.x = -Math.PI / 2; sc.add(ground);
const ids = (q.get('ids') || 'mount_horse,mount_jarlsheim,mount_brass,mount_palfrey,mount_nightmare,mount_black').split(',');
const M = ids.map((id, i) => { const m = mountModel(MOUNTS[id]); m.root.position.set((i - (ids.length - 1) / 2) * 3.4, 0, 0); m.root.rotation.y = Math.PI / 2; sc.add(m.root); return m; });
for (let t = 0; t < ph; t += 1 / 60) for (const m of M) m.hz.pose({ dt: 1 / 60, mv, idle: mv < 0.1 });
const cam = new THREE.PerspectiveCamera(30, 1600 / 600, 0.1, 200); cam.position.set(0, 3, 17); cam.lookAt(0, 1.2, 0); r.render(sc, cam); window.__ready = true;
</script></body></html>
