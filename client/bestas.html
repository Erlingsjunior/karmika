<!doctype html><html><head><meta charset="utf-8"><title>Karmika — catálogo das bestas novas</title><style>body{margin:0;background:#2a2e34}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script type="module">
/* página de teste (02/11): os corpos dos bichos novos lado a lado — sereia, rainha, goblin, xamã, chefe, espírito e o Gênio */
import * as THREE from 'three';
import { buildSiren, buildGoblin } from '/src/bestas3d.ts';
import { buildForm } from '/src/chefes.ts';
const cv = document.getElementById('c'); const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); r.setSize(1600, 700, false);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x2a2e34);
sc.add(new THREE.HemisphereLight(0xdde8ff, 0x3a3020, 1.4)); const d = new THREE.DirectionalLight(0xfff0d0, 2.2); d.position.set(6, 12, 8); sc.add(d);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 30), new THREE.MeshToonMaterial({ color: 0x4a5a3a })); ground.rotation.x = -Math.PI / 2; sc.add(ground);
const W = [[buildSiren(0x9ac8b0, 0x2a7a7a), 1.15], [buildSiren(0xb8d8d0, 0x3a3a8a, 0x1a3a5a, true), 1.6], [buildGoblin(0x6a8a3a, 'faca'), 0.9], [buildGoblin(0x5a7a4a, 'cajado'), 0.95], [buildGoblin(0x4a6a2a, 'machado', true), 1.35],
  [buildForm({ kind: 'wraith', skin: 0xb8a8d8, cloth: 0x2a1a4a, head: 'skull', glow: 0x9a6aff }), 1], [buildForm({ kind: 'wraith', skin: 0x3a8aaa, cloth: 0x0a2a3a, head: 'bare', glow: 0x6ad8ff, bulk: 1.5, claws: true }), 1.7]];
const st = new URLSearchParams(location.search).get('st') || 'idle', wk = +(new URLSearchParams(location.search).get('w') || 0);
W.forEach(([g, s], i) => { g.root.scale.setScalar(s); g.root.position.set((i - 3) * 2.3, 0, 0); g.root.rotation.y = 0.5; sc.add(g.root); });
const cam = new THREE.PerspectiveCamera(26, 1600 / 700, 0.1, 200); cam.position.set(0, 3.2, 17); cam.lookAt(0, 1, 0);
let t = 0; function frame() { t += 1 / 60; W.forEach(([g], i) => g.update({ state: st, t, id: i }, 1 / 60, wk, 0, 0, st === 'chase' ? 3 : 0)); r.render(sc, cam); window.__ready = true; requestAnimationFrame(frame); } frame();
</script></body></html>
