    '<h3>Chronicler\'s notes</h3><p class="fnote"><span class="nb">✎</span>While copying the six stories into this volume, I noticed that in three of them a man in a grey cloak appears in passing: on the bridge of Velmora, offering a boat; in Thrain\'s galleries, buying the leftover iron; at the gates of Ossária, the night before, asking the way. No one describes his face. Everyone describes the cloak.</p>'  });

  add({ toc: 'Book XVII — The first thread', lv: 'XVII', eyebrow: 'Book XVII', title: 'The village of Karmika and the first thread', start: true, body:
    '<p>Every human soul begins in the same place, and I went there to hear how it begins. The village of Karmika is small: a fountain, a stone square, the inn, the forge, the temple and a guard who never leaves the gate. There are no heroes there. There are people who need help, and the first thread of every story is always that: someone needing you.</p>' +
    '<h3>Those who wait in the square</h3>' +
    '<p><b>Garrick</b>, the guard, gives out the first hunts, and starts small, with the red rats of the graveyard. <b>Lúcia</b> is looking for her husband, who vanished near the Abandoned Church. <b>Eldrin</b>, the temple sage, sends newcomers to the Forgotten Cemetery and to the ruins where imps crawl out. <b>Doran</b>, the armorer, teaches how to make your first axe. <b>Thorin</b>, the dwarf merchant, buys everything and laughs at everything. And there is the alchemist <b>Morwen</b>, the huntress <b>Kaela</b> and the tamer <b>Corwin</b>, who looks after the mounts. The names of those who run the village sound like adventure; the Norse ones are heard only among the dwarves and in the north.</p>' });
  add({ lv: 'XVII', body:
    '<h3>The Northern Path</h3>' +
    '<p>The villagers tell the same sequence, with small changes depending on who is telling it. First the rats, the coyotes on the road and the wolves to the east. Then the Warden of the Woods, an ancient tree that went mad and began attacking the woodcutters. Then the shadows in the ruins and, at last, what lives in the church: the <b>Prince of Ashes</b>. Whoever reaches the end of that road swears the Oath of the North before Garrick, and the village stops being their whole world.</p>' +
    '<p>I noticed something curious: no one in Karmika is ever left without direction. When one task ends, someone is already pointing to the next: "go talk to So-and-so," "there are people in need in another city," "you have done all you could here." The priests say it is the thread of the Labyrinth, which is never lost from sight.</p>' +
    '<h3>The call of Askavik</h3>' +
    '<p>At twenty-five, a letter arrives. Eldrin hands it over with a trembling hand: Askavik is calling. There the newcomer meets <b>Master Halvard</b> of the War School, the weaveries of the two banners, the market, the church and Elowen\'s shop. And they meet <b>Old Gunnhild</b>, keeper of the relics, who takes them to the Seer.</p>' });
  add({ lv: 'XVII', body:
    '<h3>The Seer of Paths</h3>' +
    '<p><b>Hrefna</b> lives in a sanctuary of standing stones, behind a veil of violet light, and a thread of sand falls before her without ever running out. Marghar has no priests, but he has those who follow him willingly, and Hrefna is one of them. She follows the Essences, those who walk beside Marghar, and the people call the one she lights the most candles for the Goddess of Paths: Ilmara, the Cartographer of Steps, the first to map the labyrinth. Hers is the Scroll of Return, which opens a road of light to the fountain back home.</p>' +
    '<p>She asks twelve questions. "A wounded wolf crosses your path at night. You..." "What do you fear losing most?" "Before a locked door, you..." Each answer weighs toward two or three paths, and the karma the soul has gathered so far weighs along with it. At the end she names the strongest path and the second, and hands the choice back:</p>' +
    '<blockquote>What I saw is where your soul leans, not a chain. In Karmika, the one who chooses is you.</blockquote>' +
    '<p>Whoever accepts sets out on a journey to a master: <b>Thorgrim Ironhand</b>, at Odin\'s Fortress; <b>Grand Master Cassius</b>, at the Abbey of the Dawn; <b>Ilsa Van Rhal</b>, at the Silver Bastion; <b>Architect Ylva</b>, at the Academy of Askavik; <b>Count Vladislav III</b>, on the Hill; <b>Ulfrun the Mother Alpha</b>, at the Ancient Howl; <b>Archmage Aurelian Vesk</b>, at the Pinnacle; and <b>Malgrath</b>, in the Vale. Whoever prefers to wait goes on as a human, and some spend their whole life that way, building houses, walls and guilds.</p>' +
    '<h3>Chronicler\'s notes</h3><p class="fnote"><span class="nb">✎</span>The bride of the marshes bears the same name as the Crimson Mother. The villagers say it is a coincidence, that Hemara was a common name in those days. The vampires of the Hill, as far as I know, never speak their goddess\'s name when they cross the marshes.</p><p class="fnote"><span class="nb">✎</span>I counted Hrefna\'s candles. There are ten. I asked whose the tenth was, the only one she never lights. She answered that when she remembers, she will tell me.</p>'  });

  add({ toc: 'Book XVIII — The Abandoned Cathedral', lv: 'XVIII', eyebrow: 'Book XVIII', title: 'The Abandoned Cathedral', start: true, body:
    '<p>There is a cathedral not far from Karmika that no one visits by day anymore. It belonged to the church, and then to a bishop who stopped praying to Auréon and began setting the table for another. At the door, bound by chains that are not of this world, waits <b>Sister Ysolde</b>, a bluish spirit who asks those who pass to purify the nave.</p>' +
    '<h3>The vessel of sacrifice</h3>' +
    '<p>The dead inside do not stay dead. That is why no door opens by killing them all: on every floor there is a <b>Vessel of Sacrifice</b>, which fills with the blood of those who fall there. Zombies give little, ghouls give more, and the guardians of the crypts fill the chalice in one go. It takes <b>six hundred and sixty-six liters</b> to reach the last door: one hundred and eleven on the first floor, one hundred and sixty-six on the second, two hundred and twenty-two on the third and one hundred and sixty-seven on the fourth.</p>' });
  add({ lv: 'XVIII', body:
    '<h3>The Fallen Bishop</h3>' +
    '<p>The three guardians of the crypts carry three seals: the Crypt Executioner, the Bone Prince and the Mausoleum Warden. Whoever gathers all three and fills the chalice finds, at the bottom, the <b>Fallen Bishop</b>. He raises his crozier and says that Gorvak is hungry and he is the mouth. When he bleeds, he calls the flock of the crypts; when he bleeds more, he calls ghouls and a prince.</p>' +
    '<p>Gorvak, the Endless Banquet, of whom I spoke in the second book, never asks for anything. He only sets the table. The Cathedral is proof that someone always accepts the invitation.</p>' +
    '<h3>Chronicler\'s notes</h3><p class="fnote"><span class="nb">✎</span>Ysolde always counts the measures aloud while the vessels fill. Whoever leaves the Cathedral before the end hears her start again from zero. Her chains are black and cold, like Ishkara\'s, but they have one link, just one, of gold. Ishkara does not use gold.</p>'  });

  add({ toc: 'Book XIX — The Raven Clan', lv: 'XIX', eyebrow: 'Book XIX', title: 'The Raven Clan', start: true, body:
    '<p>Of the eight paths, the first the Library was able to follow up close was the warrior\'s. I climbed to Odin\'s Fortress after Thorgrim Ironhand, master-at-arms of the Raven Clan, and wrote down the ten trials he sets for those who arrive. In each one, the Eye judges not what was done, but why.</p>' +
    '<h3>The oath</h3>' +
    '<p>The first trial is to swear. One swears for those who cannot fight, or for the clan and for Odin, or for one\'s own glory, and the Eye weighs each of the three promises differently. Then come the fjord of Skjoldvik, the walking dead and the iron for the fortress.</p>' +
    '<h3>The deserter</h3>' +
    '<p>In Fjallbrún the apprentice finds <b>Halfdan</b>, who fled the clan. They can bring him to judgment, let him go and lie to the master, or execute him on the spot. Thorgrim never says which was the right answer. He only says that the Eye saw.</p>' });
  add({ lv: 'XIX', body:
    '<h3>The envoy of the Thread</h3>' +
    '<p>In the sixth trial, the clan sends the apprentice to Askavik to speak with Paladin Aldric, envoy of the Order of the Thread. The warrior decides whether the Raven Clan allies with the Thread, refuses, or first hears out the Unraveled. The Norse have no banner yet; perhaps they will receive one from the hands of whoever passes through there.</p>' +
    '<h3>The duel of Hrimgard</h3>' +
    '<p>In Hrimgard a rival falls in the snow in the middle of the duel. The apprentice can wait for him to rise, take advantage of the fall or call it a draw. Of the three, the Eye smiles on only two.</p>' +
    '<h3>Valhalla awaits</h3>' +
    '<p>In the last trial, Thorgrim is mortally wounded. The apprentice fights beside him to the end, or drags him to the healers against his will, or grants him an honorable death in one last duel. Whoever finishes receives the title of <b>Raven Warrior</b>. And the other seven paths? I am still climbing their roads.</p>' +
    '<h3>Chronicler\'s notes</h3><p class="fnote"><span class="nb">✎</span>In the clan\'s hall an old shield hangs above the throne, with one name scratched out and another carved over it: Ulfar. Thorgrim says it is just a shield. The fortress ravens never perch on it.</p>'  });

  add({ toc: 'Book XX — What one carries', lv: 'XX', eyebrow: 'Book XX', title: 'What one carries along the road', start: true, body:
    '<p>A walker is also what they carry. The Library keeps lists of things that have passed through many hands, and the rarest have names. There are seven steps of rarity, from the grey common to the magic, the rare, the legendary, the epic. Above them stand the <b>uniques</b>, pieces of a culture with power of their own, and the <b>relics</b>, which change the way one fights and are sometimes not even weapons.</p>' +
    '<h3>Of the cultures</h3>' +
    '<p>The Norse tell of Mjölnir, of Gungnir and of the Boots of Sleipnir. The dwarves, of the Aegis of Eitr and the Ember of Surtr, which sets ablaze everything it touches. The paladins, of Excalibur and the Chalice of Marghar, which prevents death once in a while. The hunters, of Van Rhal\'s Silver Crossbow. The vampires speak softly of Dracula\'s Heart; the werewolves, of the Fang of the First Howl; the warlocks, of the Stepless Book, whose spells cost a little life. A relic nearly always comes to someone of its own culture, as if it knew whose hands to fall into.</p>' +
    '<p>None of it is pink, by the way. I asked why, and a dwarf smith looked at me as if I were mad.</p>' });

  add({ toc: 'Book XXI — Those who walk together', lv: 'XXI', eyebrow: 'Book XXI', title: 'Those who walk together', start: true, body:
    '<p>For a long time I wrote about souls who walked alone. That is no longer so. Today walkers band together in groups of up to six, and a group is a curious thing to watch: the beast one brings down counts for all, and the quest one accepts appears, as if in a whisper, to the others. But no one is carried: within a group, the difference in experience cannot exceed ten levels.</p>' +
    '<h3>The raven and the board</h3>' +
    '<p>Every village has an iron mailbox with a raven on top. Through the raven go letters, gold, gear and bills, and the raven waits for whoever is away to deliver when they arrive. On the Square Board, besides the townsfolk\'s contracts, walkers nail up their own requests, leave the gold in safekeeping and wait for someone to fulfill them.</p>' });
  add({ lv: 'XXI', body:
    '<h3>When the banners cross</h3>' +
    '<p>Outside the villages, the Thread and the Unraveled attack each other when they meet, and no one pays in karma for defending their banner. No one is forced to fight, however. Inside the villages the ground is sacred, and no blade cuts.</p>' +
    '<p>Between those of the same banner it is different. One does not harm another, unless they make the conscious decision to hunt their own side. Whoever does so has their name written in red, and the Eye charges for every blow. Whoever strikes back, however, owes nothing.</p>' +
    '<p>And there is the duel, agreed between two, which holds anywhere and in which no one dies: whoever falls to their knees first loses. The dwarves call it a chat.</p>' });

  add({ toc: 'Book XXII — The Thread of Life', lv: 'XXII', eyebrow: 'Book XXII', title: 'The Thread of Life', start: true, body:
    '<p>Some think death in Karmika is a door that opens only once. It is not quite so. Every soul that walks is bound to the body by a thread, and the thread has <b>three breaths</b>. Whoever falls on the road rises again at the fountain of their home: it is a fall, and the thread loses a breath. The breaths come back slowly, one each day, like the breathing of someone asleep.</p>' +
    '<p>Before the twentieth level, while the Eye still sleeps, no one spends the thread. Marghar does not collect from those he has not yet seen.</p>' +
    '<h3>When the thread breaks</h3>' +
    '<p>Whoever falls with no breath left <b>leaves the flesh</b>. Those who have seen it always tell the same thing: a spark leaves the fallen body, grows a little, begins to tremble and suddenly rises, swift and thin as a needle, until it vanishes into the sky.</p>' +
    '<p>The soul then reaches the <b>center of the labyrinth</b>, which the old ones call the <b>Threshold</b>. It is a floor of light suspended above Karmika. From up there one sees the entire labyrinth, as far as the eye can reach: walls that rise and give way, corridors that close and open, places that darken into a black path and others that brighten. It is the world happening, right now, down below.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Those who wait at the center</h3>' +
    '<p>To the left of the newcomer stands <b>Orvalen, the Reader of Tracks</b>, hooded, with a staff and a cold lantern. Tracks of light swirl at his feet. He is the one who reads the life that has ended, step by step, and who gives it back or erases it.</p>' +
    '<p>To the right stands <b>Sael, She Who Returned</b>, the only one who reached the center and came back. She holds a golden thread running from her hand to the newly arrived soul, and she is the one who guides the return.</p>' +
    '<p>Between the two and the far end floats the <b>Karmic Eye</b>, gazing at whoever has arrived. And far in the back, in a golden glow, an immense silhouette can be made out, calm, leaning over a cosmic pool: <b>Marghar</b>, seeing everything that happens. No one has seen him raise his eyes. There the soul speaks with the two Essences and chooses, and there are only three choices.</p>' });
  add({ lv: 'XXII', body:
    '<h3>The three returns</h3>' +
    '<ul class="plain">' +
    '<li><b>Return to the same body.</b> Orvalen gives back the tracks as they are. The soul enters again where it was, unchanged, and comes back in debt. The old ones call this the <b>Karmic Debt</b>: half of everything the soul learns afterward pays for the walking it left undone, until the account is settled.</li>' +
    '<li><b>Reincarnate.</b> Orvalen erases the body\'s tracks, and Sael leads the soul to a new body. The soul chooses another people and another face and keeps the rest: the name, how far it has walked, what it carried, the gold, the vault and the promises. Only the class stays behind, and the path is read again by Hrefna. The spells and strength of the old body come back as loose points, so the soul can set right what it got wrong.</li>' +
    '<li><b>Pay with a Tear.</b> Whoever keeps a Tear of the Eye offers it to the Eye and pays for the whole return, with no debt at all. The soul finds its body again at the sacred place of its path: the paladin at the Abbey of the Dawn, the technocrat at the Academy, the vampire in the Count\'s castle.</li>' +
    '</ul>' +
    '<h3>The echo of the past life</h3>' +
    '<p>Whoever reincarnates and returns to the same road finds an echo. The new body does not know, but the soul remembers, and learns <b>four times faster</b> until it reaches the point where it fell. There the echo falls silent, and the road returns to its usual pace. The masters of the academies recognize these students: they learn like someone remembering.</p>' });
  add({ lv: 'XXII', body:
    '<h3>The Eye that sees and hides</h3>' +
    '<p>Whoever rises to the Threshold sees the Eye up close and notices something no one tells down here. From its upper part, without pause, flows a living golden energy that rises like incense smoke and veils Marghar\'s face. From its lower part drips a dark, dense mist, the same blue as the Hourglass, which sinks slowly to the labyrinth and is lost among the walls.</p>' +
    '<p>Those who came back say they understood there what the priests never could explain: the Eye that sees you is the same veil that hides the one who looks. No one sees Marghar, because his own gaze is in the way. And karma does not stay inside the Eye. It flows out, all the time, upward and downward, each half with its own truth: what brightens rises in gold, what weighs sinks in mist.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Why he does not act</h3>' +
    '<p>I asked Sael, in the few lines of hers left in the archives, why Marghar does not stop evil. The answer they wrote down is the longest we have from an Essence:</p>' +
    '<blockquote>Because he does not act. He does not prevent, does not kill, does not judge. I have never seen him raise his hand, neither to save nor to punish. Marghar is the wanting, and the desire to want. He is the stopping, and the desire to stop. He is the path and he is the step, and before both he is the will to walk. Whoever acts is whoever walks. He only sees, and keeps, and one day gives back.</blockquote>' +
    '<p>The elders of Askavik read a promise in this; the Unraveled, an accusation. I read both, and cannot choose.</p>' });
  add({ lv: 'XXII', body:
    '<h3>The question no one answers</h3>' +
    '<p>Orvalen, who has read tracks since before names existed, left on record a doubt I hesitate to copy. He wonders whether Marghar might also be Ahzur. Whether what we call the god of paths might be an endless system that feeds on itself and devours itself, like the serpent that bites its own tail and draws, with its body, the sign of infinity. The path and the destruction of the path, contemplating itself all the time.</p>' +
    '<p>Sael, they say, ordered him to be silent. Not because it was a lie, but because Marghar hears everything and never answers.</p>' +
    '<h3>And us</h3>' +
    '<p>If everything is Marghar, we too are part of him. We are walkers, and we are the path. We are hunger, and we are food. Perhaps that is why the labyrinth exists: not to hide us forever, but to give us time to choose which of the two to be before the Hunger arrives.</p>' +
    '<p>I cannot answer any of this. I write it down and keep walking, which is what every walker does.</p>' });
  add({ lv: 'XXII', body:
    '<h3>It\'s me</h3>' +
    '<p>What amuses me most in the records is a scene repeated in every square. Two walkers meet, and one says to the other: it\'s me, Brakka. But weren\'t you a dwarf? I was. Now I\'m an elf.</p>' +
    '<p>The soul is the same, the name is the same, and so is the karma. Karma, by the way, never stays in the body that fell: it belongs to the soul and crosses every life, together with the Tears and the debts.</p>' +
    '<p>Whoever asks to see someone\'s profile finds their past lives there, one by one: the people, the path and how far each one got. I, who know how to read skin, prefer to read these lists. They lie less.</p>' +
    '<h3>Chronicler\'s notes</h3><p class="fnote"><span class="nb">✎</span>Every account says that Sael came back from the center. None says what she went there to do, nor who was at the center before her. And those who have risen to the Threshold more than once swear that, on one of those times, she was holding two threads. They asked her about the other one. She smiled and did not answer.</p>'  });

  add({ toc: 'Book XXIII — The price of each path', lv: 'XXIII', eyebrow: 'Book XXIII', title: 'The price of each path', start: true, body:
    '<p>I walked a long way to write this book, and what I learned fits in one line: <b>no path is free</b>. Each gives the walker a strength the others envy, and charges them a weakness only the others know how to cure.</p>' +
    '<p>The masters of the academies do not like this said out loud, because it sounds like a weakness of the school. I think the opposite. It is this account that keeps the world standing: the warrior needs the mage and the warlock, the vampire needs the dwarf and the technocrat, the wolf needs even the vampire, which hurts him most of all. No one in Karmika lives alone for long. Whoever tries goes mad, starves or burns out.</p>' +
    '<p>And the bill does not come due overnight. The elders measure it in <b>turns</b>, and they say a walker can bear <b>twenty</b> turns on the road before their price becomes unbearable. In the first twelve, almost nothing is felt. After that, it weighs.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Of the warrior who hears the dead</h3>' +
    '<p>The northern warrior is the strongest of us all in close combat, and that is why he kills the most. Every death leaves a remnant of fury in him. First comes <b>frenzy</b>, and he hits harder but forgets his guard. Then comes <b>madness</b>, and that is when the price shows: the mad warrior wants to do good and cannot, because the blood speaks louder, and his soul darkens slowly, like a covered ember.</p>' +
    '<p>To come back to himself, he offers condolences to Odin for the fallen and mortifies his body in the <b>calming rituals</b>. He needs incenses of mortification and purification, and only mages and warlocks know how to make them. Neither makes them alone: the mage needs the <b>Ashes of the Dead</b>, which only the warlock gathers, and the warlock needs the <b>Sand of Astral Illumination</b>, which only the mage keeps. I saw Archmage Seline, at the Pinnacle, buy ashes from the Witch Grisolda of Gorvath with the face of someone swallowing vinegar. And I saw the witch make the same face.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Of the paladin who doubts</h3>' +
    '<p>The paladin\'s weakness is not in the sword or the shield. It is in the question he asks at night, after so many battles against entities and demons: <em>does my war for peace spill more blood than the damned themselves?</em> This <b>Doubt</b> grows with every death, and even more when the dead were people. As it grows, the Light answers his hands less; when it overflows, faith wavers, good choices lose their weight and karma drains away.</p>' +
    '<p>The remedy is old: <b>Fast and Prayer</b>. The paladin eats <b>Unleavened Bread</b>, which human cooks make from <b>Leavenless Wheat</b>, whose seed the technocrats tinkered with in the brass greenhouse and which only elven hands can make sprout, and drinks the dwarves\' <b>Holy Wine</b>, which only becomes holy with the <b>Drop of Holy Tear</b> that the elder women of Lithendel gather before sunrise. Five hands in a single meal. Perhaps that is the answer to the Doubt, and not the wine.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Of the vampire and the thirst</h3>' +
    '<p>The vampire is king of the night: stronger, faster, blows the eye can barely follow, and every wound he opens gives him back a little life. But the sun weakens and burns him, and so he seeks out the cities of shadow, like Darkcrow, or the deep woods. And there is the <b>thirst</b>. The alchemist\'s <b>Diluted Blood</b> and animal blood fool it for a while, less and less each time. Sooner or later the body asks for the blood of people: human, dwarf or elf. Whoever drinks from people quenches the thirst and darkens the soul.</p>' +
    '<p>The vampire who wishes to follow the good has a way, and it is costly: the technocrats\' <b>Automatic Blood Injector</b>, made with the <b>Concentrated Bloodletting</b> that the dwarves collect from donors at the House of Bloodletting in Emberforge. No one dies for it. Bloodletter Hulda makes a point of telling that to everyone who comes in.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Of the wolf and the hunger</h3>' +
    '<p>The lycanthrope is bigger and stronger than a man, and by day fights like a man, with cudgels, maces and crude halberds. The beast\'s form comes only with night. And the beast has a <b>hunger for the flesh of people</b>, of any people: the human is what it craves most, the dwarf is tough to chew and the elf is lean, nearly without fat. Animal meat fools it for a while, until the day it no longer fills. Hungry, the wolf grows slow and weak. Whoever eats people sates the hunger and stains the soul.</p>' +
    '<p>The wolf who chooses the good has to swallow his pride. The only meat that sates without a victim is the <b>Centuries-old Charcuterie</b>, meat cured for centuries in the cellars of Darkcrow, and those who sell it are the vampires. Sommelier Vasko serves the wolf with a half smile and asks him to eat outside. The proudest send a technocrat or a dwarf to buy it for them.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Of the technocrat and the brass heart</h3>' +
    '<p>The technocrat wields no sword, dagger or bow: they fight with the Academy\'s weapons, with the gauntlet, the turrets and the sphere that flies beside them, which attacks, heals the group or defends it, depending on their stance. But all of that comes from the <b>personal reactor</b> on their back, and the reactor wears down. A <b>Reactor Core</b> is expensive and lasts well, eight turns for the first, twenty for the one from the Academy\'s second class. Empty, the energy does not come back and the sphere goes dark.</p>' +
    '<p>The smith makes the core\'s casing, but cannot finish it alone: it needs the alchemist\'s <b>Vital Fluid</b> and the <b>Arcane Crystal</b> the mages charge at the Pinnacle. That is why the technocrat is, of everyone, the one who most needs trade. No sale, no spark.</p>' +
    '<h3>Of those who read, those who make pacts and those who keep watch</h3>' +
    '<p>The <b>mage</b> casts so much magic that its echo stays in his head. Over time it turns to <b>arrogance</b>: he looks down on simple folk, and the magic cracks in his hand. He is cured with his feet on the ground, in the <b>Grounding Ritual</b>: the Earth Salve from the tanners of the Ancient Howl and the Holy Water of the Abbey of the Dawn. Nothing humbles a mage like asking a wolf for dirt from its den.</p>' +
    '<p>The <b>warlock</b> has no magic of his own: he borrows it from Malgrath, and Malgrath charges interest. When the debt grows, the patron holds back part of his life, and in the end sends the <b>Pact Collector</b>. The debt is paid with the <b>Offering</b>: a Demon\'s Heart, which only the hunters of the Helsing Clan can tear out without it rotting, and a Blood Horn, which only the northern warrior can fill on the battlefield.</p>' +
    '<p>The <b>demon hunter</b> serves Aravel, whose eye never closes, and so he does not sleep. His sight blurs, and then he sees a demon in every face. He sleeps only with the <b>Guarded Sleep</b>: the Dust of Dreamless Sleep, made by the warlock, the very one he hunts, and the technocrats\' Guard Bell, which rings by itself if something comes near.</p>' +
    '<h3>Of the price of a life</h3>' +
    '<p>I was asked how much a life is worth in the Eye. I answered with the beasts\' own reckoning: whoever eats people buys twenty turns of peace, and the Eye charges those twenty and one more, for the life. Twenty-one. And if the victim was a walker, whose soul comes back and remembers, the Eye charges double, because there are two lives: the one that ended and the one that will have to start over.</p>' +
    '<h3>Of balance</h3>' +
    '<p>I asked a master why the academies accept so high a price. He answered without raising his eyes: <em>because without a price, the strong become gods, and a god needs no one</em>.</p>' });

  add({ toc: 'Book XXIV — Of crafts, creatures and skies', lv: 'XXIV', eyebrow: 'Book XXIV', title: 'Of crafts, creatures and skies', start: true, body:
    '<p>This book is about small things, and for that very reason true ones. No one remembers a hero for the sword; they remember the forge where it was made, the cat that slept in their lap and the night the moon turned red and they did not run.</p>' +
    '<h3>Of the craft houses</h3>' +
    '<p>Every village and city in Karmika has its five crafts around the square. No one planes boards out in the brush. In the <b>cities</b>, like Askavik and Karmika, each craft has its own house:</p>' +
    '<ul><li>the <b>Carpentry</b>, an open shed of logs, with saws hanging on the wall, the frame saw over the log and the foot-pedal lathe;</li><li>the <b>Forge</b>, with its stone chimney and arched mouth always lit, the leather bellows and the two anvils;</li><li>the <b>Tannery and Tailor\'s</b>, with the dyeing vats and the hides on the line;</li><li>the <b>Apothecary</b>, with its counter in the front room and the still room behind;</li><li>the <b>Cooking School</b>, with the brick oven and the apprentices\' tables;</li><li>and the <b>House of Technology</b>, of riveted plates, with the Tesla coil on the roof, which serves the technocrat as forge and workbench.</li></ul>' +
    '<p>In the <b>villages</b> everything is simpler: the Cutting Shed, the Open-Air Forge, the Tanner\'s Table, the Apothecary and the Back Kitchen, which you enter through the tavern\'s back door. The steam villages of the south also keep their Brass Workshop.</p>' });
  add({ lv: 'XXIV', body:
    '<h3>Of the Stable and companions</h3>' +
    '<p>The animal you buy does not travel in your backpack: it lives in your <b>Stable</b>, and from there it comes out to walk with you. Each one has a name, which you can change, hunger and bond. A hungry animal fetches slowly and does not fight; an animal that adores you comes back faster to help you.</p>' +
    '<ul><li><b>Spotted Kitten</b> and <b>Red Fox</b>: in combat they let out a <b>Racket</b>, and whoever was coming at you stops for a moment.</li><li><b>Black Cat</b> and <b>Cellar Mouse</b>: their <b>Scent</b> finds what fell far away, and the squeak distracts.</li><li><b>Wolf Pup</b>: the <b>Bite</b>, at the shins of whoever attacks you.</li><li><b>Spotted Piglet</b>: <b>Roots</b> in the dirt while you rest and sometimes brings back an apple, some bread or a few coins.</li></ul>' +
    '<p>The pet wears a <b>Collar</b> and a <b>Harness</b>. The collar makes it fetch faster; the harness brings its ability back sooner, and the iron one makes the bite deeper. Pets, collars and harnesses are bought from <b>Corwin the Tamer</b>. Horses and hay, from <b>Orm the Innkeeper</b>: the Bay Horse, the Grey Horse and the Black Steed. A hungry horse runs slower.</p>' +
    '<p>And the pet goes with you to the bottom of the dungeons. A loyal animal does not wait at the door.</p>' });
  add({ lv: 'XXIV', body:
    '<h3>Of the changing skies</h3>' +
    '<p>About twice a day, the whole world changes color. World events come around about an hour and a half earlier each day, and in a week they pass through every hour, so that no one is always left out.</p>' +
    '<p>Under the <b>Blood Moon</b> the sky bleeds as it arrives, and then the crimson settles, but does not go away. It brings:</p>' +
    '<ul><li>attacked patrols and werewolf bites five times more common on the roads;</li><li>one more werewolf in each wave, arriving two levels higher than usual;</li><li>vampires, werewolves, warlocks and souls of karma −20 or lower: +10% damage and −8% damage taken;</li><li>paladins, mages and souls of karma +20 or higher: +6% damage taken;</li><li>and for the werewolf with Scent switched on, +15% XP.</li></ul>' +
    '<p>On <b>Dawn Day</b> it is the opposite: processions of Auréon six times more common, acts of light worth half again as much karma, strength for the bright souls and weight for the dark ones.</p>' +
    '<p>Whoever wants to remember what the sky is up to looks at the <b>counter below the map</b>: it says how long until it ends or begins, and shows what has already passed and what you did in it.</p>' });
  add({ lv: 'XXIV', body:
    '<h3>Of the age of beasts</h3>' +
    '<p>The old hunters say: <em>if it has a skull over its head, it is not for you</em>. A beast five levels above hits almost twice as hard; eight above, more than twice; never more than three times. And your blow slides off it: it loses strength with every level of difference and sometimes simply misses. A beast below you, on the other hand, hurts less. It is neither luck nor misfortune, and it does not count among blessings: it is the age of the beast.</p>' +
    '<h3>Of the voices of the village</h3>' +
    '<p>The people of Karmika talk. Not all the time, but they talk: they comment on the cold, the hour, the red moon, your brawl in the square, the blood on your face, your horse and your cat\'s name. They know your karma and are wary of your path. The guard talks about the gate, the smith about a blade\'s edge, the tavern about stew. Whoever pays attention learns more in the streets than in books, this one included.</p>' });
  add({ toc: 'Book XXV — Those who carry the banner', lv: 'XXV', eyebrow: 'Book XXV', title: 'Those who carry the banner', start: true, body:
    '<p>In the fifteenth book I told of the two banners as one tells of two ideas. But no idea walks the road alone. People walk it. And it was to meet the people who carry each banner that I wore out my soles these last years, from Austrvik to the Hill, from Sudrholt to the Vale, and my boots too, because a dwarf made me climb the wall of Emberforge twice to show me a brick.</p>' +
    '<p>I found that each path has its <b>house</b>, a place where the path lives and has a name, and that each house has a master who never leaves it, as a king never leaves his castle. And I found that, besides the masters, each path has someone who <b>walks</b>: a bearer, one of the few who take the banner where it has not yet reached. It was with these that I walked. Not all walk with everyone: when the mission is one of swords, they send the sword; when it is one of words, they send the word; when it is one of mystery, they send me, which says a great deal about their opinion of mystery.</p>' +
    '<h3>The houses of the Thread</h3>' +
    '<p>The <b>Order of Auréon</b> lives in the Abbey of the Dawn, in Austrvik, where the bells have woken the city for three hundred years. Its master is <b>Grand Master Cassius</b>, old, warm and grave, who greets every novice with the same words: a knee on the ground is not humiliation, it is rest. The <b>Helsing Clan</b>, the silver hunters, lives in the Silver Bastion, in Sudrholt, and obeys <b>Master Ilsa Van Rhal</b>, whose family owns the Silver Crossbow. The <b>Circle of the Pinnacle</b>, which the people call the Ivory Tower, lights up every night in Lumenhal, and it is ruled by <b>Archmage Aurelian Vesk</b>, with <b>Archmage Seline</b> at his side, the one who buys warlock\'s ashes with the face of someone swallowing vinegar.</p>' });
  add({ lv: 'XXV', body:
    '<h3>The houses of the Unraveled</h3>' +
    '<p><b>House Noctavar</b>, which outsiders call the Count\'s Court, has stood for a thousand years in the castle on Vampire Hill, above Darkcrow, and it stands by three laws none of its own will break: do not drink from those under its protection, do not make spawn without the House\'s consent, do not lie to the Elder. The Elder is <b>Count Vladislav III</b>. Serving at table is <b>Sommelier Vasko</b>, who has a thousand years of wine and two minutes of patience, and who serves the werewolf with a half smile and a plate at the door: "outside, please, the rug is older than you."</p>' +
    '<p>The <b>Pack of the Ancient Howl</b> lives in the Lycan Jungle, has a single law, no one is left behind, and one mother, <b>Ulfrun the Mother Alpha</b>. I spent a week with the pack and came away convinced that werewolves and dwarves are the same people with different coats: rough, blunt, noisy eaters who curse what they love and do what they say. A pup asked me what a chronicler tastes like. I said paper. He lost interest.</p>' +
    '<p>The <b>Pact of Gorvath</b> gathers the warlocks of the Vale of Woe; its patron is <b>Malgrath</b>, who is a prince and not a master, and the eldest of the Pact is the <b>Witch Grisolda</b>, who gathers the Ashes of the Dead and charges for them whatever her vinegar face allows.</p>' +
    '<h3>Who walks the lands of shadow</h3>' +
    '<p>I noticed who moves through Darkcrow, the Howl and the Vale without being touched. The <b>elves</b>, because even the oldest vampire respects those who are good by nature and too thin for the table. The <b>technocrats</b>, because you do not bite the one who fixes the clock. The <b>humans</b>, no: a human there is prey, and knows it, and walks fast. And the <b>dwarves</b> do not go, because they hate that crowd; but they sell, and the shadow climbs to Emberforge to buy iron and donor blood at the House of Bloodletting, for the same price the Thread pays. I asked a dwarf how you sell to those you hate. "Dirt under the rug is their problem. The rug I don\'t sell. The iron, I do."</p>' });
  add({ lv: 'XXV', body:
    '<h3>The houses that swear no banner</h3>' +
    '<p>The <b>Raven Clan</b> guards Odin\'s Fortress, in Jarlsheim, under <b>Thorgrim Ironhand</b>. In the hall there are two carved ravens, one on each side of the throne, and the warriors swear they are Odin\'s: one thinks, the other remembers. Thorgrim says a warrior who listens to only one of the two goes mad or turns coward, and that the feat of a whole life is to sit in the middle, like the Allfather. The <b>Steam Brotherhood</b> is what the technocrats call themselves when they are not selling anything: the Grease Academy, in Boilerport, with <b>Architect Ylva</b>, and the Brass Caravan Company, with <b>Factor Brunna</b>, who carries anything anywhere and says the road does not pray.</p>' +
    '<p>And there is Askavik, which is no path\'s house and everyone\'s house: the Royal Weavery of the Thread, run by <b>Master Ingeborg</b>, and the Weavery of the Unraveled, run by <b>Corvina the Unraveler</b>, one on each side of the same street. They have not greeted each other in twenty years, but both buy thread from the same merchant, who sells to both with the same smile and charges both the same price, and is therefore the most honest person in Askavik.</p>' +
    '<h3>Those who stayed ordinary</h3>' +
    '<p>Before the bearers of the classes, I must speak of those who refused the Seer and stayed what they were born. They are not less. Some days, they are more.</p>' +
    '<p><b>Old Ansgar</b>, the Elder of Karmika, refused the Seer three lives in a row and remembers all three. He sits in the square, by the fountain, and corrects everyone\'s story: "that\'s not how it went." When I asked why he never chose a path, he answered: "I did choose. I chose to stay. It\'s the only path where no one gives you orders, and so no one helps you. You can live with it." He says a given word is all a human has, and that is why he keeps his short.</p>' });
  add({ lv: 'XXV', body:
    '<p><b>Master Builder Dagny Leadfoot</b> runs the Great Work of Emberforge, the new wall, and measures everything with a tape, promises included: "a dwarf\'s word is as long as a beard hair, two fingers; yours came to one and a half, come back tomorrow." She curses the stone, curses the foreman, curses King Thrain behind his back and has already raised three bridges nobody asked for because "they were going to be needed." She hates dirt under the rug so much she owns no rug, and still she sells iron to the Thread and to the Unraveled at the same price, because a beard has no banner: "business is business, a word is a word, and the rug is their problem." When a gallery collapsed in Ashpeak and the foreman hid it, she went down alone, pulled out the four who were buried and left the foreman down there until the end of the shift, "to learn what hiding means."</p>' +
    '<p><b>Lirien Lateleaf</b> is the envoy of the Canopy of Lithendel and the only creature I have seen dine with the Count, lunch with the pack and take tea in Gorvath in the same week without losing a hair. She is a pure elf, refused the Seer, and is welcome in all three houses of shadow because, they say there, "an elf doesn\'t lie and doesn\'t fatten." She speaks little, with an irony so fine that the one insulted says thank you. In an earlier life, she told me in passing, she was a vampire. She came back an elf. She says the cycle of alliance breaks once so that you learn what it is worth. She also explained to me what the Canopy forgives and what it does not: an elf of dark karma, who raises their city among those of the shadow and whom they call a <b>dark elf</b>, offends no one in Lithendel, because darkness is also an order, and the forest respects order. What the forest does not forgive is betraying one\'s nature: becoming something else. "I betrayed it once. I paid. That\'s why they let me walk."</p>' +
    '<h3>Aldric, who reads the names</h3>' +
    '<p>The first class bearer I met was <b>Paladin Aldric</b>, envoy of the Order of the Thread in Askavik. I have already written that he is sincere to the point of pain, and he is. What I had not written is what he keeps inside his shield: carved into the wood, one below the other, the names of every person he failed to guard. He reads them every night before sleeping, in a low voice. "Because the Order swears no one crosses alone. They crossed. Someone has to go with them, even if it\'s afterward." It is Aldric who receives those who arrive in Askavik and shows them the Labyrinth the way one shows a house: every corridor is someone still breathing.</p>' });
  add({ lv: 'XXV', body:
    '<h3>Vesna Helsing, who does not sleep</h3>' +
    '<p><b>Huntress Vesna Helsing</b> was not born a Helsing. She was born in a village that no longer exists, near Sudrholt, and she was six when a nest took it. The Bastion took her in as it takes in all the orphans of the night, and she took the clan\'s name the way one takes up a weapon. She wears on her wrist a guard bell that rings by itself if something comes near, and sleeps no more than three hours a night, because Aravel sleeps none. She is acid in the way only weariness makes you: she calls the paladins boy scouts to their faces and says a light that waits for the monster to ask forgiveness is a light that arrives late. Every orphan the Bastion takes in is her village all over again. That is why she never stops.</p>' +
    '<h3>Ísold Brightquill, who copies by hand</h3>' +
    '<p>At the Pinnacle there is a room where the books no one should read are kept, and there is a mage who copies them by hand, one by one, in dim light. She is <b>Ísold Brightquill</b>. "Because the copy doesn\'t lie. The original, sometimes, does." She was the first person I heard say that a grimoire of the Tower had a wrong syllable in its last line, and the first to blame Zerath\'s rot for it. She has a sweet arrogance, that of someone who knows more and finds it funny. She laughs at the hunter and the paladin when they quarrel, and both hate her for it with equal force, which she considers her greatest work. When I told her this, she answered that I was copying it wrong.</p>' +
    '<h3>Lady Mirela, who never broke a law</h3>' +
    '<p>On the side of the Unraveled, the voice that speaks along the roads is that of <b>Lady Mirela</b>, heir to House Noctavar. Polite like a blade. She swore the three laws of the House at fifteen and has never broken one, which, among thousand-year-old vampires, is rarer than it sounds. She considers the werewolf an animal and says so with perfect courtesy, which the werewolf takes as an insult, rightly. She receives those who arrive in Askavik from the other side of the street, with a single question: "Have you died yet? You will. And you\'ll come back. And you\'ll die again. Call that protection, if you like."</p>' });
  add({ lv: 'XXV', body:
    '<h3>Varg Brokentooth, who leaves no one</h3>' +
    '<p><b>Varg Brokentooth</b> is Ulfrun\'s second and, if Ulfrun isn\'t listening, the pack\'s own dwarf. He lost a pup from his litter to the silver of the Helsing Clan and broke his own tooth biting the cage they carried it off in. He did not let go. Since then he leaves no one behind, not the fallen enemy, not the plate. He hates the vampire with the hatred of the first moon, but sits at the same table when the Mother Alpha orders it, eats in silence for about thirty seconds and then asks Vasko whether the wine is made from grapes or from people. Vasko never answers. Varg considers that an answer.</p>' +
    '<h3>Ravena Fiveclause, who reads the fine print</h3>' +
    '<p>The youngest witch of Gorvath only signs pacts of five clauses. "The rest is vanity." <b>Ravena Fiveclause</b> reads fine print better than Malgrath himself, and he knows it, which is why he uses her to write what the others sign. She thinks the vampire and the wolf are two children fighting in the yard, and has told them both so, in writing, in five clauses. It was she who drafted the truce between the House and the Pack, and she who collected from both when they broke it, on the same night, with interest she calls "educational."</p>' +
    '<h3>Brynhild Quietblade, who came back from madness</h3>' +
    '<p>In the Raven Clan there is a champion who speaks little and only of what she has seen. <b>Brynhild Quietblade</b> is the sister of Halfdan, the deserter of Fjallbrún, and carries that without hiding it and without explaining it. She crossed the madness of battle once and came back, which almost no one does, and that is why she is the one who teaches the newcomers the stance that defends and the one that heals: "whoever can\'t stop can\'t strike." About Odin\'s ravens, she says she has stood beneath both and slept badly under each. When they asked her in Askavik which side the Clan should take, she answered that the Thread and the Unraveled were right and wrong at the same time, and left the room before anyone could ask her to explain.</p>' });
  add({ lv: 'XXV', body:
    '<h3>Anselm Rotha, who measures</h3>' +
    '<p><b>Doctor Anselm Rotha</b>, of the Steam Brotherhood, wants to measure the Labyrinth. Not guard it, not tear it down: measure it. He carries a brass gauge that marks "how much is left," and has never told anyone how much is left until what. He considers the two banners two expensive superstitions, and the Company the one truth: no sale, no spark. He is the one who hands the Academy\'s apprentices their first flying helper, the honeycomb shield and the bracer, and charges each of them a report no one reads. He buries one legend a day and, they say at the Academy, digs one up every week, without telling anyone. I once saw him standing before a door of black stone, taking notes. I asked what he was writing. "That it has no handle." And he moved on.</p>' +
    '<h3>Of what they have in common</h3>' +
    '<p>I walked with all eleven, never with two at the same time, and at the end I noticed what none of them would let me write if they read it first: all of them carry the wound of their path in their body, and all of them think the other banner is what will bring Karmika to an end. All of them want to save it. That is why they fight. I did not see a villain in any of the eleven. I saw eleven people who sleep badly, and three of them who laugh about it.</p>' +
    '<p class="seal">When you are given a quest, walker, notice who gives it. It may be one of them.</p>' });
  add({"toc": "Book XXVI — The wonders and the Fountains of Vision", "lv": "XXVI", "eyebrow": "Book XXVI", "title": "The wonders and the Fountains of Vision", "start": true, "body": "<h3>Of the coin in the water</h3><p>In every square in Karmika there is a fountain, and in every fountain there are coins at the bottom. Travelers think it is superstition. It is not. Whoever tosses a coin into a <b>Fountain of Vision</b> and keeps still sees the whole place from above, as the ravens see it and perhaps Marghar himself, and hears the story of the place told by whoever kept it. Many times, I confess, the one who kept it was me. I cannot explain how my voice ended up inside the water. The technocrats say it is an echo. The priests say it is grace. I say it is work, because I was the one who wrote it down.</p><p>Every path has its city, and every city has its wonder. And inside every wonder there is a Fountain of Vision, because none of them fits in the eyes of someone standing at its foot. To see what the builders made you have to rise, and the coin rises for you.</p><h3>Of the wonders of the Thread</h3><p>The <b>Abbey of the Dawn</b>, in Austrvik, raises the sun and the Eye over a courtyard large enough for a kneeling city. On Dawn Day the light comes down over all of it, and the novices swear they feel warmth on their backs even with their eyes closed.</p><p>The <b>Ivory Pinnacle</b>, in Lumenhal, is a white tower in the middle of a lake of islands. From afar it looks like a lighthouse; up close, like a staircase that never ends. The mages climb for years. Those who reach the top do not tell what they saw, and those who do not reach it tell far too much.</p><p>The <b>Silver Bastion</b>, in Sudrholt, is not beautiful, and is proud of it. Moat, wall, towers and a thousand and twelve stones in the wall, or a thousand and eleven, depending on who is counting. It faces the Cursed Land the way a man faces a dog that has not barked yet.</p><p><b>Odin's Fortress</b> crowns Viking Mountain, above Jarlsheim. The climb is straight, the snow does not forgive and the mead never runs out. Thorgrim receives those who wish to swear there, and whoever comes down sworn comes down different: they walk slower and look farther.</p>"});
  add({"lv": "XXVI", "body": "<h3>Of the wonders of the Unraveled</h3><p>The <b>Count's Castle</b>, on Vampire Hill, has six floors, and only two of them see the sky. Below, the catacombs of the Court and the cellar of cells. On the ground floor, the library, the ballroom with its chandeliers lit and the piano room no one plays by day. Above, the gallery of portraits, where the eyes of the paintings follow whoever passes, and the floor of bedrooms, dozens of them, some with coffins in place of beds. And at the top, the Count's private hall, with the throne inside a pool of blood. It is there, they say, that one stops being human.</p><p>The <b>Mother Tree</b>, at the Ancient Howl, is an immense den-tree, fallen in the middle of the jungle. The trunk is the Mother Alpha's house, and the hollow is a whole hall of roots and life. Halfway there stands a statue every outsider stops to look at: a giant she-wolf nursing human children. The werewolves do not explain the statue. They only say that it is why the pack abandons no one.</p><p>The <b>Warlock's Tower</b>, in the Vale of Woe, at Gorvath, is tall, but what impresses is what lies beneath it. The tower opens a shaft in the ground that goes down as far as the eye can see, and the bridges that link the road to the pillar let you see the bottom: lava, people working and, far below, near the demons, the rituals Malgrath lets no one write down. I tried. The ink boiled.</p>"});
  add({"lv": "XXVI", "body": "<h3>Of the wonders of those who swear no banner</h3><p><b>Boilerport</b>, the city of grease, has cranes that work on their own, unloading the steam freighters and setting cargo back on the docks. The Grease Academy is crowned by two immense coils that light the whole city through the air, and between the academy's floors rise hanging gardens, because the technocrats learned late, but learned, that a machine without plants rusts from the inside. On the island offshore, the <b>Technocratic Lighthouse</b> turns a red beam over the steamers, and Lighthouse Keeper Dinorá counts who arrives and who does not come back.</p><p>The <b>Gates of Emberforge</b> are a door of cast iron dug into the Black Mountain. You climb the stairway until you touch the iron, and the gate sinks into the rock. Inside lies the Great Hall, with the throne at the foot of the Mother Forge, which takes lava from the mountain's veins through ducts no living dwarf knows who dug. On the walls, diamonds and emeralds. And at the far end, between two colossal dwarves carved with their axes raised toward each other, the <b>Heart of the Black Mountain</b>: an immense blue stone that sometimes turns red. The dwarves say it turns red when someone lies in the hall. I kept quiet the whole time.</p><p><b>Gaia, the Holy Tree</b>, in Lithendel, is Mother Earth made tree, and the city of the elves lives in her branches. You ride a cable car of vines up to a level where you literally walk on the tree and see Karmika from above. The werewolves' Mother Tree was also a standing tree, once. The elves do not like to be reminded of it.</p><p class=\"seal\">When you stand before one of them, walker, toss the coin. A wonder was not made to be seen from below.</p>"});
  add({"toc": "Book XXVII — The Wanderer of Auréon", "lv": "XXVII", "eyebrow": "Book XXVII", "title": "The Wanderer of Auréon", "start": true, "body": "<h3>Of the paladin who does not stay home</h3><p>Whoever thinks of a paladin thinks of the Abbey, and the Abbey is the mother. But Grand Master Cassius has a rule that many novices find strange: the newly sworn paladin does not stay in Austrvik. He leaves. <b>The paladin is first of all a wanderer of the good</b>, and light that does not walk becomes an altar candle, beautiful and useless.</p><p>In ten villages of the Lands of Men there are chapels of Auréon still standing, whole, with a cleric at the door: Grenivik, Vestheim, Vatnaholt, Skógar, Myrbakki, Brekkuvik, Vindholt, Dalborg, Steinfoss and Lundr. Each village has its own evil, and no evil is like another. The Wanderer arrives, listens to the cleric, faces what prowls the village and decides what to do with what is left. Each cleric sends him to the next chapel, and the last one sends him back home.</p><h3>Of the extra note</h3><p>The clerics of the ten chapels do not all know each other, but they tell the same thing, each thinking they are the only one: the chapel bell rang, on some night or other, <b>one note too many</b>, a note no one had tuned. In Steinfoss they showed me a rune scratched into the bronze, inside the bell, where no hand can reach. I copied it. It is none of the six.</p><p>When the Wanderer returns to the Abbey, Cassius receives him standing and gives him the name <b>Wanderer of Auréon</b>. I asked the Grand Master about the note. He answered that light has its questions too, and changed the subject.</p>"});
  add({"toc": "Book XXVIII — The Bell on the Wrist", "lv": "XXVIII", "eyebrow": "Book XXVIII", "title": "The Bell on the Wrist", "start": true, "body": "<h3>Of silver, which is a debt</h3><p>At the Silver Bastion, Master Ilsa Van Rhal hands over the first silver blade with a phrase every Helsing knows by heart: <b>silver is not a gift, it is a debt</b>. Whoever receives it comes to owe every night of peaceful sleep to someone who stayed awake on the wall.</p><p>The one who takes the newcomers to the wall is <b>Huntress Vesna Helsing</b>, acid and funny in the way of someone who has not slept in years. She teaches them the three hours of the night, the hour of the bell, the hour of the dog and the hour when no one should be awake, and she counts the stones of the wall aloud every watch, so as not to fall asleep. She says there are a thousand and twelve. The Master says a thousand and eleven. Both count every night, and neither gives in.</p><h3>Of the orphan of Sudrholt</h3><p>In Sudrholt there is a boy called <b>Pip</b>, who lost his family to a beast from the Cursed Land and cannot sleep without hearing a bell. The Helsings do not adopt children; they say silver is no place for them. But every new hunter is sent to talk to Pip, and what they tell the boy, the truth, the wait or the lie, the Eye writes down before any beast. Later, with Sleep Dust bought from a witch of Gorvath, grudgingly, and a Guard Bell bought from the Company, the hunters invented the <b>Guarded Sleep</b> for him. It was the most beautiful thing I have ever seen a hunter do.</p>"});
  add({"lv": "XXVIII", "body": "<h3>Of the rune inside the bone</h3><p>In the Bastion's hall hangs a beast's skull, Van Rhal's, the family's first hunt. Whoever looks with Instinct sees what the eyes do not: <b>the sixth rune scratched inside the bone</b>. Not on the surface: inside, where no knife can enter. After that the Helsings began to open the skulls of the beasts they killed. Every one has the rune. I had been there years before and wrote it down without understanding. At least I wrote it down.</p><h3>Of the village that no longer exists</h3><p>There is a village on the old map called Lysmark that is not on the new map. Whoever goes to where it used to be and uses Instinct finds the spirit of a girl with a candle in her hand. She says only one thing to whoever arrives: <b>your candle was the last to go out</b>. No one knows whom she is speaking to.</p><h3>Of the oath of Aravel</h3><p>The hunter finishes their first year in the Ruins of Aravel, where Aravel, the Green Vigil, had his first altar. There, beside Vesna, they say the phrase that gives the oath its name:</p><blockquote>I do not sleep while someone small is awake in the dark.</blockquote><p>After that the hunter wears a small bell on the wrist. It does not ring to call anyone. It rings to remember.</p>"});
  add({"toc": "Book XXIX — The Oath", "lv": "XXIX", "eyebrow": "Book XXIX", "title": "The Oath", "start": true, "body": "<h3>Of the Weavery of Askavik</h3><p>There is a day when each path swears its banner, and all swear in the same place: the <b>Weavery</b> of Askavik, where the cloaks of both factions are woven. Each one swears in their own way. The paladin kneels. The werewolf howls. The vampire signs in blood and complains about the paper. The warlock reads the whole contract aloud, twice, and corrects a comma. The mage asks if he may take notes. And the northern warrior, who by the tradition of the Raven swears no banner at all, is the one who <b>arbitrates</b>: he stands in the middle of the hall and says whether the oath counted.</p><h3>Of the Moon Truce</h3><p>The Unraveled have a truce older than the banners: the <b>Moon Truce</b>. On the moonless night, wolf and vampire do not hunt each other, and the warlock writes down what was said so that no one can later claim they said something else. The wolves detest the warlock for it. The vampires detest the wolves. And the truce has held for centuries, which says a great deal about hatred and little about peace.</p><h3>Of the place where my side errs</h3><p>Every honest oath has a question the masters do not ask aloud: where does my side go wrong? The Thread finds the answer in <b>Grenivik</b>, where a captain of the Order began charging protection money from those he was meant to protect. The Unraveled find the answer in <b>Lundr</b>, where one person's freedom became another's prison. Both sides come back from there quieter.</p>"});
  add({"lv": "XXIX", "body": "<h3>Of the rot of Grenivik</h3><p>It was in that time that the rot began to flow down the river from Grenivik. Each path read it in its own way. The paladin prayed and felt cold. The werewolf sniffed and did not recognize the smell, which had never happened before. The vampire wrinkled his nose and said that blood had been old before it was born. The warlock read, and what he read was a letter: an ancient letter, older than Malgrath, written where there was no paper.</p><p>Everyone thought it was Zerath, the prince of rot. It made sense, and whatever makes too much sense ought to frighten us.</p><h3>Of the door</h3><p>At the end of the oath, on every path, someone speaks of a door. A door of black stone, with no handle, with the Eye carved with lowered lids. I have already told that there are three of them: in the Forgotten Cemetery, in Emberforge and in the Library of Askavik. Now I know there is a fourth. I will speak of it further on, in the book of the bridge.</p>"});
  add({"toc": "Book XXX — The Broken Table", "lv": "XXX", "eyebrow": "Book XXX", "title": "The Broken Table", "start": true, "body": "<h3>Of the war no one declares</h3><p>After the oaths came the time the old ones call the <b>Cold War</b>. No one declared anything. The paladin escorted caravans to the Vale and came back counting bodies that belonged to no one. The vampire learned to buy clocks, because the Court decided that those who live by night need to know the exact hour of the sun. The hunter opened silver cages and found in them things he himself had caged. Each side did to the other what it accused the other of doing.</p><h3>Of the table of Askavik</h3><p>So that the war would not become a war, the masters of both banners sat at the same table, in the council hall of Askavik. It is the <b>Broken Table</b>, and the name is old: a stone table split down the middle, one side for each banner. The humans vote, the mage keeps the minutes, the elf mediates, the dwarf brings the iron table that never cracks and Varg, at one of the sessions, cracked the iron table with a slap.</p><p>The side that wins the Table raises its banner in the square of Askavik for a whole week. It sounds like little. It is not. A week of banner in the square changes the price of bread, the mood of the guards and who gets to sleep at the inn.</p>"});
  add({"lv": "XXX", "body": "<h3>Of the extra chair</h3><p>At the first session of the Table there was one chair too many. No one had put it there. On it, carefully folded, lay a <b>grey cloak</b>. At the end of the session the cloak was gone, and no one saw it leave.</p><p>After that I went after the cloak, and every path had seen it without knowing. It was the one who bought the vampires' clocks. It was the one who sold candles to the Abbey. It was the one who paid the skald to sing the wrong song. It was the man without a scent whom the wolves could not follow. It was the one who signed the Brotherhood's crates. It was the one who wrote in that letter older than Malgrath. It was the one who carried food to the beasts' nest. It was the one who had studied the toll road, and who ordered from the dwarves a bell with the Eye carved with its eyes closed.</p><p>No one remembers the face. Everyone remembers the cloak.</p>"});
  add({"toc": "Book XXXI — Velmora, the bridge of tears", "lv": "XXXI", "eyebrow": "Book XXXI", "title": "Velmora, the bridge of tears", "start": true, "body": "<h3>Of the village the maps skip</h3><p>On the <b>Dark Canal</b>, at the border between Hrafnhöfn, which belongs to the Thread, and Darkcrow, which belongs to the Unraveled, there is a fishing village the cartographers forget to draw. It is called <b>Velmora</b>. It has two banks and a single name. The Dawn Bank, to the west, of pale houses, a square and a quay. The Night Bank, to the east, of black roofs and red lanterns the Count can see from his castle. It has no chapel. The villagers say they never needed one, and lower their eyes when they say it.</p><p>There live the Bridge Warden, Edla; the fisherman Tóki; old Rúna of the Nets, who mends what no one else will mend; the merchant Hekla, who sells to both banks at the same price; and the lamplighter Orri, who lights the lanterns of the Night Bank and says they go out on their own when someone lies on the bridge.</p><h3>Of the bridge</h3><p>The <b>Bridge of Velmora</b> is a broad arch of stone held with dwarven clamps, from before King Thrain, bearing the mark of no clan. On the middle stone there is an inscription: <i>here one crosses</i>. The last words were scraped off. The eldest say the whole phrase was <i>here one crosses, and here one stays</i>.</p>"});
  add({"lv": "XXXI", "body": "<h3>Of the ferryman</h3><p>Beneath the bridge works <b>Táraka the Ferryman</b>. His name, in a tongue older than ours, means the one who carries across, the one who delivers, and also the pupil of the eye. The lantern on his boat is always unlit. He takes the dead to the place from which one returns human, and charges nothing. I asked who had crossed before me. He told me, and it was someone from another path. He told every traveler the same thing: someone from another path crossed before.</p><h3>Of the fourth door</h3><p>The bridge has three pillars. The middle one was built <b>around</b> something. When the pillar cracked, in the year the rot came down the river and the villages fled to Velmora, a door of black stone appeared inside it, with no handle, with the Eye of lowered lids. It is older than the bridge. It is older, I think, than Velmora.</p><p>Someone closed the bridge with a chain that year and began charging a toll to those who fled. The toll collectors were paid in old coin, by someone with no face. The Thread escorted the refugees. The Unraveled broke the chain. The Raven held the middle of the bridge. And I stood looking at the door, and the door, I swear, looked back.</p><p class=\"seal\">Velmora is the only place every path must go. Go. And do not read the inscription aloud.</p>"});
  add({"toc": "Book XXXII — Of guilds and provinces", "lv": "XXXII", "eyebrow": "Book XXXII", "title": "Of guilds and provinces", "start": true, "body": "<h3>Of the Book of Guilds</h3><p>In Lumenhal stands the Town Hall, a palace of columns with the clock tower and the bell that marks the city's hours. Inside, in the audience hall, <b>Mayor Corvin Aldmar</b> keeps the <b>Book of Guilds</b> on a lectern, and it is in it that every guild in Karmika exists or ceases to exist. A copy stays with me, in the Great Library, because the Mayor trusts ink more than memory, and so do I.</p><p>Founding a guild asks little and costs much: three experienced founders, who have walked far enough to weigh something, and a <b>Tear of Marghar</b> on the table. The three sign. The name never changes again. The banner and the symbol may change; the name may not, because the Book does not erase.</p><h3>Of glory</h3><p>A guild grows in <b>glory</b>, and glory comes from three sources: a share of what each member learns on the road, the quests the guild completes together, and what the members donate to the coffers. A glorious guild is stronger in everything: its members have more health, more damage, more armor, and recover faster. The ancients call this a steady standard. I call it people who do not walk alone.</p>"});
  add({"lv": "XXXII", "body": "<h3>Of the Guild House</h3><p>When the guild reaches the fourth rank, it raises its <b>House</b>. It is not a barracks: it is a house of crafts and trade. It has rooms for each profession, the armory and the guild's items, which the members themselves sell, rent and lend to one another. No outsider runs the House. It belongs to the players, and they govern it.</p><h3>Of the castle and the province</h3><p>At the fifth rank, the guild becomes a <b>castle</b>, and the castle gains a village. Each member receives a plot of land to build their house, and the town is <b>defended and kept by the guild itself</b>, with its own hands, when the siege comes. The land around becomes the guild's province.</p><p>Outsiders may buy land in the province and live there. They pay tax, and the tax is not a punishment: it is the price of the walls' protection. Those who have never seen a province under siege think the tax is high. Those who have, pay without complaint.</p><p class=\"seal\">A guild is not a chat with a banner. It is a city that has not finished being built.</p>"});
  add({"toc": "Book XXXIII — Of taverns and wagons", "lv": "XXXIII", "eyebrow": "Book XXXIII", "title": "Of taverns and wagons", "start": true, "body": "<h3>Of the Wet Anvil</h3><p>A chronicler who does not know the taverns does not know the world, because it is in them that the world tells what it does not tell chroniclers. The best of all is the <b>Wet Anvil</b>, the dwarves' tavern. It is a stone hall with a bar of draught barrels and a whole wall of bottles, a fire pit with a boar on the spit, long tables with benches and a stage where the bard sings until someone throws a mug. Behind the bar, <b>Hildigunn</b> pours the dark beer. At the pit, <b>Fróði</b> turns the boar. In the kitchen, <b>Sif</b> makes the stew that cures hangovers and heartache, in that order.</p><p>There is a round table in the corner that can be booked for an hour, at twenty coins, for those who want to talk without being heard. I booked it once. I heard everything from the next table.</p><h3>Of the dwarf's feast</h3><p>The <b>dwarves' wagons</b> roll along every road loaded with beer and barbecue. Whoever pays gets a feast: the wagon becomes a tent, the barbecue goes on the ground, the barrels open, the music plays and the villagers dance along. After a while everyone starts slumping over and sleeps where they fell. In the morning the dwarf is already gone, and has left a letter on the ground. I keep mine: <i>What a shindig! Hope you enjoyed my services. I'm always around stirring things up.</i></p>"});
  add({"lv": "XXXIII", "body": "<h3>Of the Brass Caravan</h3><p>The <b>Brass Caravan Company</b> belongs to the technocrats, and sells what the Academy makes: vibrating blades, electrified blades, firearms, turrets that break after a few uses and little robots that help raise houses. Every wagon in Karmika pays the Company a fee for protection. When one is robbed, the Company sends an <b>alert</b> to the whole world. Whoever is nearby chooses whether to go. Whoever goes and defends it receives the reward paid by the merchants themselves. No one charges those who do not go. The Eye does.</p><h3>Of the market that belongs to the walkers</h3><p>Almost everything that circulates in Karmika was gathered, made, carried or built by someone. Woodcutter and carpenter, miner and smith, skinner and tailor, herbalist and alchemist, fisher and cook. Whoever cannot make it buys from whoever can. Even houses are sold: the Registry Office hands over the deed, and the deed goes to auction like any sword.</p>"});
  add({"toc": "Book XXXIV — The paths that still sleep", "lv": "XXXIV", "eyebrow": "Book XXXIV", "title": "The paths that still sleep", "start": true, "body": "<p>I counted eight paths, and eight are those that open today. But the Seer of Paths, when she drinks wine, tells that she has seen more roads in the water of her vessel. Roads that still sleep, waiting for someone to wake them. I write down what I heard, without promising that I know.</p><h3>The Circle of Stones</h3><p>In the heart of the <b>Enchanted Forest</b>, where the canopies glow at night, there is a circle of stones no one raised. There, they say, some go to listen to what the trees say slowly, and come back knowing how to change shape, call roots and thorns and heal with what grows from the ground. The elves call them <b>druids</b>. They say the forest has no owner; it has a guardian.</p><h3>The Faceless Guild</h3><p>In the alleys of Askavik there is a guild with no headquarters, only contracts. No one sees its members; everyone feels them. Those who know it call it the <b>Faceless Guild</b>, and its people, <b>assassins</b>. Every contract weighs on the karma of whoever pays and whoever fulfills it. I have heard it refused a contract only once. The client wore a grey cloak.</p><h3>Those who raise what fell</h3><p>Where everyone sees the end, some see raw material. In the <b>Crypt of Hemara</b>, at the edge of the Cursed Land, they speak of people who raise bones and bind souls by a thread. They are the <b>necromancers</b>, and the whole Order of the Thread hunts them, because binding a soul is the opposite of guarding it.</p><p class=\"seal\">When these paths awaken, I will be there to write it down. If they awaken before I do, let someone write it down for me.</p>"});
  add({"toc": "Epilogue", "lv": "", "eyebrow": "Epilogue", "title": "What is yet to be written", "start": true, "body": "<p>Here ends what I know of this season. The road goes on, and whoever walks it will write the chapters still missing. If you have come this far, take the advice the historian gives every traveler: look at what you are sowing.</p><p>This is <b>Season I</b> of the chronicles. What the walkers do in it, the wars, the tears, the cities raised and those that fall, goes into the next volume. The Karmika Bible is alive: the game happens in the book, and the book tells the game.</p><p class=\"seal\">Ormund Salveth, Chronicler of the Great Library</p>"});
