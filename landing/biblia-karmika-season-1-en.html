<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Karmika Bible · Season I</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: um livro de uma página por vez, com moldura gravada, virada de página e sumário clicável */
:root {
  --bg: #08060d;
  --bg-2: #120c1c;
  --page: #15101e;
  --page-2: #1b1427;
  --ink: #eadfca;
  --muted: #a89a84;
  --gold: #d9a24f;
  --gold-lo: #7d5a2c;
  --violet: #8f7bff;
  --blood: #b3202f;
  --font-display: "Cinzel Decorative", "Cinzel", Georgia, serif;
  --font-label: "Cinzel", Georgia, serif;
  --font-body: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 40%, rgba(8,6,13,0) 30%, rgba(8,6,13,0.85) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='80' viewBox='0 0 120 80' fill='none' stroke='%23d9a24f' stroke-width='1.3' stroke-linejoin='bevel' opacity='0.16'><g id='e'><path d='M24 10 L14 20 L24 30 M14 10 V30 M36 10 L46 20 L36 30 M46 10 V30'/><path d='M30 16 L34 20 L30 24 L26 20Z' fill='%23d9a24f'/></g><use href='%23e' x='60' y='40'/></svg>");
  background-size: cover, 120px 80px;
  color: var(--ink);
  font-family: var(--font-body);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
.app { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
:root { --bw: min(100%, calc((100vh - 92px) * .8)); }
@supports (height: 100dvh) { :root { --bw: min(100%, calc((100dvh - 92px) * .8)); } }
.book { position: relative; flex: 1 1 auto; min-height: 0; width: var(--bw); container-type: inline-size; }
.stage { position: absolute; inset: 0; perspective: 2200px; }
.leaf {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, var(--page-2), var(--page) 55%);
  border: 1px solid var(--gold-lo);
  border-radius: 4px 10px 10px 4px;
  box-shadow: 0 18px 50px rgba(0,0,0,.65), inset 0 0 60px rgba(0,0,0,.45), -6px 0 0 -2px #0d0915, -10px 0 0 -4px #0a0710;
  transform-origin: left center;
  backface-visibility: hidden;
  overflow: hidden;
}
.leaf::before { /* moldura interna dupla */
  content: ""; position: absolute; inset: 8px; border: 1px solid var(--gold); opacity: .55; border-radius: 2px; pointer-events: none;
}
.leaf::after {
  content: ""; position: absolute; inset: 13px; border: 1px dotted var(--gold-lo); pointer-events: none;
}
.side {
  position: absolute; top: 34px; bottom: 46px; width: 28px; z-index: 1;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='96' viewBox='0 0 28 96' fill='none' stroke='%23d9a24f' stroke-width='1.4' stroke-linejoin='round'><path d='M4 14 L14 7 L24 14 L14 21 Z'/><path d='M14 11 L17 14 L14 17 L11 14Z' fill='%23d9a24f'/><path d='M8 36 H20 L14 48 L20 60 H8 L14 48 Z'/><path d='M14 72 C18 78 19 83 14 86 C9 83 10 78 14 72Z'/></svg>") center top / 28px 96px repeat-y;
  opacity: .7; pointer-events: none;
}
.side.l { left: 16px; } .side.r { right: 16px; }
.base {
  position: absolute; left: 50px; right: 50px; bottom: 16px; height: 28px; z-index: 1;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='28' viewBox='0 0 96 28' fill='none' stroke='%23d9a24f' stroke-width='1.4' stroke-linejoin='round'><path d='M4 14 L14 7 L24 14 L14 21 Z'/><path d='M14 11 L17 14 L14 17 L11 14Z' fill='%23d9a24f'/><path d='M42 6 H54 L48 14 L54 22 H42 L48 14Z'/><path d='M82 6 C86 11 87 16 82 20 C77 16 78 11 82 6Z'/></svg>") left center / 96px 28px repeat-x;
  opacity: .55; pointer-events: none;
}
.corner { position: absolute; width: 38px; height: 38px; z-index: 2; pointer-events: none;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='38' height='38' viewBox='0 0 38 38' fill='none' stroke='%23d9a24f' stroke-width='1.6'><path d='M3 36 V12 Q3 3 12 3 H36'/><path d='M9 9 L14 14 L9 19 L4 14Z' fill='%23d9a24f' stroke='none'/></svg>") no-repeat; }
.corner.tl { top: 5px; left: 5px; }
.corner.tr { top: 5px; right: 5px; transform: scaleX(-1); }
.corner.bl { bottom: 5px; left: 5px; transform: scaleY(-1); }
.corner.br { bottom: 5px; right: 5px; transform: scale(-1,-1); }
.inner {
  position: absolute; inset: 78px 52px 56px 52px; overflow-y: auto; z-index: 3; display: flex; flex-direction: column;
  font-size: clamp(1.05rem, 2.9cqi, 1.5rem); line-height: 1.46; padding: 4px 6px 4px 2px;
  scrollbar-width: thin; scrollbar-color: var(--gold-lo) transparent;
}
.inner > :first-child, .inner > div > :first-child { margin-top: 0; }
.inner p { margin: 0 0 .8em; text-wrap: pretty; hyphens: auto; }
.inner b, .inner strong { color: #f3e2bd; font-weight: 600; }
.inner em { color: #d8c8a6; }
.eyebrow { text-indent: .32em; font-family: var(--font-label); font-size: .63em; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); margin: 0 0 .4em; text-align: center; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.45em; line-height: 1.15; text-align: center; margin: 0 0 .2em; color: #f6e4bb; text-wrap: balance; text-shadow: 0 0 18px rgba(217,162,79,.25); }
h3 { clear: both; text-indent: .16em; font-family: var(--font-label); font-weight: 600; font-size: .84em; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 1.2em 0 .6em; text-align: center; text-wrap: balance; }
h3.subtitle { clear: none; margin: .2em 0 0; font-size: .87em; text-shadow: 0 0 14px rgba(217,162,79,.35); }
h3.subtitle + .rule { margin-bottom: 1.6em; }
.rule { display: block; margin: .5em auto 1.1em; width: 70%; height: 14px; }
.initial {
  float: left; width: 1.55em; height: 1.55em; margin: .1em .45em .04em 0; font-size: 2.9em; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; text-indent: 0; hyphens: none;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23f6dc8e'/><stop offset='.5' stop-color='%23d9a24f'/><stop offset='1' stop-color='%238a5a1f'/></linearGradient><g id='c' fill='none' stroke='url(%23g)' stroke-width='1.6' stroke-linecap='round'><path d='M13 36 C11 21 19 13 31 13 C38 13 39 20 34 22 C30 23 28 19 31 17'/><path d='M13 26 C17 26 20 29 20 33'/><path d='M22 13 C26 17 26 21 23 24'/><circle cx='31' cy='17' r='1.8' fill='%23c4342f' stroke='none'/></g></defs><rect width='100' height='100' fill='%23290c2c'/><path d='M0 0 L100 100 M100 0 L0 100 M50 0 L100 50 L50 100 L0 50Z' stroke='%23d9a24f' stroke-opacity='.16' fill='none'/><rect x='4' y='4' width='92' height='92' fill='none' stroke='url(%23g)' stroke-width='3'/><rect x='9' y='9' width='82' height='82' fill='none' stroke='url(%23g)' stroke-width='1'/><use href='%23c'/><use href='%23c' transform='translate(100 0) scale(-1 1)'/><use href='%23c' transform='translate(0 100) scale(1 -1)'/><use href='%23c' transform='translate(100 100) scale(-1 -1)'/><path d='M50 5 L55 10 L50 15 L45 10Z M50 85 L55 90 L50 95 L45 90Z M5 50 L10 45 L15 50 L10 55Z M85 50 L90 45 L95 50 L90 55Z' fill='url(%23g)'/></svg>") center / 100% 100% no-repeat;
  box-shadow: 0 0 18px rgba(217,162,79,.28), 0 2px 8px rgba(0,0,0,.6); border-radius: 2px;
  background-color: #290c2c;
  color: transparent;
  position: relative;
}
.initial::before {
  content: attr(data-l); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 1.12em; transform: translate(calc(var(--dx, 0) * 1em), calc(var(--dy, 0) * 1em)); background: linear-gradient(180deg, #fff3c6 0%, #e6b459 45%, #9a6422 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 1px 0 rgba(0,0,0,.75)) drop-shadow(0 0 4px rgba(217,162,79,.45));
}
.folio { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; z-index: 4; pointer-events: none; }
.folio span { display: inline-block; background: var(--page); padding: 1px 22px; font-family: var(--font-label); font-size: .78rem; letter-spacing: .24em; color: var(--gold); }
.ribbon {
  position: absolute; top: -2px; right: 52px; z-index: 5; width: clamp(34px, 5.2cqi, 48px); height: clamp(70px, 10.5cqi, 100px); border: 0; padding: 0; cursor: pointer;
  background: linear-gradient(#a3202f, #6e1420); clip-path: polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);
  transition: height .2s;
}
.ribbon:hover, .ribbon:focus-visible { height: clamp(82px, 12.5cqi, 116px); outline: none; }
.ribbon:focus-visible { filter: drop-shadow(0 0 4px var(--gold)); }

/* capa */
.cover .inner { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .4rem; overflow-y: auto; }
.cover .title { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 7vw, 3.1rem); line-height: 1.05; color: #f6e4bb; text-shadow: 0 0 26px rgba(217,162,79,.4); margin: .1em 0 0; }
.cover .sub { font-family: var(--font-label); letter-spacing: .3em; font-size: .78rem; text-transform: uppercase; color: var(--gold); margin: 0; }
.cover .ep { margin: .35em 0 .25em; display: flex; flex-direction: column; align-items: center; gap: .2em; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.05rem, 3.6vw, 1.55rem); letter-spacing: .08em; color: #f3dfae; text-shadow: 0 0 18px rgba(217,162,79,.45); }
.cover .ep span { font-family: var(--font-label); font-size: .5em; letter-spacing: .42em; text-transform: uppercase; color: var(--gold); padding: 0 .2em .1em; border-bottom: 1px solid var(--gold-lo); }
.cover .by { font-style: italic; color: var(--muted); margin: .6em 0 0; font-size: 1.15rem; }
.cover svg.sigil { width: min(78%, 330px); height: auto; filter: drop-shadow(0 0 16px rgba(217,162,79,.35)); }
.open-btn, .nav button, .nav .toc-btn {
  font-family: var(--font-label); letter-spacing: .2em; text-transform: uppercase; font-size: .78rem; cursor: pointer;
  color: var(--ink); background: transparent; border: 1px solid var(--gold-lo); padding: 10px 18px; border-radius: 2px;
}
.open-btn { margin-top: 1rem; border-color: var(--gold); color: #f6e4bb; }
.open-btn:hover, .nav button:hover:not(:disabled) { background: rgba(217,162,79,.14); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* sumário */
.toc { list-style: none; margin: 0; padding: 0; }
.toc li { margin: 0; }
.toc a { display: flex; align-items: baseline; gap: .5rem; padding: .32em 0; color: var(--ink); text-decoration: none; font-size: 1.15rem; cursor: pointer; }
.toc a .dots { flex: 1; border-bottom: 1px dotted var(--gold-lo); transform: translateY(-4px); min-width: 12px; }
.toc a .n { font-family: var(--font-label); font-size: .85rem; color: var(--gold); letter-spacing: .1em; }
.toc a:hover { color: #fff1cf; }
.toc a:hover .dots { border-color: var(--gold); }
.toc .lv { font-family: var(--font-label); font-size: .68rem; letter-spacing: .26em; color: var(--gold); text-transform: uppercase; margin-right: .2rem; }

/* detalhes de conteúdo */
.colors { list-style: none; padding: 0; margin: .6em 0 1em; display: grid; gap: .5em; }
.colors li { display: flex; align-items: center; gap: .8em; }
.sw { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); }
.fig { display: block; margin: .6em auto 1em; width: min(60%, 210px); height: auto; }
blockquote { margin: .8em 0; padding: .2em 0 .2em 1em; border-left: 2px solid var(--gold-lo); font-style: italic; color: #d8c8a6; }
ul.plain { margin: .3em 0 1em; padding-left: 1.15em; }
ul.plain li { margin: 0 0 .45em; }
.seal { text-align: center; font-style: italic; color: var(--muted); margin-top: 1em; }


.inner > div { flex: none; }
.endorn { margin-top: auto; padding-top: 18px; flex: none; text-align: center; }
.endorn svg { width: min(78%, 300px); height: 38px; display: block; margin: 0 auto; }

.toc-row { display: flex; align-items: baseline; gap: .5rem; padding: .3em 0; color: var(--ink); text-decoration: none; font-size: 1.12rem; cursor: pointer; }
.toc-row .lv { font-family: var(--font-label); font-size: .68rem; letter-spacing: .26em; color: var(--gold); text-transform: uppercase; min-width: 2.2em; }
.toc-row .dots { flex: 1; border-bottom: 1px dotted var(--gold-lo); transform: translateY(-4px); min-width: 12px; }
.toc-row .n { font-family: var(--font-label); font-size: .85rem; color: var(--gold); letter-spacing: .1em; }
.toc-row:hover { color: #fff1cf; }
.toc-row:hover .dots { border-color: var(--gold); }
.figwrap { text-align: center; margin: .5em 0 .8em; }
.secmark { margin: 1.6em 0 .2em; }
.secmark .rule { margin: 0 auto; }
.inner > div > .secmark:first-child { display: none; }
.figwrap { --u: min(.95px, .13cqi); margin: .9em 0 1em; }
.figwrap svg { width: auto; max-width: 100%; }
.figwrap svg.hour { height: calc(var(--u) * 410); display: block; margin: 0 auto; }
.figwrap svg.eye { display: block; margin: 0 auto; }
.figwrap svg.eye { height: calc(var(--u) * 160); }
.figwrap svg.eye.tear { height: calc(var(--u) * 255); }
/* manual: etiquetas e tabelas */
.tag { display: inline-block; font-family: var(--font-label); font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; padding: 1px 6px; border: 1px solid; border-radius: 2px; vertical-align: .12em; white-space: nowrap; font-style: normal; }
.tag.d { color: var(--gold); border-color: var(--gold-lo); }
.tag.p { color: #b9acff; border-color: #6a5db5; }
.tag.o { color: #f08a9a; border-color: #8c3a4a; }
.tw { overflow-x: auto; margin: .4em 0 1em; }
table { border-collapse: collapse; width: 100%; font-size: .98rem; line-height: 1.3; }
th { font-family: var(--font-label); font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); text-align: left; font-weight: 400; padding: 4px 8px 6px 0; border-bottom: 1px solid var(--gold-lo); }
td { padding: 6px 8px 6px 0; border-bottom: 1px dotted rgba(125,90,44,.6); vertical-align: top; }
.part-note { text-align: center; font-style: italic; color: var(--muted); }
.legend { display: grid; gap: .5em; margin: 1em 0; }
.legend div { display: flex; gap: .7em; align-items: baseline; }
.toc-part { font-family: var(--font-label); font-size: .74rem; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); margin: 1em 0 .2em; text-align: center; }
.toc-link { display: block; text-align: center; margin-top: 1.2em; color: var(--gold); font-family: var(--font-label); font-size: .78rem; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; text-decoration: none; }

/* barra de navegação */
.nav { flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; width: var(--bw); }
.nav .count { font-family: var(--font-label); letter-spacing: .2em; font-size: .8rem; color: var(--muted); min-width: 92px; text-align: center; }
.nav button:disabled { opacity: .35; cursor: default; }

@media (max-width: 520px) {
  .initial { font-size: 2.6em; }
  .inner { inset: 62px 40px 52px 40px; font-size: 1.04rem; line-height: 1.4; }
  .side { width: 22px; } .side.l { left: 14px; } .side.r { right: 14px; }
  .side { background-size: 22px 76px; }
  .base { left: 40px; right: 40px; }
  h2 { font-size: 1.35em; }
  .ribbon { right: 40px; }
  .nav { flex-wrap: nowrap; gap: 6px; }
  .nav button, .open-btn { padding: 9px 9px; letter-spacing: .06em; font-size: .72rem; white-space: nowrap; }
  .nav .count { min-width: 58px; letter-spacing: .08em; font-size: .72rem; }
}


.strap { position: absolute; left: -4px; right: -4px; bottom: 7%; height: 84px; z-index: 8; padding: 0; border: 0; background: none; cursor: pointer; display: block; }
.strap .band { position: absolute; top: 12px; bottom: 12px; width: 50.2%; transition: transform .9s cubic-bezier(.5,0,.3,1);
  background: linear-gradient(180deg, #6a4023 0%, #4a2a17 40%, #34200f 100%);
  box-shadow: inset 0 2px 0 rgba(255,214,150,.18), inset 0 -3px 0 rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.6); }
.strap .band::before, .strap .band::after { content: ""; position: absolute; left: 6px; right: 6px; height: 0; border-top: 2px dashed rgba(236,196,130,.55); }
.strap .band::before { top: 8px; } .strap .band::after { bottom: 8px; }
.strap .band.l { left: 0; border-radius: 0 3px 3px 0; } .strap .band.r { right: 0; border-radius: 3px 0 0 3px; }
.strap .lock { position: absolute; left: 50%; top: 50%; width: 88px; height: 117px; margin: -64px 0 0 -44px; overflow: visible; z-index: 2;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.7)); transition: transform .25s, filter .25s; animation: lockGlow 4.5s ease-in-out infinite; }
.strap:hover .lock, .strap:focus-visible .lock { transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(255,207,122,.9)) drop-shadow(0 4px 6px rgba(0,0,0,.7)); }
.strap .shackle { transform-origin: 62px 56px; transition: transform .5s cubic-bezier(.3,1.4,.5,1); }
@keyframes lockGlow { 0%, 70%, 100% { filter: drop-shadow(0 4px 6px rgba(0,0,0,.7)); } 85% { filter: drop-shadow(0 0 12px rgba(255,207,122,.95)) drop-shadow(0 4px 6px rgba(0,0,0,.7)); } }
.strap.unlock .lock { animation: none; }
.strap.unlock .shackle { transform: translateY(-14px) rotate(-26deg); }
.strap .runes { animation: lockRune 3.2s ease-in-out infinite; filter: drop-shadow(0 0 3px #8f7bff); }
@keyframes lockRune { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.strap.unlock .runes { animation: none; opacity: 1; stroke: #fff1bd; filter: drop-shadow(0 0 5px #ffcf7a); }
.strap.unlock .keyhole { fill: #fff1bd; }
.strap.open .lock { transition: transform .9s cubic-bezier(.5,0,1,.6), opacity .9s; transform: translateY(160px) rotate(35deg); opacity: 0; }
.strap.open .band.l { transform: translateX(-102%); } .strap.open .band.r { transform: translateX(102%); }
.strap:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
.strap.unlock .hint { opacity: 0; transition: opacity .3s; }
.strap .hint { position: absolute; left: 0; right: 0; top: -44px; text-align: center; font-family: var(--font-label); font-size: .64rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); opacity: .8; }
@media (max-width: 520px) { .strap { height: 62px; } .strap .lock { width: 66px; height: 88px; margin: -50px 0 0 -33px; } }
@media (prefers-reduced-motion: reduce) { .strap .lock, .strap .band, .strap .shackle { transition: none; animation: none; } }
@keyframes runeGlow { 0%, 60%, 100% { opacity: .62; filter: none; } 72% { opacity: 1; filter: drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 12px rgba(217,162,79,.85)); } 86% { opacity: .8; filter: drop-shadow(0 0 3px rgba(217,162,79,.5)); } }
@keyframes runeGlowB { 0%, 55%, 100% { opacity: .5; filter: none; } 68% { opacity: .95; filter: drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 12px rgba(217,162,79,.85)); } 82% { opacity: .7; filter: drop-shadow(0 0 3px rgba(217,162,79,.5)); } }
@keyframes runeDrift { 0%, 100% { background-position: 0 0; } 50% { background-position: 0 7px; } }
@keyframes runeDriftB { 0%, 100% { background-position: 0 0; } 50% { background-position: 8px 0; } }
@keyframes leafGlow { 0%, 62%, 100% { border-color: var(--gold-lo); } 74% { border-color: var(--gold); } }
.side { animation: runeGlow 11s ease-in-out infinite, runeDrift 7s ease-in-out infinite; }
.side.r { animation-delay: 3.6s, -2.5s; }
.base { animation: runeGlowB 13s ease-in-out infinite 1.8s, runeDriftB 9s ease-in-out infinite; }
.leaf { animation: leafGlow 11s ease-in-out infinite; }

  add({ toc: 'Prologue', partStart: 1, lv: '', eyebrow: 'Prologue', title: 'Of what the historian saw and what he was told', start: true, body:
    '<p>My name is <b>Ormund Salveth</b>, and I am the one who writes things down. I wield no sword and cast no flames. I keep the records of the Great Library, in the central city of Karmika, and I walk the roads with ink, parchment and a great deal of patience, listening. I listen to the smith from a city of gears, to the priestess of the holy field, to the hunter who comes back from the forest with eyes older than his face, and even to the vampire who agrees to talk to me, so long as I do not ask the name of his first life.</p>' +
    '<p>After many years I learned that every story in this world tells the same story, dressed in different clothes: <b>whatever is sown comes back</b>.</p>' +
    '<p>This compendium is not a manual. Here is what is told by the fireside: how the world was set in motion, who the gods are that walk it, which peoples were born in it, which roads open before each soul and what happens when the road ends. Where I know, I will speak as one who saw. Where I was only told, I will say that I was told.</p>' +
    '<p>Read it the way one reads a chronicle. And remember, as you turn each page, that you too are sowing something.</p>' });

  add({ toc: 'Book I — Before the Paths', lv: 'I', eyebrow: 'Book I', title: 'Before the Paths', start: true, body:
    '<h3>Of the Lord who watches</h3>' +
    '<p>The eldest say that before there were roads there was only the ground, and that someone had to look at it for it to become anything. That someone is <b>Marghar, the Lord of Paths</b>.</p>' +
    '<p>You will not find him in any temple that asks or promises. Marghar does not hinder, does not help and does not judge. He sees. Sometimes, rarely, he is moved by what he sees, and those who witnessed it swear the whole world seemed to breathe. But he governs, and he collects. He is greater than all the gods of Karmika and has defeated none of them; his greatness lies not in victories but in being the call that cannot be refused. He gives time the time that time asks for, and returns to worth the worth it needs.</p>' });
  add({ lv: 'I', body:
    '<h3>Of the Before</h3>' +
    '<p>The eldest of all tell that there was a time before all times, and that it was neither dark nor bright, because there was no one to see the difference.</p>' +
    '<p>There was no path, because there was no step. There was no step, because no one had walked. And there was no stopping, because no one had moved in order to stop moving. There was only the <b>Before</b>: a whole mystery, with no direction, no hurry and no destination.</p>' +
    '<p>It was within the Before that Marghar thought. He did nothing yet. He only thought of walking. And that was enough: the thought opened the space for someone, or something, to walk.</p>' });
  add({ lv: 'I', body:
    '<h3>Of the Hunger that also wished to walk</h3>' +
    '<p>But Marghar\'s thought was not heard only by those who deserved it. In the Before there was something that had never been anything but craving. It was trapped, like a rabid dog facing prey on the other side of the fence; like the werewolf who catches the scent and has no trail; like the vampire who smells the blood and cannot find the door. Wanting, with no path for the wanting. Those who hate it, those who worship it and those who fear it call it <b>Ahzur, the Stepless</b>. Its true name, no one knows.</p>' +
    '<p>When Marghar thought of walking, Ahzur\'s craving broke loose as well. Good was free to chart its course. But in the same instant evil gained a path to reach its malice: a road straight, fast and open to all. And at the end of that straight road stood those who did not yet know how to walk.</p>' });
  add({ lv: 'I', body:
    '<h3>Of the labyrinth</h3>' +
    '<p>Marghar saw. He did not judge, did not conquer, did not imprison, for he does none of these things. But he saw, and he made the <b>paths</b>, plural. Where there was a straight line, he made forks; where there was haste, he made bends; where there was one door, he made a thousand doors. Every path is a choice, and every choice is a wall between Ahzur and us, the walkers, who are not yet ready to meet it. That is why evil is slow to find us.</p>' +
    '<p>The paths, then, are not only freedom. They are the labyrinth in which we were hidden. Everyone who walks through Karmika is a walker, and every walker, knowing it or not, is being guarded from the Hunger by a wall that Marghar raised.</p>' +
    '<h3>Of karma</h3>' +
    '<p>But there are those who do not wish to hide. Some want their path to cross Ahzur\'s, and seek it openly. Others spend their lives helping Marghar confuse the essence of evil, turning it away from unready souls. From that desire, on both sides, <b>karma</b> was born: the weight of those who help confuse the Hunger, and the weight of those who serve themselves up as a banquet, in the delight of being devoured by it.</p>' +
    '<p>That is why karma is not punishment. It is the price of standing before what was left trapped in the Before, whether to hide it or to feed it.</p>' });
  add({ lv: 'I', body:
    '<h3>Of the children of the Hunger</h3>' +
    '<p>The most cautious of the priests say that Ahzur has never been found whole, and perhaps never will be. What souls find are the ways it has learned to walk: the pact, madness, ash, deceit, the banquet, oblivion, rot, the chain and betrayal. These are the ones tradition calls the infernal princes, and I will speak of them further on.</p>' +
    '<h3>Of the two kinds of souls</h3>' +
    '<p>Those who draw near the Hunger are divided into two peoples who almost never speak to each other. There are the <b>Diverters</b>, who live to lead astray: they weave false paths, shelter the unready and keep the labyrinth standing. And there are the <b>Guests</b>, who offer themselves to the banquet: they open the doors, leave the trail and take delight in being devoured. Both pay in karma, and Marghar sees both the same way.</p>' +
    '<p>He does not say which of the two is right. They say that when one of them does something the labyrinth did not foresee, the Eye weeps.</p>' });
  add({ lv: 'I', body:
    '<h3>Of the path and the walking</h3>' +
    '<p>There is one thing the old chronicles repeat, and that our whole culture has learned to repeat with them: <b>the path and the walking were made together</b>, beneath Marghar\'s gaze. The path did not exist before someone walked it, and the walker did not exist before the path. That is why good and evil, as we know them, were born in the same instant and from the same gesture.</p>' +
    '<p>Hence the conclusion reached by priests, scribes and even thieves: life is learning. Learning to avoid, and helping others avoid; or learning to find, and helping others find.</p>' +
    '<h3>Of the irony</h3>' +
    '<p>And here lies the irony the temple masters prefer not to explain. Finding is not the good, and avoiding is not the bad. It is the karma that karma itself carries: we pursue good by avoiding evil, and we do evil merely by finding evil.</p>' +
    '<p>It seems unfair, and perhaps it is. But paths are made by those who walk them, and no one walks without leaving ground behind.</p>' });
  add({ lv: 'I', body:
    '<p>If you are asked for a law in a single sentence, it is the oldest I know: <b>what was sown will be returned</b>. Farmers call it the harvest; priests, karma; technocrats, probability; the faithful, providence; and thieves, luck, until the day they stop smiling.</p>' +
    '<h3>Of the Eye</h3>' +
    '<p>Marghar has no face anyone could describe, but he has a symbol, and the symbol is an eye. Picture two Ks turned toward each other, forming a diamond between them. It is the <b>Karmic Eye</b>, and do not mistake it for an object: it is the natural law of karma itself, governed by Marghar.</p>' +
    '<p>While a soul lives, the Eye goes with it, and every choice, every judgment, every pact, every act of mercy or cruelty falls into it. What falls into the Eye is <b>liquid</b>, because it is still being added to. The karma of the living can still grow, be diverted, be traded for another. Nothing is sealed while a person breathes.</p>' +
    '<p>Sown karma is liquid because, like water, it changes. And just as a liquid takes the shape of its vessel, karma takes shape and transforms according to the walker who carries it: the same deed weighs one way in one soul and another way in another.</p>' +
    '<p>Some will ask whether the Eye judges. It does not judge; it sees. And what it sees, it keeps.</p>' +
    '<h3>Chronicler\'s notes</h3><p class="fnote"><span class="nb">✎</span>The elders say "a time before all times." Orvalen, in the fragments we have of him, puts it differently: "the Before also had a before, and it was from there that he came to watch." I have found not one more line about this, nor do I know who "he" is.</p><p class="fnote"><span class="nb">✎</span>All over the world the Eye is drawn open. I know of only one place where it appears closed: a door of black stone, with no handle, bearing the eye carved with lowered lids. I will speak of it more than once in this volume, because more than once I was told of it.</p>'  });

  add({ toc: 'Book II — The gods who walk the path', lv: 'II', eyebrow: 'Book II', title: 'The gods who walk the path', start: true, body:
    '<p>Marghar governs, but does not walk. The walking is done by the others, and each of them chose a road and has trodden it since before there was anyone to follow. Those roads are what mortals later came to call <b>paths</b>.</p>' +
    '<h3>The High Gods</h3>' +
    '<p><b>Auréon, the Majestic</b>, lord of the celestial light, is the god of paladins. It is said his church was born of an oath: that there would always be someone standing between evil and the defenseless. His priests teach that light is not purity; it is responsibility.</p>' +
    '<p><b>Odin, the Allfather</b>, is the god of the northern warriors. He dwells where it is cold, and whoever seeks him must climb to the frozen lands. He does not promise comfort; he promises a whole life devoted to strength and honor.</p>' +
    '<p><b>Hemara, the Crimson Mother</b>, is the lady of blood and of vampirism. Whoever hears her name for too long begins to thirst. Tradition says she never forced anyone; she only waited.</p>' });
  add({ lv: 'II', body:
    '<p><b>Selvar, the Father of the Pack</b>, is the god of werewolves. His law is the law of the pack: whoever is inside is protected to the death; whoever is outside is either prey or ally.</p>' +
    '<p><b>Arquelon, the Arcane Scribe</b>, is the god of mages. They say he wrote the first word of power and spends eternity correcting it. His scholars believe that knowledge is the only charity that never runs dry.</p>' +
    '<p><b>Mekhanos, the Great Engine</b>, is the god of technocrats. He does not like being called a god; he prefers "the project." His faithful believe the world is a machine under constant refinement, and that improving it is a form of prayer.</p>' +
    '<p><b>Aravel, the Green Vigil</b>, is the god of demon hunters. His eye never closes, and those who serve him live on alert, hunting what hides in the shadows of the world.</p>' });
  add({ lv: 'II', body:
    '<h3>The Infernal Princes</h3>' +
    '<p>On the other side of the road stand those whom tradition calls princes, not gods, because they depend on those who bow to them. Each is a <b>facet of Ahzur</b>, a way the Hunger of the Before has learned to walk. There are nine, and some say there are still more to come.</p>' +
    '<p><b>Malgrath, the Lord of Pacts</b>, is the patron of warlocks. He never lies in a contract, and that is exactly why those who sign one come to regret it.</p>' +
    '<p><b>Vhaelor, the Demon of Madness</b>, has no followers; he has victims. He is one of the great enemies of the worlds of Karmika, and killing one of his avatars is a deed worthy of song, even for a vampire.</p>' +
    '<p><b>Orrukh, the Devourer of Ashes</b>, appears when many souls weigh heavy together. They say he feeds on the collective karma of cities that lost their way.</p>' });
  add({ lv: 'II', body:
    '<p><b>Sythra, the Voice of the Whisper</b>, walks by way of the word. She does not lie: she chooses what to say, and promises each one exactly what they already wanted to hear.</p>' +
    '<p><b>Gorvak, the Endless Banquet</b>, is the facet closest to the pure Hunger. He asks for nothing; he only sets the table. He is the patron of the Guests, those who offer themselves to the delight of being devoured.</p>' +
    '<p><b>Nyxael, the Night Without Echoes</b>, walks by way of oblivion. She erases names, faces and debts from the memory of those who suffer, but nothing is ever erased from the Eye.</p>' });
  add({ lv: 'II', body:
    '<p><b>Zerath, the King of Rot</b>, walks through whatever rots slowly: disease, ruin, the cities that decay from within before they fall.</p>' +
    '<p><b>Ishkara, the Lady of Chains</b>, walks by way of dominion. She is the patron of those who subjugate, who make other people the ground they stand on.</p>' +
    '<p><b>Morvek, the Oathbreaker</b>, walks by way of betrayal. They say he waits beside every oath, and that fallen paladins know him by name.</p>' });
  add({ lv: 'II', body:
    '<h3>The Essences of the Path</h3>' +
    '<p>If the princes are the facets of the Hunger, the opposite side has no princes. It has the <b>Essences</b>: beings who, instead of ruling, helped. They ask for no bent knee and no oath. Tradition divides them into three callings.</p>' +
    '<p><b>Those who unraveled the labyrinth.</b> <b>Ilmara, the Cartographer of Steps</b>, was the first to map the path step by step. <b>Orvalen, the Reader of Tracks</b>, learned to read in the ground where Ahzur had already passed. <b>Sael, She Who Returned</b>, is the only soul who, they say, reached the center of the labyrinth and came back to tell of it.</p>' });
  add({ lv: 'II', body:
    '<p><b>The Architects.</b> They build and mend the karmic paths. <b>Brannor, the Roadmason</b>, lays the stones where the road opens. <b>Lythaen, the Weaver of Bridges</b>, stitches the paths that tear. <b>Dhurgan, the Mender of Veins</b>, is the smith who repairs what time and the Hunger corrode.</p>' +
    '<p><b>The Closers.</b> They close the paths when a prince, a facet of Ahzur, is about to arrive. <b>Caldris, the Sealer of Doors</b>. <b>Merith, the Last Door</b>. <b>Aldun, the Keeper of the Threshold</b>.</p>' +
    '<p>No Essence defeats Ahzur. To close is to delay, and to mend is to buy time. But they say that, because of them, the labyrinth still stands.</p>' +
    '<p>That is precisely why the Essences are hunted. Just as walkers accomplish prodigious deeds by banishing a wicked prince from the world, even if only for a little while, the walkers on Ahzur\'s side of karma long to kill an Essence to accomplish theirs. Whoever kills an Architect tears a hole in the labyrinth, and whoever kills a Closer leaves a door open for a prince to pass through.</p>' });
  add({ lv: 'II', body:
    '<h3>How the gods treat mortals</h3>' +
    '<p>No god invades anyone\'s soul. What exists is the <b>oath</b>: the mortal comes near and promises, and the god answers with <b>gifts</b>. In return, the mortal accepts <b>vows</b> and <b>prohibitions</b>: what to do and what never to do.</p>' +
    '<p>The gods have their feuds too, and the faithful inherit them. Whoever serves one must know whom the other will never forgive.</p>' +
    '<p>The priests whisper a question: do the gods also reap what they sow? Marghar has never said, but the answer is yes. When a prince of darkness, an Essence or a god falls, news runs across the whole world, telling of the great deed of the one who brought it down, and people say it has met its karma. They vanish for a hundred turns, but their influence remains. Over endless journeys and lives, these beings gathered so much karma that their death bursts into karmic energy with nowhere to go. That energy reads the karma of those present and turns into items made for each of them, answering each one\'s karma.</p>' +
    '<h3>Chronicler\'s notes</h3><p class="fnote"><span class="nb">✎</span>In the hall of the princes, on the third level beneath the Library, there are ten niches carved into the wall. Nine bear a name cut into the stone. The tenth bears no name at all, and it is the only one where dust never gathers.</p><p class="fnote"><span class="nb">✎</span>I counted nine Essences, as everyone does. But the oldest hymns to Ilmara, sung in the elven villages, have a verse with a name no one can pronounce to the end: the singer always runs out of breath on the same syllable, and the verse begins again.</p>'  });

  add({ toc: 'Book III — To sow and to reap', lv: 'III', eyebrow: 'Book III', title: 'To sow and to reap', start: true, body:
    '<p>Before any border, the world of Karmika is divided into two seasons of the soul: the one that sows and the one that reaps.</p>' +
    '<h3>The time of sowing</h3>' +
    '<p>While a soul lives, it sows. Every step is a seed: the guild it joined, the school where it studied, the enemy it spared, the innocent it did not spare. Killing is sowing too, and even small choices, if made on purpose, count.</p>' +
    '<p>In this time the Eye lies open and level, and karma is liquid; it still rises, it still mingles. Those who live long watch the Eye fill.</p>' + EYE_FILL });
  add({ lv: 'III', body:
    '<h3>The Hourglass</h3>' +
    '<p>When the soul dies, the symbol turns. The two Ks stand upright, and the Eye becomes the <b>Hourglass</b>. The standing K does not carry an hourglass inside it; it is the hourglass.</p>' + HOUR +
    '<p>And then the most important thing I know about karma happens: <b>the liquid dries</b>. What was liquid turns to sand, and the sand begins to fall through the lower neck of the K. While it was liquid, it could still change. Sand does not change. It is done, and there is nowhere to run.</p>' });
  add({ lv: 'III', body:
    '<p>The soul then receives what it sowed, grain by grain. A priest of Auréon once told me: "The reward is dry because it is no longer up for bargaining." The Hourglass must empty completely before the symbol turns again, and only then can the soul create karma anew.</p>' +
    '<p>It empties in two ways, whichever comes first: through consequences, when what was sown finally comes to pass, or through time, when the sand simply runs out. Someone carrying a great deal of karma may have, say, fifty turns ahead of them. During that time, things happen to them, people stop liking them and harmful effects come calling. A symbol follows them everywhere, the mark of the karmic walker. They may become the target of bounty contracts, or receive discounts and favors for vengeances the world thought necessary.</p>' +
    '<h3>The return</h3>' +
    '<p>The soul goes back to its journey, and the walker chooses their race again and charts their path. But they do not come back empty. They bring with them what they were: the vampire killed by a hunter may be reborn with an unexplained thirst or a loathing of garlic; the werewolf may wake hearing howls no one else hears. And there are those who know. Prophets and mystics of ancient guilds recognize certain souls, and some of those souls are hunted for what they once were.</p>' +
    '<p>Whoever plays for years lives many lives, and the story of each will be told again, and charged again, in the lives that follow.</p>' +
    '<p>Do not imagine the Hourglass separates saints from sinners. It knows neither good nor evil, only action and reaction. The walker who did what we call evil, who merely opened paths that ruined others, will have their karma to pay. But the one who did everything beautifully and helped many people also comes back with karma to pay. Many of the opposite karma will put a price on their head, and others will give them discounts on powerful items. The Eye sees, and nothing more.</p>' });
  add({ lv: 'III', body:
    '<h3>The Karmic Tear</h3>' + EYE_TEAR +
    '<p>There is one exception to the course of the Hourglass, and it is the most coveted thing in Karmika.</p>' +
    '<p>When someone performs a deed worthy of song, good or evil, the Eye weeps. The tear falls from the lower point, and it is called the <b>Karmic Tear</b>. It is not earned by the number of deeds but by historic ones: a kind vampire, a gentle werewolf, a warlock who turns demons against evil, a paladin who gives himself to the satanic, a hunter who stalks heroic paladins, whoever defeats a legend, whoever sacrifices themselves perfectly. Each of these walked where the labyrinth had not foreseen.</p>' +
    '<p>Here it is worth speaking of Marghar. For countless ages he went on creating paths for every karmic possibility, and nothing a walker did seemed to escape what he had foreseen. But, very rarely, one of us who walk in Karmika does what was not foreseen. That new path is literally created by a walker: in their memorable deed, they take Marghar\'s energy for themselves, for without it no path is made, and they trace on their own an impossible path that not even the ancient before the ancient had foreseen.</p>' +
    '<p>It is not a thief\'s theft. It is the theft of a tree drawing nourishment from the earth in order to exist, and perhaps it is the same karma as that of the one who first thought. That summoned energy causes Marghar pain, but does not wound him, for he is older than the wound that appeared on the path and older than the pleasure that appeared on the path. He is moved, and he weeps the tear of the very Eye that sees. Seen by him and come from him, it is powerful.</p>' +
    '<p><b>For the one who received it</b>, it grants the chance to live again upon dying, without passing so soon through karmic guilt. Only the soul that earned it can use it that way. <b>In the world</b>, it can be sold, and then it becomes an item: it raises a guild, forges unique pieces, goes into powerful potions, serves as raw material and as a currency for speculation, and from it may come a Hammer of Justice or a sword like those of legend.</p>' +
    '<p>The elders put it this way: the Tear is Marghar\'s emotion. He is rarely moved, and when he is, the world is worth more than gold.</p>' +
    '<h3>Chronicler\'s notes</h3><p class="fnote"><span class="nb">✎</span>In the galleries, I asked who was the first to make the Eye weep. The oldest record in the Library has the date and the name scraped away with a knife. Of the deed, a single word survived, the last of the line: returned.</p>'  });

  add({ toc: 'Book IV — The peoples', lv: 'IV', eyebrow: 'Book IV', title: 'The peoples', start: true, body:
    '<p>Everyone starts somewhere, and in Karmika every soul starts in one of three peoples. No one is born a vampire, a mage or a paladin. They are born human, dwarf or elf, in a small village, and everything else is consequence.</p>' +
    '<h3>The humans</h3>' +
    '<p>We are the most numerous and the least special, and perhaps for that reason the freest. No path is foreign to us, no road charges us our skin. Humans build: houses, bridges, walls and entire cities are the work of human hands. And many, when the soul returns after death, choose to come back human, so that nearly all of us carry, deep down, the beginning of everyone.</p>' +
    '<h3>The dwarves</h3>' +
    '<p>A people of mountain, forge and stubbornness. The dwarves I have known believe that what is made with one\'s hands needs no justification. A dwarf demon hunter or warlock is not forbidden, only rare, and I have heard that their people look at one the way you watch a brother leaving the burrow.</p>' });
  add({ lv: 'IV', body:
    '<h3>The elves</h3>' +
    '<p>The elves belong to the beautiful forests, where the trees have memory and every craft has its rhythm. An elf who becomes a vampire or a werewolf betrays more than himself; he betrays his people. He may do it, and many have, but the price is charged in karma, not in law.</p>' +
    '<h3>What is a bar, and what is guilt</h3>' +
    '<p>I asked many priests whether the law forbids anyone a path because of their race. The answer was always the same: no law forbids, everything charges. Nature does not shut the door; it only leaves the price written on it.</p>' });

  add({ toc: 'Book V — The eight paths', lv: 'V', eyebrow: 'Book V', title: 'The eight paths', start: true, body:
    '<p>The souls of Karmika do not choose a profession; they become something. No one wakes up a paladin one morning: they must join the church, study, serve, prove themselves. Each path demands an allegiance, a journey and, almost always, a voyage to distant lands. And for the first twenty levels everyone survives as best they can, with no path at all.</p>' +
    '<h3>The Paladin</h3>' +
    '<p>To become a paladin, one must join the church of Auréon, become a priest and only then a deliverer from evil. They wear the celestial light and hate monsters.</p>' +
    '<h3>The Northern Warrior</h3>' +
    '<p>They learn in the northern combat academy, in the frozen mountains, and devote their life to Odin. Steadfast, proud and, according to the werewolves, unbearable.</p>' });
  add({ lv: 'V', body:
    '<h3>The Vampire</h3>' +
    '<p>No one chooses it all at once. They are bitten, or accept the bite, and come to live on Hemara\'s thirst. The vampire hates werewolves, paladins and the mages of the good.</p>' +
    '<h3>The Werewolf</h3>' +
    '<p>They join a lycan guild and transform. The pack is their law. They hate vampires, thieves and northern warriors.</p>' +
    '<h3>The Demon Hunter</h3>' +
    '<p>Trained in the hunters\' schools, they pursue all that is demonic: vampires, werewolves, satanic mages and warlocks. They may also work as bounty hunters.</p>' +
    '<h3>The Warlock</h3>' +
    '<p>They make pacts with the infernal princes. Their rivalry does not lie outside evil but within it, among those who serve it. They may sell rituals of vampirism and brew potions of power.</p>' });
  add({ lv: 'V', body:
    '<h3>The Mage</h3>' +
    '<p>They study for a long time and become someone who bends reality. Their rivalry lies in the heart of the good, among those who follow the light in different ways. They perform healing rituals in regions of poor karmic standing.</p>' +
    '<h3>The Technocrat</h3>' +
    '<p>They enter the technological academy of Karmika and come out with machines inside their own body. They are the most neutral of all, because they are the world\'s merchant: they sell, repair, improve cities, bring automation and, if they wish, hunt bounties.</p>' +
    '<h3>The rivalries</h3>' +
    '<p>The hatred between paths is the headstone of many stories. Vampires and werewolves have fought since the first moon. Paladins do not forgive monsters, and hunters forgive no one who smells of hell. But a path\'s hatred is a tendency, not a fate. There are vampires who protect villages and paladins who fall to corruption, and whoever does the unexpected sometimes makes the Eye weep.</p>' });

  add({ toc: 'Book VI — The colors of karma', lv: 'VI', eyebrow: 'Book VI', title: 'The colors of karma', start: true, body:
    '<p>The liquid that fills the Eye is not a single color. Every choice tints what falls into it, and a veteran\'s Eye is like a stained-glass window: you can read a whole life just from the colors.</p>' +
    '<ul class="colors">' +
    '<li>' + sw('#b3202f', '#b3202f') + '<span><b>Blood</b>, vampirism</span></li>' +
    '<li>' + sw('#2b1a3d', '#7b5fa8', '#8d6fc0') + '<span><b>Black energy</b>, warlockry</span></li>' +
    '<li>' + sw('#fff0c2', '#ffd36a') + '<span><b>Celestial light</b>, the paladin</span></li>' +
    '<li>' + sw('#3dff8a', '#3dff8a') + '<span><b>Bright green</b>, the demon hunter</span></li>' +
    '<li>' + sw('#2a4bff', '#2a4bff') + '<span><b>Bright dark blue</b>, the technocrat</span></li>' +
    '<li>' + sw('#46bcff', '#46bcff') + '<span><b>Bright light blue</b>, the mage</span></li>' +
    '<li>' + sw('#8b5a2b', '#8b5a2b') + '<span><b>Brown</b>, the werewolf</span></li>' +
    '<li>' + sw('#ffb000', '#ffb000') + '<span><b>Amber yellow</b>, the northern warrior</span></li>' +
    '</ul>' +
    '<p>The werewolf bears the color of earth and fur, and the northern warrior that of ancient amber, of bonfires and of Odin\'s gold. I no longer need to see them in dreams.</p>' +
    '<p>Just do not mistake two lights that seem like sisters. The paladin\'s is white with gold, mystical and celestial in aspect. The mage\'s is ice-white, elemental in aspect. One comes from on high; the other comes from the nature of things.</p>' });
  add({ lv: 'VI', body:
    '<h3>When colors add up</h3>' +
    '<p>Colors do not cancel out. No one erases a vampire\'s blood with celestial light; what happens is that the two live side by side, and from them a third is born. The combinations are what fascinate the scribes most, because each sum tells a story: the hunter who drank blood, the mage who made a pact, the technocrat who repented.</p>' +
    '<p>More colors, more weight. The karmic guilt of one who has added up a great deal is heavy, because there is more to reap.</p>' +
    '<h3>When a path is betrayed</h3>' +
    '<p>The path is betrayed and the color changes. When a paladin falls, the celestial light fades, and what comes after is not innocent. Whoever betrays their race, their guild or their oath pays twice: with the new color and with the weight of the old one.</p>' +
    '<h3>Chronicler\'s notes</h3><p class="fnote"><span class="nb">✎</span>The scribes record eight colors, and so do I. But in the margin of a very old book of colors, someone added, in paler ink, a ninth: grey, which is a blend of none of them. No path gives that color. I have seen cloaks of that color, though.</p>'  });

  add({ toc: 'Book VII — The land of Karmika', lv: 'VII', eyebrow: 'Book VII', title: 'The land of Karmika', start: true, body:
    '<p>Karmika is the whole world, not just a kingdom. The maps I have seen agree on three things: there are at least four great cities; each of them has six small cities around it; and between them, small villages lie scattered.</p>' +
    '<p>The villages are where we are born. There, life begins almost as survival, and whoever wishes to become something must leave. The small cities hold the lesser schools, where one learns the first steps of each craft. The great cities house the high schools, and whoever reaches them is already someone.</p>' +
    '<h3>The world that frightens</h3>' +
    '<p>Between the cities, the road is dangerous. There are forests so dense that day turns to dusk; dark caves where something breathes; churches and mausoleums abandoned by priests who turned wicked; crypts, graveyards, and ravaged cities from which no one returns without a story they would rather not tell.</p>' });
  add({ lv: 'VII', body:
    '<h3>The world that welcomes</h3>' +
    '<p>But Karmika is not only shadow. There are beautiful fields where the light lingers on the horizon, and there are frozen mountains, home of the northern warriors, where the snow shines like silver. There is a technological city in steampunk style, where steam rises in columns and the gears turn until dawn, home of the technocrats. There are the beautiful forests of the elves, island regions waiting for sailors, and holy fields where the church of Auréon tends to those who arrive wounded.</p>' +
    '<p>Those who write about Karmika have a habit of telling only the dark. I ask you not to forget: the dark weighs more because the beautiful exists, and the beautiful is worth more because, close by, there is dark. Even in the holy fields evil may come, and a land healed by rituals may bloom again.</p>' +
    '<h3>Chronicler\'s notes</h3><p class="fnote"><span class="nb">✎</span>The great map was copied three times. In all three copies, without agreeing to it, the copyists drew the same small circle at the center of the Lands of Men, where there is nothing. When asked, none of them remembered doing it.</p>'  });

  add({ toc: 'Book VIII — Crafts and merchants', lv: 'VIII', eyebrow: 'Book VIII', title: 'Crafts, merchants and the Pact of Honesty', start: true, body:
    '<p>A world that lasts for years does not live by swords alone. Someone has to sow the wheat, raise the house, forge the blade and carry the bread to the city. In Karmika every soul has a craft that suits what it knows how to do, and even work leaves its mark on the Eye.</p>' +
    '<h3>Who does what</h3>' +
    '<p>The <b>elves</b> work with what the forest gives. The <b>humans</b> build. The <b>dwarves</b> hunt veins and forge, as they say. <b>Warriors</b> and <b>demon hunters</b> may go on as bounty hunters, or choose work of strength and farming. <b>Warlocks</b> charge for rituals of vampirism and brew powerful potions. <b>Mages</b> heal regions of poor karmic standing with their rituals. And the <b>technocrat</b> does a bit of everything: merchant, smith, engineer, the one who brings automation to the cities.</p>' });
  add({ lv: 'VIII', body:
    '<h3>The world\'s merchant</h3>' +
    '<p>The technocrat is the most neutral of all, and the reason is simple: you cannot sell to everyone while being someone\'s enemy. That is why the merchants and smiths of Karmika obey strict rules of honesty, which I call the Pact.</p>' +
    '<p>A merchant may not trade with the vampire guild and the werewolf guild at the same time. May not sell information. May not inflate prices. May not betray the dungeon groups that traveled with them.</p>' +
    '<h3>The weight of greed</h3>' +
    '<p>There are merchants who pile up fortunes at the cost of lives, there are traitors and there are subjugators. The Eye sees them all, and the weight they carry is not small. But there is the other side: the technocrat who uses their intelligence to improve the city, bring light, lay out a bridge, build a machine that feeds a thousand mouths, sows a seed that one day comes back to them.</p>' +
    '<p>Then there is the thief. It is a trade of humans and elves. Dwarves, so heavy and steady, take stealing as something against their nature. But I have heard of Little Plague, a deft dwarf who made the rounds of the taverns stealing everything hidden below belt height, which was no small amount.</p>' +
    '<p>The crafts of the paths have their own prices. The <b>paladin</b>, before the sword, is a healer of faith: prays, breaks curses and, like the mage, frees entire cities from the karma that smothers them. They can be damage or be a wall. The <b>vampire</b> is a masterful weaver of fine clothes, and mages and warlocks buy only theirs. They also make wine and the foods that demand patience, rare cheeses and smoked meat. The <b>werewolf</b> builds very well and weaves heavy garments, those of warriors and paladins, who buy a great deal from them. They tame beasts better than humans do, because they speak a tongue closer to that of animals.</p>' });

  add({ toc: 'Book IX — Guilds, schools and wars', lv: 'IX', eyebrow: 'Book IX', title: 'Guilds, schools, churches and wars', start: true, body:
    '<p>Karma is not one person\'s alone. A whole guild carries the weight of its choices, and what one member sows, all of them reap, a little. That is why sensible leaders choose carefully whom they take in.</p>' +
    '<p>The greatest and oldest guilds may, on merit, receive a charter: to become a <b>school</b>. Thus there are schools of vampires, of werewolves, of demon hunters, and great churches in their own right. The basic schools belong to the world. The chartered ones belong to the memories of those who earned them.</p>' +
    '<p>Some feared this would close the doors to newcomers. But the veterans I have known repeat one phrase: whoever arrives now cannot be locked outside. The powerful guilds have a duty to teach, not only the right to reign.</p>' });
  add({ lv: 'IX', body:
    '<h3>When the banners rise</h3>' +
    '<p>And there are the wars. The school of demon hunters, attacked by werewolves, calls every hunter to battle. A call to arms rings the bells of the paladins in every city. Institutions go to war against one another, and whoever picks a side sows collective karma.</p>' +
    '<p>Many of these happenings also arise as PvE events, born from each player\'s story, in which several enter the same instance to live that memory together.</p>' });

  add({ toc: 'Book X — The long journey', lv: 'X', eyebrow: 'Book X', title: 'The long journey', start: true, body:
    '<p>Reaching the top of a path takes time, and Karmika hurries no one. The first twenty levels are for survival: no path, no title, just the person and the world. Past that threshold the soul prepares itself; at thirty, before the Seer, it chooses, and the road opens. At the twentieth level a light covers everything before the walker, and the karmic Eye opens. And when that soul dies, the Eye and its liquid dry up, it turns, and it becomes the Hourglass.</p>' +
    '<p>After that, climbing takes years. The scribes speak of a level two hundred for the soul and a level three hundred and fifty for the path, and there are no shortcuts that I know of. Many lives are spent on the climb, and many deaths as well. The soul\'s level and the path\'s level demand the same sum of effort: reaching two hundred costs as much as reaching three hundred and fifty in the craft, so the craft climbs more easily than the life. Even so, a player who never rests takes some two years. And the higher you go, the more the climb pays: a paladin who goes from level three hundred to three hundred and one gains far more strength, spirit and power in their spells than when they went from thirty to thirty-one.</p>' +
    '<p>Among so many lives, the question that interests me most is born, and no number answers it: <b>does the soul learn?</b> The Eye will see, and so will the historian.</p>' +
    '<p>And there is a law of the climb that few learn early. Whoever wishes to reach the top of a path does not do it in a single life: they must live many lives on that same path. A paladin must be reborn a paladin for dozens, perhaps hundreds of lives, before becoming a paladin of the order. Each time the walker chooses the same path again, their score gains a multiplier, one and a tenth, one and three tenths, one and a half, up to a limit of three times. And whoever changes paths does not start from zero: they carry a score similar to their personal level, because they learned through many different experiences. The same holds for crafts: whoever was a smith or a weaver in a past life learns it again faster, like someone with a natural gift.</p>' });

  add({ toc: 'Book XI — The Great Library', lv: 'XI', eyebrow: 'Book XI', title: 'The Great Library and the Living Chronicle', start: true, body:
    '<p>At the heart of Karmika, in the central city, rises the Great Library, so immense that no one has ever walked all its galleries. There are corridors of scrolls, halls of maps, and a room where the pages write themselves. This is where I work.</p>' +
    '<p>My craft is simple to state and heavy to fulfill: when the Eye weeps, someone has to write it down. Every <b>Karmic Tear</b> shed by Marghar is recorded by me, with the name of the one who earned it, the deed that caused it and the day it fell. Marghar does not write; I do.</p>' +
    '<p>Whoever wishes to check their tear, or learn of another\'s, may seek me out in the galleries.</p>' });
  add({ lv: 'XI', body:
    '<h3>The chronicle that never ends</h3>' +
    '<p>This book will never be finished. Every war that is fought, every school that changes hands, every army of paladins that answers a call, every unique warrior the world comes to know, every historic tear: I write it down, and a new page comes into being.</p>' +
    '<p>The names that enter here will be the names of those who lived it: guilds that became famous, heroes who changed the course of a war, souls whose deed made the Eye itself weep. Some of the pages you are reading were written by players, without their knowing.</p>' +
    '<blockquote>Whoever sows something great will be read by those who come after.</blockquote>' +
    '<p>Be a chapter yourself.</p>' });

  add({ lv: 'XI', body:
    '<h3>Of the six runes</h3>' +
    '<p>The copyists of the Library write with six runes, and I draw them here because the reader will find them on the border of every sacred book of Karmika, at the base of the teleport stones and in the circle the mage traces before a spell.</p>' +
    '<div class="figwrap"><svg class="runes6" viewBox="0 0 296 56" role="img" aria-label="The six runes of Karmika: the Tear, the Karmic Eye, the Hourglass, the Labyrinth, the Hunger and the glowing Rift"><defs><radialGradient id="frg"><stop offset="0" stop-color="#ffe9ad" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9ad" stop-opacity="0"/></radialGradient></defs><ellipse cx="270" cy="28" rx="26" ry="26" fill="url(#frg)"><animate attributeName="opacity" values=".25;.8;.25" dur="5s" repeatCount="indefinite"/></ellipse><g transform="translate(6 8) scale(1.45)"><path d="M14 3 C17 9 21 13.5 21 18 A7 7 0 0 1 7 18 C7 13.5 11 9 14 3Z" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M14 3 C17 9 21 13.5 21 18 A7 7 0 0 1 7 18 C7 13.5 11 9 14 3Z" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(54 8) scale(1.45)"><path d="M4 4 V24 M24 4 V24 M12 4 L6.5 14 L12 24 M16 4 L21.5 14 L16 24 M8.5 14 Q14 9 19.5 14 Q14 19 8.5 14Z" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M4 4 V24 M24 4 V24 M12 4 L6.5 14 L12 24 M16 4 L21.5 14 L16 24 M8.5 14 Q14 9 19.5 14 Q14 19 8.5 14Z" fill="none" stroke="#15101e" stroke-width="1"/><path d="M14 12 a2 2 0 1 0 0.01 0Z" fill="#d9a24f"/></g><g transform="translate(102 8) scale(1.45)"><path d="M7 4 H21 L14 14 L21 24 H7 L14 14 Z" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M7 4 H21 L14 14 L21 24 H7 L14 14 Z" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(150 8) scale(1.45)"><path d="M5 24 V4 H23 V23.5 H8.5 V7.5 H19.5 V20 H12 V11 H16 V16.5" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M5 24 V4 H23 V23.5 H8.5 V7.5 H19.5 V20 H12 V11 H16 V16.5" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(198 8) scale(1.45)"><path d="M11.5 7.2 A8.3 8.3 0 1 0 16.5 7.2 M11.5 7.2 C11 5.4 9.8 4.2 8.2 3.6 M16.5 7.2 C17 5.4 18.2 4.2 19.8 3.6" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M11.5 7.2 A8.3 8.3 0 1 0 16.5 7.2 M11.5 7.2 C11 5.4 9.8 4.2 8.2 3.6 M16.5 7.2 C17 5.4 18.2 4.2 19.8 3.6" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(246 8) scale(1.45)" class="hot"><path d="M11.4 2.6 V18.8 M16.6 9.2 V25.4 M6.6 10.4 C9.2 10.4 11.4 11.8 12.8 14 C14.2 16.2 16.4 17.6 21.4 17.6" fill="none" stroke="#f6dc8e" stroke-width="2.7"/><path d="M11.4 2.6 V18.8 M16.6 9.2 V25.4 M6.6 10.4 C9.2 10.4 11.4 11.8 12.8 14 C14.2 16.2 16.4 17.6 21.4 17.6" fill="none" stroke="#15101e" stroke-width="1"/></g></svg></div><p class="runecap">Tear · Eye · Hourglass · Labyrinth · Hunger · <b>(no name)</b></p>' +
    '<p>The <b>Tear</b>, the <b>Karmic Eye</b>, the <b>Hourglass</b>, the <b>Labyrinth</b> and the <b>Hunger</b> have names and histories, and I have spoken of each. The sixth has no name. It looks like two mismatched blades, one taller than the other, with a thread running down between them, and the apprentices call it the Rift, because that is what it looks like. Priests trace it at baptism and at the ordination of a templar; mages, in the circle; master masons, at the base of every teleport stone. A ritual without it, everyone says, does not take. None of them can say why. Neither can I.</p>' +
    '<p>I asked five masters of five houses. Grand Master Cassius said it is part of the liturgy, and liturgy is not up for debate. Archmage Vesk said it is a clasp, and every circle needs a clasp. The Count said the House has used it for a thousand years and a thousand years do not err. Ulfrun growled. Architect Ylva said that if it works, she is not going to stop and ask. I wrote down all five answers and noticed that none of them was an answer.</p>' +
    '<p>The copyists draw it last, with their eyes closed. I asked where the custom comes from. No one could tell me.</p>' +
    '<h3>Chronicler\'s notes</h3><p class="fnote"><span class="nb">✎</span>I gave names to five runes. The sixth, which the copyists draw last and with their eyes closed, has no name, and a ritual without it does not take. On the oldest teleport stones it is worn the wrong way: not from outside, by the hands that touch it, but as if it had been pushed from within. I put it down to the travelers. I do not know why.</p>' });
  add({ toc: 'Book XII — The Sands and the work of the world', lv: 'XII', eyebrow: 'Book XII', title: 'The Sands and the work of the world', start: true, body:
    '<h3>Of time counted in grains</h3>' +
    '<p>Mortals do not measure time in days but in sands, because it was the Hourglass that taught them to count. Each sand lasts four hours, and a day has six. None is lost: what goes unused, the Eye writes down too.</p>' +
    '<p>There are two kinds of sand. The <b>walker\'s sands</b> are their own: training at the school, the first quest, the long climb from one level to the next. A task may cost one sand and be finished before it runs out by someone who does it well, because the sand is the limit and never the sentence. The <b>world\'s sands</b> belong to everyone and run even when no one is watching: the bridges going up, the houses added to the city, the shops the technocrat sets up, the purifications the mages keep alive.</p>' +
    '<h3>The city that fell ill</h3>' +
    '<p>They tell of a city upon which a heavy karma fell. The water darkened, the mist would not leave the streets and the crops rotted before the harvest. Those who had a home there, or studied there, had to seek out real mages, and the mages named the price: thirty-five sands of purification, without interruption. A hundred and forty hours, nearly six days, in which someone must keep their hands on the ritual while the city waits.</p>' +
    '<p>No one bought those days. What was bought was hands, and whoever is in a hurry discovers it is the same thing. More mages around the ritual shorten the wait, but never to nothing, for the black water has a will of its own. If the mages tire and stop, the water darkens again.</p>' +
    '<h3>The Board and the Pact</h3>' +
    '<p>At the center of every city there is a Request Board. Whoever needs hides, herbs, a dead monster, a person brought back or workers for a building writes the request there, leaves the payment in the keeping of the Pact of Honesty and waits. Whoever accepts goes, fulfills it and gets paid. If no one fulfills it, the payment goes back to its owner.</p>' +
    '<p>But the Board is also a mirror. A request for purification weighs little on the Eye\'s scale. A request for a death weighs on whoever paid, on whoever killed and on the city that left the paper nailed up. I learned from an old contractor that the Board is the most honest conversation a city has with itself.</p>' +
    '<p>No path raises a city alone. The mage purifies, the human builds, the werewolf hauls, the vampire runs by night, the technocrat designs and sells. That is how the world stays standing: through the need each one has of the other.</p>' +
    '<h3>Chronicler\'s notes</h3><p class="fnote"><span class="nb">✎</span>The coin tossed into the Fountains never reaches the bottom. A technocrat from Boilerport lowered a rope with a bell on the end, as far as the rope would go. The bell never rang. When he pulled the rope back up, it was wet only halfway.</p>'  });

  add({ toc: 'Book XIII — Those who only walk', lv: 'XIII', eyebrow: 'Book XIII', title: 'Those who only walk', start: true, body:
    '<h3>Of the walker who becomes nothing</h3>' +
    '<p>There is a truth the scribes forgot to put on the first pages: in Karmika no one is obliged to do anything. The walker does as they please, and walking is the only rule. Many will never be vampires, or mages, or paladins. They will be humans, elves or dwarves until their last day, and that is no small thing.</p>' +
    '<p>Some live for adventure. There are the <b>tear hunters</b>, who spend their lives chasing the deed the labyrinth did not foresee, hoping to see the Eye weep. There are those who collect lives, one after another, the way one gathers books. And there are those who live for stability, for the long game, and leave their mark in stone, in timber and in cattle.</p>' +
    '<h3>What each people builds</h3>' +
    '<p>The human is the great builder. They may start with a hunt, then make a barn, a butcher\'s shop, a school. Other humans arrive and raise houses, and where there was nothing a village appears, then a town and, in time, a great city. They raise cattle, sheep and dogs. They hire warriors, mages and technocrats, and these bring harvesting machines and help with the building.</p>' +
    '<p>The elf widens the forest. They build cities upon the trees and, step by step, purify great stretches of Karmika. The dwarf goes down into the mountains and digs deep, or travels to other cities. They make beers and roasted meats that are worth a great deal, own breweries that travel to the feasts of villages and guilds, and are a skilled smith and trader.</p>' +
    '<h3>The danger of not choosing</h3>' +
    '<p>But whoever chooses nothing also does not choose what happens to them. A vampire may attack them and make them a vampire against their will; a werewolf may bite them. A warlock may kidnap them for a satanic ritual, or a vampire for a transformation. They die, and the painful death comes back with the soul. In the next life the walker remembers, without knowing why, who took them, and may seek revenge.</p>' +
    '<p>That is why the cities of those who only live need walls, and the walls need someone to defend them.</p>' +
    '<h3>Chronicler\'s notes</h3><p class="fnote"><span class="nb">✎</span>There is a walker in the Library who signs only as Lume. Their record covers the three peoples and the eight paths, one after another, and they never swore the same banner twice in a row. The last line of their list has the people and the path left blank, and a date that has not yet come.</p>'  });

  add({ toc: 'Book XIV — The marks of the soul', lv: 'XIV', eyebrow: 'Book XIV', title: 'The marks of the soul', start: true, body:
    '<h3>What the skin remembers</h3>' +
    '<p>The soul returns after death, and the walker chooses again what they wish to be: human, elf or dwarf, and then, if they like, another road. But the earlier lives do not vanish. Whoever asks to see someone\'s profile will find their past lives there, one by one, with the feats of each.</p>' +
    '<p>And there are things death does not take. A noble feat goes with the walker and becomes part of the body. A betrayal, a Tear, a heroic deed turn into <b>scars</b> or <b>tattoos</b>, and the highest of them into <b>glows</b> and <b>auras</b>. They remain, no matter how many times the walker dies.</p>' +
    '<p>I like to tell the apprentices of the Library that a walker can change their name, their people and their banner, but cannot fool someone who knows how to read skin. I do.</p>' +
    '<h3>Chronicler\'s notes</h3><p class="fnote"><span class="nb">✎</span>A tattooist from Darkcrow swore to me that some marks appear before the deed, not after. She showed me a young man\'s wrist with a tear drawn beneath the skin, thin as a hair. He had never made the Eye weep. I do not know what became of him.</p>'  });

  add({ toc: 'Book XV — The two banners', lv: 'XV', eyebrow: 'Book XV', title: 'The two banners: the Thread and the Unraveled', start: true, body:
    '<p>I told, in the first book, that the ancients divided souls into Diverters and Guests. It was priests\' talk. But priests\' talk, sooner or later, gets a banner, and today whoever walks the roads of Karmika sees two pennants flying over the cities. The eldest say that <b>karma itself was born from the clash between them</b>, and I, who only write things down, have found no reason to doubt it.</p>' +
    '<h3>The Order of the Thread</h3>' +
    '<p>"<b>No one crosses alone.</b>" So say those of the Order of the Thread, and so they embroider on their night-blue shield with its golden rim: a circular labyrinth and a golden thread running through its corridors, from the base to the Eye at the center. They guard the Labyrinth of Marghar. For them, every corridor left standing is a soul the Stepless does not find before its time.</p>' +
    '<p>Their justice is simple: no one is thrown to the Hunger before they are ready. Their honor is simpler still: the thread is never cut, and whoever enters the Labyrinth with one of them does not come out alone, not even dead. Paladins, demon hunters and mages carry the golden thread.</p>' });
  add({ lv: 'XV', body:
    '<h3>The Unraveled</h3>' +
    '<p>"<b>Every wall is a lie.</b>" The shield of the Unraveled is black and cracked, with a crimson rim: the labyrinth broken into pieces, a toothed mouth at the center, the thread cut with frayed ends and two blades crossed behind it. They want to cut the thread and tear down the walls. For them, the Labyrinth is a cage that sends the soul back to the wheel, life after life, and the Hunger is the only door out: true freedom, even the freedom to die for good.</p>' +
    '<p>Their justice: no one should be guarded against their own will. Their honor: never lie to yourself, and whoever walks to the mouth walks with eyes open, without pushing anyone who does not want to go. Vampires, warlocks and werewolves wear the cut thread. Make no mistake: not every Unraveled is a Guest. Many do not wish to be devoured; they only want out.</p>' });
  add({ lv: 'XV', body:
    '<h3>Where each one errs</h3>' +
    '<p>I asked both sides who was right, and both answered me with the same conviction. For that reason I distrust both answers. The Order of the Thread errs when protection becomes a prison and decides for others what "being ready" means. The Unraveled err when they tear down the wall forgetting that the Hunger does not ask who wanted to leave.</p>' +
    '<blockquote>Those who defend the Labyrinth say: the Hunger will devour everything until no one is left. Those who would tear it down ask: what freedom is this, where I live in an endless cycle, inside a labyrinth? Is that justice? Is that kindness?</blockquote>' +
    '<p>There is no good side and no evil side in this chronicle, and there will not be. There are admirable figures and flawed figures under both banners, and the walker must be able to understand both, and to doubt both.</p>' +
    '<h3>Those who swear no banner</h3>' +
    '<p>The first class is also the first oath: whoever becomes a paladin, hunter or mage joins the Thread; whoever becomes a vampire, werewolf or warlock joins the Unraveled. Two paths stay outside. The <b>northern warrior</b> is chaotic and neutral: thirsty for blood and unafraid of death, and no labyrinth seems to him worth guarding or ruining. The <b>technocrat</b> is truly neutral: believes in science and thinks they can walk their own path far from superstition, even while living in the middle of it. After reaching their class, each one completes a quest from their master that confirms their alignment.</p>' +
    '<h3>Of the peoples and the oath</h3>' +
    '<p>Each people brings its own way of promising to the banners. The human is neutral, and so their given word is all they have left: "if we lack the firmness of the spoken word, what will be left in the world?" The dwarf is chaotic, but chaos is not disorder: a dwarf\'s promise is like a dwarf\'s beard; nobody touches it. And the elf is good by nature; an elf who becomes a vampire breaks, all at once, a whole cycle of alliance.</p>' +
    '<p>The pieces bearing the crest are woven only by the royal weaveries of each side, in Askavik, and only those who have sworn, after thirty, may wear them. Over time, they say, they are worth more as beauty than as armor. But no one I know has taken off their cloak because of it.</p>' });

  add({ toc: 'Book XVI — The cartographers\' map', lv: 'XVI', eyebrow: 'Book XVI', title: 'The map the cartographers drew', start: true, body:
    '<p>In the seventh book I spoke of Karmika as travelers do, from hearsay. Since then the Library\'s cartographers have finished the great map, and at last I can say where each thing lies. They taught me the first rule of their craft: first the relief, then the waters that run down from the mountains, then the woods that follow the water, and only last the roads, which are trade routes and bend the way merchants do.</p>' +
    '<h3>The Lands of Men</h3>' +
    '<p>At the center lie the Lands of Men, with dozens of villages. There stands <b>Karmika</b>, the village where humans are born, with the fountain in the square and the notice board beside the guard. To the north rises <b>Askavik</b>, the city of academies, where every people goes to choose what it will become. And, in a dark valley of the same lands, the <b>Abandoned Cathedral</b>, of which I will speak later.</p>' });
  add({ lv: 'XVI', body:
    '<h3>The lands around</h3>' +
    '<ul class="plain">' +
    '<li>To the northwest, <b>Viking Mountain</b>: fjords, Jarls, Odin\'s Fortress and the villages of Jarlsheim, Skjoldvik and Hrimgard, where the snow never melts, it only moves around.</li>' +
    '<li>To the northeast, the <b>Black Mountain</b>, a volcano that snores at night, with lava and veins of diamond. At its foot lies <b>Emberforge</b>, where dwarves are born, and higher up, Ashpeak.</li>' +
    '<li>Hidden behind the Black Mountain, <b>Vampire Hill</b>, with the Count\'s castle and the village of Darkcrow. There the windows are shut at nightfall.</li>' +
    '<li>To the east, the <b>Vale of Woe</b>, where Malgrath teaches the warlocks and even the wheat grows with its head bowed.</li>' +
    '<li>To the west, the <b>Elven Forests</b>, with Aelvaren in the immense trees and <b>Lithendel</b>, where elves are born.</li>' +
    '<li>To the southwest, the <b>Enchanted Forest</b> and the <b>Ivory Pinnacle</b>, a tower eighty meters tall that lights up at night.</li>' +
    '<li>In the far southeast, the <b>Lycan Jungle</b> and the tribe of the Ancient Howl.</li>' +
    '<li>To the south, the <b>Steam and Grease Coast</b>, with Boilerport, Rust and Steamwick, where the boats row themselves.</li>' +
    '</ul>' +
    '<p>The cartographers also taught me to read danger. Near the cradles and the cities the land is gentle; the farther away, the harder it bites. Even the Black Mountain, which rocks the dwarves at its foot, keeps creatures at its heart that no apprentice should visit.</p>' +
