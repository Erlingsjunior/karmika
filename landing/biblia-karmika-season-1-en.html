        if (shr) { cur = cur.concat([shr]); continue; }
      }
      var sp = splitBlock(b, cur, sec, pages.length === 0);
      if (sp) { pages.push(cur.concat([sp[0]])); cur = []; queue.unshift(sp[1]); continue; }
      var held = [];
      while (cur.length && isH3(cur[cur.length - 1])) held.unshift(cur.pop());
      if (cur.length) { pages.push(cur); cur = []; queue.unshift.apply(queue, held.concat([b])); continue; }
      cur = held;
      pages.push(cur.concat([b])); cur = [];
    }
    if (cur.length) pages.push(cur);
    if (!pages.length) pages.push([]);
    return pages;
  }

  /* ---------- sumário paginado ---------- */
  function tocHead(w) {
    return '<p class="eyebrow">Contents</p><h2>' + (NP > 1 ? 'Parte ' + ROM[w] + ' — ' : '') + ED.parts[w - 1].name + '</h2>' + RULE;
  }
  function dlLink() {
    return DL ? (SNAP ? '<a class="toc-link" data-dl="html" href="#">Download the book with animations (.html)</a>' : '') + '<a class="toc-link" data-dl="md" href="#">Download the text only (.md)</a>' : '';
  }
  function tocBlocks(w, secStart, tocStartPg) {
    var out = [], anti = 0;
    sections.forEach(function (sec, si) {
      if (sec.tp !== w || !sec.toc) return;
      var lv = sec.lv ? '<span class="lv">' + sec.lv + '</span>' : '';
      var name = sec.toc.replace(/^Book [IVXL]+ — /, '');
      var pg = secStart[si];
      out.push('<a class="toc-row" data-go="' + pg + '" href="#p' + pg + '">' + lv + '<span class="nm">' + name + '</span><span class="dots"></span><span class="n">' + pg + '</span></a>');
    });
    for (var j = 1; j <= NP; j++) if (j !== w) out.push('<a class="toc-link" data-go="' + tocStartPg[j] + '" href="#p' + tocStartPg[j] + '">' + (j < w ? '&#8249; ' : '') + 'Part ' + ROM[j] + ' — ' + ED.parts[j - 1].name + (j > w ? ' &#8250;' : '') + '</a>');
    out.push(dlLink());
    return out;
  }

  var pageList = [], tocStart = {}, N = 0;
  var groups = [];
  sections.forEach(function (sec, si) {
    var last = groups[groups.length - 1], mk = '<div class="secmark" data-m="' + si + '">' + RULE + '</div>';
    if (!sec.head && last && last.stream) { last.blocks.push(mk); last.blocks = last.blocks.concat(sec.blocks); last.secs.push(si); }
    else if (!sec.head) groups.push({ stream: true, tp: sec.tp, sec: { head: '', start: false }, secs: [si], blocks: [mk].concat(sec.blocks) });
    else groups.push({ tp: sec.tp, sec: sec, secs: [si], blocks: sec.blocks });
  });
  function PL() { var r = []; for (var w = 1; w <= NP; w++) r.push(w); return r; }
  function build() {
    var secPages = groups.map(function (g) { return paginate(g.sec, g.blocks); });
    var c = {}, tocPg = {}; for (var w0 = 1; w0 <= NP; w0++) c[w0] = 1;
    for (var iter = 0; iter < 4; iter++) {
      tocStart = {}; var acc = 1; for (var w1 = 1; w1 <= NP; w1++) { tocStart[w1] = acc; acc += c[w1]; }
      var base = acc, pg = base, secStart = [];
      secPages.forEach(function (sp, gi) {
        var g = groups[gi];
        g.secs.forEach(function (si) {
          var at = 0;
          if (g.stream) {
            for (var k = 0; k < sp.length; k++) {
              var ix = -1;
              for (var j = 0; j < sp[k].length; j++) if (sp[k][j].indexOf('data-m="' + si + '"') > -1) ix = j;
              if (ix > -1) { at = ix === sp[k].length - 1 ? k + 1 : k; break; }
            }
          }
          secStart[si] = pg + Math.min(at, sp.length - 1);
        });
        pg += sp.length;
      });
      var nc = {};
      PL().forEach(function (w) {
        var tsec = { head: tocHead(w), start: false };
        tsec.blocks = tocBlocks(w, secStart, tocStart);
        tocPg[w] = { sec: tsec, pages: paginate(tsec, tsec.blocks) };
        nc[w] = tocPg[w].pages.length;
      });
      var same = PL().every(function (w) { return nc[w] === c[w]; });
      c = nc;
      if (same) break;
    }
    pageList = [{ kind: 'cover', tp: 0 }];
    PL().forEach(function (w) {
      tocPg[w].pages.forEach(function (blocks, k) {
        pageList.push({ kind: 'toc', tp: w, which: w, sec: tocPg[w].sec, blocks: blocks, first: k === 0 });
      });
    });
    groups.forEach(function (g, gi) {
      secPages[gi].forEach(function (blocks, k) {
        pageList.push({ kind: 'sec', tp: g.tp, sec: g.sec, si: gi, pi: k, blocks: blocks, first: k === 0 });
      });
    });
    N = pageList.length - 1;
    minner.textContent = '';
  }

  function leaf(i) {
    var p = pageList[i], el = document.createElement('article');
    el.className = 'leaf' + (p.kind === 'cover' ? ' cover' : '');
    var folio = i > 0 ? '<div class="folio"><span>' + i + '</span></div>' : '';
    var rib = (p.kind === 'cover' || p.kind === 'toc') ? '' :
      '<button class="ribbon" data-go="' + tocStart[p.tp || 1] + '" aria-label="Open the contents" title="Contents"></button>';
    el.innerHTML = '<i class="side l"></i><i class="side r"></i><i class="base"></i>' +
      '<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>' +
      '<div class="inner" tabindex="-1"></div>' + folio + rib;
    var inner = el.querySelector('.inner');
    if (p.kind === 'cover') {
      inner.innerHTML = '<p class="sub">Chronicles of Karmika</p>' + EYE +
        '<h1 class="title">Karmika<br>Bible</h1>' + RULE.replace('class="rule"', 'class="rule" style="margin:.2em auto"') +
        '<p class="ep"><span>Season I</span>The Two Banners</p>' +
        '<p class="sub">The Chronicles of Ormund</p>' +
        '<p class="by">by Ormund Salveth, Chronicler of the Great Library</p>';
      el.insertAdjacentHTML('beforeend', '<button class="strap" aria-label="Open the book: unlock the padlock"><span class="hint">Tap the padlock</span><span class="band l"></span><span class="band r"></span>' +
        '<svg class="lock" viewBox="0 0 84 112" aria-hidden="true"><defs>' +
        '<linearGradient id="lkg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b909c"/><stop offset=".35" stop-color="#4d515c"/><stop offset="1" stop-color="#1d1f26"/></linearGradient>' +
        '<linearGradient id="lks" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2c34"/><stop offset=".4" stop-color="#9aa0ad"/><stop offset="1" stop-color="#2a2c34"/></linearGradient></defs>' +
        '<path class="shackle" d="M22 56 V34 a20 20 0 0 1 40 0 V56" fill="none" stroke="#14151a" stroke-width="12" stroke-linecap="round"/>' +
        '<path class="shackle" d="M22 56 V34 a20 20 0 0 1 40 0 V56" fill="none" stroke="url(#lks)" stroke-width="8" stroke-linecap="round"/>' +
        '<rect x="7" y="52" width="70" height="56" rx="9" fill="url(#lkg)" stroke="#0c0d11" stroke-width="2"/>' +
        '<rect x="12" y="57" width="60" height="46" rx="6" fill="none" stroke="rgba(190,196,210,.35)" stroke-width="1.4"/>' +
        '<g fill="#7b808d" stroke="#0c0d11" stroke-width=".8"><circle cx="16" cy="61" r="2.6"/><circle cx="68" cy="61" r="2.6"/><circle cx="16" cy="99" r="2.6"/><circle cx="68" cy="99" r="2.6"/></g>' +
        '<g class="runes" fill="none" stroke="#9d8bff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="42" cy="78" r="15"/><path d="M42 61 V63 M42 93 V95 M25 78 H27 M57 78 H59"/><path d="M20 66 l4 6 l-4 6 M64 66 l-4 6 l4 6 M24 98 h6 M54 98 h6"/></g>' +
        '<circle class="keyhole" cx="42" cy="75" r="5.2" fill="#0b0810"/><path class="keyhole" d="M39.4 78 H44.6 L46.4 90 H37.6 Z" fill="#0b0810"/>' +
        '<g fill="rgba(120,70,30,.35)"><circle cx="24" cy="92" r="3"/><circle cx="60" cy="68" r="2.2"/><circle cx="31" cy="64" r="1.6"/><circle cx="56" cy="95" r="2"/></g>' +
        '<path d="M12 56 H72" stroke="rgba(255,255,255,.28)" stroke-width="1.4"/></svg></button>');
    } else {
      inner.appendChild(content(p.sec, p.blocks, p.first));
    }
    return el;
  }

  var END = '<svg viewBox="0 0 300 38" fill="none" stroke="#d9a24f" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">' +
    '<path d="M6 19 H96 C104 19 108 10 116 10 C122 10 124 15 120 17"/><path d="M294 19 H204 C196 19 192 10 184 10 C178 10 176 15 180 17"/>' +
    '<path d="M30 19 H76" stroke-opacity=".5"/><path d="M270 19 H224" stroke-opacity=".5"/>' +
    '<path d="M150 5 L168 19 L150 33 L132 19 Z"/><path d="M150 12 L160 19 L150 26 L140 19 Z" fill="#d9a24f" stroke="none"/><path d="M148 17 L152 19 L148 21 Z" fill="#15101e" stroke="none"/>' +
    '<path d="M122 12 H130 L126 19 L130 26 H122 L126 19 Z" stroke-width="1.1"/><path d="M178 12 H170 L174 19 L170 26 H178 L174 19 Z" stroke-width="1.1"/>' +
    '<circle cx="12" cy="19" r="2" fill="#d9a24f" stroke="none"/><circle cx="288" cy="19" r="2" fill="#d9a24f" stroke="none"/></svg>';
  function finish(el) {
    var inner = el.querySelector('.inner');
    if (!inner) return;
    var old = inner.querySelector('.endorn');
    if (old) old.remove();
    if (el.classList.contains('cover')) return;
    var o = document.createElement('div');
    o.className = 'endorn';
    o.innerHTML = END;
    inner.appendChild(o);
    if (inner.scrollHeight > inner.clientHeight + 1) o.remove();
  }

  var cur = -1, busy = false;
  function ui() {
    countEl.textContent = cur === 0 ? 'Cover' : cur + ' / ' + N;
    prevB.disabled = cur === 0;
    nextB.disabled = cur === N;
    try { history.replaceState(null, '', '#p' + cur); } catch (e) {}
    try { localStorage.setItem('karmika-page-en', String(cur)); } catch (e) {}
  }
  function mount(i) {
    stage.textContent = '';
    var el = leaf(i);
    stage.appendChild(el);
    finish(el);
  }
  function show(i, instant) {
    i = Math.max(0, Math.min(N, i));
    if (i === cur && stage.firstChild) return;
    var old = stage.firstChild, dir = i > cur ? 1 : -1, el = leaf(i);
    cur = i;
    ui();
    if (!old || instant || reduce) { stage.textContent = ''; stage.appendChild(el); finish(el); return; }
    busy = true;
    var frames, target;
    el.style.zIndex = dir > 0 ? 1 : 3;
    old.style.zIndex = dir > 0 ? 3 : 1;
    stage.appendChild(el);
    finish(el);
    if (dir > 0) {
      target = old;
      frames = [{ transform: 'rotateY(0deg)', opacity: 1 }, { transform: 'rotateY(-100deg)', opacity: 0.2 }];
    } else {
      target = el;
      frames = [{ transform: 'rotateY(-100deg)', opacity: 0.2 }, { transform: 'rotateY(0deg)', opacity: 1 }];
    }
    var a = target.animate(frames, { duration: 650, easing: 'cubic-bezier(.45,.05,.25,1)', fill: 'both' });
    a.onfinish = a.oncancel = function () {
      if (old.parentNode) old.parentNode.removeChild(old);
      el.style.zIndex = '';
      try { a.cancel(); } catch (e) {}
      busy = false;
    };
  }
  function go(i) { if (!busy) show(i); }

  function anchorOf(i) {
    var p = pageList[i];
    if (!p) return { k: 'c' };
    if (p.kind === 'sec') return { k: 's', si: p.si, pi: p.pi };
    if (p.kind === 'toc') return { k: 't', w: p.which };
    return { k: 'c' };
  }
  function indexOfAnchor(a) {
    var best = 0;
    for (var i = 0; i < pageList.length; i++) {
      var p = pageList[i];
      if (a.k === 'c') return 0;
      if (a.k === 't' && p.kind === 'toc' && p.which === a.w) return i;
      if (a.k === 's' && p.kind === 'sec' && p.si === a.si && p.pi <= a.pi) best = i;
    }
    return best;
  }
  var rebuildTimer = null;
  function rebuild() {
    if (busy) { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 400); return; }
    var a = cur >= 0 ? anchorOf(cur) : null;
    build();
    if (a) { cur = indexOfAnchor(a); mount(cur); ui(); }
  }
  function rebuildSoon() { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 160); }
  window.addEventListener('resize', rebuildSoon);



  function openingSvg() {
    var wv = 'M-40 0 q10 -6 20 0' + new Array(19).join(' t20 0') + ' L340 300 L-40 300 Z';
    return '<svg viewBox="20 30 260 190" role="img" aria-label="O Olho Karmico se enche de karma e derrama uma lágrima">' +
      '<defs><linearGradient id="lqo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0bd"/><stop offset="1" stop-color="#f2b04a"/></linearGradient>' +
      '<clipPath id="evo"><polygon points="60,110 143,54 157,54 240,110 157,166 143,166"/></clipPath></defs>' +
      '<g clip-path="url(#evo)"><g transform="translate(0,172)"><animateTransform attributeName="transform" type="translate" values="0 172;0 60" dur="3s" fill="freeze" calcMode="spline" keySplines="0.35 0 0.2 1"/>' +
      '<g><animateTransform attributeName="transform" type="translate" values="-40 0;0 0" dur="2.2s" repeatCount="indefinite"/><path fill="url(#lqo)" d="' + wv + '"/></g></g></g>' +
      '<g fill="none" stroke="#d9a24f" stroke-width="14" stroke-linecap="butt" stroke-linejoin="bevel"><path d="M144 40 L40 110 L144 180"/><path d="M40 40 L40 180"/><path d="M156 40 L260 110 L156 180"/><path d="M260 40 L260 180"/></g>' +
      '<polygon points="150,94 166,110 150,126 134,110" fill="#0b0810" stroke="#f2b04a" stroke-width="3"><animate attributeName="stroke-width" values="3;9;3" begin="3s" dur="0.7s"/></polygon>' +
      '<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;1" begin="3.3s" dur="2s" fill="freeze"/>' +
      '<animateTransform attributeName="transform" type="translate" values="150 176;150 176;150 214" keyTimes="0;0.42;1" calcMode="spline" keySplines="0 0 1 1;0.55 0 1 0.45" begin="3.3s" dur="2s" fill="freeze"/>' +
      '<g><animateTransform attributeName="transform" type="scale" values="0;1;1" keyTimes="0;0.42;1" begin="3.3s" dur="2s" fill="freeze"/>' +
      '<circle r="13" fill="#ffe9ad" opacity="0.25"/><path d="M0 -11 C7 -2 8 6 0 8 C-8 6 -7 -2 0 -11 Z" fill="url(#lqo)"/></g></g>' +
      '<ellipse cx="150" cy="214" rx="2" ry="1" fill="none" stroke="#ffe9ad" stroke-width="1.4" opacity="0"><animate attributeName="rx" values="2;48" begin="5.2s" dur="1.1s" fill="freeze"/><animate attributeName="ry" values="1;9" begin="5.2s" dur="1.1s" fill="freeze"/><animate attributeName="opacity" values="0.9;0" begin="5.2s" dur="1.1s" fill="freeze"/></ellipse>' +
      '</svg>';
  }
  var unlocking = false;
  function unlockStrap(st, then) {
    if (unlocking) return;
    unlocking = true;
    if (reduce) { unlocking = false; then(); return; }
    st.classList.add('unlock');
    setTimeout(function () { st.classList.add('open'); }, 650);
    setTimeout(function () { unlocking = false; then(); }, 1750);
  }
  var opening = false;
  function playOpening(target) {
    if (opening) return;
    if (reduce) { go(target); return; }
    opening = true;
    var ov = document.createElement('div');
    ov.className = 'opening';
    ov.innerHTML = openingSvg() + '<p class="cap">Karma fills. The Eye weeps.</p><span class="skip">tap to skip</span>';
    book.appendChild(ov);
    var done = false;
    function end() {
      if (done) return; done = true;
      ov.classList.add('out');
      go(target);
      setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); opening = false; }, 850);
    }
    ov.addEventListener('click', end);
    setTimeout(end, 6600);
  }

  /* ---------- download em Markdown ---------- */
  var DL = null;
  function inl(n) {
    var out = '';
    n.childNodes.forEach(function (c) {
      if (c.nodeType === 3) { out += c.textContent; return; }
      if (c.nodeType !== 1) return;
      var t = c.tagName;
      if (c.classList && c.classList.contains('tag')) { out += ' [' + c.textContent.trim() + ']'; return; }
      if (t === 'SVG' || t === 'svg') return;
      var x = inl(c);
      if (t === 'B' || t === 'STRONG') out += '**' + x + '**';
      else if (t === 'EM' || t === 'I') out += '*' + x + '*';
      else out += x;
    });
    return out.replace(/\s+\n/g, '\n').replace(/[ \t]{2,}/g, ' ');
  }
  function blk(el) {
    var t = el.tagName, c = el.className || '';
    if (/secmark/.test(c) || /figwrap/.test(c) || t === 'svg') return '';
    if (t === 'H3') return '### ' + inl(el).trim() + '\n\n';
    if (t === 'P') return inl(el).trim() + '\n\n';
    if (t === 'UL') return Array.prototype.map.call(el.children, function (li) { return '- ' + inl(li).trim(); }).join('\n') + '\n\n';
    if (/tw/.test(c) && el.querySelector('table')) {
      var heads = Array.prototype.map.call(el.querySelectorAll('thead th'), function (h) { return inl(h).trim() || ' '; });
      var rows = Array.prototype.map.call(el.querySelectorAll('tbody tr'), function (r) {
        return '| ' + Array.prototype.map.call(r.children, function (d) { return inl(d).trim().replace(/\|/g, '/'); }).join(' | ') + ' |';
      });
      return '| ' + heads.join(' | ') + ' |\n|' + heads.map(function () { return ' --- |'; }).join('') + '\n' + rows.join('\n') + '\n\n';
    }
    return inl(el).trim() ? inl(el).trim() + '\n\n' : '';
  }
  function toMarkdown() {
    var out = '# Karmika Bible · Season I\n\n*Season I · The Chronicles, by Ormund Salveth, Chronicler of the Great Library.*\n\nDocument generated from the online version of the book.\n\n';
    sections.forEach(function (sec) {
      if (sec.eyebrow) {
        var sub = /subtitle">(.*?)<\/h3>/.exec(sec.head);
        out += '\n## ' + (sec.eyebrow === sec.title ? '' : sec.eyebrow + ' — ') + sec.title + '\n\n' + (sub ? '*' + sub[1] + '*\n\n' : '');
      } else if (sec.toc) out += '\n## ' + sec.toc + '\n\n';
      sec.blocks.forEach(function (b) {
        var d = document.createElement('div'); d.innerHTML = b;
        Array.prototype.forEach.call(d.children, function (el) { out += blk(el); });
      });
    });
    return out.replace(/\n{3,}/g, '\n\n').trim() + '\n';
  }
  function offerDownload(kind) {
    if (!DL) return;
    if (kind === 'html' && SNAP) DL.save({ filename: 'karmika-bible-season-1.html', data: SNAP }).catch(function () {});
    else DL.save({ filename: 'karmika-bible-season-1.md', data: toMarkdown() }).catch(function () {});
  }
  if (window.claude && claude.use) {
    claude.use('downloads').then(function (d) { if (d) { DL = d; rebuildSoon(); } }).catch(function () {});
  }
  book.addEventListener('click', function (e) {
    var st = e.target.closest('.strap');
    if (st) { e.preventDefault(); e.stopPropagation(); unlockStrap(st, function () { playOpening(tocStart[1]); }); return; }
    var dl = e.target.closest('[data-dl]');
    if (dl) { e.preventDefault(); offerDownload(dl.getAttribute('data-dl')); return; }
    var t = e.target.closest('[data-go]');
    if (t) { e.preventDefault(); go(parseInt(t.getAttribute('data-go'), 10)); }
  });
  prevB.addEventListener('click', function () { go(cur - 1); });
  nextB.addEventListener('click', function () { go(cur + 1); });
  tocB.addEventListener('click', function () { go(tocStart[(pageList[cur] && pageList[cur].tp) || 1]); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(N);
  });
  var sx = null, sy = null;
  book.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  book.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? cur + 1 : cur - 1);
  }, { passive: true });
  window.addEventListener('hashchange', function () {
    var m = /^#p(\d+)$/.exec(location.hash);
    if (m) go(parseInt(m[1], 10));
  });

  build();
  var start = 0, mm = /^#p(\d+)$/.exec(location.hash || '');
  if (mm) start = parseInt(mm[1], 10);
  else { try { var sv = parseInt(localStorage.getItem('karmika-page-en'), 10); if (sv >= 0 && sv <= N) start = sv; } catch (e) {} }
  show(start, true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(rebuildSoon);
})();
