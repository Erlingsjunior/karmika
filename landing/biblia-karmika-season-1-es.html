      el.style.zIndex = '';
      try { a.cancel(); } catch (e) {}
      busy = false;
    };
  }
  function go(i) { if (!busy) show(i); }

  function anchorOf(i) {
    var p = pageList[i];
    if (!p) return { k: 'c' };
    if (p.kind === 'sec') return { k: 's', si: p.si, pi: p.pi };
    if (p.kind === 'toc') return { k: 't', w: p.which };
    return { k: 'c' };
  }
  function indexOfAnchor(a) {
    var best = 0;
    for (var i = 0; i < pageList.length; i++) {
      var p = pageList[i];
      if (a.k === 'c') return 0;
      if (a.k === 't' && p.kind === 'toc' && p.which === a.w) return i;
      if (a.k === 's' && p.kind === 'sec' && p.si === a.si && p.pi <= a.pi) best = i;
    }
    return best;
  }
  var rebuildTimer = null;
  function rebuild() {
    if (busy) { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 400); return; }
    var a = cur >= 0 ? anchorOf(cur) : null;
    build();
    if (a) { cur = indexOfAnchor(a); mount(cur); ui(); }
  }
  function rebuildSoon() { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 160); }
  window.addEventListener('resize', rebuildSoon);



  function openingSvg() {
    var wv = 'M-40 0 q10 -6 20 0' + new Array(19).join(' t20 0') + ' L340 300 L-40 300 Z';
    return '<svg viewBox="20 30 260 190" role="img" aria-label="O Olho Karmico se enche de karma e derrama uma lágrima">' +
      '<defs><linearGradient id="lqo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0bd"/><stop offset="1" stop-color="#f2b04a"/></linearGradient>' +
      '<clipPath id="evo"><polygon points="60,110 143,54 157,54 240,110 157,166 143,166"/></clipPath></defs>' +
      '<g clip-path="url(#evo)"><g transform="translate(0,172)"><animateTransform attributeName="transform" type="translate" values="0 172;0 60" dur="3s" fill="freeze" calcMode="spline" keySplines="0.35 0 0.2 1"/>' +
      '<g><animateTransform attributeName="transform" type="translate" values="-40 0;0 0" dur="2.2s" repeatCount="indefinite"/><path fill="url(#lqo)" d="' + wv + '"/></g></g></g>' +
      '<g fill="none" stroke="#d9a24f" stroke-width="14" stroke-linecap="butt" stroke-linejoin="bevel"><path d="M144 40 L40 110 L144 180"/><path d="M40 40 L40 180"/><path d="M156 40 L260 110 L156 180"/><path d="M260 40 L260 180"/></g>' +
      '<polygon points="150,94 166,110 150,126 134,110" fill="#0b0810" stroke="#f2b04a" stroke-width="3"><animate attributeName="stroke-width" values="3;9;3" begin="3s" dur="0.7s"/></polygon>' +
      '<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;1" begin="3.3s" dur="2s" fill="freeze"/>' +
      '<animateTransform attributeName="transform" type="translate" values="150 176;150 176;150 214" keyTimes="0;0.42;1" calcMode="spline" keySplines="0 0 1 1;0.55 0 1 0.45" begin="3.3s" dur="2s" fill="freeze"/>' +
      '<g><animateTransform attributeName="transform" type="scale" values="0;1;1" keyTimes="0;0.42;1" begin="3.3s" dur="2s" fill="freeze"/>' +
      '<circle r="13" fill="#ffe9ad" opacity="0.25"/><path d="M0 -11 C7 -2 8 6 0 8 C-8 6 -7 -2 0 -11 Z" fill="url(#lqo)"/></g></g>' +
      '<ellipse cx="150" cy="214" rx="2" ry="1" fill="none" stroke="#ffe9ad" stroke-width="1.4" opacity="0"><animate attributeName="rx" values="2;48" begin="5.2s" dur="1.1s" fill="freeze"/><animate attributeName="ry" values="1;9" begin="5.2s" dur="1.1s" fill="freeze"/><animate attributeName="opacity" values="0.9;0" begin="5.2s" dur="1.1s" fill="freeze"/></ellipse>' +
      '</svg>';
  }
  var unlocking = false;
  function unlockStrap(st, then) {
    if (unlocking) return;
    unlocking = true;
    if (reduce) { unlocking = false; then(); return; }
    st.classList.add('unlock');
    setTimeout(function () { st.classList.add('open'); }, 650);
    setTimeout(function () { unlocking = false; then(); }, 1750);
  }
  var opening = false;
  function playOpening(target) {
    if (opening) return;
    if (reduce) { go(target); return; }
    opening = true;
    var ov = document.createElement('div');
    ov.className = 'opening';
    ov.innerHTML = openingSvg() + '<p class="cap">El karma se llena. El Ojo llora.</p><span class="skip">toca para saltar</span>';
    book.appendChild(ov);
    var done = false;
    function end() {
      if (done) return; done = true;
      ov.classList.add('out');
      go(target);
      setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); opening = false; }, 850);
    }
    ov.addEventListener('click', end);
    setTimeout(end, 6600);
  }

  /* ---------- download em Markdown ---------- */
  var DL = null;
  function inl(n) {
    var out = '';
    n.childNodes.forEach(function (c) {
      if (c.nodeType === 3) { out += c.textContent; return; }
      if (c.nodeType !== 1) return;
      var t = c.tagName;
      if (c.classList && c.classList.contains('tag')) { out += ' [' + c.textContent.trim() + ']'; return; }
      if (t === 'SVG' || t === 'svg') return;
      var x = inl(c);
      if (t === 'B' || t === 'STRONG') out += '**' + x + '**';
      else if (t === 'EM' || t === 'I') out += '*' + x + '*';
      else out += x;
    });
    return out.replace(/\s+\n/g, '\n').replace(/[ \t]{2,}/g, ' ');
  }
  function blk(el) {
    var t = el.tagName, c = el.className || '';
    if (/secmark/.test(c) || /figwrap/.test(c) || t === 'svg') return '';
    if (t === 'H3') return '### ' + inl(el).trim() + '\n\n';
    if (t === 'P') return inl(el).trim() + '\n\n';
    if (t === 'UL') return Array.prototype.map.call(el.children, function (li) { return '- ' + inl(li).trim(); }).join('\n') + '\n\n';
    if (/tw/.test(c) && el.querySelector('table')) {
      var heads = Array.prototype.map.call(el.querySelectorAll('thead th'), function (h) { return inl(h).trim() || ' '; });
      var rows = Array.prototype.map.call(el.querySelectorAll('tbody tr'), function (r) {
        return '| ' + Array.prototype.map.call(r.children, function (d) { return inl(d).trim().replace(/\|/g, '/'); }).join(' | ') + ' |';
      });
      return '| ' + heads.join(' | ') + ' |\n|' + heads.map(function () { return ' --- |'; }).join('') + '\n' + rows.join('\n') + '\n\n';
    }
    return inl(el).trim() ? inl(el).trim() + '\n\n' : '';
  }
  function toMarkdown() {
    var out = '# Biblia Karmika · Season I\n\n*Season I · Las Crónicas, por Ormund Salveth, Cronista de la Gran Biblioteca.*\n\nDocumento generado a partir de la versión en línea del libro.\n\n';
    sections.forEach(function (sec) {
      if (sec.eyebrow) {
        var sub = /subtitle">(.*?)<\/h3>/.exec(sec.head);
        out += '\n## ' + (sec.eyebrow === sec.title ? '' : sec.eyebrow + ' — ') + sec.title + '\n\n' + (sub ? '*' + sub[1] + '*\n\n' : '');
      } else if (sec.toc) out += '\n## ' + sec.toc + '\n\n';
      sec.blocks.forEach(function (b) {
        var d = document.createElement('div'); d.innerHTML = b;
        Array.prototype.forEach.call(d.children, function (el) { out += blk(el); });
      });
    });
    return out.replace(/\n{3,}/g, '\n\n').trim() + '\n';
  }
  function offerDownload(kind) {
    if (!DL) return;
    if (kind === 'html' && SNAP) DL.save({ filename: 'biblia-karmika-season-1.html', data: SNAP }).catch(function () {});
    else DL.save({ filename: 'biblia-karmika-season-1.md', data: toMarkdown() }).catch(function () {});
  }
  if (window.claude && claude.use) {
    claude.use('downloads').then(function (d) { if (d) { DL = d; rebuildSoon(); } }).catch(function () {});
  }
  book.addEventListener('click', function (e) {
    var st = e.target.closest('.strap');
    if (st) { e.preventDefault(); e.stopPropagation(); unlockStrap(st, function () { playOpening(tocStart[1]); }); return; }
    var dl = e.target.closest('[data-dl]');
    if (dl) { e.preventDefault(); offerDownload(dl.getAttribute('data-dl')); return; }
    var t = e.target.closest('[data-go]');
    if (t) { e.preventDefault(); go(parseInt(t.getAttribute('data-go'), 10)); }
  });
  prevB.addEventListener('click', function () { go(cur - 1); });
  nextB.addEventListener('click', function () { go(cur + 1); });
  tocB.addEventListener('click', function () { go(tocStart[(pageList[cur] && pageList[cur].tp) || 1]); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(N);
  });
  var sx = null, sy = null;
  book.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  book.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? cur + 1 : cur - 1);
  }, { passive: true });
  window.addEventListener('hashchange', function () {
    var m = /^#p(\d+)$/.exec(location.hash);
    if (m) go(parseInt(m[1], 10));
  });

  build();
  var start = 0, mm = /^#p(\d+)$/.exec(location.hash || '');
  if (mm) start = parseInt(mm[1], 10);
  else { try { var sv = parseInt(localStorage.getItem('karmika-page-es'), 10); if (sv >= 0 && sv <= N) start = sv; } catch (e) {} }
  show(start, true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(rebuildSoon);
})();
