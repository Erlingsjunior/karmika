    '<p><b>Garrick</b>, el guardia, es quien da las primeras cacerías, y empieza por lo pequeño, con las ratas rojas del cementerio. <b>Lúcia</b> busca a su marido, que desapareció cerca de la Iglesia Abandonada. <b>Eldrin</b>, el sabio del templo, manda a los novatos al Cementerio Olvidado y a las ruinas de donde salen diablillos. <b>Doran</b>, el armero, enseña a hacer la primera hacha. <b>Thorin</b>, el mercader enano, lo compra todo y se ríe de todo. Y están la alquimista <b>Morwen</b>, la cazadora <b>Kaela</b> y el domador <b>Corwin</b>, que cuida de las monturas. Los nombres de quienes mandan en la aldea suenan a aventura; los nórdicos solo se oyen entre los enanos y en el norte.</p>' });
  add({ lv: 'XVII', body:
    '<h3>El Camino del Norte</h3>' +
    '<p>Los de la aldea cuentan la misma secuencia, con pequeños cambios según quién la cuente. Primero las ratas, los coyotes del camino y los lobos del este. Después el Guardián del Bosque, un árbol antiguo que enloqueció y empezó a atacar a los leñadores. Después las sombras en las ruinas y, por fin, lo que vive en la iglesia: el <b>Príncipe de las Cenizas</b>. Quien llega al final de ese camino hace el Juramento del Norte ante Garrick, y la aldea deja de ser su mundo entero.</p>' +
    '<p>Noté algo curioso: nadie en Karmika se queda sin rumbo. Cuando una tarea termina, alguien ya señala la siguiente: «ve a hablar con Fulano», «hay gente que necesita ayuda en otra ciudad», «ya hiciste todo lo que podías aquí». Los sacerdotes dicen que es el hilo del Laberinto, que nunca se pierde de vista.</p>' +
    '<h3>La llamada de Askavik</h3>' +
    '<p>A los veinticinco llega una carta. Eldrin la entrega con la mano temblorosa: Askavik llama. Allí el novato conoce al <b>Maestro Halvard</b>, de la Escuela de Guerra, las tejedurías de las dos banderas, el mercado, la iglesia y la tienda de Elowen. Y conoce a la <b>Vieja Gunnhild</b>, guardiana de las reliquias, que lo lleva ante la Vidente.</p>' });
  add({ lv: 'XVII', body:
    '<h3>La Vidente de los Caminos</h3>' +
    '<p><b>Hrefna</b> vive en un santuario de piedras erguidas, tras un velo de luz violeta, y un hilo de arena cae ante ella sin acabarse nunca. Marghar no tiene sacerdotes, pero tiene quien lo siga de buena gana, y Hrefna es de esas. Ella sigue a las Esencias, las que caminan al lado de Marghar, y el pueblo llama Diosa de los Caminos a aquella a quien ella más velas enciende: Ilmara, la Cartógrafa de los Pasos, la primera en trazar el laberinto. Suyo es el Pergamino del Regreso, que abre un camino de luz hasta la fuente de casa.</p>' +
    '<p>Hace doce preguntas. «Un lobo herido se cruza en tu camino de noche. Tú…» «¿Qué es lo que más temes perder?» «Ante una puerta cerrada con llave, tú…» Cada respuesta pesa hacia dos o tres caminos, y el karma que el alma juntó hasta entonces pesa con ella. Al final, dice el camino más fuerte y el segundo, y devuelve la elección:</p>' +
    '<blockquote>Lo que vi es hacia dónde se inclina tu alma, no una cadena. En Karmika, quien elige eres tú.</blockquote>' +
    '<p>Quien acepta parte de viaje hacia un maestro: <b>Thorgrim Mano de Hierro</b>, en la Fortaleza de Odín; el <b>Gran Maestre Cassius</b>, en la Abadía de la Aurora; <b>Ilsa Van Rhal</b>, en el Bastión de Plata; la <b>Arquitecta Ylva</b>, en la Academia de Askavik; el <b>Conde Vladislav III</b>, en la Colina; <b>Ulfrun la Madre Alfa</b>, en el Aullido Antiguo; el <b>Archimago Aurelian Vesk</b>, en el Pináculo; y <b>Malgrath</b>, en el Valle. Quien prefiere esperar sigue siendo humano, y hay quien pasa la vida entera así, construyendo casas, muros y gremios.</p>' +
    '<h3>Notas del cronista</h3><p class="fnote"><span class="nb">✎</span>La novia de las ciénagas lleva el mismo nombre que la Madre Roja. Los aldeanos dicen que es coincidencia, que Hemara era un nombre común en aquel tiempo. Los vampiros de la Colina, que yo sepa, nunca pronuncian el nombre de su diosa cuando cruzan las ciénagas.</p><p class="fnote"><span class="nb">✎</span>Conté las velas de Hrefna. Son diez. Le pregunté de quién era la décima, la única que nunca enciende. Me respondió que, cuando se acuerde, me lo cuenta.</p>'  });

  add({ toc: 'Libro XVIII — La Catedral Abandonada', lv: 'XVIII', eyebrow: 'Libro XVIII', title: 'La Catedral Abandonada', start: true, body:
    '<p>Hay una catedral no lejos de Karmika que ya nadie visita de día. Fue de la iglesia, y después de un obispo que dejó de rezar a Auréon y empezó a poner la mesa para otro. En la puerta, atada con cadenas que no son de este mundo, espera la <b>Hermana Ysolde</b>, un espíritu azulado que pide a quien pasa que purifique la nave.</p>' +
    '<h3>El recipiente del sacrificio</h3>' +
    '<p>Los muertos allí dentro no se quedan muertos. Por eso ninguna puerta se abre matándolos a todos: en cada piso hay un <b>Recipiente del Sacrificio</b>, que se llena con la sangre de quien cae allí. Los zombis dan poco, los necrófagos dan más, y los guardianes de las criptas llenan la copa de una vez. Son <b>seiscientos sesenta y seis litros</b> hasta la última puerta: ciento once en el primer piso, ciento sesenta y seis en el segundo, doscientos veintidós en el tercero y ciento sesenta y siete en el cuarto.</p>' });
  add({ lv: 'XVIII', body:
    '<h3>El Obispo Caído</h3>' +
    '<p>Los tres guardianes de las criptas llevan tres sellos: el Verdugo de las Criptas, el Príncipe Óseo y el Guardián del Mausoleo. Quien junta los tres y llena la copa encuentra, al fondo, al <b>Obispo Caído</b>. Alza el báculo y dice que Gorvak tiene hambre y que él es la boca. Cuando sangra, llama al rebaño de las criptas; cuando sangra más, llama a necrófagos y a un príncipe.</p>' +
    '<p>Gorvak, el Banquete Sin Fin, del que hablé en el segundo libro, nunca pide nada. Solo pone la mesa. La Catedral es la prueba de que alguien siempre acepta la invitación.</p>' +
    '<h3>Notas del cronista</h3><p class="fnote"><span class="nb">✎</span>Ysolde cuenta las medidas en voz alta, siempre, mientras los recipientes se llenan. Quien sale de la Catedral antes del final la oye empezar de nuevo desde cero. Sus cadenas son negras y frías, como las de Ishkara, pero tienen un eslabón, uno solo, de oro. Ishkara no usa oro.</p>'  });

  add({ toc: 'Libro XIX — El Clan del Cuervo', lv: 'XIX', eyebrow: 'Libro XIX', title: 'El Clan del Cuervo', start: true, body:
    '<p>De los ocho caminos, el primero que la Biblioteca pudo seguir de cerca fue el del guerrero. Subí a la Fortaleza de Odín tras Thorgrim Mano de Hierro, maestro de armas del Clan del Cuervo, y anoté las diez pruebas que da a los que llegan. En cada una, el Ojo juzga no lo que se hizo, sino por qué se hizo.</p>' +
    '<h3>El juramento</h3>' +
    '<p>La primera prueba es jurar. Se jura por los que no pueden luchar, o por el clan y por Odín, o por la propia gloria, y el Ojo pesa distinto cada una de las tres promesas. Después vienen el fiordo de Skjoldvik, los muertos que andan y el hierro para la fortaleza.</p>' +
    '<h3>El desertor</h3>' +
    '<p>En Fjallbrún el aprendiz encuentra a <b>Halfdan</b>, que huyó del clan. Puede llevarlo a juicio, dejarlo ir y mentirle al maestro, o ejecutarlo allí mismo. Thorgrim nunca dice cuál era la respuesta correcta. Solo dice que el Ojo lo vio.</p>' });
  add({ lv: 'XIX', body:
    '<h3>El emisario del Hilo</h3>' +
    '<p>En la sexta prueba, el clan manda al aprendiz a Askavik a hablar con el Paladín Aldric, emisario de la Orden del Hilo. El guerrero decide si el Clan del Cuervo se alía con el Hilo, se niega, o escucha primero a los Deshilados. Los nórdicos todavía no tienen bandera; quizá la reciban de manos de quien pase por allí.</p>' +
    '<h3>El duelo de Hrimgard</h3>' +
    '<p>En Hrimgard un rival cae en la nieve en mitad del duelo. El aprendiz puede esperar a que se levante, aprovechar la caída o terminar en empate. De los tres, el Ojo solo le sonríe a dos.</p>' +
    '<h3>El Valhalla espera</h3>' +
    '<p>En la última prueba, Thorgrim es herido de muerte. El aprendiz lucha a su lado hasta el final, o lo arrastra a los curanderos contra su voluntad, o le concede la muerte honrosa en un último duelo. Quien termina recibe el título de <b>Guerrero del Cuervo</b>. ¿Y los otros siete caminos? Todavía estoy subiendo sus caminos.</p>' +
    '<h3>Notas del cronista</h3><p class="fnote"><span class="nb">✎</span>En el salón del clan hay un escudo antiguo colgado sobre el trono, con un nombre tachado y otro grabado encima: Ulfar. Thorgrim dice que es solo un escudo. Los cuervos de la fortaleza no se posan en él.</p>'  });

  add({ toc: 'Libro XX — Lo que se carga', lv: 'XX', eyebrow: 'Libro XX', title: 'Lo que se carga por el camino', start: true, body:
    '<p>Un caminante es también lo que lleva consigo. La Biblioteca guarda listas de cosas que pasaron por muchas manos, y las más raras tienen nombre. Hay siete peldaños de rareza, del común grisáceo al mágico, al raro, al legendario, al épico. Por encima están los <b>únicos</b>, piezas de una cultura con poder propio, y las <b>reliquias</b>, que cambian la manera de luchar y a veces ni siquiera son armas.</p>' +
    '<h3>De las culturas</h3>' +
    '<p>Los nórdicos hablan de Mjölnir, de Gungnir y de las Botas de Sleipnir. Los enanos, de la Égida de Eitr y de la Brasa de Surtr, que hace arder todo lo que toca. Los paladines, de Excalibur y del Cáliz de Marghar, que impide la muerte una vez cada tanto. Los cazadores, de la Ballesta de Plata de Van Rhal. Los vampiros hablan bajo del Corazón de Drácula; los hombres lobo, del Colmillo del Primer Aullido; los brujos, del Libro Sin Pasos, cuyos hechizos cuestan un poco de vida. Una reliquia casi siempre llega a alguien de su cultura, como si supiera en qué manos caer.</p>' +
    '<p>Nada de eso es rosa, por cierto. Pregunté por qué, y un herrero enano me miró como si estuviera loco.</p>' });

  add({ toc: 'Libro XXI — Los que caminan juntos', lv: 'XXI', eyebrow: 'Libro XXI', title: 'Los que caminan juntos', start: true, body:
    '<p>Durante mucho tiempo escribí sobre almas que andaban solas. Ya no es así. Hoy los caminantes se juntan en grupos de hasta seis, y un grupo es algo curioso de observar: la fiera que uno derriba cuenta para todos, y la misión que uno acepta aparece, como en un susurro, para los demás. Pero a nadie se le lleva a cuestas: dentro del grupo, la diferencia de experiencia no puede pasar de diez niveles.</p>' +
    '<h3>El cuervo y el tablón</h3>' +
    '<p>Toda aldea tiene un buzón de hierro con un cuervo encima. Por el cuervo van cartas, oro, piezas y cobros, y el cuervo espera a quien no está para entregárselo cuando llegue. En el Tablón de la Plaza, además de los contratos de los vecinos, los caminantes clavan sus propios encargos, dejan el oro en custodia y esperan a quien los cumpla.</p>' });
  add({ lv: 'XXI', body:
    '<h3>Cuando las banderas se cruzan</h3>' +
    '<p>Fuera de las aldeas, el Hilo y los Deshilados se atacan cuando se encuentran, y nadie paga en karma por defender su bandera. Nadie está obligado a luchar, sin embargo. Dentro de las aldeas la tierra es sagrada, y ninguna hoja corta.</p>' +
    '<p>Entre los de la misma bandera es distinto. Uno no hiere al otro, a no ser que tome la decisión, consciente, de cazar a su propio bando. Quien hace eso lleva el nombre escrito en rojo, y el Ojo cobra cada golpe. Quien devuelve el golpe, en cambio, no debe nada.</p>' +
    '<p>Y está el duelo, acordado entre dos, que vale en cualquier lugar y en el que nadie muere: pierde quien cae de rodillas primero. Los enanos lo llaman charla.</p>' });

  add({ toc: 'Libro XXII — El Hilo de la Vida', lv: 'XXII', eyebrow: 'Libro XXII', title: 'El Hilo de la Vida', start: true, body:
    '<p>Hay quien piensa que la muerte, en Karmika, es una puerta que solo se abre una vez. No es exactamente así. Toda alma que camina está atada al cuerpo por un hilo, y el hilo tiene <b>tres alientos</b>. Quien cae en el camino se levanta en la fuente de su hogar: es una caída, y el hilo pierde un aliento. Los alientos vuelven despacio, uno cada día, como la respiración de quien duerme.</p>' +
    '<p>Antes del nivel veinte, cuando el Ojo todavía duerme, nadie gasta el hilo. Marghar no cobra a quien aún no ha sido visto.</p>' +
    '<h3>Cuando el hilo se rompe</h3>' +
    '<p>Quien cae sin ningún aliento <b>desencarna</b>. Los que lo vieron cuentan siempre lo mismo: una chispa sale del cuerpo caído, crece un poco, empieza a vibrar y, de repente, sube, rápida y fina como una aguja, hasta perderse en el cielo.</p>' +
    '<p>El alma llega entonces al <b>centro del laberinto</b>, que los viejos llaman el <b>Umbral</b>. Es un suelo de luz suspendido sobre Karmika. Desde allí arriba se ve el laberinto entero, hasta donde alcanza la vista: muros que se alzan y ceden, pasillos que se cierran y se abren, lugares que se oscurecen en un camino negro y otros que se aclaran. Es el mundo sucediendo, ahora, allá abajo.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Los que esperan en el centro</h3>' +
    '<p>A la izquierda de quien llega está <b>Orvalen, el Lector de Rastros</b>, encapuchado, con un bastón y una linterna fría. Los rastros de luz giran a sus pies. Es él quien lee la vida que terminó, paso a paso, y quien la devuelve o la borra.</p>' +
    '<p>A la derecha está <b>Sael, la Que Volvió</b>, la única que llegó al centro y regresó. Sostiene un hilo de oro que va de su mano hasta el alma recién llegada, y es ella quien guía el regreso.</p>' +
    '<p>Entre los dos y el fondo flota el <b>Ojo Kármico</b>, mirando a quien llegó. Y muy al fondo, en un brillo dorado, se percibe una silueta inmensa, tranquila, inclinada sobre una piscina cósmica: <b>Marghar</b>, viendo todo lo que sucede. Nadie lo ha visto alzar los ojos. Allí el alma conversa con las dos Esencias y elige, y solo hay tres elecciones.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Los tres regresos</h3>' +
    '<ul class="plain">' +
    '<li><b>Volver al mismo cuerpo.</b> Orvalen devuelve los rastros tal como están. El alma entra de nuevo donde estaba, igual, y vuelve debiendo. Los viejos lo llaman <b>Deuda Kármica</b>: la mitad de todo lo que el alma aprende después paga lo que dejó de andar, hasta que la cuenta se cierra.</li>' +
    '<li><b>Reencarnar.</b> Orvalen borra los rastros del cuerpo, y Sael lleva el alma hasta un cuerpo nuevo. El alma elige otro pueblo y otro rostro y guarda el resto: el nombre, cuánto ya anduvo, lo que llevaba, el oro, el cofre y las promesas. Solo la clase se queda atrás, y Hrefna vuelve a leer el camino. Los hechizos y la fuerza del cuerpo antiguo vuelven como puntos sueltos, para que el alma arregle lo que hizo mal.</li>' +
    '<li><b>Pagar con una Lágrima.</b> Quien guarda una Lágrima del Ojo se la ofrece al Ojo y paga el regreso entero, sin deuda alguna. El alma reencuentra el cuerpo en el lugar sagrado de su camino: el paladín en la Abadía de la Aurora, el tecnócrata en la Academia, el vampiro en el castillo del Conde.</li>' +
    '</ul>' +
    '<h3>El eco de la vida pasada</h3>' +
    '<p>Quien reencarna y vuelve al mismo camino encuentra un eco. El cuerpo nuevo no lo sabe, pero el alma recuerda, y aprende <b>cuatro veces más rápido</b> hasta alcanzar el punto en que cayó. Allí el eco se calla, y el camino vuelve a su paso de siempre. Los maestros de las academias reconocen a estos alumnos: aprenden como quien recuerda.</p>' });
  add({ lv: 'XXII', body:
    '<h3>El Ojo que ve y esconde</h3>' +
    '<p>Quien sube al Umbral ve el Ojo de cerca y nota algo que nadie cuenta aquí abajo. De su parte de arriba sale, sin parar, una energía dorada y viva, que sube como humo de incienso y oculta el rostro de Marghar. De su parte de abajo escurre una niebla oscura y densa, del mismo azul del Reloj de Arena, que baja despacio hasta el laberinto y se pierde entre los muros.</p>' +
    '<p>Los que volvieron dicen que entendieron allí lo que los sacerdotes nunca supieron explicar: el Ojo que te ve es el mismo velo que esconde a quien mira. Nadie ve a Marghar, porque su propia mirada está en el camino. Y el karma no se queda dentro del Ojo. Sale, todo el tiempo, hacia arriba y hacia abajo, cada mitad con su verdad: lo que aclara sube en oro, lo que pesa baja en niebla.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Por qué no actúa</h3>' +
    '<p>Le pregunté a Sael, en las pocas líneas suyas que quedan en los archivos, por qué Marghar no impide el mal. La respuesta que anotaron es la más larga que se tiene de una Esencia:</p>' +
    '<blockquote>Porque él no actúa. No impide, no mata, no juzga. Nunca lo vi alzar la mano, ni para salvar ni para castigar. Marghar es el querer, y el deseo de querer. Es el detenerse, y el deseo de detenerse. Es el camino y es el paso, y antes de los dos es la voluntad de caminar. Quien actúa es quien anda. Él solo ve, y guarda, y un día devuelve.</blockquote>' +
    '<p>Los ancianos de Askavik leen en esto una promesa; los Deshilados, una acusación. Yo leo las dos cosas, y no sé elegir.</p>' });
  add({ lv: 'XXII', body:
    '<h3>La pregunta que nadie responde</h3>' +
    '<p>Orvalen, que lee rastros desde antes de que existieran los nombres, dejó registrada una duda que dudo en copiar. Se pregunta si Marghar no sería también Ahzur. Si eso que llamamos dios de los caminos no sería un sistema sin fin, que se alimenta de sí mismo y a sí mismo se devora, como la serpiente que se muerde la cola y dibuja, con el cuerpo, el signo del infinito. El camino y la destrucción del camino, contemplándose a sí mismo todo el tiempo.</p>' +
    '<p>Sael, dicen, le mandó callar. No por ser mentira, sino porque Marghar lo oye todo y nunca responde.</p>' +
    '<h3>Y nosotros</h3>' +
    '<p>Si todo es Marghar, nosotros también somos parte de él. Somos caminantes, y somos camino. Somos hambre, y somos alimento. Quizá por eso existe el laberinto: no para escondernos para siempre, sino para darnos tiempo de elegir cuál de las dos cosas ser antes de que llegue el Hambre.</p>' +
    '<p>No sé responder a nada de esto. Lo anoto, y sigo andando, que es lo que hace todo caminante.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Soy yo</h3>' +
    '<p>Lo que más me divierte de los registros es una escena que se repite en cada plaza. Dos caminantes se encuentran, y uno le dice al otro: soy yo, Brakka. ¿Pero tú no eras enano? Lo era. Ahora soy elfo.</p>' +
    '<p>El alma es la misma, el nombre es el mismo, y el karma también. El karma, por cierto, nunca se queda en el cuerpo que cayó: es del alma y atraviesa todas las vidas, junto con las Lágrimas y las deudas.</p>' +
    '<p>Quien pide ver el perfil de alguien encuentra allí sus vidas pasadas, una por una: el pueblo, el camino y hasta dónde llegó cada una. Yo, que sé leer pieles, prefiero leer esas listas. Mienten menos.</p>' +
    '<h3>Notas del cronista</h3><p class="fnote"><span class="nb">✎</span>Todos los relatos dicen que Sael volvió del centro. Ninguno dice qué fue a hacer allí, ni quién estaba en el centro antes que ella. Y los que han subido al Umbral más de una vez juran que, en una de esas veces, ella sostenía dos hilos. Le preguntaron por el otro. Sonrió y no respondió.</p>'  });

  add({ toc: 'Libro XXIII — El precio de cada camino', lv: 'XXIII', eyebrow: 'Libro XXIII', title: 'El precio de cada camino', start: true, body:
    '<p>Anduve mucho para escribir este libro, y lo que aprendí cabe en una línea: <b>ningún camino es gratis</b>. Cada uno le da al caminante una fuerza que los demás envidian, y le cobra una debilidad que solo los demás saben curar.</p>' +
    '<p>A los maestros de las academias no les gusta que se diga en voz alta, porque parece debilidad de la escuela. Yo creo lo contrario. Es esa cuenta la que mantiene el mundo en pie: el guerrero necesita al mago y al brujo, el vampiro necesita al enano y al tecnócrata, el lobo necesita hasta al vampiro, que es lo que más le duele. Nadie en Karmika vive solo por mucho tiempo. Quien lo intenta enloquece, se muere de hambre o se apaga.</p>' +
    '<p>Y la cuenta no vence de un día para otro. Los más viejos la miden en <b>turnos</b>, y dicen que son <b>veinte</b> los turnos de camino que un caminante aguanta antes de que su precio se vuelva insoportable. En los primeros doce, casi no se nota nada. Después, pesa.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Del guerrero que oye a los muertos</h3>' +
    '<p>El guerrero del Norte es el más fuerte de todos nosotros en el cuerpo a cuerpo, y por eso es el que más mata. Cada muerte deja en él un resto de furia. Primero viene el <b>frenesí</b>, y golpea más fuerte, pero olvida la guardia. Después viene la <b>locura</b>, y es ahí donde aparece el precio: el guerrero loco quiere hacer el bien y no puede, porque la sangre habla más alto, y el alma se oscurece despacio, como brasa tapada.</p>' +
    '<p>Para volver en sí, presenta sus condolencias a Odín por los caídos y mortifica el cuerpo en los <b>rituales de calma</b>. Necesita los inciensos de mortificación y purificación, y esos inciensos solo saben hacerlos los magos y los brujos. Ninguno de los dos los hace solo: el mago necesita las <b>Cenizas de los Muertos</b>, que solo recoge el brujo, y el brujo necesita la <b>Arena de la Iluminación Astral</b>, que solo guarda el mago. Vi a la Archimaga Seline, en el Pináculo, comprarle cenizas a la Bruja Grisolda de Gorvath con cara de quien se traga vinagre. Y vi a la bruja poner la misma cara.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Del paladín que duda</h3>' +
    '<p>La debilidad del paladín no está en la espada ni en el escudo. Está en la pregunta que se hace de noche, después de tantas batallas contra entidades y demonios: <em>¿mi guerra por la paz derrama más sangre que los propios malditos?</em> Esa <b>Duda</b> crece con cada muerte, y más aún cuando el muerto era gente. Cuando crece, la Luz responde menos a sus manos; cuando se desborda, la fe vacila, las buenas elecciones no pesan y el karma se escurre.</p>' +
    '<p>El remedio es antiguo: el <b>Ayuno y Oración</b>. El paladín come el <b>Pan Ácimo</b>, que los cocineros humanos hacen con el <b>Trigo sin Levadura</b>, cuya semilla los tecnócratas toquetearon en el invernadero de latón y que solo las manos élficas hacen brotar, y bebe el <b>Vino Santo</b> de los enanos, que solo se vuelve santo con la <b>Gota de Lágrima Santa</b> que las ancianas de Lithendel recogen antes del sol. Cinco manos en una sola comida. Quizá esa sea la respuesta a la Duda, y no el vino.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Del vampiro y la sed</h3>' +
    '<p>El vampiro es rey de la noche: más fuerte, más rápido, golpes que el ojo apenas sigue, y cada herida que abre le devuelve un poco de vida. Pero el sol lo debilita y lo quema, y por eso busca las ciudades de sombra, como Cuervoscuro, o los bosques cerrados. Y está la <b>sed</b>. La <b>Sangre Diluida</b> de la alquimista y la sangre de animal la engañan un tiempo, cada vez menos. Tarde o temprano el cuerpo pide sangre de gente: humano, enano o elfo. Quien bebe de gente mata la sed y oscurece el alma.</p>' +
    '<p>El vampiro que quiere seguir el bien tiene un camino, y es caro: la <b>Inyección Automática de Sangre</b> de los tecnócratas, hecha con la <b>Sangría Concentrada</b> que los enanos recogen de donantes en la Casa de Sangría de Forjabrasa. Nadie muere por ella. La Sangradora Hulda se encarga de decírselo a todo el que entra.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Del lobo y el hambre</h3>' +
    '<p>El licántropo es más grande y más fuerte que un hombre, y de día lucha como hombre, con garrotes, mazas y alabardas toscas. La forma de la bestia solo llega con la noche. Y la fiera tiene <b>hambre de carne de gente</b>, de cualquier pueblo: el humano es lo que más desea, el enano es duro de masticar y el elfo es flaco, casi sin grasa. La carne de animal la engaña un tiempo, hasta el día en que ya no llena. Con hambre, el lobo se vuelve lento y débil. Quien come gente sacia el hambre y mancha el alma.</p>' +
    '<p>El lobo que elige el bien tiene que tragarse el orgullo. La única carne que sacia sin víctima es la <b>Charcutería Secular</b>, carne curada durante siglos en las bodegas de Cuervoscuro, y quienes la venden son los vampiros. El Sumiller Vasko le sirve al lobo con una media sonrisa y le pide que coma afuera. Los más orgullosos mandan a un tecnócrata o a un enano a comprarla por ellos.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Del tecnócrata y el corazón de latón</h3>' +
    '<p>El tecnócrata no empuña espada, daga ni arco: lucha con las armas de la Academia, con el guantelete, con las torretas y con la esfera que vuela a su lado, que ataca, cura al grupo o lo defiende, según su postura. Pero todo eso viene del <b>reactor personal</b> que lleva a la espalda, y el reactor se gasta. Un <b>Núcleo de Reactor</b> cuesta caro y dura bastante, ocho turnos el primero, veinte el de la segunda clase de la Academia. Vacío, la energía no vuelve y la esfera se apaga.</p>' +
    '<p>El herrero hace la carcasa del núcleo, pero no lo completa solo: necesita el <b>Fluido Vital</b> del alquimista y el <b>Cristal Arcano</b> que los magos cargan en el Pináculo. Por eso el tecnócrata es, de todos, el que más necesita del comercio. Quien no vende, no enciende.</p>' +
    '<h3>De los que leen, de los que pactan y de los que vigilan</h3>' +
    '<p>El <b>mago</b> lanza tanta magia que su eco se le queda en la cabeza. Con el tiempo se vuelve <b>soberbia</b>: mira desde arriba a la gente sencilla, y la magia se le agrieta en la mano. Se cura con los pies en la tierra, en el <b>Ritual del Arraigo</b>: el Ungüento de la Tierra de las curtidoras del Aullido Antiguo y el Agua Bendita de la Abadía de la Aurora. Nada humilla tanto a un mago como pedirle a un lobo tierra de su madriguera.</p>' +
    '<p>El <b>brujo</b> no tiene magia propia: la toma prestada de Malgrath, y Malgrath cobra intereses. Cuando la deuda crece, el patrono retiene una parte de su vida, y al final manda al <b>Cobrador del Pacto</b>. La deuda se paga con la <b>Ofrenda</b>: un Corazón de Demonio, que solo los cazadores del Clan Helsing arrancan sin que se pudra, y un Cuerno de Sangre, que solo el guerrero del Norte llena en el campo de batalla.</p>' +
    '<p>El <b>cazador de demonios</b> sirve a Aravel, cuyo ojo nunca se cierra, y por eso no duerme. La vista se le nubla, y después ve un demonio en cada rostro. Solo duerme con el <b>Sueño Vigilado</b>: el Polvo del Sueño Sin Sueños, que hace el brujo, justo aquel a quien caza, y la Campana de Guardia de los tecnócratas, que suena sola si algo se acerca.</p>' +
    '<h3>Del precio de una vida</h3>' +
    '<p>Me preguntaron cuánto vale una vida en el Ojo. Respondí con la cuenta de las propias fieras: quien come gente compra veinte turnos de paz, y el Ojo cobra los veinte y uno más, por la vida. Veintiuno. Y si la víctima era un caminante, cuya alma vuelve y recuerda, el Ojo cobra el doble, porque son dos vidas: la que acabó y la que tendrá que empezar de nuevo.</p>' +
    '<h3>Del equilibrio</h3>' +
    '<p>Le pregunté a un maestro por qué las academias aceptan un precio tan alto. Me respondió sin levantar los ojos: <em>porque sin precio, el fuerte se vuelve dios, y un dios no necesita a nadie</em>.</p>' });

  add({ toc: 'Libro XXIV — De los oficios, las criaturas y los cielos', lv: 'XXIV', eyebrow: 'Libro XXIV', title: 'De los oficios, las criaturas y los cielos', start: true, body:
    '<p>Este libro es de cosas pequeñas, y por eso mismo verdaderas. Nadie recuerda al héroe por la espada; lo recuerdan por la forja donde se hizo, por el gato que dormía en su regazo y por la noche en que la luna se puso roja y no huyó.</p>' +
    '<h3>De las casas de oficio</h3>' +
    '<p>Toda aldea y toda ciudad de Karmika tiene sus cinco oficios alrededor de la plaza. Nadie cepilla tablas en medio del monte. En las <b>ciudades</b>, como Askavik y Karmika, cada oficio tiene su casa:</p>' +
    '<ul><li>la <b>Carpintería</b>, un galpón abierto de troncos, con las sierras colgadas en la pared, la sierra de bastidor sobre el tronco y el torno de pedal;</li><li>la <b>Forja</b>, con la chimenea de piedra y la boca en arco siempre encendida, los fuelles de cuero y los dos yunques;</li><li>la <b>Curtiduría y Sastrería</b>, con las tinas de teñir y los cueros en el tendedero;</li><li>el <b>Boticario</b>, con su antesala de mostrador y la sala del alambique detrás;</li><li>la <b>Escuela de Cocina</b>, con el horno de ladrillo y las mesas de los aprendices;</li><li>y la <b>Casa de Tecnología</b>, de chapas remachadas, con la bobina de Tesla en el tejado, que le sirve al tecnócrata de forja y de banco de trabajo.</li></ul>' +
    '<p>En las <b>aldeas</b> todo es más simple: el Cobertizo de Corte, la Forja al Aire Libre, la Mesa del Curtidor, el Boticario y la Cocina del Fondo, a la que se entra por la puerta de atrás de la taberna. Las aldeas de vapor del sur guardan también su Taller de Latón.</p>' });
  add({ lv: 'XXIV', body:
    '<h3>Del Establo y los compañeros</h3>' +
    '<p>El animal que compras no anda en tu mochila: vive en tu <b>Establo</b>, y de allí sale para andar contigo. Cada uno tiene nombre, que puedes cambiar, hambre y vínculo. Un animal con hambre busca despacio y no pelea; un animal que te adora vuelve más rápido para ayudarte.</p>' +
    '<ul><li><b>Gatito Atigrado</b> y <b>Zorro Rojo</b>: en el combate sueltan el <b>Alboroto</b>, y quien venía hacia ti se detiene un instante.</li><li><b>Gata Negra</b> y <b>Ratoncito de Sótano</b>: el <b>Olfato</b> encuentra lo que cayó lejos, y el chillido distrae.</li><li><b>Cachorro de Lobo</b>: el <b>Mordisco</b>, en las canillas de quien te ataca.</li><li><b>Lechón Pinto</b>: <b>Hocica</b> la tierra cuando descansas y a veces trae una manzana, un pan o unas monedas.</li></ul>' +
    '<p>La mascota lleva <b>Collar</b> y <b>Peto</b>. El collar la hace buscar más rápido; el peto hace que la habilidad vuelva antes, y el de hierro hace más profundo el mordisco. Mascotas, collares y petos se compran a <b>Corwin el Domador</b>. Caballos y heno, a <b>Orm el Posadero</b>: el Caballo Bayo, el Caballo Rucio y el Corcel Negro. Un caballo con hambre corre menos.</p>' +
    '<p>Y la mascota va contigo hasta el fondo de las mazmorras. Un animal fiel no se queda en la puerta.</p>' });
  add({ lv: 'XXIV', body:
    '<h3>De los cielos que cambian</h3>' +
    '<p>Dos veces al día, más o menos, el mundo entero cambia de color. Los eventos mundiales llegan cerca de una hora y media antes cada día, y en una semana pasan por todas las horas, para que nadie se quede siempre fuera.</p>' +
    '<p>En la <b>Luna de Sangre</b> el cielo sangra al llegar, y después el rojo se asienta, pero no se va. Provoca:</p>' +
    '<ul><li>patrullas atacadas y mordiscos de hombre lobo cinco veces más comunes en los caminos;</li><li>un hombre lobo más en cada oleada, llegando dos niveles por encima de lo normal;</li><li>vampiros, hombres lobo, brujos y almas de karma −20 o menos: +10% de daño y −8% de daño recibido;</li><li>paladines, magos y almas de karma +20 o más: +6% de daño recibido;</li><li>y para el hombre lobo con el Olfato activado, +15% de XP.</li></ul>' +
    '<p>En el <b>Día de la Aurora</b> es lo contrario: procesiones de Auréon seis veces más comunes, actos de luz que valen la mitad más de karma, la fuerza para las almas claras y el peso para las oscuras.</p>' +
    '<p>Quien quiera recordar lo que anda haciendo el cielo mira el <b>contador debajo del mapa</b>: dice cuánto falta para que acabe o empiece, y muestra lo que ya pasó y lo que hiciste en ello.</p>' });
  add({ lv: 'XXIV', body:
    '<h3>De la edad de las fieras</h3>' +
    '<p>Los viejos cazadores dicen: <em>si tiene la calavera sobre la cabeza, no es para ti</em>. Una fiera cinco niveles por encima pega casi el doble de fuerte; ocho por encima, más del doble; nunca más del triple. Y tu golpe resbala en ella: pierde fuerza con cada nivel de diferencia y a veces simplemente falla. La fiera por debajo de ti, en cambio, hace menos daño. No es suerte ni mala suerte, y no entra en la cuenta de las bendiciones: es la edad de la fiera.</p>' +
    '<h3>De las voces de la aldea</h3>' +
    '<p>La gente de Karmika habla. No todo el tiempo, pero habla: comenta el frío, la hora, la luna roja, tu pelea en la plaza, la sangre en tu cara, tu caballo y el nombre de tu gato. Sabe de tu karma y desconfía de tu camino. El guardia habla de la puerta, el herrero del filo de la hoja, la taberna del guiso. Quien presta atención aprende más en las calles que en los libros, incluido este.</p>' });
  add({ toc: 'Libro XXV — Los que llevan la bandera', lv: 'XXV', eyebrow: 'Libro XXV', title: 'Los que llevan la bandera', start: true, body:
    '<p>En el decimoquinto libro hablé de las dos banderas como quien habla de dos ideas. Pero ninguna idea anda sola por el camino. Anda la gente. Y fue para conocer a la gente que lleva cada bandera que gasté suela estos últimos años, de Austrvik a la Colina, de Sudrholt al Valle, y también bota, porque un enano me hizo subir dos veces la muralla de Forjabrasa para enseñarme un ladrillo.</p>' +
    '<p>Descubrí que cada camino tiene su <b>casa</b>, un lugar donde el camino vive y tiene nombre, y que cada casa tiene un maestro que no sale de ella, como el rey no sale del castillo. Y descubrí que, además de los maestros, cada camino tiene a alguien que <b>anda</b>: un portador, uno de los pocos que llevan la bandera adonde aún no ha llegado. Fue con ellos con quienes anduve. No todos andan con todos: cuando la misión es de espada, mandan al de espada; cuando es de palabra, al de palabra; cuando es de misterio, me mandan a mí, lo que dice mucho de la opinión que tienen del misterio.</p>' +
    '<h3>Las casas del Hilo</h3>' +
    '<p>La <b>Orden de Auréon</b> vive en la Abadía de la Aurora, en Austrvik, donde las campanas despiertan a la ciudad desde hace trescientos años. Su maestro es el <b>Gran Maestre Cassius</b>, viejo, cálido y grave, que recibe a cada novicio con la misma frase: rodilla en tierra no es humillación, es descanso. El <b>Clan Helsing</b>, los cazadores de plata, vive en el Bastión de Plata, en Sudrholt, y obedece a la <b>Maestra Ilsa Van Rhal</b>, de cuya familia es la Ballesta de Plata. El <b>Círculo del Pináculo</b>, que el pueblo llama Torre de Marfil, se enciende cada noche en Lumenhal, y lo rige el <b>Archimago Aurelian Vesk</b>, con la <b>Archimaga Seline</b> a su lado, la que compra cenizas de bruja con cara de quien se traga vinagre.</p>' });
  add({ lv: 'XXV', body:
    '<h3>Las casas de los Deshilados</h3>' +
    '<p>La <b>Casa Noctavar</b>, que los de fuera llaman la Corte del Conde, lleva mil años en pie en el castillo de la Colina Vampírica, sobre Cuervoscuro, y sigue en pie por tres leyes que ninguno de los suyos rompe: no beber de quien está bajo su protección, no crear crías sin el consentimiento de la Casa, no mentirle al Anciano. El Anciano es el <b>Conde Vladislav III</b>. Quien sirve la mesa es el <b>Sumiller Vasko</b>, que tiene mil años de vino y dos minutos de paciencia, y que sirve al hombre lobo con una media sonrisa y un plato en la puerta: «afuera, por favor, la alfombra es más vieja que usted».</p>' +
    '<p>La <b>Manada del Aullido Antiguo</b> vive en la Selva Licántropa, tiene una sola ley, nadie se queda atrás, y una madre, <b>Ulfrun la Madre Alfa</b>. Pasé una semana con la manada y salí convencido de que hombres lobo y enanos son el mismo pueblo con distinto pelaje: brutos, directos, comen haciendo ruido, insultan lo que aman y cumplen lo que dicen. Un cachorro me preguntó a qué sabe un cronista. Le dije que a papel. Perdió el interés.</p>' +
    '<p>El <b>Pacto de Gorvath</b> reúne a los brujos del Valle de la Desgracia; su patrono es <b>Malgrath</b>, que es príncipe y no maestro, y la más vieja del Pacto es la <b>Bruja Grisolda</b>, la que recoge las Cenizas de los Muertos y cobra por ellas lo que su cara de vinagre le permita.</p>' +
    '<h3>Quién anda por las tierras de la sombra</h3>' +
    '<p>Me fijé en quién circula por Cuervoscuro, por el Aullido y por el Valle sin que lo toquen. Los <b>elfos</b>, porque hasta el vampiro más viejo respeta a quien es bueno por naturaleza y demasiado flaco para la mesa. Los <b>tecnócratas</b>, porque no se muerde a quien arregla el reloj. Los <b>humanos</b>, no: allí el humano es presa, y lo sabe, y camina rápido. Y los <b>enanos</b> no van, porque odian a esa gente; pero venden, y la sombra sube a Forjabrasa a comprar hierro y sangre de donante en la Casa de Sangría, al mismo precio que paga el Hilo. Le pregunté a un enano cómo se le vende a quien se odia. «La mugre bajo la alfombra es problema suyo. La alfombra no la vendo. El hierro, sí.»</p>' });
  add({ lv: 'XXV', body:
    '<h3>Las casas que no juran</h3>' +
    '<p>El <b>Clan del Cuervo</b> guarda la Fortaleza de Odín, en Jarlsheim, bajo <b>Thorgrim Mano de Hierro</b>. En el salón hay dos cuervos tallados, uno a cada lado del trono, y los guerreros juran que son los de Odín: uno piensa, el otro recuerda. Dice Thorgrim que el guerrero que escucha a uno solo de los dos se vuelve loco o se vuelve cobarde, y que la hazaña de toda una vida es quedarse sentado en medio, como el Padre de Todos. La <b>Hermandad del Vapor</b> es como se llaman a sí mismos los tecnócratas cuando no están vendiendo nada: la Academia de la Grasa, en Puerto Caldera, con la <b>Arquitecta Ylva</b>, y la Compañía de Caravanas de Latón, con la <b>Factora Brunna</b>, que lleva cualquier cosa a cualquier lugar y dice que el camino no reza.</p>' +
    '<p>Y está Askavik, que no es casa de ningún camino y es casa de todos: la Real Tejeduría del Hilo, de la <b>Maestra Ingeborg</b>, y la Tejeduría de los Deshilados, de <b>Corvina la Deshiladora</b>, una a cada lado de la misma calle. No se saludan desde hace veinte años, pero las dos compran hilo al mismo mercader, que les vende a las dos con la misma sonrisa y les cobra a las dos el mismo precio, y es, por lo tanto, la persona más honesta de Askavik.</p>' +
    '<h3>Los que se quedaron comunes</h3>' +
    '<p>Antes de los portadores de las clases, tengo que hablar de los que rechazaron a la Vidente y se quedaron en lo que nacieron. No son menos. Algunos días, son más.</p>' +
    '<p>El <b>Viejo Ansgar</b>, el Anciano de Karmika, rechazó a la Vidente tres vidas seguidas y recuerda las tres. Se sienta en la plaza, junto a la fuente, y corrige la historia de todo el mundo: «no fue así». Cuando le pregunté por qué no eligió un camino, respondió: «Elegí. Elegí quedarme. Es el único camino en el que nadie te manda, y por eso nadie te ayuda. Se puede vivir.» Dice que la palabra dada es todo lo que tiene un humano, y que por eso la suya es corta.</p>' });
  add({ lv: 'XXV', body:
    '<p>La <b>Maestra de Obras Dagny Pie de Plomo</b> dirige la Gran Obra de Forjabrasa, la muralla nueva, y lo mide todo con una cinta métrica, promesas incluidas: «palabra de enano mide lo que un pelo de barba, dos dedos; la tuya dio uno y medio, vuelve mañana». Insulta a la piedra, insulta al capataz, insulta al Rey Thrain a sus espaldas y ya levantó tres puentes que nadie pidió porque «iban a hacer falta». Odia la mugre bajo la alfombra hasta el punto de no tener alfombra, y aun así le vende hierro al Hilo y a los Deshilados al mismo precio, porque una barba no tiene bandera: «negocio es negocio, palabra es palabra, y la alfombra es problema suyo». Cuando se derrumbó una galería en Cenizalta y el capataz lo escondió, ella bajó sola, sacó a los cuatro enterrados y dejó al capataz allá abajo hasta el final del turno, «para que aprenda lo que es esconder».</p>' +
    '<p><b>Lirien Hoja Tardía</b> es emisaria de la Copa de Lithendel y la única criatura que he visto cenar con el Conde, almorzar con la manada y tomar té en Gorvath en la misma semana sin perder un pelo. Es elfa pura, rechazó a la Vidente, y es bienvenida en las tres casas de la sombra porque, dicen allí, «el elfo no miente y no engorda». Habla poco, con una ironía tan fina que el insultado da las gracias. En una vida anterior, me contó de pasada, fue vampira. Volvió elfa. Dice que el ciclo de alianza se rompe una vez para que uno sepa lo que vale. Me explicó también lo que la Copa perdona y lo que no: un elfo de karma oscuro, que levanta su ciudad entre los de la sombra y al que llaman <b>elfo negro</b>, no ofende a nadie en Lithendel, porque lo oscuro también es un orden, y el bosque respeta el orden. Lo que el bosque no perdona es traicionar la naturaleza: convertirse en otra cosa. «Yo traicioné una vez. Pagué. Por eso me dejan andar.»</p>' +
    '<h3>Aldric, que lee los nombres</h3>' +
    '<p>El primer portador de clase que conocí fue el <b>Paladín Aldric</b>, emisario de la Orden del Hilo en Askavik. Ya escribí que es sincero hasta doler, y lo es. Lo que no había escrito es lo que guarda por dentro del escudo: grabados en la madera, uno debajo del otro, los nombres de cada persona que no logró proteger. Los lee cada noche antes de dormir, en voz baja. «Porque la Orden jura que nadie cruza solo. Ellos cruzaron. Alguien tiene que ir con ellos, aunque sea después.» Es Aldric quien recibe a los que llegan a Askavik y les muestra el Laberinto como quien muestra una casa: cada pasillo es alguien que todavía respira.</p>' });
  add({ lv: 'XXV', body:
    '<h3>Vesna Helsing, que no duerme</h3>' +
    '<p>La <b>Cazadora Vesna Helsing</b> no nació Helsing. Nació en una aldea que ya no existe, cerca de Sudrholt, y tenía seis años cuando un nido se la llevó. El Bastión la recogió como recoge a todos los huérfanos de la noche, y ella tomó el nombre del clan como quien toma un arma. Lleva en la muñeca una campanilla de guardia que suena sola si algo se acerca, y no duerme más de tres horas por noche, porque Aravel no duerme ninguna. Es ácida de una manera que solo da el cansancio: a los paladines les llama boy scouts en la cara, y dice que una luz que espera a que el monstruo pida perdón es una luz que llega tarde. Cada huérfano que el Bastión recoge es su aldea otra vez. Por eso no para.</p>' +
    '<h3>Ísold Pluma Clara, que copia a mano</h3>' +
    '<p>En el Pináculo hay una sala donde se guardan los libros que nadie debe leer, y hay una maga que los copia a mano, uno a uno, con luz débil. Es <b>Ísold Pluma Clara</b>. «Porque la copia no miente. El original, a veces, sí.» Fue la primera persona a la que oí decir que un grimorio de la Torre tenía una sílaba equivocada en la última línea, y la primera en culpar de ello a la podredumbre de Zerath. Tiene una soberbia dulce, de quien sabe más y le hace gracia. Se ríe del cazador y del paladín cuando discuten, y los dos la odian por eso con la misma fuerza, lo que ella considera su mayor obra. Cuando se lo dije, me respondió que lo estaba copiando mal.</p>' +
    '<h3>Lady Mirela, que nunca rompió una ley</h3>' +
    '<p>Del lado de los Deshilados, la voz que habla por los caminos es la de <b>Lady Mirela</b>, heredera de la Casa Noctavar. Educada como una hoja. Juró las tres leyes de la Casa a los quince años y nunca rompió ninguna, lo que, entre vampiros de mil años, es más raro de lo que parece. Considera al hombre lobo un animal y lo dice con una cortesía perfecta, que el hombre lobo toma como insulto, con razón. Recibe a los que llegan a Askavik desde el otro lado de la calle, con una sola pregunta: «¿Ya has muerto? Morirás. Y volverás. Y volverás a morir. Llámalo protección, si quieres.»</p>' });
  add({ lv: 'XXV', body:
    '<h3>Varg Diente Partido, que no deja a nadie</h3>' +
    '<p><b>Varg Diente Partido</b> es el segundo de Ulfrun y, si Ulfrun no está escuchando, el enano de la manada. Perdió un cachorro de su camada por la plata del Clan Helsing y se partió su propio diente mordiendo la jaula en que se lo llevaban. No la soltó. Desde entonces no deja a nadie atrás, ni al enemigo caído, ni al plato. Odia al vampiro con el odio de la primera luna, pero se sienta a la misma mesa cuando la Madre Alfa lo manda, come en silencio unos treinta segundos y después le pregunta a Vasko si el vino es de uva o de gente. Vasko nunca responde. Varg cree que eso es una respuesta.</p>' +
    '<h3>Ravena Cinco Cláusulas, que lee la letra pequeña</h3>' +
    '<p>La bruja más joven de Gorvath solo firma pactos de cinco cláusulas. «Lo demás es vanidad.» <b>Ravena Cinco Cláusulas</b> lee la letra pequeña mejor que el propio Malgrath, y él lo sabe, y por eso la usa para escribir lo que los otros firman. Cree que el vampiro y el lobo son dos niños peleando en el patio, y ya se lo dijo a los dos, por escrito, en cinco cláusulas. Fue ella quien redactó la tregua entre la Casa y la Manada, y fue ella quien les cobró a los dos cuando la rompieron, la misma noche, con intereses que ella llama «pedagógicos».</p>' +
    '<h3>Brynhild Hoja Callada, que volvió de la locura</h3>' +
    '<p>En el Clan del Cuervo hay una campeona que habla poco y solo de lo que vio. <b>Brynhild Hoja Callada</b> es hermana de Halfdan, el desertor de Fjallbrún, y lo lleva sin esconderlo y sin explicarlo. Atravesó la locura de la batalla una vez y volvió, cosa que casi nadie hace, y por eso es ella quien enseña a los nuevos la postura que defiende y la que cura: «quien no sabe parar no sabe golpear». Sobre los cuervos de Odín, dice que ya estuvo debajo de los dos y que debajo de ninguno se duerme bien. Cuando le preguntaron en Askavik de qué lado debía quedarse el Clan, respondió que el Hilo y los Deshilados tenían razón y se equivocaban al mismo tiempo, y salió de la sala antes de que alguien le pidiera que lo explicara.</p>' });
  add({ lv: 'XXV', body:
    '<h3>Anselm Rotha, que mide</h3>' +
    '<p>El <b>Doctor Anselm Rotha</b>, de la Hermandad del Vapor, quiere medir el Laberinto. No guardarlo, no derribarlo: medirlo. Lleva un índice de latón que marca «cuánto falta», y nunca le ha dicho a nadie cuánto falta para qué. Considera las dos banderas dos supersticiones caras, y la Compañía la única verdad: quien no vende, no enciende. Es él quien entrega a los aprendices de la Academia su primer ayudante volador, el escudo de panal y el brazalete, y les cobra a todos un informe que nadie lee. Entierra una leyenda al día y, dicen en la Academia, desentierra una por semana, sin contárselo a nadie. Una vez lo vi parado delante de una puerta de piedra negra, tomando notas. Le pregunté qué anotaba. «Que no tiene pomo.» Y siguió.</p>' +
    '<h3>De lo que tienen en común</h3>' +
    '<p>Anduve con los once, nunca con dos a la vez, y al final noté lo que ninguno me dejaría escribir si lo leyera antes: todos llevan la herida de su camino en el cuerpo, y todos creen que la bandera del otro es lo que acabará con Karmika. Todos quieren salvarla. Por eso luchan. No vi un villano en ninguno de los once. Vi once personas que duermen mal, y tres de ellas que se ríen de eso.</p>' +
    '<p class="seal">Cuando te den una misión, caminante, fíjate en quién te la da. Puede ser uno de ellos.</p>' });
  add({"toc": "Libro XXVI — Las maravillas y las Fuentes de la Visión", "lv": "XXVI", "eyebrow": "Libro XXVI", "title": "Las maravillas y las Fuentes de la Visión", "start": true, "body": "<h3>De la moneda en el agua</h3><p>En toda plaza de Karmika hay una fuente, y en toda fuente hay monedas en el fondo. Los viajeros creen que es superstición. No lo es. Quien arroja una moneda a una <b>Fuente de la Visión</b> y se queda quieto ve el lugar entero desde arriba, como lo ven los cuervos y quizá el propio Marghar, y oye la historia del lugar contada por quien la guardó. Muchas veces, lo confieso, quien la guardó fui yo. No sé explicar cómo fue a parar mi voz dentro del agua. Los tecnócratas dicen que es eco. Los sacerdotes dicen que es gracia. Yo digo que es trabajo, porque fui yo quien lo anotó.</p><p>Cada camino tiene su ciudad, y cada ciudad tiene su maravilla. Y dentro de toda maravilla hay una Fuente de la Visión, porque ninguna cabe en los ojos de quien está a sus pies. Para ver lo que hicieron los constructores hay que subir, y la moneda sube por ti.</p><h3>De las maravillas del Hilo</h3><p>La <b>Abadía de la Aurora</b>, en Austrvik, alza el sol y el Ojo sobre un patio donde cabe una ciudad arrodillada. En el Día de la Aurora la luz baja sobre él entero, y los novicios juran que sienten calor en la espalda aun con los ojos cerrados.</p><p>El <b>Pináculo de Marfil</b>, en Lumenhal, es una torre blanca en medio de un lago de islas. De lejos parece un faro; de cerca, una escalera que no acaba. Los magos suben durante años. Los que llegan a la cima no cuentan lo que vieron, y los que no llegan cuentan demasiado.</p><p>El <b>Bastión de Plata</b>, en Sudrholt, no es bonito, y está orgulloso de ello. Foso, muralla, torres y mil doce piedras en el muro, o mil once, según quién las cuente. Mira a la Tierra Maldita como un hombre mira a un perro que todavía no ha ladrado.</p><p>La <b>Fortaleza de Odín</b> corona la Montaña Vikinga, por encima de Jarlsheim. La subida es recta, la nieve no perdona y el hidromiel no se acaba. Thorgrim recibe allí a quien quiere jurar, y quien baja jurado baja distinto: anda más despacio y mira más lejos.</p>"});
  add({"lv": "XXVI", "body": "<h3>De las maravillas de los Deshilados</h3><p>El <b>Castillo del Conde</b>, en la Colina Vampírica, tiene seis pisos, y solo dos ven el cielo. Abajo, las catacumbas de la Corte y la bodega de las celdas. En la planta baja, la biblioteca, el salón de baile con las lámparas encendidas y la sala del piano que nadie toca de día. Arriba, la galería de los retratos, donde los ojos de los cuadros siguen a quien pasa, y el piso de los dormitorios, decenas, algunos con ataúdes en lugar de camas. Y en lo alto, el salón privado del Conde, con el trono dentro de una piscina de sangre. Es allí, dicen, donde se deja de ser humano.</p><p>El <b>Árbol Madre</b>, en el Aullido Antiguo, es un inmenso árbol madriguera, caído en medio de la selva. El tronco es la casa de la Madre Alfa, y el hueco es un salón entero de raíces y de vida. A mitad de camino hay una estatua ante la que todo forastero se detiene: una loba gigante amamantando a niños humanos. Los hombres lobo no explican la estatua. Solo dicen que por eso la manada no abandona a nadie.</p><p>La <b>Torre del Brujo</b>, en el Valle de la Desgracia, en Gorvath, es alta, pero lo que impresiona es lo que tiene debajo. La torre abre en el suelo un pozo que baja hasta donde alcanza la vista, y los puentes que unen el camino al pilar dejan ver el fondo: lava, gente trabajando y, allá abajo, cerca de los demonios, los rituales que Malgrath no deja anotar a nadie. Lo intenté. La tinta hirvió.</p>"});
  add({"lv": "XXVI", "body": "<h3>De las maravillas de los que no juran</h3><p><b>Puerto Caldera</b>, la ciudad de la grasa, tiene grúas que trabajan solas, sacando carga de los cargueros a vapor y devolviéndola al muelle. La Academia de la Grasa está coronada por dos bobinas inmensas que encienden la ciudad entera por el aire, y entre los pisos de la academia suben jardines colgantes, porque los tecnócratas aprendieron tarde, pero aprendieron, que una máquina sin plantas se oxida por dentro. En la isla mar adentro, el <b>Faro Tecnocrático</b> gira un haz rojo sobre los vapores, y la Farera Dinorá cuenta quién llega y quién no vuelve.</p><p>Las <b>Puertas de Forjabrasa</b> son una puerta de hierro fundido excavada en la Montaña Negra. Se sube la escalinata hasta tocar el hierro, y el portón entra en la roca. Dentro está el Gran Salón, con el trono a los pies de la Forja Madre, que recibe lava de las vetas de la montaña por conductos que ningún enano vivo sabe quién excavó. En las paredes, diamantes y esmeraldas. Y al fondo, entre dos enanos colosales esculpidos con las hachas alzadas el uno hacia el otro, el <b>Corazón de la Montaña Negra</b>: una piedra azul, inmensa, que a veces enrojece. Los enanos dicen que enrojece cuando alguien miente en el salón. Me quedé callado todo el tiempo.</p><p><b>Gaia, el Árbol Santo</b>, en Lithendel, es la Madre Tierra hecha árbol, y la ciudad de los elfos vive en sus ramas. Se sube en un teleférico de lianas hasta un piso donde se camina literalmente sobre el árbol y se ve Karmika desde arriba. El Árbol Madre de los hombres lobo también fue, un día, un árbol en pie. A los elfos no les gusta que se lo recuerden.</p><p class=\"seal\">Cuando estés ante una de ellas, caminante, arroja la moneda. La maravilla no se hizo para verse desde abajo.</p>"});
  add({"toc": "Libro XXVII — El Andariego de Auréon", "lv": "XXVII", "eyebrow": "Libro XXVII", "title": "El Andariego de Auréon", "start": true, "body": "<h3>Del paladín que no se queda en casa</h3><p>Quien piensa en un paladín piensa en la Abadía, y la Abadía es la madre. Pero el Gran Maestre Cassius tiene una regla que a muchos novicios les extraña: el paladín recién jurado no se queda en Austrvik. Sale. <b>El paladín es ante todo un andariego del bien</b>, y la luz que no anda se vuelve vela de altar, bonita e inútil.</p><p>En diez aldeas de las Tierras de los Hombres hay capillas de Auréon en pie, enteras, con un clérigo en la puerta: Grenivik, Vestheim, Vatnaholt, Skógar, Myrbakki, Brekkuvik, Vindholt, Dalborg, Steinfoss y Lundr. Cada aldea tiene su mal, y ningún mal es igual a otro. El Andariego llega, escucha al clérigo, enfrenta lo que ronda la aldea y decide qué hacer con lo que queda. Cada clérigo lo manda a la capilla siguiente, y el último lo manda de vuelta a casa.</p><h3>De la nota de más</h3><p>Los clérigos de las diez capillas no se conocen todos, pero cuentan lo mismo, cada uno creyendo que es el único: la campana de la capilla sonó, una noche cualquiera, <b>una nota de más</b>, una que nadie había afinado. En Steinfoss me mostraron una runa rayada en el bronce, por dentro de la campana, donde ninguna mano alcanza. La copié. No es ninguna de las seis.</p><p>Cuando el Andariego vuelve a la Abadía, Cassius lo recibe de pie y le da el nombre de <b>Andariego de Auréon</b>. Le pregunté al Gran Maestre por la nota. Respondió que la luz también tiene preguntas, y cambió de tema.</p>"});
  add({"toc": "Libro XXVIII — La Campana en la Muñeca", "lv": "XXVIII", "eyebrow": "Libro XXVIII", "title": "La Campana en la Muñeca", "start": true, "body": "<h3>De la plata, que es deuda</h3><p>En el Bastión de Plata la Maestra Ilsa Van Rhal entrega la primera hoja de plata con una frase que todo Helsing sabe de memoria: <b>la plata no es regalo, es deuda</b>. Quien la recibe pasa a deber cada noche que duerma tranquilo a alguien que se quedó despierto en el muro.</p><p>Quien lleva a los nuevos al muro es la <b>Cazadora Vesna Helsing</b>, ácida y graciosa de esa manera de quien no duerme desde hace años. Les enseña las tres horas de la noche, la hora de la campana, la hora del perro y la hora en que nadie debería estar despierto, y cuenta las piedras del muro en voz alta cada vigilia, para no dormirse. Dice que son mil doce. La Maestra dice mil once. Las dos cuentan cada noche, y ninguna cede.</p><h3>Del huérfano de Sudrholt</h3><p>En Sudrholt hay un niño llamado <b>Pip</b>, que perdió a su familia por una bestia de la Tierra Maldita y no consigue dormir sin oír una campana. Los Helsing no adoptan niños; dicen que la plata no es lugar para ellos. Pero a todo cazador nuevo lo mandan a hablar con Pip, y lo que le dice al niño, la verdad, la espera o la mentira, el Ojo lo anota antes que cualquier bestia. Más tarde, con Polvo del Sueño comprado a una bruja de Gorvath, a regañadientes, y una Campana de Guardia comprada a la Compañía, los cazadores inventaron para él el <b>Sueño Vigilado</b>. Fue lo más bonito que he visto hacer a un cazador.</p>"});
  add({"lv": "XXVIII", "body": "<h3>De la runa dentro del hueso</h3><p>En el salón del Bastión cuelga una calavera de bestia, la de Van Rhal, la primera cacería de la familia. Quien mira con el Instinto ve lo que los ojos no ven: <b>la sexta runa rayada por dentro del hueso</b>. No en la superficie: por dentro, donde ningún cuchillo entra. Después de eso los Helsing empezaron a abrir las calaveras de las bestias que mataban. Todas tienen la runa. Yo ya había estado allí, años antes, y lo anoté sin entender. Por lo menos lo anoté.</p><h3>De la aldea que ya no existe</h3><p>Hay una aldea en el mapa viejo llamada Lysmark que no está en el mapa nuevo. Quien va hasta donde estaba y usa el Instinto encuentra el espíritu de una niña con una vela en la mano. Le dice una sola cosa a quien llega: <b>tu vela fue la última en apagarse</b>. Nadie sabe a quién le habla.</p><h3>Del juramento de Aravel</h3><p>El cazador termina su primer año en las Ruinas de Aravel, donde Aravel, la Vigilia Verde, tuvo su primer altar. Allí dice, junto a Vesna, la frase que da nombre al juramento:</p><blockquote>No duermo mientras alguien pequeño esté despierto en la oscuridad.</blockquote><p>Después de eso el cazador lleva una campanilla en la muñeca. No suena para llamar a nadie. Suena para recordar.</p>"});
  add({"toc": "Libro XXIX — El Juramento", "lv": "XXIX", "eyebrow": "Libro XXIX", "title": "El Juramento", "start": true, "body": "<h3>De la Tejeduría de Askavik</h3><p>Hay un día en que cada camino jura su bandera, y todos juran en el mismo lugar: la <b>Tejeduría</b> de Askavik, donde se tejen los mantos de las dos facciones. Cada uno jura a su manera. El paladín se arrodilla. El hombre lobo aúlla. El vampiro firma con sangre y se queja del papel. El brujo lee el contrato entero en voz alta, dos veces, y corrige una coma. El mago pregunta si puede tomar notas. Y el guerrero del Norte, que por la tradición del Cuervo no jura ninguna bandera, es quien <b>arbitra</b>: se queda de pie en medio del salón y dice si el juramento valió.</p><h3>De la Tregua de la Luna</h3><p>Los Deshilados tienen una tregua más vieja que las banderas: la <b>Tregua de la Luna</b>. En la noche sin luna, lobo y vampiro no se cazan, y el brujo escribe lo que se dijo para que nadie diga después que dijo otra cosa. Los lobos detestan al brujo por eso. Los vampiros detestan a los lobos. Y la tregua se mantiene desde hace siglos, lo que dice mucho del odio y poco de la paz.</p><h3>Del lugar donde mi bando se equivoca</h3><p>Todo juramento honesto tiene una pregunta que los maestros no hacen en voz alta: ¿dónde se equivoca mi bando? El Hilo encuentra la respuesta en <b>Grenivik</b>, donde un capitán de la Orden empezó a cobrar protección a quienes debía proteger. Los Deshilados encuentran la respuesta en <b>Lundr</b>, donde la libertad de uno se volvió la prisión de otro. Los dos bandos vuelven de allí más callados.</p>"});
  add({"lv": "XXIX", "body": "<h3>De la podredumbre de Grenivik</h3><p>Fue en ese tiempo cuando la podredumbre empezó a bajar por el río desde Grenivik. Cada camino la leyó a su manera. El paladín rezó y sintió frío. El hombre lobo olfateó y no reconoció el olor, cosa que nunca le había pasado. El vampiro torció la nariz y dijo que aquella sangre era vieja antes de nacer. El brujo leyó, y lo que leyó fue una letra: una letra antigua, anterior a Malgrath, escrita donde no había papel.</p><p>Todos creyeron que era Zerath, el príncipe de la podredumbre. Tenía sentido, y lo que tiene demasiado sentido debería asustarnos.</p><h3>De la puerta</h3><p>Al final del juramento, en todos los caminos, alguien habla de una puerta. Una puerta de piedra negra, sin pomo, con el Ojo esculpido de párpados bajos. Ya conté que hay tres: en el Cementerio Olvidado, en Forjabrasa y en la Biblioteca de Askavik. Ahora sé que hay una cuarta. Hablaré de ella más adelante, en el libro del puente.</p>"});
  add({"toc": "Libro XXX — La Mesa Partida", "lv": "XXX", "eyebrow": "Libro XXX", "title": "La Mesa Partida", "start": true, "body": "<h3>De la guerra que nadie declara</h3><p>Después de los juramentos llegó el tiempo que los viejos llaman la <b>Guerra Fría</b>. Nadie declaró nada. El paladín escoltaba caravanas hasta el Valle y volvía contando cuerpos que no eran de nadie. El vampiro aprendió a comprar relojes, porque la Corte decidió que quien vive de noche necesita saber la hora exacta del sol. El cazador abrió jaulas de plata y encontró en ellas cosas que él mismo había encerrado. Cada bando le hacía al otro lo que acusaba al otro de hacer.</p><h3>De la mesa de Askavik</h3><p>Para que la guerra no se volviera guerra, los maestros de las dos banderas se sentaron a la misma mesa, en el salón del consejo de Askavik. Es la <b>Mesa Partida</b>, y el nombre es antiguo: una mesa de piedra rajada por la mitad, un lado para cada bandera. Los humanos votan, el mago escribe el acta, el elfo media, el enano trae la mesa de hierro que no se raja y Varg, en una de las sesiones, rajó la mesa de hierro de un manotazo.</p><p>El bando que gana la Mesa iza su bandera en la plaza de Askavik durante una semana entera. Parece poco. No lo es. Una semana de bandera en la plaza cambia el precio del pan, el humor de los guardias y quién consigue dormir en la posada.</p>"});
  add({"lv": "XXX", "body": "<h3>De la silla de más</h3><p>En la primera sesión de la Mesa había una silla de más. Nadie la había puesto. Sobre ella, doblada con cuidado, una <b>capa gris</b>. Al final de la sesión la capa ya no estaba, y nadie la vio salir.</p><p>Después de eso fui tras la capa, y todos los caminos la habían visto sin saberlo. Era quien compraba los relojes de los vampiros. Era quien vendía velas a la Abadía. Era quien pagaba al escaldo para cantar la canción equivocada. Era el hombre sin olor al que los lobos no lograban seguir. Era quien firmaba las cajas de la Hermandad. Era quien escribía con aquella letra anterior a Malgrath. Era quien llevaba comida al nido de las bestias. Era quien había estudiado el camino del peaje, y quien encargó a los enanos una campana con el Ojo esculpido de ojos cerrados.</p><p>Nadie recuerda el rostro. Todos recuerdan la capa.</p>"});
  add({"toc": "Libro XXXI — Velmora, el puente de los llantos", "lv": "XXXI", "eyebrow": "Libro XXXI", "title": "Velmora, el puente de los llantos", "start": true, "body": "<h3>De la aldea que los mapas se saltan</h3><p>En el <b>Canal Oscuro</b>, en la frontera entre Hrafnhöfn, que es del Hilo, y Cuervoscuro, que es de los Deshilados, hay una aldea de pescadores que los cartógrafos olvidan dibujar. Se llama <b>Velmora</b>. Tiene dos orillas y un solo nombre. La Orilla de la Aurora, al oeste, de casas claras, plaza y muelle. La Orilla de la Noche, al este, de tejados negros y faroles rojos que el Conde ve desde el castillo. No tiene capilla. Los vecinos dicen que nunca la necesitaron, y bajan los ojos al decirlo.</p><p>Allí viven la Guardiana del Puente, Edla; el pescador Tóki; la vieja Rúna de las Redes, que remienda lo que ya nadie remienda; la mercadera Hekla, que vende a las dos orillas al mismo precio; y el farolero Orri, que enciende los faroles de la Orilla de la Noche y dice que se apagan solos cuando alguien miente en el puente.</p><h3>Del puente</h3><p>El <b>Puente de Velmora</b> es un arco ancho de piedra sujeta con grapas enanas, de antes del Rey Thrain, sin la marca de ningún clan. En la piedra del medio hay una inscripción: <i>aquí se pasa</i>. Lo último fue raspado. Los más viejos dicen que la frase entera era <i>aquí se pasa, y aquí se queda</i>.</p>"});
  add({"lv": "XXXI", "body": "<h3>Del barquero</h3><p>Debajo del puente trabaja <b>Táraka el Barquero</b>. Su nombre, en una lengua más vieja que la nuestra, quiere decir el que hace cruzar, el que libra, y también la niña del ojo. El farol de su barca está siempre apagado. Lleva a los muertos al lugar desde donde se vuelve humano, y no cobra. Le pregunté quién había pasado antes que yo. Me lo dijo, y era alguien de otro camino. A todo viajero le dijo lo mismo: alguien de otro camino pasó antes.</p><h3>De la cuarta puerta</h3><p>El puente tiene tres pilares. El del medio fue construido <b>alrededor</b> de algo. Cuando el pilar se rajó, el año en que la podredumbre bajó por el río y las aldeas huyeron a Velmora, apareció dentro una puerta de piedra negra, sin pomo, con el Ojo de párpados bajos. Es más vieja que el puente. Es más vieja, creo, que Velmora.</p><p>Alguien cerró el puente con una cadena aquel año y empezó a cobrar peaje a quien huía. A los cobradores les pagaban en moneda vieja, alguien sin rostro. El Hilo escoltó a los fugitivos. Los Deshilados rompieron la cadena. El Cuervo sostuvo el medio del puente. Y yo me quedé mirando la puerta, y la puerta, lo juro, me devolvió la mirada.</p><p class=\"seal\">Velmora es el único lugar al que todos los caminos tienen que ir. Ve. Y no leas la inscripción en voz alta.</p>"});
  add({"toc": "Libro XXXII — De los gremios y las provincias", "lv": "XXXII", "eyebrow": "Libro XXXII", "title": "De los gremios y las provincias", "start": true, "body": "<h3>Del Libro de Gremios</h3><p>En Lumenhal está el Ayuntamiento, un palacio de columnas con la torre del reloj y la campana que marca las horas de la ciudad. Dentro, en el salón de audiencias, el <b>Alcalde Corvin Aldmar</b> guarda el <b>Libro de Gremios</b> sobre un atril, y es en él donde todo gremio de Karmika existe o deja de existir. Una copia queda conmigo, en la Gran Biblioteca, porque el Alcalde confía más en la tinta que en la memoria, y yo también.</p><p>Fundar un gremio pide poco y cuesta mucho: tres fundadores experimentados, que ya anduvieron lo bastante para pesar algo, y una <b>Lágrima de Marghar</b> sobre la mesa. Los tres firman. El nombre ya no cambia nunca. La bandera y el símbolo pueden cambiar; el nombre no, porque el Libro no borra.</p><h3>De la gloria</h3><p>El gremio crece en <b>gloria</b>, y la gloria viene de tres fuentes: una parte de lo que cada miembro aprende por el camino, las misiones que el gremio cumple junto, y lo que los miembros donan al cofre. Un gremio glorioso es más fuerte en todo: los suyos tienen más vida, más daño, más armadura, se recuperan más rápido. Los antiguos lo llaman estandarte firme. Yo lo llamo gente que no anda sola.</p>"});
  add({"lv": "XXXII", "body": "<h3>De la Casa del Gremio</h3><p>Cuando el gremio llega al cuarto grado, levanta su <b>Casa</b>. No es un cuartel: es una casa de oficio y de comercio. Tiene salas para cada profesión, la sala de armas y los objetos del gremio, que los propios miembros venden, alquilan y se prestan unos a otros. Nadie de fuera administra la Casa. Es de los jugadores, y ellos la gobiernan.</p><h3>Del castillo y la provincia</h3><p>En el quinto grado, el gremio se convierte en <b>castillo</b>, y el castillo gana una aldea. Cada miembro recibe un trozo de tierra para construir su casa, y la ciudad es <b>defendida y mantenida por el propio gremio</b>, con sus propias manos, cuando llega el asedio. La tierra de alrededor pasa a ser provincia del gremio.</p><p>Quien es de fuera puede comprar tierra en la provincia y vivir allí. Paga impuesto, y el impuesto no es castigo: es el precio de la protección de los muros. Quien nunca vio una provincia sitiada cree que el impuesto es caro. Quien lo vio, paga sin quejarse.</p><p class=\"seal\">Un gremio no es un chat con bandera. Es una ciudad que todavía no terminó de construirse.</p>"});
  add({"toc": "Libro XXXIII — De las tabernas y las carretas", "lv": "XXXIII", "eyebrow": "Libro XXXIII", "title": "De las tabernas y las carretas", "start": true, "body": "<h3>Del Yunque Mojado</h3><p>Un cronista que no conoce las tabernas no conoce el mundo, porque es en ellas donde el mundo cuenta lo que no les cuenta a los cronistas. La mejor de todas es el <b>Yunque Mojado</b>, de los enanos. Es un salón de piedra con barra de barriles de cerveza y una pared entera de botellas, un foso de fuego con jabalí al espetón, mesas largas con bancos y un escenario donde el bardo canta hasta que alguien le tira una jarra. Detrás de la barra, <b>Hildigunn</b> sirve la cerveza negra. En el foso, <b>Fróði</b> gira el jabalí. En la cocina, <b>Sif</b> hace el guiso que cura la resaca y las penas, en ese orden.</p><p>Hay una mesa redonda en el rincón que se reserva por una hora, a veinte monedas, para quien quiere hablar sin que lo oigan. La reservé una vez. Oí todo lo de la mesa de al lado.</p><h3>De la fiesta del enano</h3><p>Las <b>carretas de los enanos</b> recorren todos los caminos cargadas de cerveza y asado. Quien paga, tiene fiesta: la carreta se vuelve carpa, el asado va al suelo, los barriles se abren, suena la música y los vecinos bailan con ellos. Al rato todo el mundo se va desplomando y duerme donde cayó. Por la mañana el enano ya se fue, y dejó una carta en el suelo. Guardo la mía: <i>¡Qué jolgorio! Espero que les hayan gustado mis servicios. Siempre ando por aquí animando las cosas.</i></p>"});
  add({"lv": "XXXIII", "body": "<h3>De la Caravana de Latón</h3><p>La <b>Compañía de Caravanas de Latón</b> es de los tecnócratas, y vende lo que fabrica la Academia: hojas que vibran, hojas electrificadas, armas de fuego, torretas que se rompen tras unos pocos usos y pequeños robots que ayudan a levantar casas. Toda carreta de Karmika paga a la Compañía una tasa por protección. Cuando asaltan una, la Compañía manda una <b>alerta</b> a todo el mundo. Quien esté cerca elige si va. Quien va y la defiende recibe la recompensa que pagan los propios mercaderes. A quien no va, nadie le cobra. El Ojo, sí.</p><h3>Del mercado que es de los caminantes</h3><p>Casi todo lo que circula en Karmika lo recolectó, fabricó, transportó o construyó alguien. Leñador y carpintero, minero y herrero, desollador y costurero, herbolario y alquimista, pescador y cocinero. Quien no sabe hacerlo le compra a quien sabe. Hasta las casas se venden: la Notaría entrega la escritura, y la escritura va a subasta como cualquier espada.</p>"});
  add({"toc": "Libro XXXIV — Los caminos que aún duermen", "lv": "XXXIV", "eyebrow": "Libro XXXIV", "title": "Los caminos que aún duermen", "start": true, "body": "<p>Conté ocho caminos, y ocho son los que se abren hoy. Pero la Vidente de los Caminos, cuando bebe vino, cuenta que vio más caminos en el agua de su recipiente. Caminos que aún duermen, esperando a quien los despierte. Anoto lo que oí, sin prometer que lo sé.</p><h3>El Círculo de las Piedras</h3><p>En el corazón del <b>Bosque Encantado</b>, donde las copas brillan de noche, hay un círculo de piedras que nadie levantó. Allí, cuentan, algunos van a escuchar lo que los árboles dicen despacio, y vuelven sabiendo cambiar de forma, llamar raíces y espinas y curar con lo que nace del suelo. Los elfos los llaman <b>druidas</b>. Dicen que el bosque no tiene dueño, tiene guardián.</p><h3>El Gremio Sin Rostro</h3><p>En los callejones de Askavik hay un gremio que no tiene sede, solo contratos. Nadie ve a sus miembros; todo el mundo los siente. Los que lo conocen lo llaman <b>Gremio Sin Rostro</b>, y a los suyos, <b>asesinos</b>. Cada contrato pesa en el karma de quien paga y de quien cumple. He oído que rechazó un contrato una sola vez. El contratante llevaba una capa gris.</p><h3>Los que levantan lo que cayó</h3><p>Donde todos ven el fin, hay quien ve materia prima. En la <b>Cripta de Hemara</b>, al borde de la Tierra Maldita, se habla de gente que levanta huesos y ata almas por un hilo. Son los <b>nigromantes</b>, y toda la Orden del Hilo los persigue, porque atar un alma es lo contrario de guardarla.</p><p class=\"seal\">Cuando esos caminos despierten, yo estaré allí para anotarlo. Si despiertan antes que yo, que alguien lo anote por mí.</p>"});
  add({"toc": "Epílogo", "lv": "", "eyebrow": "Epílogo", "title": "Lo que aún está por escribir", "start": true, "body": "<p>Aquí termina lo que sé de esta temporada. El camino sigue, y quien lo recorra escribirá los capítulos que faltan. Si llegaste hasta aquí, llévate el consejo que el historiador da a todo viajero: mira lo que estás sembrando.</p><p>Esta es la <b>Season I</b> de las crónicas. Lo que los caminantes hagan en ella, las guerras, las lágrimas, las ciudades levantadas y las que caigan, entra en el próximo volumen. La Biblia Karmika está viva: el juego sucede en el libro, y el libro cuenta el juego.</p><p class=\"seal\">Ormund Salveth, Cronista de la Gran Biblioteca</p>"});
