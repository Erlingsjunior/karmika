<!doctype html><html lang="es"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Biblia Karmika · Season I</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: um livro de uma página por vez, com moldura gravada, virada de página e sumário clicável */
:root {
  --bg: #08060d;
  --bg-2: #120c1c;
  --page: #15101e;
  --page-2: #1b1427;
  --ink: #eadfca;
  --muted: #a89a84;
  --gold: #d9a24f;
  --gold-lo: #7d5a2c;
  --violet: #8f7bff;
  --blood: #b3202f;
  --font-display: "Cinzel Decorative", "Cinzel", Georgia, serif;
  --font-label: "Cinzel", Georgia, serif;
  --font-body: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 40%, rgba(8,6,13,0) 30%, rgba(8,6,13,0.85) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='80' viewBox='0 0 120 80' fill='none' stroke='%23d9a24f' stroke-width='1.3' stroke-linejoin='bevel' opacity='0.16'><g id='e'><path d='M24 10 L14 20 L24 30 M14 10 V30 M36 10 L46 20 L36 30 M46 10 V30'/><path d='M30 16 L34 20 L30 24 L26 20Z' fill='%23d9a24f'/></g><use href='%23e' x='60' y='40'/></svg>");
  background-size: cover, 120px 80px;
  color: var(--ink);
  font-family: var(--font-body);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
.app { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
:root { --bw: min(100%, calc((100vh - 92px) * .8)); }
@supports (height: 100dvh) { :root { --bw: min(100%, calc((100dvh - 92px) * .8)); } }
.book { position: relative; flex: 1 1 auto; min-height: 0; width: var(--bw); container-type: inline-size; }
.stage { position: absolute; inset: 0; perspective: 2200px; }
.leaf {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, var(--page-2), var(--page) 55%);
  border: 1px solid var(--gold-lo);
  border-radius: 4px 10px 10px 4px;
  box-shadow: 0 18px 50px rgba(0,0,0,.65), inset 0 0 60px rgba(0,0,0,.45), -6px 0 0 -2px #0d0915, -10px 0 0 -4px #0a0710;
  transform-origin: left center;
  backface-visibility: hidden;
  overflow: hidden;
}
.leaf::before { /* moldura interna dupla */
  content: ""; position: absolute; inset: 8px; border: 1px solid var(--gold); opacity: .55; border-radius: 2px; pointer-events: none;
}
.leaf::after {
  content: ""; position: absolute; inset: 13px; border: 1px dotted var(--gold-lo); pointer-events: none;
}
.side {
  position: absolute; top: 34px; bottom: 46px; width: 28px; z-index: 1;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='96' viewBox='0 0 28 96' fill='none' stroke='%23d9a24f' stroke-width='1.4' stroke-linejoin='round'><path d='M4 14 L14 7 L24 14 L14 21 Z'/><path d='M14 11 L17 14 L14 17 L11 14Z' fill='%23d9a24f'/><path d='M8 36 H20 L14 48 L20 60 H8 L14 48 Z'/><path d='M14 72 C18 78 19 83 14 86 C9 83 10 78 14 72Z'/></svg>") center top / 28px 96px repeat-y;
  opacity: .7; pointer-events: none;
}
.side.l { left: 16px; } .side.r { right: 16px; }
.base {
  position: absolute; left: 50px; right: 50px; bottom: 16px; height: 28px; z-index: 1;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='28' viewBox='0 0 96 28' fill='none' stroke='%23d9a24f' stroke-width='1.4' stroke-linejoin='round'><path d='M4 14 L14 7 L24 14 L14 21 Z'/><path d='M14 11 L17 14 L14 17 L11 14Z' fill='%23d9a24f'/><path d='M42 6 H54 L48 14 L54 22 H42 L48 14Z'/><path d='M82 6 C86 11 87 16 82 20 C77 16 78 11 82 6Z'/></svg>") left center / 96px 28px repeat-x;
  opacity: .55; pointer-events: none;
}
.corner { position: absolute; width: 38px; height: 38px; z-index: 2; pointer-events: none;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='38' height='38' viewBox='0 0 38 38' fill='none' stroke='%23d9a24f' stroke-width='1.6'><path d='M3 36 V12 Q3 3 12 3 H36'/><path d='M9 9 L14 14 L9 19 L4 14Z' fill='%23d9a24f' stroke='none'/></svg>") no-repeat; }
.corner.tl { top: 5px; left: 5px; }
.corner.tr { top: 5px; right: 5px; transform: scaleX(-1); }
.corner.bl { bottom: 5px; left: 5px; transform: scaleY(-1); }
.corner.br { bottom: 5px; right: 5px; transform: scale(-1,-1); }
.inner {
  position: absolute; inset: 78px 52px 56px 52px; overflow-y: auto; z-index: 3; display: flex; flex-direction: column;
  font-size: clamp(1.05rem, 2.9cqi, 1.5rem); line-height: 1.46; padding: 4px 6px 4px 2px;
  scrollbar-width: thin; scrollbar-color: var(--gold-lo) transparent;
}
.inner > :first-child, .inner > div > :first-child { margin-top: 0; }
.inner p { margin: 0 0 .8em; text-wrap: pretty; hyphens: auto; }
.inner b, .inner strong { color: #f3e2bd; font-weight: 600; }
.inner em { color: #d8c8a6; }
.eyebrow { text-indent: .32em; font-family: var(--font-label); font-size: .63em; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); margin: 0 0 .4em; text-align: center; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.45em; line-height: 1.15; text-align: center; margin: 0 0 .2em; color: #f6e4bb; text-wrap: balance; text-shadow: 0 0 18px rgba(217,162,79,.25); }
h3 { clear: both; text-indent: .16em; font-family: var(--font-label); font-weight: 600; font-size: .84em; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 1.2em 0 .6em; text-align: center; text-wrap: balance; }
h3.subtitle { clear: none; margin: .2em 0 0; font-size: .87em; text-shadow: 0 0 14px rgba(217,162,79,.35); }
h3.subtitle + .rule { margin-bottom: 1.6em; }
.rule { display: block; margin: .5em auto 1.1em; width: 70%; height: 14px; }
.initial {
  float: left; width: 1.55em; height: 1.55em; margin: .1em .45em .04em 0; font-size: 2.9em; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; text-indent: 0; hyphens: none;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23f6dc8e'/><stop offset='.5' stop-color='%23d9a24f'/><stop offset='1' stop-color='%238a5a1f'/></linearGradient><g id='c' fill='none' stroke='url(%23g)' stroke-width='1.6' stroke-linecap='round'><path d='M13 36 C11 21 19 13 31 13 C38 13 39 20 34 22 C30 23 28 19 31 17'/><path d='M13 26 C17 26 20 29 20 33'/><path d='M22 13 C26 17 26 21 23 24'/><circle cx='31' cy='17' r='1.8' fill='%23c4342f' stroke='none'/></g></defs><rect width='100' height='100' fill='%23290c2c'/><path d='M0 0 L100 100 M100 0 L0 100 M50 0 L100 50 L50 100 L0 50Z' stroke='%23d9a24f' stroke-opacity='.16' fill='none'/><rect x='4' y='4' width='92' height='92' fill='none' stroke='url(%23g)' stroke-width='3'/><rect x='9' y='9' width='82' height='82' fill='none' stroke='url(%23g)' stroke-width='1'/><use href='%23c'/><use href='%23c' transform='translate(100 0) scale(-1 1)'/><use href='%23c' transform='translate(0 100) scale(1 -1)'/><use href='%23c' transform='translate(100 100) scale(-1 -1)'/><path d='M50 5 L55 10 L50 15 L45 10Z M50 85 L55 90 L50 95 L45 90Z M5 50 L10 45 L15 50 L10 55Z M85 50 L90 45 L95 50 L90 55Z' fill='url(%23g)'/></svg>") center / 100% 100% no-repeat;
  box-shadow: 0 0 18px rgba(217,162,79,.28), 0 2px 8px rgba(0,0,0,.6); border-radius: 2px;
  background-color: #290c2c;
  color: transparent;
  position: relative;
}
.initial::before {
  content: attr(data-l); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 1.12em; transform: translate(calc(var(--dx, 0) * 1em), calc(var(--dy, 0) * 1em)); background: linear-gradient(180deg, #fff3c6 0%, #e6b459 45%, #9a6422 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 1px 0 rgba(0,0,0,.75)) drop-shadow(0 0 4px rgba(217,162,79,.45));
}
.folio { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; z-index: 4; pointer-events: none; }
.folio span { display: inline-block; background: var(--page); padding: 1px 22px; font-family: var(--font-label); font-size: .78rem; letter-spacing: .24em; color: var(--gold); }
.ribbon {
  position: absolute; top: -2px; right: 52px; z-index: 5; width: clamp(34px, 5.2cqi, 48px); height: clamp(70px, 10.5cqi, 100px); border: 0; padding: 0; cursor: pointer;
  background: linear-gradient(#a3202f, #6e1420); clip-path: polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);
  transition: height .2s;
}
.ribbon:hover, .ribbon:focus-visible { height: clamp(82px, 12.5cqi, 116px); outline: none; }
.ribbon:focus-visible { filter: drop-shadow(0 0 4px var(--gold)); }

/* capa */
.cover .inner { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .4rem; overflow-y: auto; }
.cover .title { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 7vw, 3.1rem); line-height: 1.05; color: #f6e4bb; text-shadow: 0 0 26px rgba(217,162,79,.4); margin: .1em 0 0; }
.cover .sub { font-family: var(--font-label); letter-spacing: .3em; font-size: .78rem; text-transform: uppercase; color: var(--gold); margin: 0; }
.cover .ep { margin: .35em 0 .25em; display: flex; flex-direction: column; align-items: center; gap: .2em; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.05rem, 3.6vw, 1.55rem); letter-spacing: .08em; color: #f3dfae; text-shadow: 0 0 18px rgba(217,162,79,.45); }
.cover .ep span { font-family: var(--font-label); font-size: .5em; letter-spacing: .42em; text-transform: uppercase; color: var(--gold); padding: 0 .2em .1em; border-bottom: 1px solid var(--gold-lo); }
.cover .by { font-style: italic; color: var(--muted); margin: .6em 0 0; font-size: 1.15rem; }
.cover svg.sigil { width: min(78%, 330px); height: auto; filter: drop-shadow(0 0 16px rgba(217,162,79,.35)); }
.open-btn, .nav button, .nav .toc-btn {
  font-family: var(--font-label); letter-spacing: .2em; text-transform: uppercase; font-size: .78rem; cursor: pointer;
  color: var(--ink); background: transparent; border: 1px solid var(--gold-lo); padding: 10px 18px; border-radius: 2px;
}
.open-btn { margin-top: 1rem; border-color: var(--gold); color: #f6e4bb; }
.open-btn:hover, .nav button:hover:not(:disabled) { background: rgba(217,162,79,.14); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* sumário */
.toc { list-style: none; margin: 0; padding: 0; }
.toc li { margin: 0; }
.toc a { display: flex; align-items: baseline; gap: .5rem; padding: .32em 0; color: var(--ink); text-decoration: none; font-size: 1.15rem; cursor: pointer; }
.toc a .dots { flex: 1; border-bottom: 1px dotted var(--gold-lo); transform: translateY(-4px); min-width: 12px; }
.toc a .n { font-family: var(--font-label); font-size: .85rem; color: var(--gold); letter-spacing: .1em; }
.toc a:hover { color: #fff1cf; }
.toc a:hover .dots { border-color: var(--gold); }
.toc .lv { font-family: var(--font-label); font-size: .68rem; letter-spacing: .26em; color: var(--gold); text-transform: uppercase; margin-right: .2rem; }

/* detalhes de conteúdo */
.colors { list-style: none; padding: 0; margin: .6em 0 1em; display: grid; gap: .5em; }
.colors li { display: flex; align-items: center; gap: .8em; }
.sw { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); }
.fig { display: block; margin: .6em auto 1em; width: min(60%, 210px); height: auto; }
blockquote { margin: .8em 0; padding: .2em 0 .2em 1em; border-left: 2px solid var(--gold-lo); font-style: italic; color: #d8c8a6; }
ul.plain { margin: .3em 0 1em; padding-left: 1.15em; }
ul.plain li { margin: 0 0 .45em; }
.seal { text-align: center; font-style: italic; color: var(--muted); margin-top: 1em; }


.inner > div { flex: none; }
.endorn { margin-top: auto; padding-top: 18px; flex: none; text-align: center; }
.endorn svg { width: min(78%, 300px); height: 38px; display: block; margin: 0 auto; }

.toc-row { display: flex; align-items: baseline; gap: .5rem; padding: .3em 0; color: var(--ink); text-decoration: none; font-size: 1.12rem; cursor: pointer; }
.toc-row .lv { font-family: var(--font-label); font-size: .68rem; letter-spacing: .26em; color: var(--gold); text-transform: uppercase; min-width: 2.2em; }
.toc-row .dots { flex: 1; border-bottom: 1px dotted var(--gold-lo); transform: translateY(-4px); min-width: 12px; }
.toc-row .n { font-family: var(--font-label); font-size: .85rem; color: var(--gold); letter-spacing: .1em; }
.toc-row:hover { color: #fff1cf; }
.toc-row:hover .dots { border-color: var(--gold); }
.figwrap { text-align: center; margin: .5em 0 .8em; }
.secmark { margin: 1.6em 0 .2em; }
.secmark .rule { margin: 0 auto; }
.inner > div > .secmark:first-child { display: none; }
.figwrap { --u: min(.95px, .13cqi); margin: .9em 0 1em; }
.figwrap svg { width: auto; max-width: 100%; }
.figwrap svg.hour { height: calc(var(--u) * 410); display: block; margin: 0 auto; }
.figwrap svg.eye { display: block; margin: 0 auto; }
.figwrap svg.eye { height: calc(var(--u) * 160); }
.figwrap svg.eye.tear { height: calc(var(--u) * 255); }
/* manual: etiquetas e tabelas */
.tag { display: inline-block; font-family: var(--font-label); font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; padding: 1px 6px; border: 1px solid; border-radius: 2px; vertical-align: .12em; white-space: nowrap; font-style: normal; }
.tag.d { color: var(--gold); border-color: var(--gold-lo); }
.tag.p { color: #b9acff; border-color: #6a5db5; }
.tag.o { color: #f08a9a; border-color: #8c3a4a; }
.tw { overflow-x: auto; margin: .4em 0 1em; }
table { border-collapse: collapse; width: 100%; font-size: .98rem; line-height: 1.3; }
th { font-family: var(--font-label); font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); text-align: left; font-weight: 400; padding: 4px 8px 6px 0; border-bottom: 1px solid var(--gold-lo); }
td { padding: 6px 8px 6px 0; border-bottom: 1px dotted rgba(125,90,44,.6); vertical-align: top; }
.part-note { text-align: center; font-style: italic; color: var(--muted); }
.legend { display: grid; gap: .5em; margin: 1em 0; }
.legend div { display: flex; gap: .7em; align-items: baseline; }
.toc-part { font-family: var(--font-label); font-size: .74rem; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); margin: 1em 0 .2em; text-align: center; }
.toc-link { display: block; text-align: center; margin-top: 1.2em; color: var(--gold); font-family: var(--font-label); font-size: .78rem; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; text-decoration: none; }

/* barra de navegação */
.nav { flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; width: var(--bw); }
.nav .count { font-family: var(--font-label); letter-spacing: .2em; font-size: .8rem; color: var(--muted); min-width: 92px; text-align: center; }
.nav button:disabled { opacity: .35; cursor: default; }

@media (max-width: 520px) {
  .initial { font-size: 2.6em; }
  .inner { inset: 62px 40px 52px 40px; font-size: 1.04rem; line-height: 1.4; }
  .side { width: 22px; } .side.l { left: 14px; } .side.r { right: 14px; }
  .side { background-size: 22px 76px; }
  .base { left: 40px; right: 40px; }
  h2 { font-size: 1.35em; }
  .ribbon { right: 40px; }
  .nav { flex-wrap: nowrap; gap: 6px; }
  .nav button, .open-btn { padding: 9px 9px; letter-spacing: .06em; font-size: .72rem; white-space: nowrap; }
  .nav .count { min-width: 58px; letter-spacing: .08em; font-size: .72rem; }
}


.strap { position: absolute; left: -4px; right: -4px; bottom: 7%; height: 84px; z-index: 8; padding: 0; border: 0; background: none; cursor: pointer; display: block; }
.strap .band { position: absolute; top: 12px; bottom: 12px; width: 50.2%; transition: transform .9s cubic-bezier(.5,0,.3,1);
  background: linear-gradient(180deg, #6a4023 0%, #4a2a17 40%, #34200f 100%);
  box-shadow: inset 0 2px 0 rgba(255,214,150,.18), inset 0 -3px 0 rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.6); }
.strap .band::before, .strap .band::after { content: ""; position: absolute; left: 6px; right: 6px; height: 0; border-top: 2px dashed rgba(236,196,130,.55); }
.strap .band::before { top: 8px; } .strap .band::after { bottom: 8px; }
.strap .band.l { left: 0; border-radius: 0 3px 3px 0; } .strap .band.r { right: 0; border-radius: 3px 0 0 3px; }
.strap .lock { position: absolute; left: 50%; top: 50%; width: 88px; height: 117px; margin: -64px 0 0 -44px; overflow: visible; z-index: 2;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.7)); transition: transform .25s, filter .25s; animation: lockGlow 4.5s ease-in-out infinite; }
.strap:hover .lock, .strap:focus-visible .lock { transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(255,207,122,.9)) drop-shadow(0 4px 6px rgba(0,0,0,.7)); }
.strap .shackle { transform-origin: 62px 56px; transition: transform .5s cubic-bezier(.3,1.4,.5,1); }
@keyframes lockGlow { 0%, 70%, 100% { filter: drop-shadow(0 4px 6px rgba(0,0,0,.7)); } 85% { filter: drop-shadow(0 0 12px rgba(255,207,122,.95)) drop-shadow(0 4px 6px rgba(0,0,0,.7)); } }
.strap.unlock .lock { animation: none; }
.strap.unlock .shackle { transform: translateY(-14px) rotate(-26deg); }
.strap .runes { animation: lockRune 3.2s ease-in-out infinite; filter: drop-shadow(0 0 3px #8f7bff); }
@keyframes lockRune { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.strap.unlock .runes { animation: none; opacity: 1; stroke: #fff1bd; filter: drop-shadow(0 0 5px #ffcf7a); }
.strap.unlock .keyhole { fill: #fff1bd; }
.strap.open .lock { transition: transform .9s cubic-bezier(.5,0,1,.6), opacity .9s; transform: translateY(160px) rotate(35deg); opacity: 0; }
.strap.open .band.l { transform: translateX(-102%); } .strap.open .band.r { transform: translateX(102%); }
.strap:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
.strap.unlock .hint { opacity: 0; transition: opacity .3s; }
.strap .hint { position: absolute; left: 0; right: 0; top: -44px; text-align: center; font-family: var(--font-label); font-size: .64rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); opacity: .8; }
@media (max-width: 520px) { .strap { height: 62px; } .strap .lock { width: 66px; height: 88px; margin: -50px 0 0 -33px; } }
@media (prefers-reduced-motion: reduce) { .strap .lock, .strap .band, .strap .shackle { transition: none; animation: none; } }
@keyframes runeGlow { 0%, 60%, 100% { opacity: .62; filter: none; } 72% { opacity: 1; filter: drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 12px rgba(217,162,79,.85)); } 86% { opacity: .8; filter: drop-shadow(0 0 3px rgba(217,162,79,.5)); } }
@keyframes runeGlowB { 0%, 55%, 100% { opacity: .5; filter: none; } 68% { opacity: .95; filter: drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 12px rgba(217,162,79,.85)); } 82% { opacity: .7; filter: drop-shadow(0 0 3px rgba(217,162,79,.5)); } }
@keyframes runeDrift { 0%, 100% { background-position: 0 0; } 50% { background-position: 0 7px; } }
@keyframes runeDriftB { 0%, 100% { background-position: 0 0; } 50% { background-position: 8px 0; } }
@keyframes leafGlow { 0%, 62%, 100% { border-color: var(--gold-lo); } 74% { border-color: var(--gold); } }
.side { animation: runeGlow 11s ease-in-out infinite, runeDrift 7s ease-in-out infinite; }
.side.r { animation-delay: 3.6s, -2.5s; }
.base { animation: runeGlowB 13s ease-in-out infinite 1.8s, runeDriftB 9s ease-in-out infinite; }
.leaf { animation: leafGlow 11s ease-in-out infinite; }

    '<p>Me llamo <b>Ormund Salveth</b>, y soy el que anota. No empuño espada ni conjuro llamas. Guardo los registros de la Gran Biblioteca, en la ciudad central de Karmika, y recorro los caminos con tinta, pergamino y mucha paciencia, escuchando. Escucho al herrero de una ciudad de engranajes, a la sacerdotisa del campo sagrado, al cazador que vuelve del bosque con los ojos más viejos que la cara, e incluso al vampiro que acepta hablar conmigo, siempre que no le pregunte el nombre de su primera vida.</p>' +

    '<p>Dicen los más viejos que, antes de que hubiera caminos, solo había terreno, y que alguien tenía que mirarlo para que fuera algo. Ese alguien es <b>Marghar, el Señor de los Caminos</b>.</p>' +
    '<p>No lo encontrarás en ningún templo que pida o prometa. Marghar no estorba, no ayuda y no juzga. Él ve. A veces, rara vez, se conmueve con lo que ve, y quien lo presenció jura que el mundo entero pareció respirar. Pero él rige, y él cobra. Es mayor que todos los dioses de Karmika y no ha vencido a ninguno; su grandeza no está en las victorias, sino en ser la llamada que no se puede rechazar. Da al tiempo el tiempo que el tiempo pide y devuelve al valor el valor que necesita.</p>' });
  add({ lv: 'I', body:
    '<h3>Del Antes</h3>' +
    '<p>Los más viejos de todos cuentan que hubo un tiempo anterior a todos los tiempos, y que no era oscuro ni claro, porque no había nadie que viera la diferencia.</p>' +

    '<p>Fue dentro del Antes donde Marghar pensó. Todavía no hizo nada. Solo pensó en caminar. Y bastó: el pensamiento abrió el espacio para que alguien, o algo, pudiera andar.</p>' });
  add({ lv: 'I', body:
    '<h3>Del Hambre que también quiso andar</h3>' +
    '<p>Pero el pensamiento de Marghar no lo oyeron solo quienes lo merecían. Había en el Antes algo que nunca había sido nada más que deseo. Estaba atrapado, como un perro rabioso ante la presa al otro lado de la cerca; como el hombre lobo que huele el rastro y no tiene sendero; como el vampiro que olfatea la sangre y no encuentra la puerta. Querer, sin camino para el querer. Quienes lo odian, quienes lo veneran y quienes lo temen lo llaman <b>Ahzur, el Sin-Paso</b>. Su nombre verdadero, nadie lo conoce.</p>' +
    '<p>Cuando Marghar pensó en caminar, el deseo de Ahzur también se soltó. El bien quedó libre para trazar su rumbo. Pero el mal ganó, en el mismo instante, un camino para alcanzar su maldad: una calzada recta, rápida y abierta a todos. Y al final de esa recta estaban los que aún no sabían andar.</p>' });
  add({ lv: 'I', body:
    '<h3>Del laberinto</h3>' +
    '<p>Marghar vio. No juzgó, no venció, no encerró, porque no hace nada de eso. Pero vio, y creó los <b>caminos</b>, en plural. Donde había una recta, hizo bifurcaciones; donde había prisa, hizo vueltas; donde había una puerta, hizo mil puertas. Cada camino es una elección, y cada elección es un muro entre Ahzur y nosotros, los caminantes, que todavía no estamos preparados para encontrarlo. Por eso el mal tarda en hallarnos.</p>' +
    '<p>Los caminos, por tanto, no son solo libertad. Son el laberinto en el que fuimos escondidos. Todo aquel que anda por Karmika es un caminante, y todo caminante, lo sepa o no, está siendo protegido del Hambre por un muro que Marghar levantó.</p>' +
    '<h3>Del karma</h3>' +
    '<p>Pero hay quienes no quieren esconderse. Algunos desean que su camino se cruce con el de Ahzur, y lo buscan abiertamente. Otros pasan la vida ayudando a Marghar a confundir la esencia del mal, desviándola de las almas que no están preparadas. De ese deseo, en los dos bandos, nació el <b>karma</b>: el peso de quien ayuda a confundir al Hambre, y el peso de quien se sirve como banquete, en el deleite de ser devorado por ella.</p>' +
    '<p>Por eso el karma no es castigo. Es el precio de ponerse frente a lo que quedó atrapado en el Antes, ya sea para esconderlo, ya sea para alimentarlo.</p>' });
  add({ lv: 'I', body:
    '<h3>De los hijos del Hambre</h3>' +
    '<p>Dicen los más prudentes de los sacerdotes que Ahzur nunca fue encontrado entero, y que tal vez nunca lo sea. Lo que las almas encuentran son las maneras que aprendió de andar: el pacto, la locura, la ceniza, el engaño, el banquete, el olvido, la podredumbre, la cadena y la traición. Son los que la tradición llama príncipes infernales, y de ellos hablaré más adelante.</p>' +
    '<h3>De las dos clases de almas</h3>' +
    '<p>Los que se acercan al Hambre se dividen en dos pueblos que casi nunca se hablan. Están los <b>Desviadores</b>, que viven para desviar: tejen caminos falsos, protegen a los que no están preparados, mantienen el laberinto en pie. Y están los <b>Comensales</b>, que se ofrecen al banquete: abren las puertas, dejan el rastro y encuentran deleite en ser devorados. Los dos pagan en karma, y Marghar ve a los dos del mismo modo.</p>' +
    '<p>Él no dice cuál de los dos tiene razón. Dicen que, cuando uno de ellos hace algo que el laberinto no había previsto, el Ojo llora.</p>' });
  add({ lv: 'I', body:
    '<h3>Del camino y del caminar</h3>' +
    '<p>Hay algo que las crónicas antiguas repiten, y que toda nuestra cultura aprendió a repetir con ellas: <b>el camino y el caminar fueron creados juntos</b>, bajo los ojos de Marghar. El camino no existía antes de quien lo andara, y quien lo andara no existía antes del camino. Por eso el bien y el mal, tal como los conocemos, nacieron en el mismo instante y del mismo gesto.</p>' +
    '<p>De ahí la conclusión a la que llegaron los sacerdotes, los escribas y hasta los ladrones: la vida es aprender. Aprender a evitar, y ayudar a evitar; o aprender a encontrar, y ayudar a encontrar.</p>' +
    '<h3>De la ironía</h3>' +
    '<p>Y aquí está la ironía que los maestros de templo prefieren no explicar. Encontrar no es lo bueno, y evitar no es lo malo. Es el karma que el propio karma carga: perseguimos el bien evitando el mal, y hacemos el mal solo con encontrar el mal.</p>' +
    '<p>Parece injusto, y quizá lo sea. Pero los caminos los hace quien camina, y nadie camina sin dejar suelo detrás.</p>' });
  add({ lv: 'I', body:
    '<p>Si te piden una ley en una sola frase, es la más antigua que conozco: <b>lo que se sembró será devuelto</b>. Los campesinos lo llaman cosecha; los sacerdotes, karma; los tecnócratas, probabilidad; los fieles, providencia; y los ladrones, suerte, hasta el día en que dejan de sonreír.</p>' +
    '<h3>Del Ojo</h3>' +
    '<p>Marghar no tiene un rostro que alguien pueda describir, pero tiene un símbolo, y el símbolo es un ojo. Imagina dos K vueltas una hacia la otra, formando entre ellas un rombo. Es el <b>Ojo Kármico</b>, y no lo confundas con un objeto: es la propia ley natural del karma, regida por Marghar.</p>' +
    '<p>Mientras un alma vive, el Ojo la acompaña, y cada elección, cada juicio, cada pacto, cada gesto de misericordia o de crueldad cae dentro de él. Lo que cae en el Ojo es <b>líquido</b>, porque todavía se le sigue añadiendo. El karma de quien vive aún puede crecer, ser desviado, ser cambiado por otro. Nada está sellado mientras la persona respira.</p>' +
    '<p>El karma sembrado es líquido porque, como el agua, cambia. Y así como el líquido toma la forma de su recipiente, el karma se moldea y se transforma según el caminante que lo carga: el mismo acto pesa de una manera en un alma y de otra en otra.</p>' +
    '<p>Habrá quien pregunte si el Ojo juzga. No juzga, ve. Y lo que ve, lo guarda.</p>' +
    '<h3>Notas del cronista</h3><p class="fnote"><span class="nb">✎</span>Los ancianos dicen «un tiempo anterior a todos los tiempos». Orvalen, en los fragmentos que tenemos de él, lo escribe de otro modo: «el Antes también tuvo un antes, y fue de allí de donde él vino a mirar». No he encontrado ni una línea más sobre esto, ni sé quién es ese «él».</p><p class="fnote"><span class="nb">✎</span>En todo el mundo, el Ojo se dibuja abierto. Conozco un único lugar donde aparece cerrado: una puerta de piedra negra, sin pomo, con el ojo esculpido de párpados bajos. Hablaré de ella más de una vez en este volumen, porque más de una vez me hablaron de ella.</p>'  });

  add({ toc: 'Libro II — Los dioses que recorren el camino', lv: 'II', eyebrow: 'Libro II', title: 'Los dioses que recorren el camino', start: true, body:
    '<p>Marghar rige, pero no camina. Los que caminan son los otros, y cada uno eligió un camino y lo recorre desde antes de que hubiera quien lo siguiera. Fueron esos caminos los que, más tarde, los mortales empezaron a llamar <b>caminos</b>.</p>' +
    '<h3>Los Altos Dioses</h3>' +
    '<p><b>Auréon, el Majestuoso</b>, señor de la luz celeste, es el dios de los paladines. Dicen que su iglesia nació de un juramento: el de que siempre habría alguien entre el mal y el indefenso. Sus sacerdotes enseñan que la luz no es pureza, es responsabilidad.</p>' +
    '<p><b>Odín, el Padre de Todos</b>, es el dios de los guerreros nórdicos. Vive donde hace frío, y quien lo busca tiene que subir hasta las regiones heladas. No promete comodidad, promete una vida entera dedicada a la fuerza y al honor.</p>' +
    '<p><b>Hemara, la Madre Roja</b>, es la señora de la sangre y del vampirismo. Quien oye su nombre durante mucho tiempo empieza a sentir sed. La tradición dice que nunca obligó a nadie, que solo esperó.</p>' });
  add({ lv: 'II', body:
    '<p><b>Selvar, el Padre de la Manada</b>, es el dios de los hombres lobo. Su ley es la de la manada: quien está dentro está protegido hasta la muerte; quien está fuera es presa o es aliado.</p>' +
    '<p><b>Arquelon, el Escriba Arcano</b>, es el dios de los magos. Dicen que escribió la primera palabra de poder y que pasa la eternidad corrigiéndola. Sus estudiosos creen que el conocimiento es la única caridad que no se agota.</p>' +
    '<p><b>Mekhanos, el Gran Ingenio</b>, es el dios de los tecnócratas. No le gusta que lo llamen dios: prefiere «el proyecto». Sus fieles creen que el mundo es una máquina en constante perfeccionamiento, y que mejorarla es rezar.</p>' +
    '<p><b>Aravel, la Vigilia Verde</b>, es el dios de los cazadores de demonios. Su ojo nunca se cierra, y quien lo sirve vive alerta, persiguiendo lo que se esconde en las sombras del mundo.</p>' });
  add({ lv: 'II', body:
    '<h3>Los Príncipes Infernales</h3>' +
    '<p>En la otra orilla del camino están los que la tradición llama príncipes, no dioses, porque dependen de quien se incline ante ellos. Cada uno es una <b>faceta de Ahzur</b>, una manera que el Hambre del Antes aprendió de andar. Son nueve, y hay quien dice que aún faltan.</p>' +
    '<p><b>Malgrath, el Señor de los Pactos</b>, es el patrono de los brujos. Nunca miente en un contrato, y es justamente por eso que quien lo firma se arrepiente.</p>' +
    '<p><b>Vhaelor, el Demonio de la Locura</b>, no tiene seguidores, tiene víctimas. Es uno de los grandes enemigos de los mundos de Karmika, y matar a uno de sus avatares es hazaña digna de canción incluso para un vampiro.</p>' +
    '<p><b>Orrukh, el Devorador de Cenizas</b>, aparece cuando muchas almas pesan juntas. Dicen que se alimenta del karma colectivo de las ciudades que se perdieron.</p>' });
  add({ lv: 'II', body:
    '<p><b>Sythra, la Voz del Susurro</b>, anda por la palabra. No miente: elige qué decir, y promete a cada uno aquello que ya quería oír.</p>' +
    '<p><b>Gorvak, el Banquete Sin Fin</b>, es la faceta más cercana al Hambre pura. No pide nada; solo pone la mesa. Es el patrono de los Comensales, los que se ofrecen al deleite de ser devorados.</p>' +
    '<p><b>Nyxael, la Noche Sin Ecos</b>, anda por el olvido. Borra nombres, rostros y deudas de la memoria de quien sufre, pero nada se borra del Ojo.</p>' });
  add({ lv: 'II', body:
    '<p><b>Zerath, el Rey de la Podredumbre</b>, anda por lo que se pudre despacio: la enfermedad, la ruina, las ciudades que se corrompen por dentro antes de caer.</p>' +
    '<p><b>Ishkara, la Dama de las Cadenas</b>, anda por el dominio. Es la patrona de los que someten, de los que hacen de otros su suelo.</p>' +
    '<p><b>Morvek, el Rompejuramentos</b>, anda por la traición. Dicen que espera al lado de todo juramento, y que los paladines caídos lo conocen por su nombre.</p>' });
  add({ lv: 'II', body:
    '<h3>Las Esencias del Camino</h3>' +
    '<p>Si los príncipes son las facetas del Hambre, el lado opuesto no tiene príncipes. Tiene las <b>Esencias</b>: seres que, en lugar de reinar, ayudaron. No piden rodilla en tierra ni juramento. La tradición las reparte en tres oficios.</p>' +
    '<p><b>Las que desentrañaron el laberinto.</b> <b>Ilmara, la Cartógrafa de los Pasos</b>, fue la primera en trazar el camino paso a paso. <b>Orvalen, el Lector de Rastros</b>, aprendió a leer en el suelo por dónde Ahzur ya había pasado. <b>Sael, la Que Volvió</b>, es la única alma que, dicen, llegó al centro del laberinto y regresó para contarlo.</p>' });
  add({ lv: 'II', body:
    '<p><b>Los Arquitectos.</b> Construyen y reparan los caminos kármicos. <b>Brannor, el Cantero de Caminos</b>, asienta las piedras donde el camino se abre. <b>Lythaen, la Tejedora de Puentes</b>, cose los caminos que se rasgan. <b>Dhurgan, el Reparador de Vetas</b>, es el herrero que arregla lo que el tiempo y el Hambre corroen.</p>' +
    '<p><b>Los Cerradores.</b> Cierran los caminos cuando un príncipe, una faceta de Ahzur, está a punto de llegar. <b>Caldris, el Sellador de Puertas</b>. <b>Merith, la Última Puerta</b>. <b>Aldun, el Guardián del Umbral</b>.</p>' +
    '<p>Ninguna Esencia vence a Ahzur. Cerrar es aplazar, y reparar es ganar tiempo. Pero dicen que, gracias a ellas, el laberinto sigue en pie.</p>' +
    '<p>Precisamente por eso las Esencias son cazadas. Así como los caminantes cumplen hazañas prodigiosas desterrando del mundo, aunque sea por poco tiempo, a un príncipe maligno, los caminantes del lado kármico de Ahzur desean matar a una Esencia para cumplir la suya. Quien mata a un Arquitecto abre un agujero en el laberinto, y quien mata a un Cerrador deja una puerta abierta para que pase un príncipe.</p>' });
  add({ lv: 'II', body:
    '<h3>Cómo tratan los dioses a los mortales</h3>' +
    '<p>Ningún dios invade el alma de nadie. Lo que existe es el <b>juramento</b>: el mortal se acerca, promete, y el dios responde con <b>dones</b>. A cambio, acepta <b>votos</b> y <b>prohibiciones</b>: lo que debe hacer y lo que jamás debe hacer.</p>' +
    '<p>Los dioses también tienen sus enemistades, y los fieles las heredan. Quien sirve a uno necesita saber a quién no perdona el otro.</p>' +
    '<p>Los sacerdotes susurran una pregunta: ¿los dioses también cosechan lo que siembran? Marghar nunca lo dijo, pero la respuesta es sí. Cuando un príncipe de las tinieblas, una Esencia o un dios cae, las noticias corren por el mundo entero, hablando de la gran hazaña de quien lo derribó, y dicen que encontró su karma. Desaparecen durante cien turnos, pero su influencia permanece. Esos seres reunieron, en infinitas caminatas y vidas, tanto karma que su muerte estalla en energía kármica sin tener adónde ir. Esa energía lee el karma de los presentes y se transforma en objetos hechos para cada uno, a la medida del karma de cada uno.</p>' +
    '<h3>Notas del cronista</h3><p class="fnote"><span class="nb">✎</span>En la sala de los príncipes, en el tercer sótano de la Biblioteca, hay diez nichos excavados en la pared. Nueve tienen un nombre grabado en la piedra. El décimo no tiene nombre alguno, y es el único en el que no se acumula polvo.</p><p class="fnote"><span class="nb">✎</span>Conté nueve Esencias, como cuentan todos. Pero los himnos más antiguos de Ilmara, cantados en las aldeas élficas, tienen una estrofa con un nombre que nadie logra pronunciar hasta el final: la cantora siempre se queda sin aliento en la misma sílaba, y la estrofa vuelve a empezar.</p>'  });

  add({ toc: 'Libro III — Sembrar y cosechar', lv: 'III', eyebrow: 'Libro III', title: 'Sembrar y cosechar', start: true, body:
    '<p>El mundo de Karmika se divide, antes que en cualquier frontera, en dos estaciones del alma: la que siembra y la que cosecha.</p>' +
    '<h3>El tiempo de sembrar</h3>' +
    '<p>Mientras un alma vive, siembra. Cada paso es una semilla: el gremio al que entró, la escuela en la que estudió, el enemigo al que perdonó, el inocente al que no perdonó. Matar también es sembrar, e incluso las elecciones pequeñas, si se hacen a propósito, cuentan.</p>' +
    '<p>En ese tiempo el Ojo está abierto en horizontal, y el karma es líquido: todavía sube, todavía se mezcla. Quien vive mucho ve el Ojo llenarse.</p>' + EYE_FILL });
  add({ lv: 'III', body:
    '<h3>El Reloj de Arena</h3>' +
    '<p>Cuando el alma muere, el símbolo gira. Las dos K se ponen de pie, y el Ojo se convierte en <b>Reloj de Arena</b>. La K de pie no lleva un reloj de arena dentro; ella es el reloj de arena.</p>' + HOUR +
    '<p>Y entonces sucede lo más importante que sé del karma: <b>el líquido se seca</b>. Lo que era líquido se vuelve arena, y la arena empieza a caer por la boca de abajo de la K. El líquido, mientras era líquido, todavía podía cambiar. La arena no cambia. Está hecho, y no hay adónde huir.</p>' });
  add({ lv: 'III', body:
    '<p>El alma recibe entonces lo que sembró, grano a grano. Uno de los sacerdotes de Auréon me dijo una vez: «La recompensa es seca porque ya no se puede negociar». El Reloj de Arena tiene que vaciarse por completo antes de que el símbolo vuelva a girar, y solo entonces el alma puede crear karma de nuevo.</p>' +
    '<p>Se vacía de dos maneras, y vale la que llegue primero: por las consecuencias, cuando lo que se sembró finalmente sucede, o por el tiempo, cuando la arena simplemente se acaba. Quien carga mucho karma puede tener, digamos, cincuenta turnos por delante. En ese tiempo le suceden cosas, la gente deja de quererlo y lo visitan efectos nocivos. Un símbolo lo persigue a todas partes, el símbolo del caminante kármico. Puede convertirse en blanco de contratos de persecución, o recibir descuentos y favores por venganzas que el mundo consideró necesarias.</p>' +
    '<h3>El regreso</h3>' +
    '<p>El alma vuelve a su caminata, y el caminante elige de nuevo su raza y traza su camino. Pero no vuelve vacío. Trae consigo lo que fue: el vampiro al que mató un cazador puede renacer con una sed inexplicable o con aversión al ajo; el hombre lobo puede despertar oyendo aullidos que nadie más escucha. Y hay quienes saben. Profetas y místicos de gremios antiguos reconocen ciertas almas, y algunas de esas almas son cazadas por lo que fueron.</p>' +
    '<p>Quien juega durante años vive muchas vidas, y la historia de cada una será contada de nuevo, y cobrada de nuevo, en las vidas siguientes.</p>' +
    '<p>No imagines que el Reloj de Arena separa santos de pecadores. No conoce el bien ni el mal, solo acción y reacción. El caminante que hizo lo que llamamos malo, y que solo abrió caminos que arruinaron a otros, tendrá su karma que pagar. Pero quien lo hizo todo bonito y ayudó a mucha gente también vuelve con karma que pagar. Muchos del karma opuesto pondrán precio a su cabeza, y otros le harán descuentos en objetos poderosos. El Ojo ve, y nada más.</p>' });
  add({ lv: 'III', body:
    '<h3>La Lágrima Kármica</h3>' + EYE_TEAR +
    '<p>Hay una excepción al curso del Reloj de Arena, y es la más codiciada de Karmika.</p>' +
    '<p>Cuando alguien realiza una hazaña digna de canción, buena o mala, el Ojo llora. La lágrima cae del vértice de abajo, y se llama <b>Lágrima Kármica</b>. No se gana por la cantidad de hazañas, sino por hazañas históricas: un vampiro bondadoso, un hombre lobo gentil, un brujo que usa demonios contra el mal, un paladín que se entrega a lo satánico, un cazador que persigue a paladines heroicos, quien derrota a una leyenda, quien se sacrifica a la perfección. Cada uno de ellos anduvo por donde el laberinto no había previsto.</p>' +
    '<p>Aquí conviene hablar de Marghar. Durante incontables eras siguió creando caminos para todas las posibilidades kármicas, y nada de lo que hiciera un caminante parecía escapar de lo que él había previsto. Pero, muy rara vez, alguno de nosotros, de los que andan por Karmika, hace lo que no estaba previsto. Ese camino nuevo lo crea literalmente un caminante: en su hazaña memorable, toma para sí la energía de Marghar, porque sin ella no se crea ningún camino, y traza por sí mismo un camino imposible, que ni el antiguo antes del antiguo había previsto.</p>' +
    '<p>No es el robo de un ladrón. Es el robo de un árbol que saca de la tierra el alimento para existir, y quizá sea el mismo karma de quien pensó primero. Esa energía invocada le causa dolor a Marghar, pero no lo hiere, porque él es anterior a la herida que surgió en el camino y anterior al placer que surgió en el camino. Se conmueve, y llora la lágrima del propio Ojo que ve. Vista por él y venida de él, es poderosa.</p>' +
    '<p><b>En quien la recibió</b>, da la oportunidad de revivir al morir, sin pasar tan pronto por la culpa kármica. Solo el alma que la conquistó puede usarla así. <b>En el mundo</b>, puede venderse, y entonces se convierte en objeto: hace crecer un gremio, forja piezas únicas, compone pociones poderosas, sirve de materia prima y de moneda de especulación, y de ella pueden salir un Martillo de la Justicia o una espada como las de las leyendas.</p>' +
    '<p>Los ancianos lo resumen así: la Lágrima es la emoción de Marghar. Rara vez se conmueve, y cuando lo hace, el mundo vale más que el oro.</p>' +
    '<h3>Notas del cronista</h3><p class="fnote"><span class="nb">✎</span>Pregunté, en las galerías, quién fue el primero en hacer llorar al Ojo. El registro más antiguo de la Biblioteca tiene la fecha y el nombre raspados a cuchillo. De la hazaña quedó una sola palabra, la última de la línea: volvió.</p>'  });

  add({ toc: 'Libro IV — Los pueblos', lv: 'IV', eyebrow: 'Libro IV', title: 'Los pueblos', start: true, body:
    '<p>Todo el mundo empieza en algún lugar, y en Karmika toda alma empieza en uno de tres pueblos. Nadie nace vampiro, mago o paladín. Nace humano, enano o elfo, en una aldea pequeña, y todo lo demás es consecuencia.</p>' +
    '<h3>Los humanos</h3>' +
    '<p>Somos los más numerosos y los menos especiales, y quizá por eso los más libres. Ningún camino nos es ajeno, ningún camino nos cobra la piel. Los humanos construyen: casas, puentes, murallas y ciudades enteras son obra de manos humanas. Y muchos, cuando el alma vuelve después de la muerte, eligen volver humanos, de modo que casi todos cargamos, en el fondo, el comienzo de todos.</p>' +
    '<h3>Los enanos</h3>' +
    '<p>Gente de montaña, de forja y de terquedad. Los enanos que conocí creen que lo que se hace con las manos no necesita justificación. Un enano cazador de demonios o brujo no está prohibido, solo es raro, y he oído que su pueblo lo mira como quien ve a un hermano saliendo de la madriguera.</p>' });
  add({ lv: 'IV', body:
    '<h3>Los elfos</h3>' +
    '<p>Los elfos pertenecen a los bosques hermosos, donde los árboles tienen memoria y los oficios tienen ritmo. Un elfo que se hace vampiro u hombre lobo traiciona más que a sí mismo: traiciona a su gente. Puede hacerlo, y muchos ya lo hicieron, pero el precio se cobra en karma, no en ley.</p>' +
    '<h3>Qué es impedimento, y qué es culpa</h3>' +
    '<p>Pregunté a muchos sacerdotes si la ley le prohíbe a alguien un camino por su raza. La respuesta era siempre la misma: ninguna ley prohíbe, todo se cobra. La naturaleza no cierra la puerta; solo deja el precio escrito en ella.</p>' });

  add({ toc: 'Libro V — Los ocho caminos', lv: 'V', eyebrow: 'Libro V', title: 'Los ocho caminos', start: true, body:
    '<p>Las almas de Karmika no eligen una profesión, se convierten en algo. Nadie amanece paladín un día cualquiera: tiene que entrar en la iglesia, estudiar, servir, demostrar. Cada camino exige una filiación, una travesía y, casi siempre, un viaje a regiones lejanas. Y, hasta los primeros veinte niveles, todos sobreviven como pueden, sin camino alguno.</p>' +
    '<h3>El Paladín</h3>' +
    '<p>Para ser paladín hay que entrar en la iglesia de Auréon, hacerse sacerdote y, solo entonces, libertador del mal. Viste la luz celeste y odia a los monstruos.</p>' +
    '<h3>El Guerrero Nórdico</h3>' +
    '<p>Aprende en la academia nórdica de combate, en las montañas heladas, y dedica la vida a Odín. Es firme, orgulloso y, según los hombres lobo, insoportable.</p>' });
  add({ lv: 'V', body:
    '<h3>El Vampiro</h3>' +
    '<p>Nadie lo elige de una sola vez. Lo muerden, o acepta el mordisco, y pasa a vivir de la sed de Hemara. El vampiro odia a los hombres lobo, a los paladines y a los magos del bien.</p>' +
    '<h3>El Hombre Lobo</h3>' +
    '<p>Entra en un gremio licántropo y se transforma. La manada es su ley. Odia a los vampiros, a los ladrones y a los guerreros nórdicos.</p>' +
    '<h3>El Cazador de Demonios</h3>' +
    '<p>Formado en las escuelas de cazadores, persigue lo demoníaco: vampiros, hombres lobo, magos y brujos satánicos. También puede ser cazarrecompensas.</p>' +
    '<h3>El Brujo</h3>' +
    '<p>Hace pactos con los príncipes infernales. Su rivalidad no está fuera del mal, está dentro de él, entre los mismos que lo sirven. Puede vender rituales de vampirismo y preparar pociones de poder.</p>' });
  add({ lv: 'V', body:
    '<h3>El Mago</h3>' +
    '<p>Estudia durante mucho tiempo y se convierte en alguien que dobla la realidad. Su rivalidad está en el seno del bien, entre los que siguen la luz de maneras distintas. Realiza rituales de sanación en regiones de índice kármico malo.</p>' +
    '<h3>El Tecnócrata</h3>' +
    '<p>Entra en la academia tecnológica de Karmika y sale con máquinas dentro del propio cuerpo. Es el más neutral de todos, porque es el mercader del mundo: vende, repara, mejora ciudades, trae automatización y, si quiere, caza recompensas.</p>' +
    '<h3>Las rivalidades</h3>' +
    '<p>El odio entre caminos es la lápida de muchas historias. Vampiros y hombres lobo se enfrentan desde la primera luna. Los paladines no perdonan a los monstruos, y los cazadores no perdonan a nadie que huela a infierno. Pero el odio de un camino es tendencia, no destino. Hay vampiros que protegen aldeas y paladines que se corrompen, y quien hace lo inesperado a veces hace llorar al Ojo.</p>' });

  add({ toc: 'Libro VI — Los colores del karma', lv: 'VI', eyebrow: 'Libro VI', title: 'Los colores del karma', start: true, body:
    '<p>El líquido que llena el Ojo no tiene un solo color. Cada elección tiñe lo que cae en él, y el Ojo de un veterano es como un vitral: se puede leer una vida entera solo por los colores.</p>' +
    '<ul class="colors">' +
    '<li>' + sw('#b3202f', '#b3202f') + '<span><b>Sangre</b>, el vampirismo</span></li>' +
    '<li>' + sw('#2b1a3d', '#7b5fa8', '#8d6fc0') + '<span><b>Energía negra</b>, la brujería</span></li>' +
    '<li>' + sw('#fff0c2', '#ffd36a') + '<span><b>Luz celeste</b>, el paladín</span></li>' +
    '<li>' + sw('#3dff8a', '#3dff8a') + '<span><b>Verde brillante</b>, el cazador de demonios</span></li>' +
    '<li>' + sw('#2a4bff', '#2a4bff') + '<span><b>Azul oscuro brillante</b>, el tecnócrata</span></li>' +
    '<li>' + sw('#46bcff', '#46bcff') + '<span><b>Azul claro brillante</b>, el mago</span></li>' +
    '<li>' + sw('#8b5a2b', '#8b5a2b') + '<span><b>Marrón</b>, el hombre lobo</span></li>' +
    '<li>' + sw('#ffb000', '#ffb000') + '<span><b>Amarillo ámbar</b>, el guerrero nórdico</span></li>' +
    '</ul>' +
    '<p>El hombre lobo tiene el color de la tierra y del pelaje, y el guerrero nórdico el del ámbar antiguo, el de las hogueras y del oro de Odín. Ya no necesito verlos en sueños.</p>' +
    '<p>Solo no confundas dos luces que parecen hermanas. La del paladín es blanca con dorado, y tiene un aspecto místico, celestial. La del mago es blanco hielo, y tiene un aspecto elemental. Una viene de lo alto, la otra viene de la naturaleza de las cosas.</p>' });
  add({ lv: 'VI', body:
    '<h3>Cuando los colores se suman</h3>' +
    '<p>Los colores no se anulan. Nadie borra la sangre de un vampiro con luz celeste; lo que sucede es que las dos conviven, y de ellas nace una tercera. Las combinaciones son lo que más fascina a los escribas, porque cada suma cuenta una historia: el cazador que bebió sangre, el mago que hizo un pacto, el tecnócrata que se arrepintió.</p>' +
    '<p>Más colores, más peso. La culpa kármica de quien sumó mucho es pesada, porque hay más que cosechar.</p>' +
    '<h3>Cuando se traiciona un camino</h3>' +
    '<p>El camino se traiciona y el color cambia. Cuando un paladín cae, la luz celeste se apaga y lo que viene después no es inocente. Quien traiciona a su raza, a su gremio o a su juramento paga dos veces: con el color nuevo y con el peso del color antiguo.</p>' +
    '<h3>Notas del cronista</h3><p class="fnote"><span class="nb">✎</span>Los escribas registran ocho colores, y yo también. Pero en el margen de un libro de colores muy viejo alguien añadió, con tinta más clara, un noveno: gris, que no es la mezcla de ninguno. No hay camino que dé ese color. Sin embargo, he visto capas de ese color.</p>'  });

  add({ toc: 'Libro VII — La tierra de Karmika', lv: 'VII', eyebrow: 'Libro VII', title: 'La tierra de Karmika', start: true, body:
    '<p>Karmika es el mundo entero, y no solo un reino. Los mapas que he visto coinciden en tres cosas: hay por lo menos cuatro grandes ciudades; cada una tiene seis ciudades pequeñas a su alrededor; y, entre ellas, se dispersan pequeñas aldeas.</p>' +
    '<p>Las aldeas son donde nacemos. Allí la vida empieza casi como supervivencia, y quien quiere ser algo tiene que partir. Las ciudades pequeñas guardan escuelas de nivel bajo, donde se aprende lo primero de cada oficio. Las grandes ciudades albergan las escuelas de alto nivel, y quien llega a ellas ya es alguien.</p>' +
    '<h3>El mundo que asusta</h3>' +
    '<p>Entre las ciudades, el camino es peligroso. Hay bosques tan densos que el día se vuelve crepúsculo; cuevas oscuras donde algo respira; iglesias y mausoleos abandonados por curas que se volvieron malos; criptas, cementerios y ciudades arrasadas, de donde nadie vuelve sin una historia que no quiere contar.</p>' });
  add({ lv: 'VII', body:
    '<h3>El mundo que acoge</h3>' +
    '<p>Pero Karmika no es solo sombra. Hay campos hermosos donde la luz se demora en el horizonte, y hay montañas heladas, hogar de los guerreros del norte, donde la nieve brilla como plata. Hay una ciudad tecnológica de estilo steampunk, donde el vapor sube en columnas y los engranajes giran hasta la madrugada, que es la casa de los tecnócratas. Hay bosques hermosos de los elfos, regiones de islas a la espera de navegantes, y campos sagrados donde la iglesia de Auréon cuida a quien llega herido.</p>' +
    '<p>Los que escriben sobre Karmika tienen la costumbre de contar solo lo oscuro. Yo pido que no se olvide: lo oscuro pesa más porque existe lo bello, y lo bello vale más porque, ahí cerca, hay oscuridad. Incluso en los campos sagrados puede llegar el mal, y una tierra sanada por rituales puede florecer de nuevo.</p>' +
    '<h3>Notas del cronista</h3><p class="fnote"><span class="nb">✎</span>El gran mapa fue copiado tres veces. En las tres copias, sin ponerse de acuerdo, los copistas dibujaron el mismo pequeño círculo en el centro de las Tierras de los Hombres, donde no hay nada. Cuando se les preguntó, ninguno recordaba haberlo hecho.</p>'  });

  add({ toc: 'Libro VIII — Oficios y mercaderes', lv: 'VIII', eyebrow: 'Libro VIII', title: 'Oficios, mercaderes y el Pacto de la Honestidad', start: true, body:
    '<p>Un mundo que dura años no vive solo de espadas. Alguien tiene que sembrar el trigo, levantar la casa, forjar la hoja y llevar el pan a la ciudad. En Karmika, cada alma tiene un oficio que va con lo que sabe hacer, y hasta el trabajo deja huella en el Ojo.</p>' +
    '<h3>Quién hace qué</h3>' +
    '<p>Los <b>elfos</b> trabajan con lo que da el bosque. Los <b>humanos</b> construyen. Los <b>enanos</b> buscan vetas y forjan, según dicen. Los <b>guerreros</b> y los <b>cazadores de demonios</b> pueden seguir como cazarrecompensas, o elegir trabajos de fuerza y de siembra. Los <b>brujos</b> cobran por rituales de vampirismo y preparan pociones poderosas. Los <b>magos</b> sanan regiones de índice kármico malo con sus rituales. Y el <b>tecnócrata</b> hace de todo: mercader, herrero, ingeniero, el que trae automatización a las ciudades.</p>' });
  add({ lv: 'VIII', body:
    '<h3>El mercader del mundo</h3>' +
    '<p>El tecnócrata es el más neutral de todos, y la razón es simple: no se puede vender a todos siendo enemigo de alguien. Por eso los mercaderes y herreros de Karmika obedecen reglas severas de honestidad, que yo llamo el Pacto.</p>' +
    '<p>El mercader no puede comerciar al mismo tiempo con el gremio de los vampiros y con el de los hombres lobo. No puede vender información. No puede inflar precios. No puede traicionar a los grupos de mazmorra que lo acompañaron.</p>' +
    '<h3>El peso de la avaricia</h3>' +
    '<p>Hay mercaderes que acumulan fortuna a costa de vidas, hay traidores y hay opresores. El Ojo los ve a todos, y el peso que cargan no es pequeño. Pero existe el otro lado: el tecnócrata que usa la inteligencia para mejorar la ciudad, traer luz, trazar un puente, construir una máquina que alimenta mil bocas, siembra una semilla que un día le vuelve.</p>' +
    '<p>Está además el ladrón. Es oficio de humanos y de elfos. Los enanos, tan pesados y firmes, toman el robo como algo que va contra su naturaleza. Pero he oído hablar de la Pequeña Peste, un enano habilidoso que recorría las tabernas robando todo lo que se escondía por debajo de la cintura, que no era poco.</p>' +
    '<p>Los oficios de los caminos tienen sus precios. El <b>paladín</b>, antes que espada, es un sanador de fe: reza, rompe maldiciones y, como el mago, libera ciudades enteras del karma que las asfixia. Puede ser daño o ser muralla. El <b>vampiro</b> es un tejedor excelente de ropa fina, y magos y brujos solo compran la suya. También hace vino y las comidas que piden paciencia, quesos raros y carne ahumada. El <b>hombre lobo</b> construye muy bien y teje ropa gruesa, la de guerreros y paladines, que le compran mucho. Doma fieras mejor que el humano, porque habla una lengua más cercana a la de los animales.</p>' });

  add({ toc: 'Libro IX — Gremios, escuelas y guerras', lv: 'IX', eyebrow: 'Libro IX', title: 'Gremios, escuelas, iglesias y guerras', start: true, body:
    '<p>El karma no es de uno solo. Un gremio entero carga el peso de sus elecciones, y lo que un miembro siembra, todos lo cosechan, un poco. Por eso los líderes sensatos eligen bien a quién reciben.</p>' +
    '<p>Los gremios más grandes y antiguos pueden, por mérito, recibir una concesión: convertirse en <b>escuela</b>. Así hay escuelas de vampiros, de hombres lobo, de cazadores de demonios, e iglesias grandes de pleno derecho. Las escuelas básicas pertenecen al mundo. Las concedidas, a las memorias de quien las conquistó.</p>' +
    '<p>Había quien temía que eso cerrara las puertas a los nuevos. Pero los veteranos que conocí repiten una frase: a quien llega ahora no se le puede dejar fuera. Los gremios poderosos tienen el deber de enseñar, y no solo el derecho de reinar.</p>' });
  add({ lv: 'IX', body:
    '<h3>Cuando se alzan las banderas</h3>' +
    '<p>Y están las guerras. La escuela de cazadores de demonios, atacada por hombres lobo, llama a todos los cazadores al combate. Una llamada a las armas hace sonar las campanas de los paladines de todas las ciudades. Las instituciones entran en guerra unas contra otras, y quien elige un bando siembra karma colectivo.</p>' +
    '<p>Muchos de estos acontecimientos también surgen como eventos PvE, nacidos de la historia de cada jugador, en los que varios entran en una misma instancia para vivir, juntos, ese recuerdo.</p>' });

  add({ toc: 'Libro X — La larga travesía', lv: 'X', eyebrow: 'Libro X', title: 'La larga travesía', start: true, body:
    '<p>Para llegar a la cima de un camino hace falta tiempo, y Karmika no le mete prisa a nadie. Los primeros veinte niveles son de supervivencia: sin camino, sin título, solo la persona y el mundo. Pasado ese umbral, el alma se prepara; a los treinta, ante la Vidente, elige, y el camino se abre. En el nivel veinte, una luz lo cubre todo ante quien camina y el Ojo kármico se abre. Y cuando esa alma muere, el Ojo y su líquido se secan, él gira y se convierte en Reloj de Arena.</p>' +
    '<p>Después de eso, subir lleva años. Los escribas hablan de un nivel doscientos para el alma y de un nivel trescientos cincuenta para el camino, y no hay atajos que yo conozca. Muchas vidas se gastan en la subida, y muchas muertes también. El nivel del alma y el del camino piden la misma suma de esfuerzo: llegar al doscientos cuesta tanto como llegar al trescientos cincuenta del oficio, de modo que el oficio sube más fácil que la vida. Aun así, un jugador que no descansa tarda unos dos años. Y cuanto más alto, más paga la subida: un paladín que pasa del nivel trescientos al trescientos uno gana mucha más fuerza, espíritu y poder en sus hechizos que cuando pasó del treinta al treinta y uno.</p>' +
    '<p>Entre tantas vidas nace la pregunta que más me interesa y que ningún número responde: <b>¿aprende el alma?</b> El Ojo lo verá, y el historiador también.</p>' +
    '<p>Y hay una ley de la subida que pocos aprenden pronto. Quien quiere llegar a la cima de un camino no lo hace en una sola vida: necesita vivir muchas vidas en ese mismo camino. Un paladín tiene que renacer paladín durante decenas, quizá cientos de vidas, hasta convertirse en paladín de la orden. Cada vez que el caminante elige de nuevo el mismo camino, su puntuación gana un multiplicador, de uno y una décima, de uno y tres décimas, de uno y medio, hasta el límite de tres veces. Y quien cambia de camino no vuelve a cero: lleva una puntuación parecida a su nivel personal, porque aprendió en muchas experiencias distintas. Lo mismo vale para los oficios: quien ya fue herrero o tejedor en una vida pasada aprende de nuevo más deprisa, como quien tiene un don natural.</p>' });

  add({ toc: 'Libro XI — La Gran Biblioteca', lv: 'XI', eyebrow: 'Libro XI', title: 'La Gran Biblioteca y la Crónica Viva', start: true, body:
    '<p>En el corazón de Karmika, en la ciudad central, se alza la Gran Biblioteca, tan inmensa que nadie ha recorrido jamás todas sus galerías. Hay pasillos de pergaminos, salones de mapas y una sala donde las páginas se escriben solas. Aquí es donde trabajo.</p>' +
    '<p>Mi oficio es fácil de decir y pesado de cumplir: cuando el Ojo llora, alguien tiene que anotarlo. Cada <b>Lágrima Kármica</b> derramada por Marghar la registro yo, con el nombre de quien la conquistó, la hazaña que la causó y el día en que cayó. Marghar no escribe; escribo yo.</p>' +
    '<p>Quien quiera comprobar su lágrima, o saber de la de otro, que me busque en las galerías.</p>' });
  add({ lv: 'XI', body:
    '<h3>La crónica que no termina</h3>' +
    '<p>Este libro nunca estará terminado. Cada guerra que se libra, cada escuela que cambia de manos, cada ejército de paladines que responde a una llamada, cada guerrero único que el mundo llega a conocer, cada lágrima histórica: yo lo anoto, y una página nueva empieza a existir.</p>' +
    '<p>Los nombres que entren aquí serán los nombres de quienes lo vivieron: gremios que se hicieron famosos, héroes que cambiaron el rumbo de una guerra, almas cuya hazaña hizo llorar al propio Ojo. Algunas de las páginas que lees las escribieron jugadores, sin saberlo.</p>' +
    '<blockquote>Quien siembra algo grande será leído por quien venga después.</blockquote>' +
    '<p>Sé tú mismo un capítulo.</p>' });

  add({ lv: 'XI', body:
    '<h3>De las seis runas</h3>' +
    '<p>Los copistas de la Biblioteca escriben con seis runas, y las dibujo aquí porque el lector las encontrará en el marco de todo libro sagrado de Karmika, en la base de las piedras de teletransporte y en el círculo que el mago traza antes del hechizo.</p>' +
    '<div class="figwrap"><svg class="runes6" viewBox="0 0 296 56" role="img" aria-label="Las seis runas de Karmika: la Lágrima, el Ojo Kármico, el Reloj de Arena, el Laberinto, el Hambre y la Rendija, que brilla"><defs><radialGradient id="frg"><stop offset="0" stop-color="#ffe9ad" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9ad" stop-opacity="0"/></radialGradient></defs><ellipse cx="270" cy="28" rx="26" ry="26" fill="url(#frg)"><animate attributeName="opacity" values=".25;.8;.25" dur="5s" repeatCount="indefinite"/></ellipse><g transform="translate(6 8) scale(1.45)"><path d="M14 3 C17 9 21 13.5 21 18 A7 7 0 0 1 7 18 C7 13.5 11 9 14 3Z" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M14 3 C17 9 21 13.5 21 18 A7 7 0 0 1 7 18 C7 13.5 11 9 14 3Z" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(54 8) scale(1.45)"><path d="M4 4 V24 M24 4 V24 M12 4 L6.5 14 L12 24 M16 4 L21.5 14 L16 24 M8.5 14 Q14 9 19.5 14 Q14 19 8.5 14Z" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M4 4 V24 M24 4 V24 M12 4 L6.5 14 L12 24 M16 4 L21.5 14 L16 24 M8.5 14 Q14 9 19.5 14 Q14 19 8.5 14Z" fill="none" stroke="#15101e" stroke-width="1"/><path d="M14 12 a2 2 0 1 0 0.01 0Z" fill="#d9a24f"/></g><g transform="translate(102 8) scale(1.45)"><path d="M7 4 H21 L14 14 L21 24 H7 L14 14 Z" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M7 4 H21 L14 14 L21 24 H7 L14 14 Z" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(150 8) scale(1.45)"><path d="M5 24 V4 H23 V23.5 H8.5 V7.5 H19.5 V20 H12 V11 H16 V16.5" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M5 24 V4 H23 V23.5 H8.5 V7.5 H19.5 V20 H12 V11 H16 V16.5" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(198 8) scale(1.45)"><path d="M11.5 7.2 A8.3 8.3 0 1 0 16.5 7.2 M11.5 7.2 C11 5.4 9.8 4.2 8.2 3.6 M16.5 7.2 C17 5.4 18.2 4.2 19.8 3.6" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M11.5 7.2 A8.3 8.3 0 1 0 16.5 7.2 M11.5 7.2 C11 5.4 9.8 4.2 8.2 3.6 M16.5 7.2 C17 5.4 18.2 4.2 19.8 3.6" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(246 8) scale(1.45)" class="hot"><path d="M11.4 2.6 V18.8 M16.6 9.2 V25.4 M6.6 10.4 C9.2 10.4 11.4 11.8 12.8 14 C14.2 16.2 16.4 17.6 21.4 17.6" fill="none" stroke="#f6dc8e" stroke-width="2.7"/><path d="M11.4 2.6 V18.8 M16.6 9.2 V25.4 M6.6 10.4 C9.2 10.4 11.4 11.8 12.8 14 C14.2 16.2 16.4 17.6 21.4 17.6" fill="none" stroke="#15101e" stroke-width="1"/></g></svg></div><p class="runecap">Lágrima · Ojo · Reloj de Arena · Laberinto · Hambre · <b>(sin nombre)</b></p>' +
    '<p>La <b>Lágrima</b>, el <b>Ojo Kármico</b>, el <b>Reloj de Arena</b>, el <b>Laberinto</b> y el <b>Hambre</b> tienen nombre e historia, y hablé de cada una. La sexta no tiene nombre. Parece dos hojas desencontradas, una más alta que la otra, con un hilo que escurre entre ellas, y los aprendices la llaman la Rendija, porque es lo que parece. Los sacerdotes la trazan en el bautismo y en la ordenación del templario; los magos, en el círculo; los maestros canteros, en la base de toda piedra de teletransporte. Un ritual sin ella, dicen todos, no prende. Ninguno sabe decir por qué. Yo tampoco.</p>' +
    '<p>Pregunté a cinco maestros de cinco casas. El Gran Maestre Cassius dijo que es de la liturgia, y que la liturgia no se discute. El Archimago Vesk dijo que es un cierre, y que todo círculo necesita un cierre. El Conde dijo que la Casa la usa desde hace mil años y que mil años no se equivocan. Ulfrun gruñó. La Arquitecta Ylva dijo que, si funciona, no va a pararse a preguntar. Anoté las cinco respuestas y me di cuenta de que ninguna era una respuesta.</p>' +
    '<p>Los copistas la dibujan al final, con los ojos cerrados. Pregunté de dónde viene la costumbre. Nadie supo decírmelo.</p>' +
    '<h3>Notas del cronista</h3><p class="fnote"><span class="nb">✎</span>Di nombre a cinco runas. La sexta, que los copistas dibujan al final y con los ojos cerrados, no tiene nombre, y un ritual sin ella no prende. En las piedras de teletransporte más antiguas está gastada de la manera equivocada: no por fuera, por las manos de quien la toca, sino como si la hubieran empujado desde dentro. Se lo atribuyo a los viajeros. No sé por qué.</p>' });
  add({ toc: 'Libro XII — Las Arenas y el trabajo del mundo', lv: 'XII', eyebrow: 'Libro XII', title: 'Las Arenas y el trabajo del mundo', start: true, body:
    '<h3>Del tiempo que se cuenta en granos</h3>' +
    '<p>Los mortales no miden el tiempo en días, sino en arenas, porque fue el Reloj de Arena quien les enseñó a contar. Cada arena dura cuatro horas, y el día tiene seis. No se pierde ninguna: lo que no se usó, el Ojo también lo anota.</p>' +
    '<p>Hay dos tipos de arena. Las <b>arenas de quien camina</b> son suyas: el entrenamiento en la escuela, la primera misión, la larga subida de un nivel al otro. Una tarea puede costar una arena y terminarse antes, si quien la hace la hace bien, porque la arena es el límite y nunca la condena. Las <b>arenas del mundo</b> son de todos y corren aunque nadie mire: los puentes que se levantan, las casas que se suman a la ciudad, las tiendas que monta el tecnócrata, las purificaciones que mantienen los magos.</p>' +
    '<h3>La ciudad que enfermó</h3>' +
    '<p>Cuentan de una ciudad sobre la que cayó un karma pesado. El agua se oscureció, la niebla no salía de las calles y las cosechas se pudrían antes de recogerlas. Quien tenía casa allí, o estudiaba allí, tuvo que buscar magos de verdad, y los magos dijeron el precio: treinta y cinco arenas de purificación, sin interrupción. Ciento cuarenta horas, casi seis días, en las que alguien tiene que mantener las manos en el ritual mientras la ciudad espera.</p>' +
    '<p>Nadie compró esos días. Lo que se compró fueron manos, y quien tiene prisa descubre que es lo mismo. Más magos alrededor del ritual acortan el plazo, pero nunca hasta dejarlo en nada, porque el agua negra tiene voluntad propia. Si los magos se cansan y paran, el agua vuelve a oscurecerse.</p>' +
    '<h3>El Tablón y el Pacto</h3>' +
    '<p>En el centro de cada ciudad hay un Tablón de Encargos. Quien necesita pieles, hierbas, un monstruo muerto, una persona traída de vuelta o trabajadores para una obra escribe allí el encargo, deja el pago bajo la custodia del Pacto de la Honestidad y espera. Quien acepta va, cumple y cobra. Si nadie cumple, el pago vuelve a su dueño.</p>' +
    '<p>Pero el Tablón también es espejo. Un encargo de purificación pesa poco en la balanza del Ojo. Un encargo de muerte pesa en quien pagó, en quien mató y en la ciudad que dejó el papel clavado. Aprendí de un viejo contratista que el Tablón es la conversación más honesta que una ciudad tiene consigo misma.</p>' +
    '<p>Ningún camino levanta una ciudad solo. El mago purifica, el humano construye, el hombre lobo carga, el vampiro corre de noche, el tecnócrata proyecta y vende. Así se mantiene en pie el mundo: por la necesidad que cada uno tiene del otro.</p>' +
    '<h3>Notas del cronista</h3><p class="fnote"><span class="nb">✎</span>La moneda que se arroja a las Fuentes nunca llega al fondo. Un tecnócrata de Puerto Caldera bajó una cuerda con una campanilla en la punta, hasta donde dio la cuerda. La campanilla no sonó. Cuando recogió la cuerda, estaba mojada solo hasta la mitad.</p>'  });

  add({ toc: 'Libro XIII — Los que solo caminan', lv: 'XIII', eyebrow: 'Libro XIII', title: 'Los que solo caminan', start: true, body:
    '<h3>Del caminante que no se convierte en nada</h3>' +
    '<p>Hay una verdad que los escribas olvidaron poner en las primeras páginas: en Karmika nadie está obligado a nada. El caminante hace lo que quiere, y andar es la única regla. Muchos nunca serán vampiros, ni magos, ni paladines. Serán humanos, elfos o enanos hasta el último día, y eso no es poca cosa.</p>' +
    '<p>Hay quien vive por la aventura. Están los <b>cazadores de lágrimas</b>, que pasan la vida detrás de la hazaña que el laberinto no previó, esperando ver llorar al Ojo. Están los que coleccionan vidas, una tras otra, como quien junta libros. Y están los que viven por la estabilidad, por la jugada larga, y dejan su huella en piedra, en madera y en ganado.</p>' +
    '<h3>Lo que construye cada pueblo</h3>' +
    '<p>El humano es el gran constructor. Puede empezar con una cacería, y después hacer un granero, una carnicería, una escuela. Llegan otros humanos y levantan casas, y donde no había nada surgen una aldea, un pueblo y, con el tiempo, una gran ciudad. Cría ganado, ovejas y perros. Contrata guerreros, magos y tecnócratas, y estos traen máquinas de cosecha y ayuda para las obras.</p>' +
    '<p>El elfo amplía el bosque. Hace ciudades sobre los árboles y, paso a paso, purifica grandes extensiones de Karmika. El enano baja a las montañas y cava hondo, o va a otras ciudades. Hace cervezas y carnes asadas que valen mucho, tiene cervecerías que viajan hasta las fiestas de aldeas y gremios, y es herrero y comerciante hábil.</p>' +
    '<h3>El peligro de no elegir</h3>' +
    '<p>Pero quien no elige nada tampoco elige lo que le pasa. Un vampiro puede atacarlo y convertirlo en vampiro sin que quiera; un hombre lobo puede morderlo. Un brujo puede secuestrarlo para un ritual satánico, o un vampiro para una transformación. Muere, y la muerte dolorosa vuelve con el alma. En la vida siguiente el caminante recuerda, sin saber por qué, a quien se lo llevó, y puede buscar venganza.</p>' +
    '<p>Por eso las ciudades de quienes solo viven necesitan murallas, y las murallas, quien las defienda.</p>' +
    '<h3>Notas del cronista</h3><p class="fnote"><span class="nb">✎</span>Hay en la Biblioteca un caminante que firma solo como Lume. Su registro abarca los tres pueblos y los ocho caminos, uno tras otro, y nunca juró la misma bandera dos veces seguidas. La última línea de su lista tiene el pueblo y el camino en blanco, y una fecha que todavía no ha llegado.</p>'  });

  add({ toc: 'Libro XIV — Las marcas del alma', lv: 'XIV', eyebrow: 'Libro XIV', title: 'Las marcas del alma', start: true, body:
    '<h3>Lo que la piel recuerda</h3>' +
    '<p>El alma vuelve después de morir, y el caminante elige de nuevo lo que quiere ser: humano, elfo o enano, y después, si quiere, otro camino. Pero las vidas anteriores no desaparecen. Quien pida ver el perfil de alguien encontrará allí sus vidas pasadas, una por una, con las hazañas de cada una.</p>' +
    '<p>Y hay cosas que la muerte no se lleva. Una hazaña noble acompaña al caminante y se vuelve parte del cuerpo. Una traición, una Lágrima, un hecho heroico se convierten en <b>cicatrices</b> o <b>tatuajes</b>, y los más altos en <b>brillos</b> y <b>auras</b>. Permanecen, sin importar cuántas veces muera.</p>' +
    '<p>Suelo decir a los aprendices de la Biblioteca que un caminante puede cambiar de nombre, de pueblo y de bandera, pero que no engaña a quien sabe leer la piel. Yo la leo.</p>' +
    '<h3>Notas del cronista</h3><p class="fnote"><span class="nb">✎</span>Una tatuadora de Cuervoscuro me juró que algunas marcas aparecen antes de la hazaña, y no después. Me mostró la muñeca de un muchacho con una lágrima dibujada bajo la piel, fina como un cabello. Él nunca había hecho llorar al Ojo. No sé qué fue de él.</p>'  });

  add({ toc: 'Libro XV — Las dos banderas', lv: 'XV', eyebrow: 'Libro XV', title: 'Las dos banderas: el Hilo y los Deshilados', start: true, body:
    '<p>Conté, en el primer libro, que los antiguos dividían las almas entre Desviadores y Comensales. Era una charla de sacerdotes. Pero las charlas de sacerdotes, tarde o temprano, ganan bandera, y hoy quien anda por los caminos de Karmika ve dos estandartes ondeando en lo alto de las ciudades. Dicen los más viejos que <b>del choque entre ellas nació el propio karma</b>, y yo, que solo anoto, no encontré razón para dudarlo.</p>' +
    '<h3>La Orden del Hilo</h3>' +
    '<p>«<b>Nadie cruza solo.</b>» Eso dicen los de la Orden del Hilo, y eso bordan en su escudo azul noche de borde dorado: un laberinto circular y un hilo de oro que corre por los pasillos, de la base hasta el Ojo en el centro. Ellos guardan el Laberinto de Marghar. Para ellos, cada pasillo que sigue en pie es un alma que el Sin-Paso no encuentra antes de tiempo.</p>' +
    '<p>Su justicia es simple: nadie es arrojado al Hambre sin estar preparado. Su honor es más simple todavía: el hilo nunca se corta, y quien entra en el Laberinto con uno de ellos no sale solo, ni muerto. Paladines, cazadores de demonios y magos llevan el hilo dorado.</p>' });
  add({ lv: 'XV', body:
    '<h3>Los Deshilados</h3>' +
    '<p>«<b>Todo muro es una mentira.</b>» El escudo de los Deshilados es negro y agrietado, con borde carmesí: el laberinto partido en pedazos, una boca dentada en el centro, el hilo cortado con las puntas deshilachadas y dos hojas cruzadas detrás. Quieren cortar el hilo y derribar los muros. Para ellos, el Laberinto es una jaula que devuelve el alma a la rueda, vida tras vida, y el Hambre es la única puerta de salida: la libertad de verdad, incluso la de morir para siempre.</p>' +
    '<p>Su justicia: nadie debe ser guardado contra su propia voluntad. Su honor: no mentirse nunca a sí mismo, y quien anda hasta la boca anda con los ojos abiertos, sin empujar a quien no quiere ir. Vampiros, brujos y hombres lobo visten el hilo cortado. No te confundas: no todo Deshilado es Comensal. Muchos no quieren ser devorados; solo quieren salir.</p>' });
  add({ lv: 'XV', body:
    '<h3>Dónde se equivoca cada uno</h3>' +
    '<p>Pregunté a los dos bandos quién tenía razón, y los dos me respondieron con la misma convicción. Por eso desconfío de las dos respuestas. La Orden del Hilo se equivoca cuando la protección se vuelve prisión y decide por los demás qué es «estar preparado». Los Deshilados se equivocan cuando derriban el muro sin recordar que el Hambre no pregunta quién quería salir.</p>' +
    '<blockquote>Quien defiende el Laberinto dice: el Hambre lo devorará todo hasta que no quede nadie. Quien quiere derribarlo pregunta: ¿qué libertad es esta, en la que vivo en un ciclo sin fin, dentro de un laberinto? ¿Eso es justicia? ¿Eso es bondad?</blockquote>' +
    '<p>No hay bando bueno ni bando malo en esta crónica, y no lo habrá. Hay figuras admirables y figuras con fallas en las dos banderas, y el caminante necesita poder entender a las dos, y dudar de las dos.</p>' +
    '<h3>Los que no juran bandera</h3>' +
    '<p>La primera clase es también el primer juramento: quien se hace paladín, cazador o mago entra en el Hilo; quien se hace vampiro, hombre lobo o brujo entra en los Deshilados. Dos caminos quedan fuera. El <b>guerrero del norte</b> es caótico y neutral: tiene sed de sangre y no teme a la muerte, y ningún laberinto le parece digno de guardia ni de ruina. El <b>tecnócrata</b> es neutral de verdad: cree en la ciencia y piensa que puede recorrer su propio camino lejos de las supersticiones, aunque viva en medio de ellas. Después de alcanzar la clase, cada uno hace una misión de su maestro que valida su alineamiento.</p>' +
    '<h3>De los pueblos y el juramento</h3>' +
    '<p>Cada pueblo lleva a las banderas su manera de prometer. El humano es neutral, y por eso la palabra dada es todo lo que le queda: «si no tenemos la firmeza de la palabra dicha, ¿qué quedará en el mundo?». El enano es caótico, pero caos no es desorden: la promesa de un enano es como su barba, no se toca. Y el elfo es bueno por naturaleza; un elfo que se hace vampiro rompe, de una vez, todo un ciclo de alianza.</p>' +
    '<p>Las piezas con blasón solo las tejen las tejedurías reales de cada bando, en Askavik, y solo las viste quien ya juró, después de los treinta. Con el tiempo, dicen, valen más como belleza que como armadura. Pero nadie que yo conozca se ha quitado su manto por eso.</p>' });

  add({ toc: 'Libro XVI — El mapa de los cartógrafos', lv: 'XVI', eyebrow: 'Libro XVI', title: 'El mapa que dibujaron los cartógrafos', start: true, body:
    '<p>En el séptimo libro hablé de Karmika como hablan los viajeros, de oídas. Desde entonces los cartógrafos de la Biblioteca terminaron el gran mapa, y por fin puedo decir dónde está cada cosa. Me enseñaron la primera regla del oficio: primero el relieve, después las aguas que bajan de las montañas, después los bosques que siguen al agua, y solo al final los caminos, que son rutas de comercio y hacen curvas como las hacen los mercaderes.</p>' +
    '<h3>Las Tierras de los Hombres</h3>' +
    '<p>En el centro están las Tierras de los Hombres, con decenas de aldeas. Allí está <b>Karmika</b>, la aldea donde nacen los humanos, con la fuente en la plaza y el tablón de avisos al lado del guardia. Al norte se alza <b>Askavik</b>, la ciudad de las academias, adonde cualquier pueblo va a elegir lo que será. Y, en un valle oscuro de las mismas tierras, la <b>Catedral Abandonada</b>, de la que hablaré más adelante.</p>' });
  add({ lv: 'XVI', body:
    '<h3>Las tierras de alrededor</h3>' +
    '<ul class="plain">' +
    '<li>Al noroeste, la <b>Montaña Vikinga</b>: fiordos, Jarls, la Fortaleza de Odín y las aldeas de Jarlsheim, Skjoldvik y Hrimgard, donde la nieve no se derrite, solo cambia de sitio.</li>' +
    '<li>Al noreste, la <b>Montaña Negra</b>, un volcán que ronca de noche, con lava y vetas de diamante. En la falda está <b>Forjabrasa</b>, donde nacen los enanos, y más arriba, Cenizalta.</li>' +
    '<li>Escondida tras la Montaña Negra, la <b>Colina Vampírica</b>, con el castillo del Conde y la aldea de Cuervoscuro. Allí se cierran las ventanas al anochecer.</li>' +
    '<li>Al este, el <b>Valle de la Desgracia</b>, donde Malgrath enseña a los brujos y hasta el trigo nace cabizbajo.</li>' +
    '<li>Al oeste, los <b>Bosques Élficos</b>, con Aelvaren en los árboles inmensos y <b>Lithendel</b>, donde nacen los elfos.</li>' +
    '<li>Al suroeste, el <b>Bosque Encantado</b> y el <b>Pináculo de Marfil</b>, una torre de ochenta metros que se enciende de noche.</li>' +
    '<li>En el extremo sureste, la <b>Selva Licántropa</b> y la tribu del Aullido Antiguo.</li>' +
    '<li>Al sur, la <b>Costa del Vapor y la Grasa</b>, con Puerto Caldera, Herrumbre y Vaporera, donde los barcos reman solos.</li>' +
    '</ul>' +
    '<p>Los cartógrafos también me enseñaron a leer el peligro. Cerca de las cunas y de las ciudades la tierra es mansa; cuanto más lejos, más muerde. Hasta la Montaña Negra, que acuna a los enanos en su falda, guarda en el corazón bichos que ningún aprendiz debería visitar.</p>' +
    '<h3>Notas del cronista</h3><p class="fnote"><span class="nb">✎</span>Al copiar las seis historias en este volumen, noté que en tres de ellas aparece, de pasada, un hombre de capa gris: en el puente de Velmora, ofreciendo una barca; en las galerías de Thrain, comprando el hierro que sobró; en las puertas de Ossária, la víspera, preguntando el camino. Nadie describe el rostro. Todos describen la capa.</p>'  });

  add({ toc: 'Libro XVII — El primer hilo', lv: 'XVII', eyebrow: 'Libro XVII', title: 'La aldea de Karmika y el primer hilo', start: true, body:
    '<p>Toda alma humana empieza en el mismo lugar, y fui hasta allí para oír cómo empieza. La aldea de Karmika es pequeña: una fuente, una plaza de piedra, la posada, la forja, el templo y un guardia que no se aparta de la puerta. Allí no hay héroes. Hay gente que necesita ayuda, y el primer hilo de toda historia es siempre ese: alguien que te necesita.</p>' +
    '<h3>Los que esperan en la plaza</h3>' +
