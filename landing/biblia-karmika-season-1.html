    '<p><b>Hrefna</b> mora num santuário de pedras de pé, atrás de um véu de luz violeta, e um fio de areia cai diante dela sem nunca acabar. Marghar não tem sacerdotes, mas tem quem o siga de boa vontade, e Hrefna é dessas. Ela segue as Essências, as que caminham ao lado de Marghar, e o povo chama de Deusa dos Caminhos aquela a quem ela mais acende velas: Ilmara, a Cartógrafa dos Passos, a primeira a mapear o labirinto. É dela o Pergaminho do Regresso, que abre uma estrada de luz até a fonte de casa.</p>' +
    '<p>Ela faz doze perguntas. “Um lobo ferido atravessa o seu caminho à noite. Você…” “O que você mais teme perder?” “Diante de uma porta trancada, você…” Cada resposta pesa para dois ou três caminhos, e o karma que a alma juntou até ali pesa junto. No fim, ela diz o caminho mais forte e o segundo, e devolve a escolha:</p>' +
    '<blockquote>O que eu vi é o que a sua alma inclina, não uma corrente. Em Karmika, quem escolhe é você.</blockquote>' +
    '<p>Quem aceita parte em viagem até um mestre: <b>Thorgrim Mão-de-Ferro</b>, na Fortaleza de Odin; o <b>Grão-Mestre Cassius</b>, na Abadia da Aurora; <b>Ilsa Van Rhal</b>, no Bastião de Prata; a <b>Arquiteta Ylva</b>, na Academia de Askavik; o <b>Conde Vladislav III</b>, na Colina; <b>Ulfrun, a Mãe-Alfa</b>, no Uivo Antigo; o <b>Arquimago Aurelian Vesk</b>, no Pináculo; e <b>Malgrath</b>, no Vale. Quem prefere esperar segue humano, e há quem passe a vida inteira assim, construindo casas, muros e guildas.</p>' +
    '<h3>Notas do cronista</h3><p class="fnote"><span class="nb">✎</span>A noiva dos charcos tem o mesmo nome da Mãe Rubra. Os aldeões dizem que é coincidência, que Hemara era nome comum naquele tempo. Os vampiros da Colina, que eu saiba, nunca pronunciam o nome da sua deusa quando atravessam os charcos.</p><p class="fnote"><span class="nb">✎</span>Contei as velas de Hrefna. São dez. Perguntei de quem era a décima, que é a única que ela nunca acende. Ela respondeu que, quando lembrar, me conta.</p>'  });

  add({ toc: 'Livro XVIII — A Catedral Abandonada', lv: 'XVIII', eyebrow: 'Livro XVIII', title: 'A Catedral Abandonada', start: true, body:
    '<p>Há uma catedral não longe de Karmika que ninguém mais visita de dia. Foi da igreja, e depois foi de um bispo que deixou de rezar para Auréon e passou a pôr a mesa para outro. Na porta, presa por correntes que não são deste mundo, espera a <b>Irmã Ysolde</b>, um espírito azulado que pede a quem passa que purifique a nave.</p>' +
    '<h3>O vasilhame do sacrifício</h3>' +
    '<p>Os mortos lá dentro não ficam mortos. Por isso nenhuma porta se abre matando todos: em cada andar há um <b>Vasilhame do Sacrifício</b>, que enche com o sangue de quem cai ali. Zumbis dão pouco, carniçais dão mais, e os guardiões das criptas enchem a taça de uma vez. São <b>seiscentos e sessenta e seis litros</b> até a última porta, cento e onze no primeiro andar, cento e sessenta e seis no segundo, duzentos e vinte e dois no terceiro e cento e sessenta e sete no quarto.</p>' });
  add({ lv: 'XVIII', body:
    '<h3>O Bispo Caído</h3>' +
    '<p>Os três guardiões das criptas carregam três selos: o Carrasco das Criptas, o Príncipe Ósseo e o Guardião do Mausoléu. Quem junta os três e enche a taça encontra, no fundo, o <b>Bispo Caído</b>. Ele ergue o báculo e diz que Gorvak tem fome e que ele é a boca. Quando sangra, chama o rebanho das criptas; quando sangra mais, chama carniçais e um príncipe.</p>' +
    '<p>Gorvak, o Banquete Sem Fim, de quem falei no segundo livro, nunca pede nada. Só põe a mesa. A Catedral é a prova de que alguém sempre aceita o convite.</p>' +
    '<h3>Notas do cronista</h3><p class="fnote"><span class="nb">✎</span>Ysolde conta as medidas em voz alta, sempre, enquanto os vasilhames enchem. Quem sai da Catedral antes do fim a ouve recomeçar do zero. As correntes dela são negras e frias, como as de Ishkara, mas têm um elo, um só, de ouro. Ishkara não usa ouro.</p>'  });

  add({ toc: 'Livro XIX — O Clã do Corvo', lv: 'XIX', eyebrow: 'Livro XIX', title: 'O Clã do Corvo', start: true, body:
    '<p>Dos oito caminhos, o primeiro que a Biblioteca pôde seguir de perto foi o do guerreiro. Subi à Fortaleza de Odin atrás de Thorgrim Mão-de-Ferro, mestre de armas do Clã do Corvo, e anotei as dez provas que ele dá aos que chegam. Em cada uma, o Olho julga não o que se fez, mas por que se fez.</p>' +
    '<h3>O juramento</h3>' +
    '<p>A primeira prova é jurar. Jura-se pelos que não podem lutar, ou pelo clã e por Odin, ou pela própria glória, e o Olho pesa diferente cada uma das três promessas. Depois vêm o fiorde de Skjoldvik, os mortos que andam e o ferro para a fortaleza.</p>' +
    '<h3>O desertor</h3>' +
    '<p>Em Fjallbrún o aprendiz encontra <b>Halfdan</b>, que fugiu do clã. Pode levá-lo a julgamento, deixá-lo ir e mentir ao mestre, ou executá-lo ali mesmo. Thorgrim nunca diz qual era a resposta certa. Diz apenas que o Olho viu.</p>' });
  add({ lv: 'XIX', body:
    '<h3>O emissário do Fio</h3>' +
    '<p>Na sexta prova, o clã manda o aprendiz a Askavik falar com o Paladino Aldric, emissário da Ordem do Fio. O guerreiro decide se o Clã do Corvo se alia ao Fio, se recusa, ou se ouve primeiro os Desfiados. Os nórdicos ainda não têm bandeira; talvez a recebam das mãos de quem passar por ali.</p>' +
    '<h3>O duelo de Hrimgard</h3>' +
    '<p>Em Hrimgard um rival cai na neve no meio do duelo. O aprendiz pode esperar que ele se levante, aproveitar a queda ou encerrar empatado. Dos três, o Olho só sorri para dois.</p>' +
    '<h3>Valhalla espera</h3>' +
    '<p>Na última prova, Thorgrim é ferido de morte. O aprendiz luta ao lado dele até o fim, ou o arrasta aos curandeiros contra a vontade, ou lhe dá a morte honrosa num último duelo. Quem termina recebe o título de <b>Guerreiro do Corvo</b>. E os outros sete caminhos? Ainda estou subindo as estradas deles.</p>' +
    '<h3>Notas do cronista</h3><p class="fnote"><span class="nb">✎</span>No salão do clã há um escudo antigo pendurado acima do trono, com um nome riscado e outro gravado por cima: Ulfar. Thorgrim diz que é só um escudo. Os corvos da fortaleza não pousam nele.</p>'  });

  add({ toc: 'Livro XX — O que se carrega', lv: 'XX', eyebrow: 'Livro XX', title: 'O que se carrega pela estrada', start: true, body:
    '<p>Um caminhante é também o que leva consigo. A Biblioteca guarda listas de coisas que passaram por muitas mãos, e as mais raras têm nome. Há sete degraus de raridade, do comum cinzento ao mágico, ao raro, ao lendário, ao épico. Acima deles estão os <b>únicos</b>, peças de uma cultura com poder próprio, e as <b>relíquias</b>, que mudam o jeito de lutar e às vezes nem são armas.</p>' +
    '<h3>Das culturas</h3>' +
    '<p>Os nórdicos contam do Mjölnir, de Gungnir e das Botas de Sleipnir. Os anões, da Égide de Eitr e da Brasa de Surtr, que faz arder tudo o que toca. Os paladinos, de Excalibur e do Cálice de Marghar, que impede a morte uma vez a cada tanto. Os caçadores, da Besta de Prata de Van Rhal. Os vampiros falam baixo do Coração de Drácula; os lobisomens, da Presa do Primeiro Uivo; os bruxos, do Livro Sem Passos, cujas magias custam um pouco de vida. Uma relíquia quase sempre chega a quem é da sua cultura, como se soubesse para quem cair.</p>' +
    '<p>Nada disso é rosa, aliás. Perguntei por quê, e um ferreiro anão me olhou como se eu fosse louco.</p>' });

  add({ toc: 'Livro XXI — Os que caminham juntos', lv: 'XXI', eyebrow: 'Livro XXI', title: 'Os que caminham juntos', start: true, body:
    '<p>Por muito tempo escrevi sobre almas que andavam sozinhas. Já não é assim. Hoje os caminhantes se juntam em grupos de até seis, e um grupo é uma coisa curiosa de se observar: a fera que um derruba conta para todos, e a missão que um aceita aparece, como num sussurro, para os outros. Mas ninguém é carregado: entre os do grupo, a diferença de experiência não pode passar de dez níveis.</p>' +
    '<h3>O corvo e o quadro</h3>' +
    '<p>Toda vila tem uma caixa de correio de ferro com um corvo no topo. Pelo corvo vão cartas, ouro, peças e cobranças, e o corvo espera quem não está para entregar quando chegar. No Quadro da Praça, além dos contratos dos moradores, os caminhantes pregam os seus próprios pedidos, deixam o ouro sob guarda e esperam quem os cumpra.</p>' });
  add({ lv: 'XXI', body:
    '<h3>Quando as bandeiras se cruzam</h3>' +
    '<p>Fora das vilas, o Fio e os Desfiados se atacam quando se encontram, e ninguém paga em karma por defender a sua bandeira. Ninguém é obrigado a lutar, porém. Dentro das vilas a terra é sagrada, e nenhuma lâmina corta.</p>' +
    '<p>Entre os da mesma bandeira é diferente. Um não fere o outro, a não ser que tome a decisão, consciente, de caçar o próprio lado. Quem faz isso tem o nome escrito em vermelho, e o Olho cobra a cada golpe. Quem revida, porém, nada deve.</p>' +
    '<p>E há o duelo, combinado entre dois, que vale em qualquer lugar e em que ninguém morre: perde quem cai de joelhos primeiro. Os anões chamam isso de conversa.</p>' });

  add({ toc: 'Livro XXII — O Fio da Vida', lv: 'XXII', eyebrow: 'Livro XXII', title: 'O Fio da Vida', start: true, body:
    '<p>Há quem pense que a morte, em Karmika, é uma porta que só se abre uma vez. Não é bem assim. Toda alma que caminha está presa ao corpo por um fio, e o fio tem <b>três fôlegos</b>. Quem cai na estrada levanta na fonte do seu lar: é uma queda, e o fio perde um fôlego. Os fôlegos voltam devagar, um a cada dia, como a respiração de quem dorme.</p>' +
    '<p>Antes do vigésimo nível, quando o Olho ainda dorme, ninguém gasta o fio. Marghar não cobra de quem ainda não foi visto.</p>' +
    '<h3>Quando o fio se rompe</h3>' +
    '<p>Quem cai sem nenhum fôlego <b>desencarna</b>. Os que viram contam sempre a mesma coisa: uma faísca sai do corpo caído, cresce um pouco, começa a vibrar e, de repente, sobe, rápida e fina como uma agulha, até sumir no céu.</p>' +
    '<p>A alma chega então ao <b>centro do labirinto</b>, que os velhos chamam de <b>Limiar</b>. É um chão de luz suspenso sobre Karmika. Lá de cima se vê o labirinto inteiro, até onde a vista alcança: muros que se erguem e cedem, corredores que se fecham e se abrem, lugares que escurecem num caminho negro e outros que clareiam. É o mundo acontecendo, agora, lá embaixo.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Os que esperam no centro</h3>' +
    '<p>À esquerda de quem chega está <b>Orvalen, o Leitor de Rastros</b>, de capuz, com um cajado e uma lanterna fria. Os rastros de luz giram nos pés dele. É ele quem lê a vida que acabou, passo por passo, e quem a devolve ou a apaga.</p>' +
    '<p>À direita está <b>Sael, a Que Voltou</b>, a única que chegou ao centro e retornou. Ela segura um fio de ouro que vai da mão dela até a alma recém-chegada, e é ela quem guia a volta.</p>' +
    '<p>Entre os dois e o fundo flutua o <b>Olho Kármico</b>, olhando para quem chegou. E bem ao fundo, num brilho dourado, percebe-se uma silhueta imensa, calma, debruçada sobre uma piscina cósmica: <b>Marghar</b>, vendo tudo o que acontece. Ninguém o viu erguer os olhos. Ali a alma conversa com os dois Essenciais e escolhe, e só há três escolhas.</p>' });
  add({ lv: 'XXII', body:
    '<h3>As três voltas</h3>' +
    '<ul class="plain">' +
    '<li><b>Voltar ao mesmo corpo.</b> Orvalen devolve os rastros como estão. A alma entra de novo onde estava, igual, e volta devendo. Os velhos chamam isso de <b>Dívida Kármica</b>: metade de tudo o que a alma aprende depois paga o que ela deixou de andar, até a conta fechar.</li>' +
    '<li><b>Reencarnar.</b> Orvalen apaga os rastros do corpo, e Sael leva a alma até um corpo novo. A alma escolhe outro povo e outro rosto e guarda o resto: o nome, o quanto já andou, o que carregava, o ouro, o cofre e as promessas. Só a classe fica para trás, e o caminho é lido de novo por Hrefna. As magias e a força do corpo antigo voltam como pontos soltos, para a alma arrumar o que errou.</li>' +
    '<li><b>Pagar com uma Lágrima.</b> Quem guarda uma Lágrima do Olho a oferece ao Olho e paga a volta inteira, sem dívida nenhuma. A alma reencontra o corpo no lugar sagrado do seu caminho: o paladino na Abadia da Aurora, o technocrata na Academia, o vampiro no castelo do Conde.</li>' +
    '</ul>' +
    '<h3>O eco da vida passada</h3>' +
    '<p>Quem reencarna e volta à mesma estrada encontra um eco. O corpo novo não sabe, mas a alma lembra, e aprende <b>quatro vezes mais rápido</b> até alcançar o ponto em que caiu. Ali o eco se cala, e a estrada volta a ter o passo de sempre. Os mestres das academias reconhecem esses alunos: aprendem como quem relembra.</p>' });
  add({ lv: 'XXII', body:
    '<h3>O Olho que vê e esconde</h3>' +
    '<p>Quem sobe ao Limiar vê o Olho de perto e repara numa coisa que ninguém conta cá embaixo. Da parte de cima dele sai, sem parar, uma energia dourada e viva, que sobe como fumaça de incenso e encobre o rosto de Marghar. Da parte de baixo escorre uma névoa escura e densa, do mesmo azul da Ampulheta, que desce devagar até o labirinto e se perde entre os muros.</p>' +
    '<p>Os que voltaram dizem que entenderam ali o que os sacerdotes nunca souberam explicar: o Olho que vê você é o mesmo véu que esconde quem olha. Ninguém vê Marghar, porque o próprio olhar dele está no caminho. E o karma não para dentro do Olho. Ele sai, o tempo todo, para cima e para baixo, cada metade com a sua verdade: o que clareia sobe em ouro, o que pesa desce em névoa.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Por que ele não age</h3>' +
    '<p>Perguntei a Sael, nas poucas linhas que dela restam nos arquivos, por que Marghar não impede o mal. A resposta que anotaram é a mais longa que se tem de uma Essência:</p>' +
    '<blockquote>Porque ele não age. Não impede, não mata, não julga. Nunca o vi erguer a mão, nem para salvar, nem para punir. Marghar é o querer, e o desejo de querer. É o parar, e o desejo de parar. É o caminho e é o passo, e antes dos dois é a vontade de caminhar. Quem age é quem anda. Ele só vê, e guarda, e um dia devolve.</blockquote>' +
    '<p>Os anciãos de Askavik leem nisso uma promessa; os Desfiados, uma acusação. Eu leio as duas coisas, e não sei escolher.</p>' });
  add({ lv: 'XXII', body:
    '<h3>A pergunta que ninguém responde</h3>' +
    '<p>Orvalen, que lê rastros desde antes de existirem nomes, deixou registrada uma dúvida que eu hesito em copiar. Ele se pergunta se Marghar não seria também Ahzur. Se aquilo que chamamos de deus dos caminhos não seria um sistema sem fim, que se alimenta de si mesmo e de si mesmo se devora, como a serpente que morde a própria cauda e desenha, com o corpo, o sinal do infinito. O caminho e a destruição do caminho, contemplando a si mesmo o tempo todo.</p>' +
    '<p>Sael, dizem, mandou que ele se calasse. Não por ser mentira, mas porque Marghar ouve tudo e nunca responde.</p>' +
    '<h3>E nós</h3>' +
    '<p>Se tudo é Marghar, nós também somos parte dele. Somos caminhantes, e somos caminho. Somos fome, e somos alimento. Talvez seja por isso que o labirinto existe: não para nos esconder para sempre, mas para nos dar tempo de escolher qual das duas coisas ser antes que a Fome chegue.</p>' +
    '<p>Não sei responder a nada disso. Anoto, e sigo andando, que é o que todo caminhante faz.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Sou eu</h3>' +
    '<p>O que mais me diverte nos registros é uma cena que se repete em toda praça. Dois caminhantes se encontram, e um diz ao outro: sou eu, o Brakka. Mas você não era anão? Era. Agora sou elfo.</p>' +
    '<p>A alma é a mesma, o nome é o mesmo, e o karma também. O karma, aliás, nunca fica no corpo que caiu: ele é da alma e atravessa todas as vidas, junto com as Lágrimas e com as dívidas.</p>' +
    '<p>Quem pede para ver o perfil de alguém encontra ali as vidas passadas, uma por uma: o povo, o caminho e até onde cada uma chegou. Eu, que sei ler peles, prefiro ler essas listas. Elas mentem menos.</p>' +
    '<h3>Notas do cronista</h3><p class="fnote"><span class="nb">✎</span>Todos os relatos dizem que Sael voltou do centro. Nenhum diz o que ela foi fazer lá, nem quem estava no centro antes dela. E os que subiram ao Limiar mais de uma vez juram que, numa das vezes, ela segurava dois fios. Perguntaram-lhe pelo outro. Ela sorriu e não respondeu.</p>'  });

  add({ toc: 'Livro XXIII — O preço de cada caminho', lv: 'XXIII', eyebrow: 'Livro XXIII', title: 'O preço de cada caminho', start: true, body:
    '<p>Andei muito para escrever este livro, e o que aprendi cabe numa linha: <b>nenhum caminho é de graça</b>. Cada um dá ao caminhante uma força que os outros invejam, e cobra dele uma fraqueza que só os outros sabem curar.</p>' +
    '<p>Os mestres das academias não gostam que se diga isso em voz alta, porque parece fraqueza da escola. Eu acho o contrário. É essa conta que mantém o mundo de pé: o guerreiro precisa do mago e do bruxo, o vampiro precisa do anão e do tecnocrata, o lobo precisa até do vampiro, que é o que mais lhe dói. Ninguém em Karmika vive sozinho por muito tempo. Quem tenta, enlouquece, morre de fome ou apaga.</p>' +
    '<p>E a conta não vence de um dia para o outro. Os mais velhos medem em <b>turnos</b>, e dizem que são <b>vinte</b> os turnos de estrada que um caminhante aguenta antes que o seu preço fique insuportável. Nos primeiros doze, quase nada se sente. Depois disso, pesa.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Do guerreiro que ouve os mortos</h3>' +
    '<p>O guerreiro do Norte é o mais forte de todos nós no corpo a corpo, e é por isso que é o que mais mata. Cada morte deixa nele um resto de fúria. Primeiro vem o <b>frenesi</b>, e ele bate mais forte, mas esquece a guarda. Depois vem a <b>loucura</b>, e é aí que o preço aparece: o guerreiro louco quer fazer o bem e não consegue, porque o sangue fala mais alto, e a alma escurece devagar, como brasa coberta.</p>' +
    '<p>Para voltar a si, ele presta condolências a Odin pelos que caíram e mortifica o corpo nos <b>rituais de calmaria</b>. Precisa dos incensos de mortificação e purificação, e esses incensos só os magos e os bruxos sabem fazer. Nenhum dos dois os faz sozinho: o mago precisa das <b>Cinzas dos Mortos</b>, que só o bruxo recolhe, e o bruxo precisa da <b>Areia da Iluminação Astral</b>, que só o mago guarda. Vi a Arquimaga Seline, no Pináculo, comprar cinzas da Bruxa Grisolda de Gorvath com a cara de quem engole vinagre. E vi a bruxa fazer a mesma cara.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Do paladino que duvida</h3>' +
    '<p>A fraqueza do paladino não está na espada nem no escudo. Está na pergunta que ele faz à noite, depois de tantas batalhas contra entidades e demônios: <em>será que a minha guerra pela paz derrama mais sangue do que os próprios malditos?</em> Essa <b>Dúvida</b> cresce a cada morte, e mais ainda quando o morto era gente. Quando ela cresce, a Luz responde menos às suas mãos; quando transborda, a fé vacila, as boas escolhas não pesam e o karma escorre.</p>' +
    '<p>O remédio é antigo: o <b>Jejum e Oração</b>. O paladino come o <b>Pão Ázimo</b>, que os cozinheiros humanos fazem com o <b>Trigo sem Fermento</b>, cuja semente os tecnocratas mexeram na estufa de latão e que só as mãos élficas fazem brotar, e bebe o <b>Vinho Santo</b> dos anões, que só fica santo com a <b>Gota de Lágrima Santa</b> que as anciãs de Lithendel recolhem antes do sol. Cinco mãos numa única refeição. Talvez seja essa a resposta para a Dúvida, e não o vinho.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Do vampiro e da sede</h3>' +
    '<p>O vampiro é rei da noite: mais forte, mais rápido, golpes que o olho mal acompanha, e cada ferida que abre lhe devolve um pouco de vida. Mas o sol o enfraquece e o queima, e por isso ele procura as cidades de sombra, como Corvoscuro, ou as matas fechadas. E há a <b>sede</b>. O <b>Sangue Diluído</b> da alquimista e o sangue de bicho enganam por um tempo, cada vez menos. Cedo ou tarde o corpo pede sangue de gente: humano, anão ou elfo. Quem bebe de gente mata a sede e escurece a alma.</p>' +
    '<p>O vampiro que quer seguir o bem tem um caminho, e ele é caro: a <b>Injeção Automática de Sangue</b> dos tecnocratas, feita com a <b>Sangria Concentrada</b> que os anões recolhem de doadores na Casa de Sangria de Brasaforja. Ninguém morre por ela. A Sangradora Hulda faz questão de dizer isso a quem entra.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Do lobo e da fome</h3>' +
    '<p>O licantropo é maior e mais forte que um homem, e de dia luta como homem, com porretes, maças e alabardas toscas. A forma da besta só vem com a noite. E a fera tem <b>fome de carne de gente</b>, de qualquer povo: o humano é o que ela mais deseja, o anão é duro de mastigar e o elfo é magro, quase sem gordura. Carne de bicho engana por um tempo, até o dia em que já não enche. Com fome, o lobo fica lento e fraco. Quem come gente sacia a fome e mancha a alma.</p>' +
    '<p>O lobo que escolhe o bem precisa engolir o orgulho. A única carne que sacia sem vítima é a <b>Charcutaria Secular</b>, carne curada há séculos nas adegas de Corvoscuro, e quem a vende são os vampiros. O Sommelier Vasko serve o lobo com um sorriso de canto e pede que ele coma lá fora. Os mais orgulhosos mandam um tecnocrata ou um anão comprar por eles.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Do tecnocrata e do coração de latão</h3>' +
    '<p>O tecnocrata não empunha espada, adaga nem arco: luta com as armas da Academia, com a manopla, com as torres e com a esfera que voa ao seu lado, que ataca, cura o grupo ou o defende, conforme a postura dele. Mas tudo isso vem do <b>reator pessoal</b> nas costas, e o reator gasta. Um <b>Núcleo de Reator</b> custa caro e dura bem, oito turnos o primeiro, vinte o da segunda classe da Academia. Vazio, a energia não volta e a esfera apaga.</p>' +
    '<p>O ferreiro faz o casco do núcleo, mas não o completa sozinho: precisa do <b>Fluido Vital</b> do alquimista e do <b>Cristal Arcano</b> que os magos carregam no Pináculo. Por isso o tecnocrata é, de todos, o que mais precisa de comércio. Quem não vende, não acende.</p>' +
    '<h3>Dos que leem, dos que pactuam e dos que vigiam</h3>' +
    '<p>O <b>mago</b> lança tanta magia que o eco dela fica na cabeça. Com o tempo vira <b>soberba</b>: ele olha de cima para os simples, e a magia racha na mão. Cura-se com os pés no chão, no <b>Ritual do Aterramento</b>: o Unguento da Terra das curtidoras do Uivo Antigo e a Água Benta da Abadia da Aurora. Nada humilha tanto um mago quanto pedir terra de toca a um lobo.</p>' +
    '<p>O <b>bruxo</b> não tem magia própria: pega emprestado de Malgrath, e Malgrath cobra juros. Quando a dívida cresce, o patrono segura uma parte da vida dele, e por fim manda o <b>Cobrador do Pacto</b>. A dívida se paga com a <b>Oferenda</b>: um Coração de Demônio, que só os caçadores do Clã Helsing arrancam sem que apodreça, e um Chifre de Sangue, que só o guerreiro do Norte enche no campo de batalha.</p>' +
    '<p>O <b>caçador de demônios</b> serve a Aravel, cujo olho nunca fecha, e por isso não dorme. A vista turva, e depois ele vê demônio em todo rosto. Só dorme com o <b>Sono Guardado</b>: o Pó do Sono Sem Sonhos, que quem faz é o bruxo, justamente quem ele caça, e o Sino de Guarda dos tecnocratas, que toca sozinho se algo se aproxima.</p>' +
    '<h3>Do preço de uma vida</h3>' +
    '<p>Perguntaram-me quanto vale uma vida no Olho. Respondi com a conta das próprias feras: quem come gente compra vinte turnos de paz, e o Olho cobra os vinte e mais um, pela vida. Vinte e um. E se a vítima era um caminhante, cuja alma volta e lembra, o Olho cobra o dobro, porque são duas vidas: a que acabou e a que terá de recomeçar.</p>' +
    '<h3>Do equilíbrio</h3>' +
    '<p>Perguntei a um mestre por que as academias aceitam tanto preço. Ele me respondeu sem levantar os olhos: <em>porque sem preço, o forte vira deus, e deus não precisa de ninguém</em>.</p>' });

  add({ toc: 'Livro XXIV — Dos ofícios, dos bichos e dos céus', lv: 'XXIV', eyebrow: 'Livro XXIV', title: 'Dos ofícios, dos bichos e dos céus', start: true, body:
    '<p>Este livro é de coisas pequenas, e por isso mesmo verdadeiras. Ninguém lembra do herói pela espada; lembram dele pela forja onde ela foi feita, pelo gato que dormia no seu colo e pela noite em que a lua ficou vermelha e ele não fugiu.</p>' +
    '<h3>Das casas de ofício</h3>' +
    '<p>Toda vila e toda cidade de Karmika tem os seus cinco ofícios em volta da praça. Ninguém aplaina tábua no meio do mato. Nas <b>cidades</b>, como Askavik e Karmika, cada ofício tem a sua casa:</p>' +
    '<ul><li>a <b>Marcenaria</b>, um galpão aberto de toras, com as serras penduradas na parede, a serra de quadro sobre a tora e o torno de pedal;</li><li>a <b>Forja</b>, com a chaminé de pedra e a boca em arco sempre acesa, os foles de couro e as duas bigornas;</li><li>o <b>Curtume e Alfaiataria</b>, com as tinas de tingir e os couros no varal;</li><li>o <b>Apotecário</b>, com a sua antessala de balcão e a sala do alambique atrás;</li><li>a <b>Escola de Cozinha</b>, com o forno de tijolo e as mesas dos aprendizes;</li><li>e a <b>Casa de Tecnologia</b>, de chapas rebitadas, com a bobina de Tesla no telhado, que serve ao tecnocrata de forja e de bancada.</li></ul>' +
    '<p>Nas <b>vilas</b> tudo é mais simples: o Barracão de Corte, a Forja ao Ar Livre, a Mesa do Curtidor, o Apotecário e a Cozinha dos Fundos, que se entra pela porta de trás da taverna. As vilas de vapor do sul guardam também a sua Oficina de Latão.</p>' });
  add({ lv: 'XXIV', body:
    '<h3>Do Estábulo e dos companheiros</h3>' +
    '<p>O bicho que você compra não anda na sua mochila: ele mora no seu <b>Estábulo</b>, e de lá sai para andar com você. Cada um tem nome, que você pode trocar, fome e vínculo. Bicho com fome busca devagar e não briga; bicho que te adora volta mais rápido para te ajudar.</p>' +
    '<ul><li><b>Gatinho Malhado</b> e <b>Raposa Ruiva</b>: no combate soltam o <b>Alarido</b>, e quem vinha para cima de você para por um instante.</li><li><b>Gata Preta</b> e <b>Ratinho de Porão</b>: o <b>Faro</b> acha o que caiu longe, e o guincho distrai.</li><li><b>Filhote de Lobo</b>: a <b>Mordida</b>, nas canelas de quem te ataca.</li><li><b>Leitão Malhado</b>: <b>Fuça</b> a terra quando você descansa e às vezes traz uma maçã, um pão ou umas moedas.</li></ul>' +
    '<p>O pet veste <b>Coleira</b> e <b>Peitoral</b>. A coleira faz buscar mais rápido; o peitoral faz a habilidade voltar mais cedo, e o de ferro deixa a mordida mais funda. Pets, coleiras e peitorais se compram com <b>Corwin, o Domador</b>. Cavalos e feno, com <b>Orm, o Estalajadeiro</b>: o Cavalo Baio, o Cavalo Ruço e o Corcel Negro. Cavalo com fome corre menos.</p>' +
    '<p>E o pet vai com você até o fundo das masmorras. Bicho fiel não fica na porta.</p>' });
  add({ lv: 'XXIV', body:
    '<h3>Dos céus que mudam</h3>' +
    '<p>Duas vezes por dia, mais ou menos, o mundo inteiro muda de cor. Os eventos mundiais andam cerca de uma hora e meia mais cedo a cada dia, e em uma semana passam por todas as horas, para que ninguém fique sempre de fora.</p>' +
    '<p>Na <b>Lua de Sangue</b> o céu sangra na chegada, e depois o rubro assenta, mas não vai embora. Ela causa:</p>' +
    '<ul><li>patrulhas atacadas e mordidas de lobisomem cinco vezes mais comuns nas estradas;</li><li>um lobisomem a mais em cada onda, chegando dois níveis acima do normal;</li><li>vampiros, lobisomens, bruxos e almas de karma −20 ou menos: +10% de dano e −8% de dano recebido;</li><li>paladinos, magos e almas de karma +20 ou mais: +6% de dano recebido;</li><li>e ao lobisomem de Faro ligado, +15% de XP.</li></ul>' +
    '<p>No <b>Dia da Aurora</b> é o contrário: procissões de Auréon seis vezes mais comuns, atos de luz valendo metade a mais de karma, a força para as almas claras e o peso para as escuras.</p>' +
    '<p>Quem quiser lembrar do que o céu anda fazendo olha o <b>contador embaixo do mapa</b>: ele diz quanto falta para acabar ou para começar, e mostra o que já passou e o que você fez nele.</p>' });
  add({ lv: 'XXIV', body:
    '<h3>Da idade das feras</h3>' +
    '<p>Os velhos caçadores dizem: <em>quem tem a caveira sobre a cabeça não é para você</em>. Uma fera cinco níveis acima bate quase duas vezes mais forte; oito acima, mais de duas vezes; nunca mais de três. E o seu golpe escorrega nela: perde força a cada nível de diferença e às vezes simplesmente erra. A fera abaixo de você, ao contrário, machuca menos. Não é sorte nem azar, e não entra na conta das bênçãos: é a idade da fera.</p>' +
    '<h3>Das vozes da vila</h3>' +
    '<p>O povo de Karmika fala. Não o tempo todo, mas fala: comenta o frio, a hora, a lua vermelha, a sua briga na praça, o sangue no seu rosto, o seu cavalo e o nome do seu gato. Sabe do seu karma e desconfia do seu caminho. O guarda fala de portão, o ferreiro de fio de lâmina, a taverna de ensopado. Quem presta atenção aprende mais nas ruas do que nos livros, inclusive neste.</p>' });
  add({ toc: 'Livro XXV — Os que carregam a bandeira', lv: 'XXV', eyebrow: 'Livro XXV', title: 'Os que carregam a bandeira', start: true, body:
    '<p>No décimo quinto livro contei das duas bandeiras como quem conta de duas ideias. Mas ideia nenhuma anda sozinha pela estrada. Anda gente. E foi para conhecer a gente que carrega cada bandeira que gastei os últimos anos de sola, de Austrvik à Colina, de Sudrholt ao Vale, e também de bota, porque um anão me fez subir a muralha de Brasaforja duas vezes para me mostrar um tijolo.</p>' +
    '<p>Descobri que cada caminho tem a sua <b>casa</b>, um lugar onde o caminho mora e tem nome, e que cada casa tem um mestre que não sai dela, como o rei não sai do castelo. E descobri que, além dos mestres, cada caminho tem alguém que <b>anda</b>: um portador, um dos poucos que levam a bandeira para onde ela ainda não chegou. Foi com esses que andei. Nem todos andam com todos: quando a missão é de espada, mandam o de espada; quando é de palavra, mandam o de palavra; quando é de mistério, mandam a mim, o que diz muito sobre a opinião que têm do mistério.</p>' +
    '<h3>As casas do Fio</h3>' +
    '<p>A <b>Ordem de Auréon</b> mora na Abadia da Aurora, em Austrvik, onde os sinos acordam a cidade há trezentos anos. O seu mestre é o <b>Grão-Mestre Cassius</b>, velho, quente e grave, que recebe cada noviço com a mesma frase: joelho no chão não é humilhação, é descanso. O <b>Clã Helsing</b>, os caçadores de prata, mora no Bastião de Prata, em Sudrholt, e obedece à <b>Mestra Ilsa Van Rhal</b>, de cuja família é a Besta de Prata. O <b>Círculo do Pináculo</b>, que o povo chama de Torre de Marfim, acende todas as noites em Lumenhal, e quem o rege é o <b>Arquimago Aurelian Vesk</b>, com a <b>Arquimaga Seline</b> ao lado, a que compra cinzas de bruxa com cara de quem engole vinagre.</p>' });
  add({ lv: 'XXV', body:
    '<h3>As casas dos Desfiados</h3>' +
    '<p>A <b>Casa Noctavar</b>, que os de fora chamam de Corte do Conde, está de pé há mil anos no castelo da Colina Vampírica, sobre Corvoscuro, e está de pé por três leis que nenhum dos seus quebra: não beber de quem está sob a sua proteção, não criar cria sem o consentimento da Casa, não mentir ao Ancião. O Ancião é o <b>Conde Vladislav III</b>. Quem serve a mesa é o <b>Sommelier Vasko</b>, que tem mil anos de vinho e dois minutos de paciência, e que serve o lobisomem com um sorriso de canto e um prato na porta: “lá fora, por favor, o tapete é mais velho do que você”.</p>' +
    '<p>A <b>Matilha do Uivo Antigo</b> vive na Selva Licantropa, tem uma lei só, ninguém fica para trás, e uma mãe, <b>Ulfrun, a Mãe-Alfa</b>. Passei uma semana com a matilha e saí convencido de que lobisomens e anões são o mesmo povo com pelagens diferentes: brutos, diretos, comem fazendo barulho, xingam o que amam e cumprem o que dizem. Um filhote me perguntou se cronista tem gosto de quê. Respondi que de papel. Ele perdeu o interesse.</p>' +
    '<p>O <b>Pacto de Gorvath</b> reúne os bruxos do Vale da Desgraça; o seu patrono é <b>Malgrath</b>, que é príncipe e não mestre, e a mais velha do Pacto é a <b>Bruxa Grisolda</b>, a que recolhe as Cinzas dos Mortos e cobra por elas o que a sua cara de vinagre permitir.</p>' +
    '<h3>Quem anda pelas terras da sombra</h3>' +
    '<p>Reparei em quem circula por Corvoscuro, pelo Uivo e pelo Vale sem ser tocado. Os <b>elfos</b>, porque até o vampiro mais velho respeita quem é bom por natureza e magro demais para a mesa. Os <b>tecnocratas</b>, porque não se morde quem conserta o relógio. Os <b>humanos</b>, não: humano ali é presa, e sabe disso, e anda rápido. E os <b>anões</b> não vão, porque odeiam a turma de lá; mas vendem, e a sombra sobe a Brasaforja para comprar ferro e sangue de doador na Casa de Sangria, pelo mesmo preço que paga o Fio. Perguntei a um anão como se vende a quem se odeia. “Sujeira debaixo do tapete é problema deles. O tapete eu não vendo. O ferro, sim.”</p>' });
  add({ lv: 'XXV', body:
    '<h3>As casas que não juram</h3>' +
    '<p>O <b>Clã do Corvo</b> guarda a Fortaleza de Odin, em Jarlsheim, sob <b>Thorgrim Mão-de-Ferro</b>. No salão há dois corvos entalhados, um de cada lado do trono, e os guerreiros juram que são os de Odin: um pensa, o outro lembra. Diz Thorgrim que um guerreiro que escuta um só dos dois vira louco ou vira covarde, e que a façanha de uma vida inteira é ficar sentado no meio, como o Pai de Todos. A <b>Irmandade do Vapor</b> é como os tecnocratas chamam a si mesmos quando não estão vendendo nada: a Academia da Graxa, em Porto Caldeira, com a <b>Arquiteta Ylva</b>, e a Companhia das Caravanas de Latão, com a <b>Feitora Brunna</b>, que leva qualquer coisa a qualquer lugar e diz que o caminho não reza.</p>' +
    '<p>E há Askavik, que não é casa de nenhum caminho e é casa de todos: a Tecelagem Real do Fio, da <b>Mestra Ingeborg</b>, e a Tecelagem dos Desfiados, de <b>Corvina, a Desfiadora</b>, uma de cada lado da mesma rua. Não se cumprimentam há vinte anos, mas as duas compram linha do mesmo mercador, que vende para as duas com o mesmo sorriso e cobra das duas o mesmo preço, e é, portanto, a pessoa mais honesta de Askavik.</p>' +
    '<h3>Os que ficaram comuns</h3>' +
    '<p>Antes dos portadores das classes, preciso falar dos que recusaram a Vidente e ficaram o que nasceram. Não são menos. Em certos dias, são mais.</p>' +
    '<p>O <b>Velho Ansgar</b>, o Ancião de Karmika, recusou a Vidente três vidas seguidas e lembra das três. Senta na praça, perto da fonte, e corrige a história de todo mundo: “não foi assim”. Quando perguntei por que não escolheu um caminho, respondeu: “Escolhi. Escolhi ficar. É o único caminho em que ninguém manda em você, e por isso ninguém te ajuda. Dá para viver.” Diz que a palavra dada é tudo o que um humano tem, e que por isso a dele é curta.</p>' });
  add({ lv: 'XXV', body:
    '<p>A <b>Mestra-de-Obras Dagny Pé-de-Chumbo</b> comanda a Grande Obra de Brasaforja, a muralha nova, e mede tudo com uma fita métrica, inclusive promessas: “fio de bigode tem dois dedos; a sua promessa deu um e meio, volta amanhã”. Xinga a pedra, xinga o capataz, xinga o Rei Thrain pelas costas e já ergueu três pontes que ninguém pediu porque “ia precisar”. Odeia sujeira debaixo do tapete a ponto de não ter tapete, e mesmo assim vende ferro para o Fio e para os Desfiados pelo mesmo preço, porque fio de bigode não tem bandeira: “negócio é negócio, palavra é palavra, e o tapete é problema deles”. Quando caiu uma galeria em Cinzalto e o capataz escondeu, ela desceu sozinha, tirou os quatro soterrados e deixou o capataz lá embaixo até o fim do turno, “para aprender o que é esconder”.</p>' +
    '<p><b>Lirien Folha-Tarde</b> é emissária da Copa de Lithendel e a única criatura que eu vi jantar com o Conde, almoçar com a matilha e tomar chá em Gorvath na mesma semana sem perder um fio de cabelo. É elfa pura, recusou a Vidente, e é bem-vinda nas três casas da sombra porque, dizem lá, “elfo não mente e não engorda”. Fala pouco, com uma ironia tão fina que o insultado agradece. Numa vida anterior, me contou de passagem, foi vampira. Voltou elfa. Diz que o ciclo de aliança se quebra uma vez para a gente saber o que ele vale. Explicou-me também o que a Copa perdoa e o que não perdoa: um elfo de karma escuro, que ergue a sua cidade entre os da sombra e a quem chamam de <b>elfo negro</b>, não ofende ninguém em Lithendel, porque o escuro também é uma ordem, e ordem a mata respeita. O que a mata não perdoa é trair a natureza: fazer-se outra coisa. “Eu traí uma vez. Paguei. Por isso me deixam andar.”</p>' +
    '<h3>Aldric, que lê os nomes</h3>' +
    '<p>O primeiro portador de classe que conheci foi o <b>Paladino Aldric</b>, emissário da Ordem do Fio em Askavik. Já escrevi que ele é sincero até doer, e é. O que não tinha escrito é o que ele guarda por dentro do escudo: gravados na madeira, um abaixo do outro, os nomes de cada pessoa que ele não conseguiu guardar. Ele os lê toda noite, antes de dormir, em voz baixa. “Porque a Ordem jura que ninguém atravessa só. Eles atravessaram. Alguém tem que ir junto, nem que seja depois.” É Aldric quem recebe os que chegam a Askavik e lhes mostra o Labirinto como quem mostra uma casa: cada corredor é alguém que ainda respira.</p>' });
  add({ lv: 'XXV', body:
    '<h3>Vesna Helsing, que não dorme</h3>' +
    '<p>A <b>Caçadora Vesna Helsing</b> não nasceu Helsing. Nasceu numa vila que não existe mais, perto de Sudrholt, e tinha seis anos quando um ninho a levou. O Bastião a recolheu como recolhe todos os órfãos da noite, e ela tomou o nome do clã como se toma uma arma. Carrega no pulso um sininho de guarda que toca sozinho se algo se aproxima, e não dorme mais do que três horas por noite, porque Aravel não dorme nenhuma. É ácida de um jeito que só o cansaço dá: chama os paladinos de escoteiros, na cara deles, e diz que uma luz que espera o monstro pedir perdão é uma luz que chega tarde. Cada órfão que o Bastião recolhe é a vila dela de novo. É por isso que ela não para.</p>' +
    '<h3>Ísold Pena-Clara, que copia à mão</h3>' +
    '<p>No Pináculo há uma sala onde ficam os livros que ninguém deve ler, e há uma maga que os copia à mão, um por um, à luz fraca. É <b>Ísold Pena-Clara</b>. “Porque a cópia não mente. O original, às vezes, sim.” Foi a primeira pessoa que ouvi dizer que um grimório da Torre tinha uma sílaba errada na última linha, e a primeira a culpar a podridão de Zerath por isso. Tem uma soberba doce, de quem sabe mais e acha engraçado. Ri do caçador e do paladino quando brigam, e os dois a odeiam por isso com a mesma força, o que ela considera a sua maior obra. Quando lhe disse isso, respondeu que eu estava copiando errado.</p>' +
    '<h3>Lady Mirela, que nunca quebrou uma lei</h3>' +
    '<p>Do lado dos Desfiados, a voz que fala pelas estradas é a de <b>Lady Mirela</b>, herdeira da Casa Noctavar. Educada como uma lâmina. Jurou as três leis da Casa aos quinze anos e nunca quebrou nenhuma, o que, entre vampiros de mil anos, é mais raro do que parece. Acha o lobisomem um animal e diz isso com uma cortesia perfeita, que o lobisomem leva como insulto, acertadamente. Recebe os que chegam a Askavik pelo outro lado da rua, com uma pergunta só: “Você já morreu? Vai morrer. E vai voltar. E vai morrer de novo. Chame isso de proteção, se quiser.”</p>' });
  add({ lv: 'XXV', body:
    '<h3>Varg Dente-Partido, que não deixa ninguém</h3>' +
    '<p><b>Varg Dente-Partido</b> é o segundo de Ulfrun e, se Ulfrun não estiver ouvindo, o anão da matilha. Perdeu um filhote da sua ninhada para a prata do Clã Helsing e quebrou o próprio dente mordendo a gaiola em que o levavam. Não a soltou. Desde então não deixa ninguém para trás, nem o inimigo caído, nem o prato. Odeia o vampiro com o ódio da primeira lua, mas senta à mesma mesa quando a Mãe-Alfa manda, come em silêncio por uns trinta segundos e depois pergunta ao Vasko se o vinho é de uva ou de gente. O Vasko nunca responde. Varg acha que isso é resposta.</p>' +
    '<h3>Ravena Cinco-Cláusulas, que lê a letra miúda</h3>' +
    '<p>A bruxa mais nova de Gorvath só assina pactos de cinco cláusulas. “O resto é vaidade.” <b>Ravena Cinco-Cláusulas</b> lê letra miúda melhor do que o próprio Malgrath, e ele sabe, e é por isso que a usa para escrever o que os outros assinam. Acha o vampiro e o lobo duas crianças brigando no quintal, e já disse isso aos dois, por escrito, em cinco cláusulas. Foi ela quem redigiu a trégua entre a Casa e a Matilha e foi ela quem cobrou dos dois quando a quebraram, na mesma noite, com juros que ela chama de “pedagógicos”.</p>' +
    '<h3>Brynhild Lâmina-Quieta, que voltou da loucura</h3>' +
    '<p>No Clã do Corvo há uma campeã que fala pouco e só do que viu. <b>Brynhild Lâmina-Quieta</b> é irmã de Halfdan, o desertor de Fjallbrún, e carrega isso sem esconder e sem explicar. Atravessou a loucura da batalha uma vez e voltou, o que quase ninguém faz, e por isso é ela quem ensina aos novos a postura que defende e a que cura: “quem não sabe parar não sabe bater”. Sobre os corvos de Odin, diz que já esteve embaixo dos dois e que embaixo de nenhum se dorme bem. Quando lhe perguntaram em Askavik de que lado o Clã deveria ficar, respondeu que o Fio e os Desfiados estavam certos e errados ao mesmo tempo, e saiu da sala antes que alguém pedisse para explicar.</p>' });
  add({ lv: 'XXV', body:
    '<h3>Anselm Rotha, que mede</h3>' +
    '<p>O <b>Doutor Anselm Rotha</b>, da Irmandade do Vapor, quer medir o Labirinto. Não guardá-lo, não derrubá-lo: medir. Carrega um índice de latão que marca “quanto falta”, e nunca disse a ninguém quanto falta para o quê. Acha as duas bandeiras duas superstições caras, e a Companhia uma só verdade: quem não vende, não acende. É ele quem entrega aos aprendizes da Academia o primeiro ajudante que voa, o escudo de favos e o bracelete, e cobra de cada um um relatório que ninguém lê. Enterra uma lenda por dia e, dizem na Academia, desenterra uma por semana, sem contar a ninguém. Eu o vi uma vez parado diante de uma porta de pedra preta, anotando. Perguntei o que anotava. “Que ela não tem maçaneta.” E seguiu.</p>' +
    '<h3>Do que eles têm em comum</h3>' +
    '<p>Andei com os onze, nunca com dois ao mesmo tempo, e no fim notei o que nenhum deles me deixaria escrever se lesse antes: todos carregam a ferida do seu caminho no corpo, e todos acham que a bandeira do outro é o que vai acabar com Karmika. Todos querem salvá-la. É por isso que lutam. Não vi, em nenhum dos onze, um vilão. Vi onze pessoas que não dormem bem, e três delas que riem disso.</p>' +
    '<p class="seal">Quando lhe derem uma missão, caminhante, repare quem a dá. Pode ser um deles.</p>' });
  add({"toc": "Livro XXVI — As maravilhas e as Fontes da Visão", "lv": "XXVI", "eyebrow": "Livro XXVI", "title": "As maravilhas e as Fontes da Visão", "start": true, "body": "<h3>Da moeda na água</h3><p>Em toda praça de Karmika há uma fonte, e em toda fonte há moedas no fundo. Os viajantes acham que é superstição. Não é. Quem joga uma moeda numa <b>Fonte da Visão</b> e fica quieto vê o lugar inteiro de cima, como o veem os corvos e talvez o próprio Marghar, e ouve a história do lugar contada por quem a guardou. Muitas vezes, confesso, quem a guardou fui eu. Não sei explicar como a minha voz foi parar dentro da água. Os technocratas dizem que é eco. Os sacerdotes dizem que é graça. Eu digo que é trabalho, porque fui eu que anotei.</p><p>Cada caminho tem a sua cidade, e cada cidade tem a sua maravilha. E dentro de toda maravilha há uma Fonte da Visão, porque nenhuma delas cabe nos olhos de quem está ao pé dela. Para ver o que os construtores fizeram é preciso subir, e a moeda sobe por você.</p><h3>Das maravilhas do Fio</h3><p>A <b>Abadia da Aurora</b>, em Austrvik, ergue o sol e o Olho sobre um pátio onde cabe uma cidade ajoelhada. No Dia da Aurora a luz desce sobre ele inteiro, e os noviços juram que sentem calor nas costas mesmo de olhos fechados.</p><p>O <b>Pináculo de Marfim</b>, em Lumenhal, é uma torre branca no meio de um lago de ilhas. De longe parece um farol; de perto, uma escada que não acaba. Os magos sobem por anos. Os que chegam ao topo não contam o que viram, e os que não chegam contam demais.</p><p>O <b>Bastião de Prata</b>, em Sudrholt, não é bonito, e se orgulha disso. Fosso, muralha, torres e mil e doze pedras no muro, ou mil e onze, conforme quem conta. Fica de frente para a Terra Maldita como um homem fica de frente para um cão que ainda não latiu.</p><p>A <b>Fortaleza de Odin</b> coroa a Montanha Viking, acima de Jarlsheim. A subida é reta, a neve não perdoa e o hidromel não acaba. Thorgrim recebe ali quem quer jurar, e quem desce jurado desce diferente: anda mais devagar e olha mais longe.</p>"});
  add({"lv": "XXVI", "body": "<h3>Das maravilhas dos Desfiados</h3><p>O <b>Castelo do Conde</b>, na Colina Vampírica, tem seis andares, e só dois deles veem o céu. Embaixo, as catacumbas da Corte e a adega das celas. No térreo, a biblioteca, o salão de baile com os lustres acesos e a sala do piano que ninguém toca de dia. Acima, a galeria dos retratos, onde os olhos dos quadros seguem quem passa, e o andar dos quartos, dezenas deles, alguns com caixões no lugar das camas. E no alto, o salão particular do Conde, com o trono dentro de uma piscina de sangue. É ali, dizem, que se deixa de ser humano.</p><p>A <b>Árvore-Mãe</b>, no Uivo Antigo, é uma árvore-toca imensa, caída no meio da selva. O tronco é a casa da Mãe-Alfa, e o oco é um salão inteiro de raízes e de vida. No meio do caminho até ela há uma estátua que todo forasteiro para para olhar: uma loba gigante dando de mamar a crianças humanas. Os lobisomens não explicam a estátua. Dizem só que é por isso que a matilha não abandona ninguém.</p><p>A <b>Torre do Bruxo</b>, no Vale da Desgraça, em Gorvath, é alta, mas o que impressiona é o que ela tem por baixo. A torre abre um poço no chão que desce até onde a vista alcança, e as pontes que ligam a estrada ao pilar deixam ver o fundo: lava, gente trabalhando e, lá embaixo, perto dos demônios, os rituais que Malgrath não deixa ninguém anotar. Eu tentei. A tinta ferveu.</p>"});
  add({"lv": "XXVI", "body": "<h3>Das maravilhas dos que não juram</h3><p><b>Porto Caldeira</b>, a cidade da graxa, tem guindastes que trabalham sozinhos, tirando carga dos cargueiros a vapor e devolvendo ao cais. A Academia da Graxa é coroada por duas bobinas imensas que acendem a cidade inteira pelo ar, e entre os pisos da academia sobem jardins suspensos, porque os technocratas aprenderam tarde, mas aprenderam, que máquina sem planta enferruja por dentro. Na ilha ao largo, o <b>Farol Tecnocrático</b> gira um feixe vermelho sobre os vapores, e a Faroleira Dinorá conta quem chega e quem não volta.</p><p>Os <b>Portões de Brasaforja</b> são uma porta de ferro fundido escavada na Montanha Negra. Sobe-se a escadaria até encostar no ferro, e o portão entra na rocha. Lá dentro fica o Grande Salão, com o trono aos pés da Forja-Mãe, que recebe lava dos veios da montanha por dutos que nenhum anão vivo sabe quem escavou. Nas paredes, diamantes e esmeraldas. E no fundo, entre dois anões colossais esculpidos com os machados erguidos um para o outro, o <b>Coração da Montanha Negra</b>: uma pedra azul, imensa, que às vezes avermelha. Os anões dizem que avermelha quando alguém mente no salão. Fiquei quieto o tempo todo.</p><p><b>Gaia, a Árvore Santa</b>, em Lithendel, é a Mãe Terra feita árvore, e a cidade dos elfos mora nos galhos dela. Sobe-se num teleférico de cipós até um andar onde se anda literalmente na árvore e se vê Karmika lá de cima. A Árvore-Mãe dos lobisomens também foi uma árvore de pé, um dia. Os elfos não gostam que se lembre disso.</p><p class=\"seal\">Quando estiver diante de uma delas, caminhante, jogue a moeda. A maravilha não foi feita para ser vista de baixo.</p>"});
  add({"toc": "Livro XXVII — O Andarilho de Auréon", "lv": "XXVII", "eyebrow": "Livro XXVII", "title": "O Andarilho de Auréon", "start": true, "body": "<h3>Do paladino que não fica em casa</h3><p>Quem pensa em paladino pensa na Abadia, e a Abadia é a mãe. Mas o Grão-Mestre Cassius tem uma regra que muitos noviços estranham: o paladino recém-jurado não fica em Austrvik. Ele sai. <b>O paladino é antes de tudo um andarilho do bem</b>, e a luz que não anda vira vela de altar, bonita e inútil.</p><p>Em dez vilas das Terras dos Homens há capelas de Auréon de pé, inteiras, com um clérigo na porta: Grenivik, Vestheim, Vatnaholt, Skógar, Myrbakki, Brekkuvik, Vindholt, Dalborg, Steinfoss e Lundr. Cada vila tem o seu mal, e nenhum mal é igual ao outro. O Andarilho chega, ouve o clérigo, enfrenta o que ronda a vila e decide o que fazer com o que sobrou. Cada clérigo o manda para a próxima capela, e a última o manda de volta para casa.</p><h3>Da nota a mais</h3><p>Os clérigos das dez capelas não se conhecem todos, mas contam a mesma coisa, cada um achando que é o único: o sino da capela tocou, numa noite qualquer, <b>uma nota a mais</b>, uma que ninguém afinou. Em Steinfoss me mostraram uma runa riscada no bronze, por dentro do sino, onde nenhuma mão alcança. Copiei-a. Não é nenhuma das seis.</p><p>Quando o Andarilho volta à Abadia, Cassius o recebe de pé e lhe dá o nome de <b>Andarilho de Auréon</b>. Perguntei ao Grão-Mestre sobre a nota. Ele respondeu que a luz também tem perguntas, e mudou de assunto.</p>"});
  add({"toc": "Livro XXVIII — O Sino no Pulso", "lv": "XXVIII", "eyebrow": "Livro XXVIII", "title": "O Sino no Pulso", "start": true, "body": "<h3>Da prata, que é dívida</h3><p>No Bastião de Prata a Mestra Ilsa Van Rhal entrega a primeira lâmina de prata com uma frase que todo Helsing sabe de cor: <b>a prata não é presente, é dívida</b>. Quem a recebe passa a dever cada noite que dormir tranquilo a alguém que ficou acordado no muro.</p><p>Quem leva os novos para o muro é a <b>Caçadora Vesna Helsing</b>, ácida e engraçada daquele jeito de quem não dorme há anos. Ela ensina as três horas da noite, a hora do sino, a hora do cão e a hora em que ninguém deve estar acordado, e conta as pedras do muro em voz alta toda vigília, para não dormir. Diz que são mil e doze. A Mestra diz mil e onze. As duas contam toda noite, e nenhuma cede.</p><h3>Do órfão de Sudrholt</h3><p>Em Sudrholt há um menino chamado <b>Pip</b>, que perdeu a família para uma besta da Terra Maldita e não consegue dormir sem ouvir um sino. Os Helsing não adotam crianças; dizem que a prata não é lugar para elas. Mas todo caçador novo é mandado falar com o Pip, e o que ele diz ao menino, a verdade, a espera ou a mentira, o Olho anota antes de qualquer besta. Mais tarde, com Pó do Sono comprado de uma bruxa de Gorvath, a contragosto, e um Sino de Guarda comprado da Companhia, os caçadores inventaram para ele o <b>Sono Guardado</b>. Foi a coisa mais bonita que vi um caçador fazer.</p>"});
  add({"lv": "XXVIII", "body": "<h3>Da runa dentro do osso</h3><p>No salão do Bastião há uma caveira de besta pendurada, a de Van Rhal, a primeira caçada da família. Quem olha com o Instinto vê o que os olhos não veem: <b>a sexta runa riscada por dentro do osso</b>. Não na superfície, por dentro, onde nenhuma faca entra. Depois disso os Helsing começaram a abrir as caveiras das bestas que matavam. Todas têm a runa. Eu já tinha estado lá, anos antes, e anotei sem entender. Pelo menos anotei.</p><h3>Da vila que não existe mais</h3><p>Há uma vila no mapa velho chamada Lysmark que não está no mapa novo. Quem vai até onde ela era e usa o Instinto encontra o espírito de uma menina com uma vela na mão. Ela diz só uma coisa a quem chega: <b>a sua vela foi a última a apagar</b>. Ninguém sabe a quem ela fala.</p><h3>Do juramento de Aravel</h3><p>O caçador termina o seu primeiro ano nas Ruínas de Aravel, onde Aravel, a Vigília Verde, tinha o seu primeiro altar. Ali ele diz, ao lado da Vesna, a frase que dá o nome ao juramento:</p><blockquote>Eu não durmo enquanto alguém pequeno estiver acordado no escuro.</blockquote><p>Depois disso o caçador passa a usar um sino pequeno no pulso. Não toca para chamar ninguém. Toca para lembrar.</p>"});
  add({"toc": "Livro XXIX — O Juramento", "lv": "XXIX", "eyebrow": "Livro XXIX", "title": "O Juramento", "start": true, "body": "<h3>Da Tecelagem de Askavik</h3><p>Há um dia em que cada caminho jura a sua bandeira, e todos juram no mesmo lugar: a <b>Tecelagem</b> de Askavik, onde se tecem os mantos das duas facções. Cada um jura do seu jeito. O paladino ajoelha. O lobisomem uiva. O vampiro assina com sangue e reclama do papel. O bruxo lê o contrato inteiro em voz alta, duas vezes, e corrige uma vírgula. O mago pergunta se pode anotar. E o guerreiro do Norte, que pela tradição do Corvo não jura bandeira nenhuma, é quem <b>arbitra</b>: fica de pé no meio do salão e diz se o juramento valeu.</p><h3>Da Trégua da Lua</h3><p>Os Desfiados têm uma trégua mais velha que as bandeiras: a <b>Trégua da Lua</b>. Na noite sem lua, lobo e vampiro não se caçam, e o bruxo escreve o que foi dito para que ninguém diga depois que disse outra coisa. Os lobos detestam o bruxo por isso. Os vampiros detestam os lobos. E a trégua se mantém há séculos, o que diz muito sobre o ódio e pouco sobre a paz.</p><h3>Do lugar onde o meu lado erra</h3><p>Todo juramento honesto tem uma pergunta que os mestres não fazem em voz alta: onde é que o meu lado erra? O Fio encontra a resposta em <b>Grenivik</b>, onde um capitão da Ordem passou a cobrar proteção de quem ele devia proteger. Os Desfiados encontram a resposta em <b>Lundr</b>, onde a liberdade de um virou a prisão de outro. Os dois lados voltam de lá mais quietos.</p>"});
  add({"lv": "XXIX", "body": "<h3>Da podridão de Grenivik</h3><p>Foi nesse tempo que a podridão começou a descer o rio a partir de Grenivik. Cada caminho a leu de um jeito. O paladino rezou e sentiu frio. O lobisomem farejou e não reconheceu o cheiro, o que nunca tinha acontecido. O vampiro torceu o nariz e disse que aquele sangue estava velho antes de nascer. O bruxo leu, e o que leu foi uma letra: uma letra antiga, anterior a Malgrath, escrita onde não havia papel.</p><p>Todos acharam que era Zerath, o príncipe da podridão. Fazia sentido, e o que faz sentido demais deveria nos assustar.</p><h3>Da porta</h3><p>No fim do juramento, em todos os caminhos, alguém fala de uma porta. Uma porta de pedra preta, sem maçaneta, com o Olho esculpido de pálpebras baixas. Já contei que há três delas: no Cemitério Esquecido, em Brasaforja e na Biblioteca de Askavik. Agora sei que há uma quarta. Falarei dela adiante, no livro da ponte.</p>"});
  add({"toc": "Livro XXX — A Mesa Partida", "lv": "XXX", "eyebrow": "Livro XXX", "title": "A Mesa Partida", "start": true, "body": "<h3>Da guerra que ninguém declara</h3><p>Depois dos juramentos veio o tempo que os velhos chamam de <b>Guerra Fria</b>. Ninguém declarou nada. O paladino escoltava caravanas até o Vale e voltava contando corpos que não eram de ninguém. O vampiro aprendeu a comprar relógios, porque a Corte decidiu que quem vive à noite precisa saber a hora exata do sol. O caçador abriu gaiolas de prata e encontrou nelas coisas que ele mesmo tinha prendido. Cada lado fazia ao outro o que acusava o outro de fazer.</p><h3>Da mesa de Askavik</h3><p>Para que a guerra não virasse guerra, os mestres das duas bandeiras sentaram à mesma mesa, no salão do conselho de Askavik. É a <b>Mesa Partida</b>, e o nome é antigo: uma mesa de pedra rachada ao meio, um lado para cada bandeira. Os humanos votam, o mago escreve a ata, o elfo media, o anão traz a mesa de ferro que não racha e o Varg, numa das sessões, rachou a mesa de ferro com um tapa.</p><p>O lado que vence a Mesa hasteia a sua bandeira na praça de Askavik por uma semana inteira. Parece pouco. Não é. Uma semana de bandeira na praça muda o preço do pão, o humor dos guardas e quem consegue dormir na estalagem.</p>"});
  add({"lv": "XXX", "body": "<h3>Da cadeira a mais</h3><p>Na primeira sessão da Mesa havia uma cadeira a mais. Ninguém a tinha posto. Sobre ela, dobrada com cuidado, uma <b>capa cinza</b>. No fim da sessão a capa não estava mais lá, e ninguém a viu sair.</p><p>Depois disso fui atrás da capa, e todo caminho a tinha visto sem saber. Era quem comprava os relógios dos vampiros. Era quem vendia velas à Abadia. Era quem pagava o skald para cantar a canção errada. Era o homem sem cheiro que os lobos não conseguiam seguir. Era quem assinava as caixas da Irmandade. Era quem escrevia com aquela letra anterior a Malgrath. Era quem levava comida ao ninho das bestas. Era quem tinha estudado a estrada do imposto, e quem encomendou aos anões um sino com o Olho esculpido de olhos fechados.</p><p>Ninguém lembra do rosto. Todos lembram da capa.</p>"});
  add({"toc": "Livro XXXI — Velmora, a ponte dos prantos", "lv": "XXXI", "eyebrow": "Livro XXXI", "title": "Velmora, a ponte dos prantos", "start": true, "body": "<h3>Da vila que os mapas pulam</h3><p>No <b>Canal Escuro</b>, na fronteira entre Hrafnhöfn, que é do Fio, e Corvoscuro, que é dos Desfiados, há uma vila de pescadores que os cartógrafos esquecem de desenhar. Chama-se <b>Velmora</b>. Tem duas margens e um nome só. A Margem da Aurora, a oeste, de casas claras, praça e cais. A Margem da Noite, a leste, de telhados negros e lanternas vermelhas que o Conde enxerga do castelo. Não tem capela. Os moradores dizem que nunca precisaram, e baixam os olhos quando dizem.</p><p>Moram ali a Guardiã da Ponte, Edla; o pescador Tóki; a velha Rúna das Redes, que remenda o que ninguém mais remenda; a mercadora Hekla, que vende para as duas margens pelo mesmo preço; e o lanterneiro Orri, que acende as lanternas da Margem da Noite e diz que elas apagam sozinhas quando alguém mente na ponte.</p><h3>Da ponte</h3><p>A <b>Ponte de Velmora</b> é um arco largo de pedra presa com grampos anões, de antes do Rei Thrain, sem a marca de nenhum clã. Na pedra do meio há uma inscrição: <i>aqui se passa</i>. A última palavra foi raspada. Os mais velhos dizem que a frase inteira era <i>aqui se passa, e aqui se fica</i>.</p>"});
  add({"lv": "XXXI", "body": "<h3>Do barqueiro</h3><p>Debaixo da ponte trabalha <b>Táraka, o Barqueiro</b>. O nome dele, numa língua mais velha que a nossa, quer dizer o que faz atravessar, o que livra, e também a menina do olho. A lanterna do barco dele está sempre apagada. Ele leva os mortos ao lugar de onde se volta humano, e não cobra. Perguntei quem passou antes de mim. Ele me disse, e era alguém de outro caminho. Disse a todo viajante a mesma coisa: alguém de outro caminho passou antes.</p><h3>Da quarta porta</h3><p>A ponte tem três pilares. O do meio foi construído <b>em volta</b> de alguma coisa. Quando o pilar rachou, no ano em que a podridão desceu o rio e as vilas fugiram para Velmora, apareceu por dentro uma porta de pedra preta, sem maçaneta, com o Olho de pálpebras baixas. É mais velha que a ponte. É mais velha, eu acho, que Velmora.</p><p>Alguém fechou a ponte com uma corrente, naquele ano, e passou a cobrar pedágio de quem fugia. Os cobradores foram pagos em moeda velha, por alguém sem rosto. O Fio escoltou os fugitivos. Os Desfiados quebraram a corrente. O Corvo segurou o meio da ponte. E eu fiquei olhando a porta, e a porta, juro, ficou olhando de volta.</p><p class=\"seal\">Velmora é o único lugar aonde todos os caminhos precisam ir. Vá. E não leia a inscrição em voz alta.</p>"});
  add({"toc": "Livro XXXII — Das guildas e das províncias", "lv": "XXXII", "eyebrow": "Livro XXXII", "title": "Das guildas e das províncias", "start": true, "body": "<h3>Do Livro de Guildas</h3><p>Em Lumenhal fica a Prefeitura, um palácio de colunas com a torre do relógio e o sino que marca as horas da cidade. Lá dentro, no salão de atendimento, o <b>Prefeito Corvin Aldmar</b> guarda o <b>Livro de Guildas</b> sobre um atril, e é nele que toda guilda de Karmika existe ou deixa de existir. Uma cópia fica comigo, na Grande Biblioteca, porque o Prefeito confia mais em tinta do que em memória, e eu também.</p><p>Fundar uma guilda pede pouco e custa muito: três fundadores experientes, que já andaram o bastante para pesar alguma coisa, e uma <b>Lágrima de Marghar</b> sobre a mesa. Os três assinam. O nome nunca mais muda. A bandeira e o símbolo podem mudar; o nome, não, porque o Livro não apaga.</p><h3>Da glória</h3><p>A guilda cresce em <b>glória</b>, e a glória vem de três fontes: uma parte do que cada membro aprende pela estrada, as missões que a guilda cumpre junta, e o que os membros doam ao cofre. Uma guilda gloriosa é mais forte em tudo: os seus têm mais vida, mais dano, mais armadura, recarregam mais rápido. Os antigos chamam isso de estandarte firme. Eu chamo de gente que não anda sozinha.</p>"});
  add({"lv": "XXXII", "body": "<h3>Da Casa da Guilda</h3><p>Quando a guilda chega ao quarto grau, ergue a sua <b>Casa</b>. Não é um quartel: é uma casa de ofício e de comércio. Tem salas para cada profissão, o salão de armas e os itens da guilda, que os próprios membros vendem, alugam e emprestam uns aos outros. Ninguém de fora administra a Casa. Ela é dos jogadores, e é governada por eles.</p><h3>Do castelo e da província</h3><p>No quinto grau, a guilda vira <b>castelo</b>, e o castelo ganha uma vila. Cada membro recebe um pedaço de terra para construir a sua casa, e a cidade é <b>defendida e mantida pela própria guilda</b>, com as próprias mãos, quando o cerco chega. A terra em volta passa a ser província da guilda.</p><p>Quem é de fora pode comprar terra na província e morar ali. Paga imposto, e o imposto não é castigo: é o preço da proteção dos muros. Quem nunca viu uma província cercada acha o imposto caro. Quem viu, paga sem reclamar.</p><p class=\"seal\">Uma guilda não é uma conversa com bandeira. É uma cidade que ainda não terminou de ser construída.</p>"});
  add({"toc": "Livro XXXIII — Das tavernas e das carroças", "lv": "XXXIII", "eyebrow": "Livro XXXIII", "title": "Das tavernas e das carroças", "start": true, "body": "<h3>Da Bigorna Molhada</h3><p>Um cronista que não conhece as tavernas não conhece o mundo, porque é nelas que o mundo conta o que não conta aos cronistas. A melhor de todas é a <b>Bigorna Molhada</b>, dos anões. É um salão de pedra com balcão de barris de chope e uma parede inteira de garrafas, uma cova de fogo com javali no espeto, mesas compridas com bancos e um palco onde o bardo canta até alguém jogar uma caneca. Atrás do balcão, <b>Hildigunn</b> serve a cerveja preta. Na cova, <b>Fróði</b> vira o javali. Na cozinha, <b>Sif</b> faz o ensopado que cura ressaca e mágoa, nessa ordem.</p><p>Há uma mesa redonda no canto que se reserva por uma hora, a vinte moedas, para quem quer conversar sem ser ouvido. Eu reservei uma vez. Ouvi tudo da mesa ao lado.</p><h3>Da festa do anão</h3><p>As <b>carroças dos anões</b> rodam todas as estradas carregadas de cerveja e churrasco. Quem paga, ganha festa: a carroça vira tenda, o churrasco vai para o chão, os barris abrem, a música toca e os moradores dançam junto. Depois de um tempo todo mundo vai se debruçando e dorme onde caiu. De manhã o anão já partiu, e deixou uma carta no chão. Guardo a minha: <i>Que festança! Espero que tenham gostado dos meus serviços. Estou sempre por aqui agitando as coisas.</i></p>"});
  add({"lv": "XXXIII", "body": "<h3>Da Caravana de Latão</h3><p>A <b>Companhia das Caravanas de Latão</b> é dos technocratas, e vende o que a Academia fabrica: lâminas que vibram, lâminas eletrificadas, armas de fogo, torretas que quebram depois de alguns usos e pequenos robôs que ajudam a erguer casas. Toda carroça de Karmika paga à Companhia uma taxa por proteção. Quando uma é assaltada, a Companhia manda um <b>alerta</b> a todo o mundo. Quem estiver perto escolhe se vai. Quem vai e defende recebe a recompensa paga pelos próprios mercadores. Quem não vai, ninguém cobra. O Olho cobra.</p><h3>Do mercado que é dos caminhantes</h3><p>Quase tudo o que circula em Karmika foi colhido, fabricado, transportado ou construído por alguém. Lenhador e marceneiro, minerador e ferreiro, esfolador e costureiro, herbalista e alquimista, pescador e cozinheiro. Quem não sabe fazer compra de quem sabe. Até as casas se vendem: o Cartório entrega a escritura, e a escritura vai a leilão como qualquer espada.</p>"});
  add({"toc": "Livro XXXIV — Os caminhos que ainda dormem", "lv": "XXXIV", "eyebrow": "Livro XXXIV", "title": "Os caminhos que ainda dormem", "start": true, "body": "<p>Contei oito caminhos, e são oito os que se abrem hoje. Mas a Vidente dos Caminhos, quando bebe vinho, conta que viu mais estradas na água do vasilhame. Estradas que ainda dormem, esperando quem as acorde. Anoto o que ouvi, sem prometer que sei.</p><h3>O Círculo das Pedras</h3><p>No coração da <b>Floresta Encantada</b>, onde as copas brilham à noite, há um círculo de pedras que ninguém ergueu. Ali, contam, alguns vão escutar o que as árvores dizem devagar, e voltam sabendo mudar de forma, chamar raízes e espinhos e curar com o que nasce do chão. Os elfos chamam esses de <b>druidas</b>. Dizem que a mata não tem dono, tem guardião.</p><h3>A Guilda Sem Rosto</h3><p>Nos becos de Askavik há uma guilda que não tem sede, só contratos. Ninguém vê os seus membros; todo mundo sente. Os que a conhecem a chamam de <b>Guilda Sem Rosto</b>, e aos seus, de <b>assassinos</b>. Cada contrato pesa no karma de quem paga e de quem cumpre. Ouvi dizer que ela recusou um contrato uma única vez. O contratante usava uma capa cinza.</p><h3>Os que levantam o que caiu</h3><p>Onde todos veem o fim, há quem veja matéria-prima. Na <b>Cripta de Hemara</b>, na beira da Terra Maldita, falam de gente que levanta ossos e prende almas por um fio. São os <b>necromantes</b>, e a Ordem do Fio inteira os persegue, porque prender uma alma é o contrário de guardá-la.</p><p class=\"seal\">Quando esses caminhos acordarem, eu estarei lá para anotar. Se acordarem antes de mim, que alguém anote por mim.</p>"});
  add({"toc": "Epílogo", "lv": "", "eyebrow": "Epílogo", "title": "O que ainda está por escrever", "start": true, "body": "<p>Aqui termina o que sei desta temporada. A estrada continua, e quem a trilhar vai escrever os capítulos que faltam. Se você chegou até aqui, leve o conselho que o historiador dá a todo viajante: olhe o que está plantando.</p><p>Esta é a <b>Season I</b> das crônicas. O que os caminhantes fizerem nela, as guerras, as lágrimas, as cidades erguidas e as que caírem, entra no próximo volume. A Bíblia Karmika é viva: o jogo acontece no livro, e o livro conta o jogo.</p><p class=\"seal\">Ormund Salveth, Cronista da Grande Biblioteca</p>"});

    var a = cur >= 0 ? anchorOf(cur) : null;
    build();
    if (a) { cur = indexOfAnchor(a); mount(cur); ui(); }
  }
  function rebuildSoon() { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 160); }
  window.addEventListener('resize', rebuildSoon);



  function openingSvg() {
    var wv = 'M-40 0 q10 -6 20 0' + new Array(19).join(' t20 0') + ' L340 300 L-40 300 Z';
    return '<svg viewBox="20 30 260 190" role="img" aria-label="O Olho Karmico se enche de karma e derrama uma lágrima">' +
      '<defs><linearGradient id="lqo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0bd"/><stop offset="1" stop-color="#f2b04a"/></linearGradient>' +
      '<clipPath id="evo"><polygon points="60,110 143,54 157,54 240,110 157,166 143,166"/></clipPath></defs>' +
      '<g clip-path="url(#evo)"><g transform="translate(0,172)"><animateTransform attributeName="transform" type="translate" values="0 172;0 60" dur="3s" fill="freeze" calcMode="spline" keySplines="0.35 0 0.2 1"/>' +
      '<g><animateTransform attributeName="transform" type="translate" values="-40 0;0 0" dur="2.2s" repeatCount="indefinite"/><path fill="url(#lqo)" d="' + wv + '"/></g></g></g>' +
      '<g fill="none" stroke="#d9a24f" stroke-width="14" stroke-linecap="butt" stroke-linejoin="bevel"><path d="M144 40 L40 110 L144 180"/><path d="M40 40 L40 180"/><path d="M156 40 L260 110 L156 180"/><path d="M260 40 L260 180"/></g>' +
      '<polygon points="150,94 166,110 150,126 134,110" fill="#0b0810" stroke="#f2b04a" stroke-width="3"><animate attributeName="stroke-width" values="3;9;3" begin="3s" dur="0.7s"/></polygon>' +
      '<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;1" begin="3.3s" dur="2s" fill="freeze"/>' +
      '<animateTransform attributeName="transform" type="translate" values="150 176;150 176;150 214" keyTimes="0;0.42;1" calcMode="spline" keySplines="0 0 1 1;0.55 0 1 0.45" begin="3.3s" dur="2s" fill="freeze"/>' +
      '<g><animateTransform attributeName="transform" type="scale" values="0;1;1" keyTimes="0;0.42;1" begin="3.3s" dur="2s" fill="freeze"/>' +
      '<circle r="13" fill="#ffe9ad" opacity="0.25"/><path d="M0 -11 C7 -2 8 6 0 8 C-8 6 -7 -2 0 -11 Z" fill="url(#lqo)"/></g></g>' +
      '<ellipse cx="150" cy="214" rx="2" ry="1" fill="none" stroke="#ffe9ad" stroke-width="1.4" opacity="0"><animate attributeName="rx" values="2;48" begin="5.2s" dur="1.1s" fill="freeze"/><animate attributeName="ry" values="1;9" begin="5.2s" dur="1.1s" fill="freeze"/><animate attributeName="opacity" values="0.9;0" begin="5.2s" dur="1.1s" fill="freeze"/></ellipse>' +
      '</svg>';
  }
  var unlocking = false;
  function unlockStrap(st, then) {
    if (unlocking) return;
    unlocking = true;
    if (reduce) { unlocking = false; then(); return; }
    st.classList.add('unlock');
    setTimeout(function () { st.classList.add('open'); }, 650);
    setTimeout(function () { unlocking = false; then(); }, 1750);
  }
  var opening = false;
  function playOpening(target) {
    if (opening) return;
    if (reduce) { go(target); return; }
    opening = true;
    var ov = document.createElement('div');
    ov.className = 'opening';
    ov.innerHTML = openingSvg() + '<p class="cap">O karma se enche. O Olho chora.</p><span class="skip">toque para pular</span>';
    book.appendChild(ov);
    var done = false;
    function end() {
      if (done) return; done = true;
      ov.classList.add('out');
      go(target);
      setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); opening = false; }, 850);
    }
    ov.addEventListener('click', end);
    setTimeout(end, 6600);
  }

  /* ---------- download em Markdown ---------- */
  var DL = null;
  function inl(n) {
    var out = '';
    n.childNodes.forEach(function (c) {
      if (c.nodeType === 3) { out += c.textContent; return; }
      if (c.nodeType !== 1) return;
      var t = c.tagName;
      if (c.classList && c.classList.contains('tag')) { out += ' [' + c.textContent.trim() + ']'; return; }
      if (t === 'SVG' || t === 'svg') return;
      var x = inl(c);
      if (t === 'B' || t === 'STRONG') out += '**' + x + '**';
      else if (t === 'EM' || t === 'I') out += '*' + x + '*';
      else out += x;
    });
    return out.replace(/\s+\n/g, '\n').replace(/[ \t]{2,}/g, ' ');
  }
  function blk(el) {
    var t = el.tagName, c = el.className || '';
    if (/secmark/.test(c) || /figwrap/.test(c) || t === 'svg') return '';
    if (t === 'H3') return '### ' + inl(el).trim() + '\n\n';
    if (t === 'P') return inl(el).trim() + '\n\n';
    if (t === 'UL') return Array.prototype.map.call(el.children, function (li) { return '- ' + inl(li).trim(); }).join('\n') + '\n\n';
    if (/tw/.test(c) && el.querySelector('table')) {
      var heads = Array.prototype.map.call(el.querySelectorAll('thead th'), function (h) { return inl(h).trim() || ' '; });
      var rows = Array.prototype.map.call(el.querySelectorAll('tbody tr'), function (r) {
        return '| ' + Array.prototype.map.call(r.children, function (d) { return inl(d).trim().replace(/\|/g, '/'); }).join(' | ') + ' |';
      });
      return '| ' + heads.join(' | ') + ' |\n|' + heads.map(function () { return ' --- |'; }).join('') + '\n' + rows.join('\n') + '\n\n';
    }
    return inl(el).trim() ? inl(el).trim() + '\n\n' : '';
  }
  function toMarkdown() {
    var out = '# Bíblia Karmika · Season I\n\n*Season I · As Crônicas, por Ormund Salveth, Cronista da Grande Biblioteca.*\n\nDocumento gerado da versão online do livro.\n\n';
    sections.forEach(function (sec) {
      if (sec.eyebrow) {
        var sub = /subtitle">(.*?)<\/h3>/.exec(sec.head);
        out += '\n## ' + (sec.eyebrow === sec.title ? '' : sec.eyebrow + ' — ') + sec.title + '\n\n' + (sub ? '*' + sub[1] + '*\n\n' : '');
      } else if (sec.toc) out += '\n## ' + sec.toc + '\n\n';
      sec.blocks.forEach(function (b) {
        var d = document.createElement('div'); d.innerHTML = b;
        Array.prototype.forEach.call(d.children, function (el) { out += blk(el); });
      });
    });
    return out.replace(/\n{3,}/g, '\n\n').trim() + '\n';
  }
  function offerDownload(kind) {
    if (!DL) return;
    if (kind === 'html' && SNAP) DL.save({ filename: 'biblia-vol1-historia.html', data: SNAP }).catch(function () {});
    else DL.save({ filename: 'biblia-vol1-historia.md', data: toMarkdown() }).catch(function () {});
  }
  if (window.claude && claude.use) {
    claude.use('downloads').then(function (d) { if (d) { DL = d; rebuildSoon(); } }).catch(function () {});
  }
  book.addEventListener('click', function (e) {
    var st = e.target.closest('.strap');
    if (st) { e.preventDefault(); e.stopPropagation(); unlockStrap(st, function () { playOpening(tocStart[1]); }); return; }
    var dl = e.target.closest('[data-dl]');
    if (dl) { e.preventDefault(); offerDownload(dl.getAttribute('data-dl')); return; }
    var t = e.target.closest('[data-go]');
    if (t) { e.preventDefault(); go(parseInt(t.getAttribute('data-go'), 10)); }
  });
  prevB.addEventListener('click', function () { go(cur - 1); });
  nextB.addEventListener('click', function () { go(cur + 1); });
  tocB.addEventListener('click', function () { go(tocStart[(pageList[cur] && pageList[cur].tp) || 1]); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(N);
  });
  var sx = null, sy = null;
  book.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  book.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? cur + 1 : cur - 1);
  }, { passive: true });
  window.addEventListener('hashchange', function () {
    var m = /^#p(\d+)$/.exec(location.hash);
    if (m) go(parseInt(m[1], 10));
  });

  build();
  var start = 0, mm = /^#p(\d+)$/.exec(location.hash || '');
  if (mm) start = parseInt(mm[1], 10);
  else { try { var sv = parseInt(localStorage.getItem('karmika-page'), 10); if (sv >= 0 && sv <= N) start = sv; } catch (e) {} }
  show(start, true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(rebuildSoon);
})();
