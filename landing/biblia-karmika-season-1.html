<title>Bíblia Karmika · Season I</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: um livro de uma página por vez, com moldura gravada, virada de página e sumário clicável */
:root {
  --bg: #08060d;
  --bg-2: #120c1c;
  --page: #15101e;
  --page-2: #1b1427;
  --ink: #eadfca;
  --muted: #a89a84;
  --gold: #d9a24f;
  --gold-lo: #7d5a2c;
  --violet: #8f7bff;
  --blood: #b3202f;
  --font-display: "Cinzel Decorative", "Cinzel", Georgia, serif;
  --font-label: "Cinzel", Georgia, serif;
  --font-body: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 40%, rgba(8,6,13,0) 30%, rgba(8,6,13,0.85) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='80' viewBox='0 0 120 80' fill='none' stroke='%23d9a24f' stroke-width='1.3' stroke-linejoin='bevel' opacity='0.16'><g id='e'><path d='M24 10 L14 20 L24 30 M14 10 V30 M36 10 L46 20 L36 30 M46 10 V30'/><path d='M30 16 L34 20 L30 24 L26 20Z' fill='%23d9a24f'/></g><use href='%23e' x='60' y='40'/></svg>");
  background-size: cover, 120px 80px;
  color: var(--ink);
  font-family: var(--font-body);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
.app { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
:root { --bw: min(100%, calc((100vh - 92px) * .8)); }
@supports (height: 100dvh) { :root { --bw: min(100%, calc((100dvh - 92px) * .8)); } }
.book { position: relative; flex: 1 1 auto; min-height: 0; width: var(--bw); container-type: inline-size; }
.stage { position: absolute; inset: 0; perspective: 2200px; }
.leaf {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, var(--page-2), var(--page) 55%);
  border: 1px solid var(--gold-lo);
  border-radius: 4px 10px 10px 4px;
  box-shadow: 0 18px 50px rgba(0,0,0,.65), inset 0 0 60px rgba(0,0,0,.45), -6px 0 0 -2px #0d0915, -10px 0 0 -4px #0a0710;
  transform-origin: left center;
  backface-visibility: hidden;
  overflow: hidden;
}
.leaf::before { /* moldura interna dupla */
  content: ""; position: absolute; inset: 8px; border: 1px solid var(--gold); opacity: .55; border-radius: 2px; pointer-events: none;
}
.leaf::after {
  content: ""; position: absolute; inset: 13px; border: 1px dotted var(--gold-lo); pointer-events: none;
}
.side {
  position: absolute; top: 34px; bottom: 46px; width: 28px; z-index: 1;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='96' viewBox='0 0 28 96' fill='none' stroke='%23d9a24f' stroke-width='1.4' stroke-linejoin='round'><path d='M4 14 L14 7 L24 14 L14 21 Z'/><path d='M14 11 L17 14 L14 17 L11 14Z' fill='%23d9a24f'/><path d='M8 36 H20 L14 48 L20 60 H8 L14 48 Z'/><path d='M14 72 C18 78 19 83 14 86 C9 83 10 78 14 72Z'/></svg>") center top / 28px 96px repeat-y;
  opacity: .7; pointer-events: none;
}
.side.l { left: 16px; } .side.r { right: 16px; }
.base {
  position: absolute; left: 50px; right: 50px; bottom: 16px; height: 28px; z-index: 1;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='28' viewBox='0 0 96 28' fill='none' stroke='%23d9a24f' stroke-width='1.4' stroke-linejoin='round'><path d='M4 14 L14 7 L24 14 L14 21 Z'/><path d='M14 11 L17 14 L14 17 L11 14Z' fill='%23d9a24f'/><path d='M42 6 H54 L48 14 L54 22 H42 L48 14Z'/><path d='M82 6 C86 11 87 16 82 20 C77 16 78 11 82 6Z'/></svg>") left center / 96px 28px repeat-x;
  opacity: .55; pointer-events: none;
}
.corner { position: absolute; width: 38px; height: 38px; z-index: 2; pointer-events: none;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='38' height='38' viewBox='0 0 38 38' fill='none' stroke='%23d9a24f' stroke-width='1.6'><path d='M3 36 V12 Q3 3 12 3 H36'/><path d='M9 9 L14 14 L9 19 L4 14Z' fill='%23d9a24f' stroke='none'/></svg>") no-repeat; }
.corner.tl { top: 5px; left: 5px; }
.corner.tr { top: 5px; right: 5px; transform: scaleX(-1); }
.corner.bl { bottom: 5px; left: 5px; transform: scaleY(-1); }
.corner.br { bottom: 5px; right: 5px; transform: scale(-1,-1); }
.inner {
  position: absolute; inset: 78px 52px 56px 52px; overflow-y: auto; z-index: 3; display: flex; flex-direction: column;
  font-size: clamp(1.05rem, 2.9cqi, 1.5rem); line-height: 1.46; padding: 4px 6px 4px 2px;
  scrollbar-width: thin; scrollbar-color: var(--gold-lo) transparent;
}
.inner > :first-child, .inner > div > :first-child { margin-top: 0; }
.inner p { margin: 0 0 .8em; text-wrap: pretty; hyphens: auto; }
.inner b, .inner strong { color: #f3e2bd; font-weight: 600; }
.inner em { color: #d8c8a6; }
.eyebrow { text-indent: .32em; font-family: var(--font-label); font-size: .63em; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); margin: 0 0 .4em; text-align: center; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.45em; line-height: 1.15; text-align: center; margin: 0 0 .2em; color: #f6e4bb; text-wrap: balance; text-shadow: 0 0 18px rgba(217,162,79,.25); }
h3 { clear: both; text-indent: .16em; font-family: var(--font-label); font-weight: 600; font-size: .84em; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 1.2em 0 .6em; text-align: center; text-wrap: balance; }
h3.subtitle { clear: none; margin: .2em 0 0; font-size: .87em; text-shadow: 0 0 14px rgba(217,162,79,.35); }
h3.subtitle + .rule { margin-bottom: 1.6em; }
.rule { display: block; margin: .5em auto 1.1em; width: 70%; height: 14px; }
.initial {
  float: left; width: 1.55em; height: 1.55em; margin: .1em .45em .04em 0; font-size: 2.9em; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; text-indent: 0; hyphens: none;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23f6dc8e'/><stop offset='.5' stop-color='%23d9a24f'/><stop offset='1' stop-color='%238a5a1f'/></linearGradient><g id='c' fill='none' stroke='url(%23g)' stroke-width='1.6' stroke-linecap='round'><path d='M13 36 C11 21 19 13 31 13 C38 13 39 20 34 22 C30 23 28 19 31 17'/><path d='M13 26 C17 26 20 29 20 33'/><path d='M22 13 C26 17 26 21 23 24'/><circle cx='31' cy='17' r='1.8' fill='%23c4342f' stroke='none'/></g></defs><rect width='100' height='100' fill='%23290c2c'/><path d='M0 0 L100 100 M100 0 L0 100 M50 0 L100 50 L50 100 L0 50Z' stroke='%23d9a24f' stroke-opacity='.16' fill='none'/><rect x='4' y='4' width='92' height='92' fill='none' stroke='url(%23g)' stroke-width='3'/><rect x='9' y='9' width='82' height='82' fill='none' stroke='url(%23g)' stroke-width='1'/><use href='%23c'/><use href='%23c' transform='translate(100 0) scale(-1 1)'/><use href='%23c' transform='translate(0 100) scale(1 -1)'/><use href='%23c' transform='translate(100 100) scale(-1 -1)'/><path d='M50 5 L55 10 L50 15 L45 10Z M50 85 L55 90 L50 95 L45 90Z M5 50 L10 45 L15 50 L10 55Z M85 50 L90 45 L95 50 L90 55Z' fill='url(%23g)'/></svg>") center / 100% 100% no-repeat;
  box-shadow: 0 0 18px rgba(217,162,79,.28), 0 2px 8px rgba(0,0,0,.6); border-radius: 2px;
  background-color: #290c2c;
  color: transparent;
  position: relative;
}
.initial::before {
  content: attr(data-l); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 1.12em; transform: translate(calc(var(--dx, 0) * 1em), calc(var(--dy, 0) * 1em)); background: linear-gradient(180deg, #fff3c6 0%, #e6b459 45%, #9a6422 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 1px 0 rgba(0,0,0,.75)) drop-shadow(0 0 4px rgba(217,162,79,.45));
}
.folio { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; z-index: 4; pointer-events: none; }
.folio span { display: inline-block; background: var(--page); padding: 1px 22px; font-family: var(--font-label); font-size: .78rem; letter-spacing: .24em; color: var(--gold); }
.ribbon {
  position: absolute; top: -2px; right: 52px; z-index: 5; width: clamp(34px, 5.2cqi, 48px); height: clamp(70px, 10.5cqi, 100px); border: 0; padding: 0; cursor: pointer;
  background: linear-gradient(#a3202f, #6e1420); clip-path: polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);
  transition: height .2s;
}
.ribbon:hover, .ribbon:focus-visible { height: clamp(82px, 12.5cqi, 116px); outline: none; }
.ribbon:focus-visible { filter: drop-shadow(0 0 4px var(--gold)); }

/* capa */
.cover .inner { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .4rem; overflow-y: auto; }
.cover .title { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 7vw, 3.1rem); line-height: 1.05; color: #f6e4bb; text-shadow: 0 0 26px rgba(217,162,79,.4); margin: .1em 0 0; }
.cover .sub { font-family: var(--font-label); letter-spacing: .3em; font-size: .78rem; text-transform: uppercase; color: var(--gold); margin: 0; }
.cover .ep { margin: .35em 0 .25em; display: flex; flex-direction: column; align-items: center; gap: .2em; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.05rem, 3.6vw, 1.55rem); letter-spacing: .08em; color: #f3dfae; text-shadow: 0 0 18px rgba(217,162,79,.45); }
.cover .ep span { font-family: var(--font-label); font-size: .5em; letter-spacing: .42em; text-transform: uppercase; color: var(--gold); padding: 0 .2em .1em; border-bottom: 1px solid var(--gold-lo); }
.cover .by { font-style: italic; color: var(--muted); margin: .6em 0 0; font-size: 1.15rem; }
.cover svg.sigil { width: min(78%, 330px); height: auto; filter: drop-shadow(0 0 16px rgba(217,162,79,.35)); }
.open-btn, .nav button, .nav .toc-btn {
  font-family: var(--font-label); letter-spacing: .2em; text-transform: uppercase; font-size: .78rem; cursor: pointer;
  color: var(--ink); background: transparent; border: 1px solid var(--gold-lo); padding: 10px 18px; border-radius: 2px;
}
.open-btn { margin-top: 1rem; border-color: var(--gold); color: #f6e4bb; }
.open-btn:hover, .nav button:hover:not(:disabled) { background: rgba(217,162,79,.14); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* sumário */
.toc { list-style: none; margin: 0; padding: 0; }
.toc li { margin: 0; }
.toc a { display: flex; align-items: baseline; gap: .5rem; padding: .32em 0; color: var(--ink); text-decoration: none; font-size: 1.15rem; cursor: pointer; }
.toc a .dots { flex: 1; border-bottom: 1px dotted var(--gold-lo); transform: translateY(-4px); min-width: 12px; }
.toc a .n { font-family: var(--font-label); font-size: .85rem; color: var(--gold); letter-spacing: .1em; }
.toc a:hover { color: #fff1cf; }
.toc a:hover .dots { border-color: var(--gold); }
.toc .lv { font-family: var(--font-label); font-size: .68rem; letter-spacing: .26em; color: var(--gold); text-transform: uppercase; margin-right: .2rem; }

/* detalhes de conteúdo */
.colors { list-style: none; padding: 0; margin: .6em 0 1em; display: grid; gap: .5em; }
.colors li { display: flex; align-items: center; gap: .8em; }
.sw { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); }
.fig { display: block; margin: .6em auto 1em; width: min(60%, 210px); height: auto; }
blockquote { margin: .8em 0; padding: .2em 0 .2em 1em; border-left: 2px solid var(--gold-lo); font-style: italic; color: #d8c8a6; }
ul.plain { margin: .3em 0 1em; padding-left: 1.15em; }
ul.plain li { margin: 0 0 .45em; }
.seal { text-align: center; font-style: italic; color: var(--muted); margin-top: 1em; }


.inner > div { flex: none; }
.endorn { margin-top: auto; padding-top: 18px; flex: none; text-align: center; }
.endorn svg { width: min(78%, 300px); height: 38px; display: block; margin: 0 auto; }

.toc-row { display: flex; align-items: baseline; gap: .5rem; padding: .3em 0; color: var(--ink); text-decoration: none; font-size: 1.12rem; cursor: pointer; }
.toc-row .lv { font-family: var(--font-label); font-size: .68rem; letter-spacing: .26em; color: var(--gold); text-transform: uppercase; min-width: 2.2em; }
.toc-row .dots { flex: 1; border-bottom: 1px dotted var(--gold-lo); transform: translateY(-4px); min-width: 12px; }
.toc-row .n { font-family: var(--font-label); font-size: .85rem; color: var(--gold); letter-spacing: .1em; }
.toc-row:hover { color: #fff1cf; }
.toc-row:hover .dots { border-color: var(--gold); }
.figwrap { text-align: center; margin: .5em 0 .8em; }
.secmark { margin: 1.6em 0 .2em; }
.secmark .rule { margin: 0 auto; }
.inner > div > .secmark:first-child { display: none; }
.figwrap { --u: min(.95px, .13cqi); margin: .9em 0 1em; }
.figwrap svg { width: auto; max-width: 100%; }
.figwrap svg.hour { height: calc(var(--u) * 410); display: block; margin: 0 auto; }
.figwrap svg.eye { display: block; margin: 0 auto; }
.figwrap svg.eye { height: calc(var(--u) * 160); }
.figwrap svg.eye.tear { height: calc(var(--u) * 255); }
/* manual: etiquetas e tabelas */
.tag { display: inline-block; font-family: var(--font-label); font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; padding: 1px 6px; border: 1px solid; border-radius: 2px; vertical-align: .12em; white-space: nowrap; font-style: normal; }
.tag.d { color: var(--gold); border-color: var(--gold-lo); }
.tag.p { color: #b9acff; border-color: #6a5db5; }
.tag.o { color: #f08a9a; border-color: #8c3a4a; }
.tw { overflow-x: auto; margin: .4em 0 1em; }
table { border-collapse: collapse; width: 100%; font-size: .98rem; line-height: 1.3; }
th { font-family: var(--font-label); font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); text-align: left; font-weight: 400; padding: 4px 8px 6px 0; border-bottom: 1px solid var(--gold-lo); }
td { padding: 6px 8px 6px 0; border-bottom: 1px dotted rgba(125,90,44,.6); vertical-align: top; }
.part-note { text-align: center; font-style: italic; color: var(--muted); }
.legend { display: grid; gap: .5em; margin: 1em 0; }
.legend div { display: flex; gap: .7em; align-items: baseline; }
.toc-part { font-family: var(--font-label); font-size: .74rem; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); margin: 1em 0 .2em; text-align: center; }
.toc-link { display: block; text-align: center; margin-top: 1.2em; color: var(--gold); font-family: var(--font-label); font-size: .78rem; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; text-decoration: none; }

/* barra de navegação */
.nav { flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; width: var(--bw); }
.nav .count { font-family: var(--font-label); letter-spacing: .2em; font-size: .8rem; color: var(--muted); min-width: 92px; text-align: center; }
.nav button:disabled { opacity: .35; cursor: default; }

@media (max-width: 520px) {
  .initial { font-size: 2.6em; }
  .inner { inset: 62px 40px 52px 40px; font-size: 1.04rem; line-height: 1.4; }
  .side { width: 22px; } .side.l { left: 14px; } .side.r { right: 14px; }
  .side { background-size: 22px 76px; }
  .base { left: 40px; right: 40px; }
  h2 { font-size: 1.35em; }
  .ribbon { right: 40px; }
  .nav { flex-wrap: nowrap; gap: 6px; }
  .nav button, .open-btn { padding: 9px 9px; letter-spacing: .06em; font-size: .72rem; white-space: nowrap; }
  .nav .count { min-width: 58px; letter-spacing: .08em; font-size: .72rem; }
}


.strap { position: absolute; left: -4px; right: -4px; bottom: 7%; height: 84px; z-index: 8; padding: 0; border: 0; background: none; cursor: pointer; display: block; }
.strap .band { position: absolute; top: 12px; bottom: 12px; width: 50.2%; transition: transform .9s cubic-bezier(.5,0,.3,1);
  background: linear-gradient(180deg, #6a4023 0%, #4a2a17 40%, #34200f 100%);
  box-shadow: inset 0 2px 0 rgba(255,214,150,.18), inset 0 -3px 0 rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.6); }
.strap .band::before, .strap .band::after { content: ""; position: absolute; left: 6px; right: 6px; height: 0; border-top: 2px dashed rgba(236,196,130,.55); }
.strap .band::before { top: 8px; } .strap .band::after { bottom: 8px; }
.strap .band.l { left: 0; border-radius: 0 3px 3px 0; } .strap .band.r { right: 0; border-radius: 3px 0 0 3px; }
.strap .lock { position: absolute; left: 50%; top: 50%; width: 88px; height: 117px; margin: -64px 0 0 -44px; overflow: visible; z-index: 2;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.7)); transition: transform .25s, filter .25s; animation: lockGlow 4.5s ease-in-out infinite; }
.strap:hover .lock, .strap:focus-visible .lock { transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(255,207,122,.9)) drop-shadow(0 4px 6px rgba(0,0,0,.7)); }
.strap .shackle { transform-origin: 62px 56px; transition: transform .5s cubic-bezier(.3,1.4,.5,1); }
@keyframes lockGlow { 0%, 70%, 100% { filter: drop-shadow(0 4px 6px rgba(0,0,0,.7)); } 85% { filter: drop-shadow(0 0 12px rgba(255,207,122,.95)) drop-shadow(0 4px 6px rgba(0,0,0,.7)); } }
.strap.unlock .lock { animation: none; }
.strap.unlock .shackle { transform: translateY(-14px) rotate(-26deg); }
.strap .runes { animation: lockRune 3.2s ease-in-out infinite; filter: drop-shadow(0 0 3px #8f7bff); }
@keyframes lockRune { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.strap.unlock .runes { animation: none; opacity: 1; stroke: #fff1bd; filter: drop-shadow(0 0 5px #ffcf7a); }
.strap.unlock .keyhole { fill: #fff1bd; }
.strap.open .lock { transition: transform .9s cubic-bezier(.5,0,1,.6), opacity .9s; transform: translateY(160px) rotate(35deg); opacity: 0; }
.strap.open .band.l { transform: translateX(-102%); } .strap.open .band.r { transform: translateX(102%); }
.strap:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
.strap.unlock .hint { opacity: 0; transition: opacity .3s; }
.strap .hint { position: absolute; left: 0; right: 0; top: -44px; text-align: center; font-family: var(--font-label); font-size: .64rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); opacity: .8; }
@media (max-width: 520px) { .strap { height: 62px; } .strap .lock { width: 66px; height: 88px; margin: -50px 0 0 -33px; } }
@media (prefers-reduced-motion: reduce) { .strap .lock, .strap .band, .strap .shackle { transition: none; animation: none; } }
@keyframes runeGlow { 0%, 60%, 100% { opacity: .62; filter: none; } 72% { opacity: 1; filter: drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 12px rgba(217,162,79,.85)); } 86% { opacity: .8; filter: drop-shadow(0 0 3px rgba(217,162,79,.5)); } }
@keyframes runeGlowB { 0%, 55%, 100% { opacity: .5; filter: none; } 68% { opacity: .95; filter: drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 12px rgba(217,162,79,.85)); } 82% { opacity: .7; filter: drop-shadow(0 0 3px rgba(217,162,79,.5)); } }
@keyframes runeDrift { 0%, 100% { background-position: 0 0; } 50% { background-position: 0 7px; } }
@keyframes runeDriftB { 0%, 100% { background-position: 0 0; } 50% { background-position: 8px 0; } }
@keyframes leafGlow { 0%, 62%, 100% { border-color: var(--gold-lo); } 74% { border-color: var(--gold); } }
.side { animation: runeGlow 11s ease-in-out infinite, runeDrift 7s ease-in-out infinite; }
.side.r { animation-delay: 3.6s, -2.5s; }
.base { animation: runeGlowB 13s ease-in-out infinite 1.8s, runeDriftB 9s ease-in-out infinite; }
.leaf { animation: leafGlow 11s ease-in-out infinite; }

  add({ toc: 'Prólogo', partStart: 1, lv: '', eyebrow: 'Prólogo', title: 'Do que o historiador viu e do que lhe contaram', start: true, body:
    '<p>Chamo-me <b>Ormund Salveth</b>, e sou aquele que anota. Não empunho espada nem conjuro chamas. Guardo os registros da Grande Biblioteca, na cidade central de Karmika, e ando pelas estradas com tinta, pergaminho e muita paciência, escutando. Escuto o ferreiro de uma cidade de engrenagens, a sacerdotisa do campo sagrado, o caçador que volta da floresta com os olhos mais velhos do que o rosto, e até o vampiro que aceita falar comigo, desde que eu não pergunte o nome da sua primeira vida.</p>' +

    '<p>Este compêndio não é um manual. Aqui está o que se conta à beira do fogo: como o mundo foi posto em movimento, quem são os deuses que o caminham, que povos nasceram nele, que estradas se abrem diante de cada alma e o que acontece quando a estrada termina. Onde eu souber, falarei como quem viu. Onde só me contaram, direi que me contaram.</p>' +

  add({ toc: 'Livro I — Antes dos Caminhos', lv: 'I', eyebrow: 'Livro I', title: 'Antes dos Caminhos', start: true, body:
    '<h3>Do Senhor que olha</h3>' +
    '<p>Dizem os mais velhos que, antes de haver estradas, havia apenas o terreno, e que alguém precisava olhar para ele para que fosse algo. Esse alguém é <b>Marghar, o Senhor dos Caminhos</b>.</p>' +
    '<p>Não o encontrará em nenhum templo que peça ou prometa. Marghar não atrapalha, não ajuda e não julga. Ele vê. Às vezes, raramente, se emociona com o que vê, e quem o presenciou jura que o mundo inteiro pareceu respirar. Mas ele rege, e ele cobra. É maior do que todos os deuses de Karmika e não venceu nenhum deles; a sua grandeza não está em vitórias, e sim em ser o chamado que não se recusa. Dá ao tempo o tempo que o tempo pede e devolve ao valor o valor de que ele precisa.</p>' });
  add({ lv: 'I', body:
    '<h3>Do Antes</h3>' +
    '<p>Os mais velhos de todos contam que houve um tempo anterior a todos os tempos, e que ele não era escuro nem claro, porque não havia ninguém que enxergasse a diferença.</p>' +
    '<p>Não existia caminho, porque não existia passo. Não existia passo, porque ninguém havia caminhado. E não existia o parar, porque ninguém havia se movido para deixar de se mover. Havia apenas o <b>Antes</b>: um mistério inteiro, sem direção, sem pressa e sem destino.</p>' +
    '<p>Foi dentro do Antes que Marghar pensou. Ele ainda não fez nada. Apenas pensou em caminhar. E bastou: o pensamento abriu o espaço para que alguém, ou alguma coisa, pudesse andar.</p>' });
  add({ lv: 'I', body:
    '<h3>Da Fome que também quis andar</h3>' +
    '<p>Mas o pensamento de Marghar não foi ouvido só por quem merecia. Havia no Antes algo que nunca fora nada além de vontade. Estava preso, como um cão raivoso diante da caça do outro lado da cerca; como o lobisomem que sente o cheiro e não tem trilha; como o vampiro que fareja o sangue e não encontra a porta. Querer, sem caminho para o querer. Os que o odeiam, os que o veneram e os que o temem o chamam <b>Ahzur, o Sem-Passo</b>. O seu nome verdadeiro, ninguém conhece.</p>' +
    '<p>Quando Marghar pensou em caminhar, a vontade de Ahzur também se soltou. O bem ficou livre para traçar o seu rumo. Mas o mal ganhou, no mesmo instante, um caminho para alcançar a sua maldade: uma estrada reta, rápida e aberta a todos. E no fim dessa reta estavam os que ainda não sabiam andar.</p>' });
  add({ lv: 'I', body:
    '<h3>Do labirinto</h3>' +
    '<p>Marghar viu. Não julgou, não venceu, não prendeu, porque não faz nada disso. Mas viu, e criou os <b>caminhos</b>, no plural. Onde havia uma reta, fez bifurcações; onde havia pressa, fez voltas; onde havia uma porta, fez mil portas. Cada caminho é uma escolha, e cada escolha é uma parede entre Ahzur e nós, os caminhantes, que ainda não estamos preparados para encontrá-lo. É por isso que o mal demora a nos achar.</p>' +
    '<p>Os caminhos, portanto, não são só liberdade. São o labirinto em que nós fomos escondidos. Todo aquele que anda por Karmika é um caminhante, e todo caminhante, saiba ou não, está sendo guardado da Fome por um muro que Marghar ergueu.</p>' +
    '<h3>Do karma</h3>' +
    '<p>Mas há os que não querem se esconder. Alguns desejam que o seu caminho cruze o de Ahzur, e o buscam abertamente. Outros passam a vida ajudando Marghar a confundir a essência do mal, desviando-o das almas despreparadas. Desse desejo, dos dois lados, nasceu o <b>karma</b>: o peso de quem ajuda a confundir a Fome, e o peso de quem se serve como banquete, no deleite de ser devorado por ela.</p>' +
    '<p>É por isso que o karma não é castigo. É o preço de se pôr diante do que ficou preso no Antes, seja para escondê-lo, seja para alimentá-lo.</p>' });
  add({ lv: 'I', body:
    '<h3>Dos filhos da Fome</h3>' +
    '<p>Dizem os mais cautelosos dos sacerdotes que Ahzur nunca foi encontrado por inteiro, e que talvez nunca seja. O que as almas encontram são os jeitos que ele aprendeu de andar: o pacto, a loucura, a cinza, o engano, o banquete, o esquecimento, a podridão, a corrente e a traição. São os que a tradição chama de príncipes infernais, e deles falarei adiante.</p>' +
    '<h3>Dos dois tipos de almas</h3>' +
    '<p>Os que se aproximam da Fome se dividem em dois povos que quase nunca se falam. Há os <b>Desviadores</b>, que vivem para desviar: tecem caminhos falsos, protegem os despreparados, mantêm o labirinto de pé. E há os <b>Convivas</b>, que se oferecem ao banquete: abrem as portas, deixam o rastro e encontram deleite em ser devorados. Os dois pagam em karma, e Marghar vê os dois do mesmo modo.</p>' +
    '<p>Ele não diz qual dos dois está certo. Dizem que, quando um deles faz algo que o labirinto não previa, o Olho chora.</p>' });
  add({ lv: 'I', body:
    '<h3>Do caminho e do caminhar</h3>' +
    '<p>Há uma coisa que as crônicas antigas repetem, e que a nossa cultura inteira aprendeu a repetir junto: <b>o caminho e o caminhar foram criados juntos</b>, sob os olhos de Marghar. O caminho não existia antes de quem andasse, e quem andasse não existia antes do caminho. É por isso que o bem e o mal, como os conhecemos, nasceram no mesmo instante e do mesmo gesto.</p>' +
    '<p>Daí a conclusão a que chegaram os sacerdotes, os escribas e até os ladrões: a vida é aprender. Aprender a evitar, e ajudar a evitar; ou aprender a encontrar, e ajudar a encontrar.</p>' +
    '<h3>Da ironia</h3>' +
    '<p>E aqui mora a ironia que os mestres de templo preferem não explicar. Encontrar não é o bom, e evitar não é o ruim. É o karma que o próprio karma carrega: perseguimos o bem evitando o mal, e fazemos o mal apenas encontrando o mal.</p>' +
    '<p>Parece injusto, e talvez seja. Mas os caminhos são feitos por quem caminha, e ninguém caminha sem deixar chão atrás de si.</p>' });
  add({ lv: 'I', body:
    '<p>Se lhe pedirem uma lei em uma frase, é a mais antiga que conheço: <b>o que foi plantado será devolvido</b>. Os camponeses chamam de semeadura; os sacerdotes, de karma; os technocratas, de probabilidade; os fiéis, de providência; e os ladrões, de sorte, até o dia em que deixam de sorrir.</p>' +
    '<h3>Do Olho</h3>' +
    '<p>Marghar não tem rosto que alguém possa descrever, mas tem um símbolo, e o símbolo é um olho. Imagine dois K voltados um para o outro, formando entre si um losango. É o <b>Olho Karmico</b>, e não o confunda com um objeto: é a própria lei natural do karma, regida por Marghar.</p>' +
    '<p>Enquanto uma alma vive, o Olho a acompanha, e cada escolha, cada juízo, cada pacto, cada gesto de misericórdia ou crueldade cai dentro dele. O que cai no Olho é <b>líquido</b>, porque ainda está sendo acrescentado. O karma de quem vive ainda pode crescer, ser desviado, ser trocado por outro. Nada está selado enquanto a pessoa respira.</p>' +
    '<p>O karma semeado é líquido porque, como a água, ele muda. E assim como o líquido se molda ao seu recipiente, o karma se molda e se transforma conforme o caminhante que o carrega: o mesmo ato pesa de um jeito numa alma e de outro jeito noutra.</p>' +
    '<p>Haverá quem pergunte se o Olho julga. Não julga, vê. E o que ele vê, guarda.</p>' +
    '<h3>Notas do cronista</h3><p class="fnote"><span class="nb">✎</span>Os anciãos dizem “um tempo anterior a todos os tempos”. Orvalen, nos fragmentos que temos dele, escreve de outro modo: “o Antes também teve um antes, e foi de lá que ele veio olhar”. Não encontrei mais nenhuma linha sobre isso, nem sei de quem é o “ele”.</p><p class="fnote"><span class="nb">✎</span>Em todo o mundo, o Olho é desenhado aberto. Conheço um único lugar onde ele aparece fechado: uma porta de pedra preta, sem maçaneta, com o olho esculpido de pálpebras baixas. Falarei dela mais de uma vez neste volume, porque mais de uma vez me falaram dela.</p>'  });

  add({ toc: 'Livro II — Os deuses que trilham o caminho', lv: 'II', eyebrow: 'Livro II', title: 'Os deuses que trilham o caminho', start: true, body:
    '<p>Marghar rege, mas não caminha. Quem caminha são os outros, e cada um escolheu uma estrada e a trilha desde antes de haver quem a seguisse. Foram essas estradas que, mais tarde, os mortais passaram a chamar de <b>caminhos</b>.</p>' +
    '<h3>Os Altos Deuses</h3>' +
    '<p><b>Auréon, o Majestoso</b>, senhor da luz celeste, é o deus dos paladinos. Dizem que sua igreja nasceu de um juramento: o de que haveria sempre alguém entre o mal e o indefeso. Seus sacerdotes ensinam que a luz não é pureza, é responsabilidade.</p>' +
    '<p><b>Odin, o Pai de Todos</b>, é o deus dos guerreiros nórdicos. Vive onde faz frio, e quem o procura precisa subir até às regiões gélidas. Não promete conforto, promete uma vida inteira dedicada à força e à honra.</p>' +
    '<p><b>Hemara, a Mãe Rubra</b>, é a senhora do sangue e do vampirismo. Quem ouve seu nome por muito tempo passa a sentir sede. A tradição diz que ela nunca obrigou ninguém, que apenas esperou.</p>' });
  add({ lv: 'II', body:
    '<p><b>Selvar, o Pai da Matilha</b>, é o deus dos lobisomens. Sua lei é a da alcateia: quem está dentro é protegido até a morte, quem está fora é presa ou é aliado.</p>' +
    '<p><b>Arquelon, o Escriba Arcano</b>, é o deus dos magos. Dizem que escreveu a primeira palavra de poder e que passa a eternidade corrigindo-a. Seus estudiosos acreditam que o conhecimento é a única caridade que não se esgota.</p>' +
    '<p><b>Mekhanos, o Grande Engenho</b>, é o deus dos technocratas. Não gosta de ser chamado de deus: prefere “o projeto”. Seus fiéis acreditam que o mundo é uma máquina em constante refinamento, e que melhorá-la é rezar.</p>' +
    '<p><b>Aravel, a Vigília Verde</b>, é o deus dos caçadores de demônios. Seu olho nunca fecha, e quem o serve vive em alerta, perseguindo o que se esconde nas sombras do mundo.</p>' });
  add({ lv: 'II', body:
    '<h3>Os Príncipes Infernais</h3>' +
    '<p>Na outra margem da estrada estão os que a tradição chama de príncipes, não de deuses, porque dependem de quem se curve a eles. Cada um é uma <b>faceta de Ahzur</b>, um jeito que a Fome do Antes aprendeu de andar. São nove, e há quem diga que ainda faltam.</p>' +
    '<p><b>Malgrath, o Senhor dos Pactos</b>, é o patrono dos bruxos. Nunca mente em um contrato, e é justamente por isso que quem o assina se arrepende.</p>' +
    '<p><b>Vhaelor, o Demônio da Loucura</b>, não tem seguidores, tem vítimas. É um dos grandes inimigos dos mundos de Karmika, e matar um de seus avatares é feito digno de canção até para um vampiro.</p>' +
    '<p><b>Orrukh, o Devorador de Cinzas</b>, aparece quando muitas almas pesam juntas. Dizem que se alimenta do karma coletivo das cidades que se perderam.</p>' });
  add({ lv: 'II', body:
    '<p><b>Sythra, a Voz do Sussurro</b>, anda pela palavra. Não mente: escolhe o que dizer, e promete a cada um aquilo que ele já queria ouvir.</p>' +
    '<p><b>Gorvak, o Banquete Sem Fim</b>, é a faceta mais próxima da Fome pura. Não pede nada; apenas põe a mesa. É o patrono dos Convivas, os que se oferecem ao deleite de ser devorados.</p>' +
    '<p><b>Nyxael, a Noite Sem Ecos</b>, anda pelo esquecimento. Apaga nomes, rostos e dívidas da memória de quem sofre, mas nada se apaga do Olho.</p>' });
  add({ lv: 'II', body:
    '<p><b>Zerath, o Rei da Podridão</b>, anda pelo que apodrece devagar: a doença, a ruína, as cidades que se corrompem por dentro antes de caírem.</p>' +
    '<p><b>Ishkara, a Dama das Correntes</b>, anda pelo domínio. É a patrona dos subjugadores, dos que fazem de outros o seu chão.</p>' +
    '<p><b>Morvek, o Quebra-Juramentos</b>, anda pela traição. Dizem que espera ao lado de todo juramento, e que paladinos caídos o conhecem pelo nome.</p>' });
  add({ lv: 'II', body:
    '<h3>As Essências do Caminho</h3>' +
    '<p>Se os príncipes são as facetas da Fome, o lado oposto não tem príncipes. Tem as <b>Essências</b>: seres que, em vez de reinar, ajudaram. Não pedem joelho dobrado nem juramento. A tradição as reparte em três ofícios.</p>' +
    '<p><b>As que desvendaram o labirinto.</b> <b>Ilmara, a Cartógrafa dos Passos</b>, foi a primeira a mapear o caminho passo a passo. <b>Orvalen, o Leitor de Rastros</b>, aprendeu a ler no chão onde Ahzur já havia passado. <b>Sael, a Que Voltou</b>, é a única alma que, dizem, chegou ao centro do labirinto e retornou para contar.</p>' });
  add({ lv: 'II', body:
    '<p><b>Os Arquitetos.</b> Constroem e reparam os caminhos karmicos. <b>Brannor, o Pedreiro de Estradas</b>, assenta as pedras onde a estrada se abre. <b>Lythaen, a Tecelã de Pontes</b>, costura os caminhos que se rasgam. <b>Dhurgan, o Reparador de Veios</b>, é o ferreiro que conserta o que o tempo e a Fome corroem.</p>' +
    '<p><b>Os Fechadores.</b> Fecham os caminhos quando um príncipe, uma faceta de Ahzur, está quase chegando. <b>Caldris, o Selador de Portas</b>. <b>Merith, a Última Porta</b>. <b>Aldun, o Guardião do Limiar</b>.</p>' +
    '<p>Nenhuma Essência vence Ahzur. Fechar é adiar, e consertar é dar tempo. Mas dizem que, por causa delas, o labirinto ainda está de pé.</p>' +
    '<p>Por isso mesmo as Essências são caçadas. Assim como caminhantes cumprem tarefas prodigiosas banindo do mundo, nem que seja por pouco tempo, um príncipe maligno, os caminhantes do lado karmico de Ahzur desejam matar uma Essência para realizar a sua. Quem mata um Arquiteto abre um buraco no labirinto, e quem mata um Fechador deixa uma porta aberta para um príncipe passar.</p>' });
  add({ lv: 'II', body:
    '<h3>Como os deuses tratam os mortais</h3>' +
    '<p>Nenhum deus invade a alma de ninguém. O que existe é o <b>juramento</b>: o mortal se aproxima, promete, e o deus responde com <b>dádivas</b>. Em troca, ele aceita <b>votos</b> e <b>interdições</b>: o que fazer e o que jamais fazer.</p>' +
    '<p>Os deuses também têm suas inimizades, e os fiéis as herdam. Quem serve a um precisa saber quem o outro não perdoa.</p>' +
    '<p>Os sacerdotes sussurram uma pergunta: os deuses também colhem o que plantam? Marghar nunca disse, mas a resposta é sim. Quando um príncipe das trevas, uma Essência ou um deus cai, notícias correm o mundo todo, falando do feito grandioso de quem o derrubou, e dizem que ele encontrou o seu karma. Eles somem por cem turnos, mas a influência deles permanece. Esses seres juntaram, em infinitas caminhadas e vidas, tanto karma que a morte deles explode em energia karmica sem ter para onde ir. Essa energia lê o karma de quem está presente e se transforma em itens feitos para cada um, para atender ao karma de cada um.</p>' +
    '<h3>Notas do cronista</h3><p class="fnote"><span class="nb">✎</span>Na sala dos príncipes, no terceiro subsolo da Biblioteca, há dez nichos escavados na parede. Nove têm nome gravado na pedra. O décimo não tem nome nenhum, e é o único em que não se acumula poeira.</p><p class="fnote"><span class="nb">✎</span>Contei nove Essências, como contam todos. Mas os hinos mais velhos de Ilmara, cantados nas vilas élficas, têm uma estrofe com um nome que ninguém consegue pronunciar até o fim: a cantora sempre perde o fôlego na mesma sílaba, e a estrofe recomeça.</p>'  });

  add({ toc: 'Livro III — Plantar e colher', lv: 'III', eyebrow: 'Livro III', title: 'Plantar e colher', start: true, body:
    '<p>O mundo de Karmika se divide, antes de qualquer fronteira, em duas estações da alma: a que planta e a que colhe.</p>' +
    '<h3>O tempo de plantar</h3>' +
    '<p>Quando uma alma vive, ela planta. Cada passo é uma semente: a guilda em que entrou, a escola em que estudou, o inimigo que poupou, o inocente que não poupou. Matar também é plantar, e até as escolhas pequenas, se feitas de propósito, contam.</p>' +
    '<p>Nesse tempo o Olho está aberto na horizontal, e o karma é líquido, ainda sobe, ainda se mistura. Quem vive muito vê o Olho encher.</p>' + EYE_FILL });
  add({ lv: 'III', body:
    '<h3>A Ampulheta</h3>' +
    '<p>Quando a alma morre, o símbolo gira. Os dois K se erguem de pé, e o Olho torna-se <b>Ampulheta</b>. O K de pé não carrega uma ampulheta dentro; ele é a ampulheta.</p>' + HOUR +
    '<p>E então acontece a coisa mais importante que sei sobre o karma: <b>o líquido seca</b>. O que era líquido vira areia, e a areia começa a cair pelo bico de baixo do K. O líquido, enquanto era líquido, ainda podia mudar. A areia não muda. Está feito, e não há para onde fugir.</p>' });
  add({ lv: 'III', body:
    '<p>A alma recebe então o que plantou, grão por grão. Um dos sacerdotes de Auréon me disse uma vez: “A recompensa é seca porque já não é negociável”. A Ampulheta precisa esvaziar completamente antes de o símbolo voltar a girar, e só então a alma pode criar karma de novo.</p>' +
    '<p>Ela esvazia de dois jeitos, e vale o que vier primeiro: pelas consequências, quando o que se plantou finalmente acontece, ou pelo tempo, quando a areia simplesmente acaba. Quem carrega muito karma pode ter, digamos, cinquenta turnos pela frente. Nesse tempo, coisas acontecem com ele, pessoas deixam de gostar dele e efeitos nocivos o visitam. Um símbolo o persegue por toda parte, o símbolo do caminhante karmico. Ele pode virar alvo de contratos de perseguição, ou receber descontos e benefícios por vinganças que o mundo achou necessárias.</p>' +
    '<h3>O retorno</h3>' +
    '<p>A alma volta à sua caminhada, e o caminhante escolhe de novo a sua raça e traça o seu caminho. Mas não volta vazia. Traz consigo o que foi: o vampiro morto por um caçador pode renascer com sede inexplicável ou com aversão a alho; o lobisomem pode acordar ouvindo uivos que ninguém mais escuta. E há os que sabem. Profetas e místicos de guildas antigas reconhecem certas almas, e algumas dessas almas são caçadas por causa do que foram.</p>' +
    '<p>Quem joga durante anos vive muitas vidas, e a história de cada uma será contada de novo, cobrada de novo, nas vidas seguintes.</p>' +
    '<p>Não imagine que a Ampulheta separa santos de pecadores. Ela não conhece bem nem mal, só ação e reação. O caminhante que fez o que chamamos de mau, e que apenas abriu caminhos que arruinaram outros, terá o seu karma a pagar. Mas quem fez tudo bonito e ajudou muita gente também volta com karma a pagar. Muitos do karma oposto vão pôr um prêmio na sua cabeça, e outros lhe darão descontos em itens poderosos. O Olho vê, e nada além disso.</p>' });
  add({ lv: 'III', body:
    '<h3>A Lágrima Karmica</h3>' + EYE_TEAR +
    '<p>Há uma exceção ao curso da Ampulheta, e é a mais cobiçada de Karmika.</p>' +
    '<p>Quando alguém comete um feito digno de canção, bom ou mau, o Olho chora. Ela cai do vértice de baixo, e é chamada <b>Lágrima Karmica</b>. Não se ganha pela quantidade de feitos, e sim por feitos históricos: um vampiro bondoso, um lobisomem gentil, um bruxo que usa demônios contra o mal, um paladino que se entrega ao satânico, um caçador que persegue paladinos heróicos, quem derrota uma lenda, quem se sacrifica perfeitamente. Cada um desses andou por onde o labirinto não previa.</p>' +
    '<p>Aqui cabe falar de Marghar. Por incontáveis eras ele permaneceu criando caminhos para todas as possibilidades karmicas, e nada do que um caminhante fizesse parecia escapar do que ele havia previsto. Mas, muito raramente, alguém de nós, dos que andam em Karmika, faz o que não estava previsto. Esse caminho novo é criado literalmente por um caminhante: em seu feito memorável, ele toma para si a energia de Marghar, porque sem ela nenhum caminho se cria, e traça por si mesmo um caminho impossível, que nem o antigo antes do antigo havia previsto.</p>' +
    '<p>Não é roubo de ladrão. É o roubo de uma árvore que puxa da terra o nutriente para existir, e talvez seja o mesmo karma de quem pensou primeiro. Essa energia invocada causa dor em Marghar, mas não o fere, porque ele é anterior à ferida que surgiu no caminho e anterior ao prazer que surgiu no caminho. Ele se emociona, e chora a lágrima do próprio Olho que vê. Vista por ele e vinda dele, ela é poderosa.</p>' +
    '<p><b>Em quem a recebeu</b>, ela dá a chance de reviver ao morrer, sem passar tão cedo pela culpa karmica. Só a alma que a conquistou pode usá-la assim. <b>No mundo</b>, ela pode ser vendida, e então torna-se item: evolui uma guilda, forja peças únicas, compõe poções poderosas, serve de matéria-prima e de moeda de especulação, e dela podem sair um Martelo da Justiça ou uma espada como as das lendas.</p>' +
    '<p>Os anciãos resumem assim: a Lágrima é a emoção de Marghar. Ele raramente se emociona, e quando o faz, o mundo vale mais do que ouro.</p>' +
    '<h3>Notas do cronista</h3><p class="fnote"><span class="nb">✎</span>Perguntei, nas galerias, quem foi o primeiro a fazer o Olho chorar. O registro mais antigo da Biblioteca tem a data e o nome raspados com faca. Do feito sobrou uma única palavra, a última da linha: voltou.</p>'  });

  add({ toc: 'Livro IV — Os povos', lv: 'IV', eyebrow: 'Livro IV', title: 'Os povos', start: true, body:
    '<p>Todo mundo começa em algum lugar, e em Karmika toda alma começa em um de três povos. Ninguém nasce vampiro, mago ou paladino. Nasce humano, anão ou elfo, num vilarejo pequeno, e tudo o mais é consequência.</p>' +
    '<h3>Os humanos</h3>' +
    '<p>Somos os mais numerosos e os menos especiais, e talvez por isso os mais livres. Nenhum caminho nos é estranho, nenhuma estrada nos cobra a pele. Os humanos constroem: casas, pontes, muralhas e cidades inteiras são obra de mãos humanas. E muitos, quando a alma volta depois da morte, escolhem voltar humanos, de modo que quase todos carregamos, no fundo, o começo de todos.</p>' +
    '<h3>Os anões</h3>' +
    '<p>Gente de montanha, de forja e de teimosia. Os anões que conheci acreditam que o que se faz com as mãos não precisa de justificativa. Um anão caçador de demônios ou bruxo não é proibido, apenas raro, e ouvi dizer que seu povo o olha como quem vê um irmão saindo da toca.</p>' });
  add({ lv: 'IV', body:
    '<h3>Os elfos</h3>' +
    '<p>Os elfos pertencem às florestas bonitas, onde as árvores têm memória e os ofícios têm ritmo. Um elfo que se faz vampiro ou lobisomem trai mais do que a si mesmo, trai a sua gente. Ele pode fazê-lo, e muitos já o fizeram, mas o preço se cobra em karma, e não em lei.</p>' +
    '<h3>O que é impedimento, e o que é culpa</h3>' +
    '<p>Perguntei a muitos sacerdotes se a lei veda a alguém um caminho por sua raça. A resposta era sempre a mesma: nenhuma lei veda, tudo cobra. A natureza não fecha a porta, apenas deixa o preço escrito nela.</p>' });

  add({ toc: 'Livro V — Os oito caminhos', lv: 'V', eyebrow: 'Livro V', title: 'Os oito caminhos', start: true, body:
    '<p>As almas de Karmika não escolhem uma profissão, tornam-se algo. Ninguém acorda paladino numa manhã: precisa entrar na igreja, estudar, servir, provar. Cada caminho exige uma filiação, uma jornada e, quase sempre, uma viagem a regiões distantes. E, até os primeiros vinte níveis, todos sobrevivem como podem, sem caminho nenhum.</p>' +
    '<h3>O Paladino</h3>' +
    '<p>Para ser paladino, é preciso entrar na igreja de Auréon, tornar-se sacerdote e, só então, libertador do mal. Veste a luz celeste e odeia os monstros.</p>' +
    '<h3>O Guerreiro Nórdico</h3>' +
    '<p>Aprende na academia nórdica de combate, nas montanhas gélidas, e dedica a vida a Odin. É firme, orgulhoso e, segundo os lobisomens, intolerável.</p>' });
  add({ lv: 'V', body:
    '<h3>O Vampiro</h3>' +
    '<p>Ninguém o escolhe de uma vez. É mordido, ou aceita a mordida, e passa a viver da sede de Hemara. O vampiro odeia lobisomens, paladinos e os magos do bem.</p>' +
    '<h3>O Lobisomem</h3>' +
    '<p>Entra numa guilda licantropa e se transforma. A matilha é sua lei. Odeia vampiros, ladrões e guerreiros nórdicos.</p>' +
    '<h3>O Caçador de Demônios</h3>' +
    '<p>Formado nas escolas de caçadores, persegue o que é demoníaco: vampiros, lobisomens, magos e bruxos satânicos. Pode também ser caçador de recompensas.</p>' +
    '<h3>O Bruxo</h3>' +
    '<p>Faz pactos com os príncipes infernais. Sua rivalidade não está fora do mal, está dentro dele, entre os próprios que o servem. Pode vender rituais de vampirismo e preparar poções de poder.</p>' });
  add({ lv: 'V', body:
    '<h3>O Mago</h3>' +
    '<p>Estuda por muito tempo e se torna alguém que dobra a realidade. Sua rivalidade está no seio do bem, entre os que seguem a luz de maneiras distintas. Realiza rituais de cura em regiões de índice karmico ruim.</p>' +
    '<h3>O Technocrata</h3>' +
    '<p>Entra na academia tecnológica de Karmika e sai com máquinas dentro do próprio corpo. É o mais neutro de todos, porque é o mercador do mundo: vende, conserta, melhora cidades, traz automação e, se quiser, caça recompensas.</p>' +
    '<h3>As rivalidades</h3>' +
    '<p>O ódio entre caminhos é a lápide de muitas histórias. Vampiros e lobisomens se enfrentam desde a primeira lua. Paladinos não perdoam monstros, e os caçadores não perdoam ninguém que tenha cheiro de inferno. Mas o ódio de um caminho é tendência, não destino. Existem vampiros que protegem aldeias e paladinos que se corrompem, e quem faz o inesperado às vezes faz o Olho chorar.</p>' });

  add({ toc: 'Livro VI — As cores do karma', lv: 'VI', eyebrow: 'Livro VI', title: 'As cores do karma', start: true, body:
    '<p>O líquido que enche o Olho não tem uma cor só. Cada escolha tinge o que cai nele, e o Olho de um veterano é como um vitral: dá para ler uma vida inteira só pelas cores.</p>' +
    '<ul class="colors">' +
    '<li>' + sw('#b3202f', '#b3202f') + '<span><b>Sangue</b>, o vampirismo</span></li>' +
    '<li>' + sw('#2b1a3d', '#7b5fa8', '#8d6fc0') + '<span><b>Energia negra</b>, a bruxaria</span></li>' +
    '<li>' + sw('#fff0c2', '#ffd36a') + '<span><b>Luz celeste</b>, o paladino</span></li>' +
    '<li>' + sw('#3dff8a', '#3dff8a') + '<span><b>Verde brilhante</b>, o caçador de demônios</span></li>' +
    '<li>' + sw('#2a4bff', '#2a4bff') + '<span><b>Azul escuro brilhante</b>, o technocrata</span></li>' +
    '<li>' + sw('#46bcff', '#46bcff') + '<span><b>Azul claro brilhante</b>, o mago</span></li>' +
    '<li>' + sw('#8b5a2b', '#8b5a2b') + '<span><b>Marrom</b>, o lobisomem</span></li>' +
    '<li>' + sw('#ffb000', '#ffb000') + '<span><b>Amarelo âmbar</b>, o guerreiro nórdico</span></li>' +
    '</ul>' +
    '<p>O lobisomem tem a cor da terra e da pelagem, e o guerreiro nórdico a do âmbar antigo, o das fogueiras e do ouro de Odin. Já não preciso vê-las em sonho.</p>' +
    '<p>Só não confunda duas luzes que parecem irmãs. A do paladino é branca com dourado, e tem um aspecto místico, celestial. A do mago é branco-gelo, e tem aspecto elemental. Uma vem do alto, a outra vem da natureza das coisas.</p>' });
  add({ lv: 'VI', body:
    '<h3>Quando as cores se somam</h3>' +
    '<p>As cores não se cancelam. Ninguém apaga o sangue de um vampiro com luz celeste; o que acontece é que as duas convivem, e delas nasce uma terceira. As combinações são as que mais fascinam os escribas, porque cada soma conta uma história: o caçador que bebeu sangue, o mago que fez um pacto, o technocrata que se arrependeu.</p>' +
    '<p>Mais cores, mais peso. A culpa karmica de quem somou muito é pesada, porque há mais a colher.</p>' +
    '<h3>Quando se trai um caminho</h3>' +
    '<p>O caminho trai-se e a cor muda. Quando um paladino cai, a luz celeste esmaece e o que vem depois não é inocente. Quem trai a raça, a guilda ou o juramento paga duas vezes: com a cor nova e com o peso da cor antiga.</p>' +
    '<h3>Notas do cronista</h3><p class="fnote"><span class="nb">✎</span>Os escribas registram oito cores, e eu também. Mas na margem de um livro de cores muito velho alguém acrescentou, em tinta mais clara, uma nona: cinza, que não é a mistura de nenhuma. Não há caminho que dê essa cor. Já vi capas dessa cor, porém.</p>'  });

  add({ toc: 'Livro VII — A terra de Karmika', lv: 'VII', eyebrow: 'Livro VII', title: 'A terra de Karmika', start: true, body:
    '<p>Karmika é o mundo inteiro, e não só um reino. Os mapas que já vi concordam em três coisas: há pelo menos quatro grandes cidades; cada uma delas tem seis cidades pequenas a seu redor; e, entre elas, espalham-se pequenos vilarejos.</p>' +
    '<p>Os vilarejos são onde nascemos. Lá a vida começa quase como uma sobrevivência, e quem quer ser algo precisa partir. As cidades pequenas guardam escolas de pequeno nível, onde se aprende o primeiro de cada ofício. As grandes cidades abrigam as escolas de alto nível, e quem chega a elas já é alguém.</p>' +
    '<h3>O mundo que assusta</h3>' +
    '<p>Entre as cidades, a estrada é perigosa. Há florestas tão densas que o dia vira crepúsculo; cavernas escuras onde algo respira; igrejas e mausoléus abandonados por padres que se tornaram maus; criptas, cemitérios, e cidades devastadas, de onde ninguém volta sem uma história que não quer contar.</p>' });
  add({ lv: 'VII', body:
    '<h3>O mundo que acolhe</h3>' +
    '<p>Mas Karmika não é só sombra. Há campos belos onde a luz demora no horizonte, e há montanhas gélidas, lar dos guerreiros do norte, onde a neve brilha como prata. Há uma cidade tecnológica de estilo steampunk, onde o vapor sobe em colunas e as engrenagens giram até a madrugada, que é a casa dos technocratas. Há florestas bonitas dos elfos, regiões de ilhas à espera de navegantes, e campos sagrados onde a igreja de Auréon cuida de quem chega ferido.</p>' +
    '<p>Os que escrevem sobre Karmika têm o hábito de só contar o escuro. Eu peço que não se esqueçam: o escuro pesa mais porque existe o belo, e o belo vale mais porque, ali perto, há escuro. Mesmo nos campos sagrados, o mal pode chegar, e uma terra curada por rituais pode florescer de novo.</p>' +
    '<h3>Notas do cronista</h3><p class="fnote"><span class="nb">✎</span>O grande mapa foi copiado três vezes. Nas três cópias, sem combinarem, os copistas desenharam o mesmo pequeno círculo no centro das Terras dos Homens, onde não há nada. Perguntados, nenhum lembrava de tê-lo feito.</p>'  });

  add({ toc: 'Livro VIII — Ofícios e mercadores', lv: 'VIII', eyebrow: 'Livro VIII', title: 'Ofícios, mercadores e o Pacto da Honestidade', start: true, body:
    '<p>Um mundo que dura anos não vive só de espadas. Alguém precisa plantar o trigo, levantar a casa, forjar a lâmina e levar o pão até a cidade. Em Karmika, cada alma tem um ofício que combina com o que sabe fazer, e até o trabalho deixa marca no Olho.</p>' +
    '<h3>Quem faz o quê</h3>' +
    '<p>Os <b>elfos</b> trabalham com o que a floresta dá. Os <b>humanos</b> constroem. Os <b>anões</b> caçam veios e forjam, conforme dizem. Os <b>guerreiros</b> e os <b>caçadores de demônios</b> podem seguir como caçadores de recompensas, ou escolher trabalhos de força e de plantio. Os <b>bruxos</b> cobram por rituais de vampirismo e preparam poções poderosas. Os <b>magos</b> curam regiões de índice karmico ruim com seus rituais. E o <b>technocrata</b> faz de tudo: mercador, ferreiro, engenheiro, aquele que traz automação às cidades.</p>' });
  add({ lv: 'VIII', body:
    '<h3>O mercador do mundo</h3>' +
    '<p>O technocrata é o mais neutro de todos, e a razão é simples: não se pode vender para todos sendo inimigo de alguém. Por isso os mercadores e ferreiros de Karmika obedecem a regras severas de honestidade, que chamo de Pacto.</p>' +
    '<p>O mercador não pode comerciar ao mesmo tempo com a guilda dos vampiros e com a dos lobisomens. Não pode vender informações. Não pode superfaturar preços. Não pode trair os grupos de dungeon que o acompanharam.</p>' +
    '<h3>O peso da avareza</h3>' +
    '<p>Há mercadores que acumulam fortuna à custa de vidas, há traidores e há subjugadores. O Olho os vê a todos, e o peso que carregam não é pequeno. Mas existe o outro lado: o technocrata que usa a inteligência para melhorar a cidade, trazer luz, traçar uma ponte, construir uma máquina que alimenta mil bocas, planta uma semente que um dia lhe volta.</p>' +
    '<p>Há ainda o ladrão. É ofício de humanos e de elfos. Os anões, tão pesados e firmes, tomam o roubo como coisa que vai contra a natureza deles. Mas já ouvi falar da Pequena Peste, um anão habilidoso que circulava pelas tavernas roubando tudo o que se escondia abaixo da linha da cintura, o que não era pouco.</p>' +
    '<p>Os ofícios dos caminhos têm os seus preços. O <b>paladino</b>, antes de espada, é um curandeiro de fé: reza, quebra maldições e, como o mago, liberta cidades inteiras do karma que as sufoca. Pode ser dano ou ser muralha. O <b>vampiro</b> é um tecelão exímio de roupas finas, e magos e bruxos só compram as suas. Faz também vinho e as comidas que pedem paciência, queijos raros e carne defumada. O <b>lobisomem</b> constrói muito bem, e tece roupas grossas, as de guerreiros e de paladinos, que compram muito dele. Doma feras melhor do que o humano, porque fala uma língua mais próxima da dos bichos.</p>' });

  add({ toc: 'Livro IX — Guildas, escolas e guerras', lv: 'IX', eyebrow: 'Livro IX', title: 'Guildas, escolas, igrejas e guerras', start: true, body:
    '<p>O karma não é só de um. Uma guilda inteira carrega o peso das suas escolhas, e o que um membro planta, todos colhem, um pouco. Por isso os líderes sensatos escolhem bem quem recebem.</p>' +
    '<p>As maiores e mais antigas das guildas podem, por mérito, receber uma concessão: tornar-se <b>escola</b>. Assim, há escolas de vampiros, de lobisomens, de caçadores de demônios, e igrejas grandes de pleno direito. As escolas básicas pertencem ao mundo. As concedidas, às memórias de quem as conquistou.</p>' +
    '<p>Havia quem temesse que isso fechasse as portas aos novos. Mas os veteranos que conheci repetem uma frase: quem chega agora não pode ser trancado do lado de fora. As guildas poderosas têm o dever de ensinar, e não só o direito de reinar.</p>' });
  add({ lv: 'IX', body:
    '<h3>Quando as bandeiras se erguem</h3>' +
    '<p>E há as guerras. A escola de caçadores de demônios, atacada por lobisomens, chama todos os caçadores ao combate. Um chamado às armas faz soar os sinos dos paladinos de todas as cidades. As instituições entram em guerra umas contra as outras, e quem escolhe um lado planta karma coletivo.</p>' +
    '<p>Muitos desses acontecimentos também surgem como eventos de PvE, nascidos da história de cada jogador, nos quais vários entram numa mesma instância para viver, juntos, aquela memória.</p>' });

  add({ toc: 'Livro X — A longa jornada', lv: 'X', eyebrow: 'Livro X', title: 'A longa jornada', start: true, body:
    '<p>Para chegar ao topo de um caminho é preciso tempo, e Karmika não dá pressa a ninguém. Os primeiros vinte níveis são de sobrevivência: sem caminho, sem título, apenas a pessoa e o mundo. Passado esse limiar, a alma se prepara; aos trinta, diante da Vidente, ela escolhe, e a estrada se abre. No vigésimo nível, uma luz cobre tudo diante de quem caminha e o Olho karmico se abre. E quando essa alma morre, o Olho e o seu líquido secam, ele se vira e se torna Ampulheta.</p>' +
    '<p>Depois disso, subir leva anos. Os escribas falam de um nível duzentos para a alma e de um nível trezentos e cinquenta para o caminho, e não há atalhos que eu conheça. Muitas vidas são gastas na subida, e muitas mortes também. O nível da alma e o do caminho pedem a mesma soma de esforço: chegar ao duzentos custa tanto quanto chegar ao trezentos e cinquenta do ofício, de modo que o ofício sobe mais fácil que a vida. Mesmo assim, um jogador que não descansa leva uns dois anos. E quanto mais alto, mais a subida paga: um paladino que passa do nível trezentos ao trezentos e um ganha muito mais força, espírito e poder em suas magias do que quando passou do trinta ao trinta e um.</p>' +
    '<p>Entre tantas vidas, nasce a pergunta que mais me interessa e que nenhum número responde: <b>será que a alma aprende?</b> O Olho vai ver, e o historiador também.</p>' +
    '<p>E há uma lei da subida que poucos aprendem cedo. Quem quer chegar ao topo de um caminho não o faz numa vida só: precisa viver muitas vidas naquele mesmo caminho. Um paladino precisa renascer paladino por dezenas, talvez centenas de vidas, até se tornar um paladino da ordem. Cada vez que o caminhante escolhe o mesmo caminho de novo, a sua pontuação ganha um multiplicador, de um e um décimo, de um e três décimos, de um e meio, até o limite de três vezes. E quem muda de caminho não volta do zero: leva pontuação semelhante ao seu nível pessoal, porque aprendeu em muitas experiências diferentes. O mesmo vale para os ofícios: quem já foi ferreiro ou tecelão numa vida passada aprende de novo mais depressa, como quem tem uma aptidão natural.</p>' });

  add({ toc: 'Livro XI — A Grande Biblioteca', lv: 'XI', eyebrow: 'Livro XI', title: 'A Grande Biblioteca e a Crônica Viva', start: true, body:
    '<p>No coração de Karmika, na cidade central, ergue-se a Grande Biblioteca, tão imensa que ninguém jamais percorreu todas as suas galerias. Há corredores de pergaminhos, salões de mapas, e uma sala onde as páginas se escrevem sozinhas. É aqui que trabalho.</p>' +
    '<p>Meu ofício é simples de dizer e pesado de cumprir: quando o Olho chora, alguém precisa anotar. Cada <b>Lágrima Karmica</b> derramada por Marghar é registrada por mim, com o nome de quem a conquistou, o feito que a causou e o dia em que caiu. Marghar não escreve; escrevo eu.</p>' +
    '<p>Quem quiser conferir a sua lágrima, ou saber da de outro, que me procure nas galerias.</p>' });
  add({ lv: 'XI', body:
    '<h3>A crônica que não termina</h3>' +
    '<p>Este livro nunca estará terminado. Cada guerra que se trava, cada escola que muda de mãos, cada exército de paladinos que responde a um chamado, cada guerreiro único que o mundo passa a conhecer, cada lágrima histórica, eu anoto, e uma página nova passa a existir.</p>' +
    '<p>Os nomes que aqui entrarem serão os nomes de quem viveu aquilo: guildas que se tornaram famosas, heróis que mudaram o rumo de uma guerra, almas cujo feito fez o próprio Olho chorar. Algumas das páginas que você lê foram escritas por jogadores, sem que eles soubessem.</p>' +
    '<blockquote>Quem planta algo grande será lido por quem vier depois.</blockquote>' +
    '<p>Seja você mesmo um capítulo.</p>' });

  add({ lv: 'XI', body:
    '<h3>Das seis runas</h3>' +
    '<p>Os copistas da Biblioteca escrevem com seis runas, e eu as desenho aqui porque o leitor as encontrará na moldura de todo livro sagrado de Karmika, na base das pedras de teleporte e no círculo que o mago traça antes do feitiço.</p>' +
    '<div class="figwrap"><svg class="runes6" viewBox="0 0 296 56" role="img" aria-label="As seis runas de Karmika: a Lágrima, o Olho Kármico, a Ampulheta, o Labirinto, a Fome e a Fresta, que brilha"><defs><radialGradient id="frg"><stop offset="0" stop-color="#ffe9ad" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9ad" stop-opacity="0"/></radialGradient></defs><ellipse cx="270" cy="28" rx="26" ry="26" fill="url(#frg)"><animate attributeName="opacity" values=".25;.8;.25" dur="5s" repeatCount="indefinite"/></ellipse><g transform="translate(6 8) scale(1.45)"><path d="M14 3 C17 9 21 13.5 21 18 A7 7 0 0 1 7 18 C7 13.5 11 9 14 3Z" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M14 3 C17 9 21 13.5 21 18 A7 7 0 0 1 7 18 C7 13.5 11 9 14 3Z" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(54 8) scale(1.45)"><path d="M4 4 V24 M24 4 V24 M12 4 L6.5 14 L12 24 M16 4 L21.5 14 L16 24 M8.5 14 Q14 9 19.5 14 Q14 19 8.5 14Z" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M4 4 V24 M24 4 V24 M12 4 L6.5 14 L12 24 M16 4 L21.5 14 L16 24 M8.5 14 Q14 9 19.5 14 Q14 19 8.5 14Z" fill="none" stroke="#15101e" stroke-width="1"/><path d="M14 12 a2 2 0 1 0 0.01 0Z" fill="#d9a24f"/></g><g transform="translate(102 8) scale(1.45)"><path d="M7 4 H21 L14 14 L21 24 H7 L14 14 Z" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M7 4 H21 L14 14 L21 24 H7 L14 14 Z" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(150 8) scale(1.45)"><path d="M5 24 V4 H23 V23.5 H8.5 V7.5 H19.5 V20 H12 V11 H16 V16.5" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M5 24 V4 H23 V23.5 H8.5 V7.5 H19.5 V20 H12 V11 H16 V16.5" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(198 8) scale(1.45)"><path d="M11.5 7.2 A8.3 8.3 0 1 0 16.5 7.2 M11.5 7.2 C11 5.4 9.8 4.2 8.2 3.6 M16.5 7.2 C17 5.4 18.2 4.2 19.8 3.6" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M11.5 7.2 A8.3 8.3 0 1 0 16.5 7.2 M11.5 7.2 C11 5.4 9.8 4.2 8.2 3.6 M16.5 7.2 C17 5.4 18.2 4.2 19.8 3.6" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(246 8) scale(1.45)" class="hot"><path d="M11.4 2.6 V18.8 M16.6 9.2 V25.4 M6.6 10.4 C9.2 10.4 11.4 11.8 12.8 14 C14.2 16.2 16.4 17.6 21.4 17.6" fill="none" stroke="#f6dc8e" stroke-width="2.7"/><path d="M11.4 2.6 V18.8 M16.6 9.2 V25.4 M6.6 10.4 C9.2 10.4 11.4 11.8 12.8 14 C14.2 16.2 16.4 17.6 21.4 17.6" fill="none" stroke="#15101e" stroke-width="1"/></g></svg></div><p class="runecap">Lágrima · Olho · Ampulheta · Labirinto · Fome · <b>(sem nome)</b></p>' +
    '<p>A <b>Lágrima</b>, o <b>Olho Kármico</b>, a <b>Ampulheta</b>, o <b>Labirinto</b> e a <b>Fome</b> têm nome e história, e falei de cada uma. A sexta não tem nome. Parece duas lâminas desencontradas, uma mais alta que a outra, com um fio que escorre por entre elas, e os aprendizes a chamam de a Fresta, porque é o que ela parece. Os sacerdotes a traçam no batismo e na ordenação do templário; os magos, no círculo; os mestres-pedreiros, na base de toda pedra de teleporte. Um ritual sem ela, dizem todos, não pega. Nenhum deles sabe dizer por quê. Eu também não sei.</p>' +
    '<p>Perguntei a cinco mestres de cinco casas. O Grão-Mestre Cassius disse que é da liturgia, e que liturgia não se discute. O Arquimago Vesk disse que é um fecho, e que todo círculo precisa de fecho. O Conde disse que a Casa a usa há mil anos e que mil anos não erram. Ulfrun rosnou. A Arquiteta Ylva disse que, se funciona, ela não vai parar para perguntar. Anotei as cinco respostas e reparei que nenhuma era uma resposta.</p>' +
    '<p>Os copistas a desenham por último, de olhos fechados. Perguntei de onde vem o costume. Ninguém soube me dizer.</p>' +
    '<h3>Notas do cronista</h3><p class="fnote"><span class="nb">✎</span>Dei nome a cinco runas. A sexta, que os copistas desenham por último e de olhos fechados, não tem nome, e um ritual sem ela não pega. Nas pedras de teleporte mais antigas ela está gasta do jeito errado: não por fora, pelas mãos de quem toca, mas como se tivesse sido empurrada de dentro. Atribuo isso aos viajantes. Não sei por quê.</p>' });
  add({ toc: 'Livro XII — As Areias e o trabalho do mundo', lv: 'XII', eyebrow: 'Livro XII', title: 'As Areias e o trabalho do mundo', start: true, body:
    '<h3>Do tempo que se conta em grãos</h3>' +
    '<p>Os mortais não medem o tempo em dias, mas em areias, porque foi a Ampulheta que lhes ensinou a contar. Cada areia dura quatro horas, e o dia tem seis. Não se perde nenhuma: o que não foi usado, o Olho também anota.</p>' +
    '<p>Há dois tipos de areia. As <b>areias de quem caminha</b> são suas: o treino na escola, a primeira missão, a longa subida de um nível ao outro. Uma tarefa pode custar uma areia e ser terminada antes dela, por quem a faz bem, porque a areia é o limite e nunca a pena. As <b>areias do mundo</b> pertencem a todos e correm mesmo quando ninguém olha: as pontes que se erguem, as casas que se somam à cidade, as lojas que o technocrata monta, as purificações que os magos mantêm.</p>' +
    '<h3>A cidade que adoeceu</h3>' +
    '<p>Contam de uma cidade sobre a qual caiu um karma pesado. A água escureceu, a névoa não saía das ruas e as plantações apodreciam antes da colheita. Quem tinha casa ali, ou estudava ali, precisou procurar magos de verdade, e os magos disseram o preço: trinta e cinco areias de purificação, sem interrupção. Cento e quarenta horas, quase seis dias, em que alguém precisa manter as mãos no ritual enquanto a cidade espera.</p>' +
    '<p>Ninguém comprou aqueles dias. O que se comprou foram mãos, e quem tem pressa descobre que é a mesma coisa. Mais magos ao redor do ritual encurtam o prazo, mas não a ponto de zerá-lo, pois a água negra tem a sua própria vontade. Se os magos se cansam e param, a água volta a escurecer.</p>' +
    '<h3>O Quadro e o Pacto</h3>' +
    '<p>No centro de cada cidade há um Quadro de Pedidos. Quem precisa de peles, de ervas, de um monstro morto, de uma pessoa trazida de volta ou de trabalhadores para uma obra escreve o pedido ali, deixa o pagamento sob a guarda do Pacto da Honestidade e espera. Quem aceita vai, cumpre e recebe. Se ninguém cumpre, o pagamento volta ao dono.</p>' +
    '<p>Mas o Quadro também é espelho. Um pedido de purificação pesa pouco na balança do Olho. Um pedido de morte pesa em quem pagou, em quem matou e na cidade que deixou o papel pregado. Aprendi com um velho contratador que o Quadro é a conversa mais honesta que uma cidade tem consigo mesma.</p>' +
    '<p>Nenhum caminho levanta uma cidade sozinho. O mago purifica, o humano constrói, o lobisomem carrega, o vampiro corre à noite, o technocrata projeta e vende. É assim que o mundo fica de pé: pela necessidade que um tem do outro.</p>' +
    '<h3>Notas do cronista</h3><p class="fnote"><span class="nb">✎</span>A moeda que se joga nas Fontes nunca chega ao fundo. Um technocrata de Porto Caldeira desceu uma corda com um sino na ponta, até onde a corda deu. O sino não tocou. Quando ele recolheu a corda, estava molhada só até a metade.</p>'  });

  add({ toc: 'Livro XIII — Os que apenas caminham', lv: 'XIII', eyebrow: 'Livro XIII', title: 'Os que apenas caminham', start: true, body:
    '<h3>Do caminhante que não se torna nada</h3>' +
    '<p>Há uma verdade que os escribas esqueceram de pôr nas primeiras páginas: em Karmika ninguém é obrigado a nada. O caminhante faz o que quer, e andar é a única regra. Muitos nunca serão vampiros, nem magos, nem paladinos. Serão humanos, elfos ou anões até o último dia, e isso não é pouca coisa.</p>' +
    '<p>Há quem viva pela aventura. Há os <b>tear hunters</b>, que passam a vida atrás do feito que o labirinto não previu, esperando ver o Olho chorar. Há os que colecionam vidas, uma depois da outra, como quem junta livros. E há os que vivem pela estabilidade, pela jogada longa, e deixam a sua marca em pedra, em madeira e em gado.</p>' +
    '<h3>O que cada povo constrói</h3>' +
    '<p>O humano é o grande construtor. Pode começar com uma caça, e depois fazer um celeiro, um açougue, uma escola. Outros humanos chegam e erguem casas, e onde não havia nada surgem uma aldeia, uma cidade e, com o tempo, uma grande cidade. Cria gado, ovelhas e cães. Contrata guerreiros, magos e technocratas, e estes trazem máquinas de colheita e ajuda para as obras.</p>' +
    '<p>O elfo amplia a floresta. Faz cidades sobre as árvores e, passo a passo, purifica grandes espaços de Karmika. O anão desce às montanhas e cava fundo, ou vai a outras cidades. Faz cervejas e carnes assadas que valem muito, tem fábricas de cerveja que viajam até as festas de aldeias e de guildas, e é ferreiro e comerciante hábil.</p>' +
    '<h3>O perigo de não escolher</h3>' +
    '<p>Mas quem não escolhe nada também não escolhe o que lhe acontece. Um vampiro pode atacá-lo e fazê-lo vampiro sem querer, um lobisomem pode mordê-lo. Um bruxo pode sequestrá-lo para um ritual satânico, ou um vampiro para uma transformação. Ele morre, e a morte dolorosa volta com a alma. Na vida seguinte o caminhante lembra, sem saber por quê, de quem o levou, e pode buscar vingança.</p>' +
    '<p>É por isso que as cidades de quem apenas vive precisam de muralhas, e as muralhas, de quem as defenda.</p>' +
    '<h3>Notas do cronista</h3><p class="fnote"><span class="nb">✎</span>Há na Biblioteca um caminhante que assina apenas Lume. O registro dele cobre os três povos e os oito caminhos, um depois do outro, e nunca jurou a mesma bandeira duas vezes seguidas. A última linha da sua lista tem o povo e o caminho em branco, e uma data que ainda não chegou.</p>'  });

  add({ toc: 'Livro XIV — As marcas da alma', lv: 'XIV', eyebrow: 'Livro XIV', title: 'As marcas da alma', start: true, body:
    '<h3>O que a pele lembra</h3>' +
    '<p>A alma volta depois de morrer, e o caminhante escolhe de novo o que quer ser: humano, elfo ou anão, e depois, se quiser, outra estrada. Mas as vidas anteriores não somem. Quem pedir para ver o perfil de alguém encontra ali as suas vidas passadas, uma por uma, com as façanhas de cada uma.</p>' +
    '<p>E há coisas que a morte não leva. Uma façanha nobre acompanha o caminhante e se torna parte do corpo. Uma traição, uma Lágrima, um feito heroico viram <b>cicatrizes</b> ou <b>tatuagens</b>, e as mais altas viram <b>brilhos</b> e <b>auras</b>. Permanecem, não importa quantas vezes ele morra.</p>' +
    '<p>Costumo dizer aos aprendizes da Biblioteca que um caminhante pode trocar de nome, de povo e de bandeira, mas que não engana quem sabe ler a pele. Eu leio.</p>' +
    '<h3>Notas do cronista</h3><p class="fnote"><span class="nb">✎</span>Uma tatuadora de Corvoscuro me jurou que algumas marcas aparecem antes do feito, e não depois. Mostrou-me o pulso de um rapaz com uma lágrima desenhada sob a pele, fina como um fio de cabelo. Ele nunca tinha feito o Olho chorar. Não sei o que foi feito dele.</p>'  });

  add({ toc: 'Livro XV — As duas bandeiras', lv: 'XV', eyebrow: 'Livro XV', title: 'As duas bandeiras: o Fio e os Desfiados', start: true, body:
    '<p>Contei, no primeiro livro, que os antigos dividiam as almas entre Desviadores e Convivas. Era uma conversa de sacerdotes. Mas as conversas de sacerdotes, cedo ou tarde, ganham bandeira, e hoje quem anda pelas estradas de Karmika vê duas flâmulas tremulando no alto das cidades. Dizem os mais velhos que <b>do choque entre elas nasceu o próprio karma</b>, e eu, que só anoto, não encontrei razão para duvidar.</p>' +
    '<h3>A Ordem do Fio</h3>' +
    '<p>“<b>Ninguém atravessa só.</b>” É o que dizem os da Ordem do Fio, e é o que bordam no escudo azul-noite de borda dourada: um labirinto circular e um fio de ouro que corre pelos corredores, da base até o Olho no centro. Eles guardam o Labirinto de Marghar. Para eles, cada corredor que fica de pé é uma alma que o Sem-Passo não encontra antes da hora.</p>' +
    '<p>A sua justiça é simples: ninguém é jogado à Fome sem estar pronto. A sua honra é mais simples ainda: o fio nunca se corta, e quem entra no Labirinto com um deles não sai sozinho, nem morto. Paladinos, caçadores de demônios e magos carregam o fio dourado.</p>' });
  add({ lv: 'XV', body:
    '<h3>Os Desfiados</h3>' +
    '<p>“<b>Todo muro é uma mentira.</b>” O escudo dos Desfiados é negro e rachado, com borda carmim: o labirinto partido em pedaços, uma boca dentada no centro, o fio cortado com as pontas desfiadas e duas lâminas cruzadas atrás. Eles querem cortar o fio e derrubar os muros. Para eles, o Labirinto é uma gaiola que devolve a alma à roda, vida após vida, e a Fome é a única porta para fora: a liberdade de verdade, até a de morrer de vez.</p>' +
    '<p>A sua justiça: ninguém deve ser guardado contra a própria vontade. A sua honra: nunca mentir para si mesmo, e quem anda até a boca anda de olhos abertos, sem empurrar quem não quer ir. Vampiros, bruxos e lobisomens vestem o fio cortado. Não confunda: nem todo Desfiado é Conviva. Muitos não querem ser devorados; querem apenas sair.</p>' });
  add({ lv: 'XV', body:
    '<h3>Onde cada um erra</h3>' +
    '<p>Perguntei aos dois lados quem estava certo, e os dois me responderam com a mesma convicção. Desconfio, por isso, das duas respostas. A Ordem do Fio erra quando a proteção vira prisão e decide pelos outros o que é “estar pronto”. Os Desfiados erram quando derrubam o muro sem lembrar que a Fome não pergunta quem queria sair.</p>' +
    '<blockquote>Quem defende o Labirinto diz: a Fome vai devorar tudo até não sobrar ninguém. Quem quer derrubá-lo pergunta: que liberdade é essa, em que vivo num ciclo sem fim, dentro de um labirinto? Isso é justiça? Isso é bondade?</blockquote>' +
    '<p>Não há lado bom nem lado mau nesta crônica, e não haverá. Há figuras admiráveis e figuras falhas nas duas bandeiras, e o caminhante precisa poder entender as duas, e duvidar das duas.</p>' +
    '<h3>Os que não juram bandeira</h3>' +
    '<p>A primeira classe é também o primeiro juramento: quem se faz paladino, caçador ou mago entra no Fio; quem se faz vampiro, lobisomem ou bruxo entra nos Desfiados. Dois caminhos ficam de fora. O <b>guerreiro do norte</b> é caótico e neutro: tem sede de sangue e não teme a morte, e nenhum labirinto lhe parece digno de guarda ou de ruína. O <b>technocrata</b> é neutro de verdade: crê na ciência e acha que pode trilhar o próprio caminho longe das crendices, mesmo vivendo no meio delas. Depois de alcançar a classe, cada um faz uma missão do seu mestre que valida o seu alinhamento.</p>' +
    '<h3>Dos povos e do juramento</h3>' +
    '<p>Cada povo leva para as bandeiras o seu jeito de prometer. O humano é neutro, e por isso a palavra dada é tudo o que lhe sobra: “se não tivermos a firmeza da palavra dita, o que sobrará no mundo?”. O anão é caótico, mas caos não é bagunça: promessa de anão é como fio de bigode, não se mexe. E o elfo é bom por natureza; um elfo que se faz vampiro quebra, de uma vez, um ciclo inteiro de aliança.</p>' +
    '<p>As peças com brasão só são tecidas pelas tecelagens reais de cada lado, em Askavik, e só as veste quem já jurou, depois dos trinta. Com o tempo, dizem, valem mais como beleza do que como armadura. Mas ninguém que eu conheça tirou o seu manto por isso.</p>' });

  add({ toc: 'Livro XVI — O mapa dos cartógrafos', lv: 'XVI', eyebrow: 'Livro XVI', title: 'O mapa que os cartógrafos desenharam', start: true, body:
    '<p>No sétimo livro falei de Karmika como falam os viajantes, de ouvir dizer. Desde então os cartógrafos da Biblioteca terminaram o grande mapa, e posso enfim dizer onde fica cada coisa. Eles me ensinaram a primeira regra do ofício: primeiro o relevo, depois as águas que descem das montanhas, depois os bosques que seguem a água, e só por último as estradas, que são rotas de comércio e fazem curvas como fazem os mercadores.</p>' +
    '<h3>As Terras dos Homens</h3>' +
    '<p>No centro estão as Terras dos Homens, com dezenas de vilas. Ali fica <b>Karmika</b>, a vila onde nascem os humanos, com a fonte na praça e o quadro de avisos ao lado do guarda. Ao norte dela ergue-se <b>Askavik</b>, a cidade das academias, onde qualquer povo vai escolher o que será. E, num vale escuro das mesmas terras, a <b>Catedral Abandonada</b>, de que falarei adiante.</p>' });
  add({ lv: 'XVI', body:
    '<h3>As terras em volta</h3>' +
    '<ul class="plain">' +
    '<li>A noroeste, a <b>Montanha Viking</b>: fiordes, Jarls, a Fortaleza de Odin e as vilas de Jarlsheim, Skjoldvik e Hrimgard, onde a neve não derrete, só muda de lugar.</li>' +
    '<li>A nordeste, a <b>Montanha Negra</b>, um vulcão que ronca à noite, com lava e veios de diamante. No sopé fica <b>Brasaforja</b>, onde nascem os anões, e mais acima, Cinzalto.</li>' +
    '<li>Escondida atrás da Montanha Negra, a <b>Colina Vampírica</b>, com o castelo do Conde e a vila de Corvoscuro. Lá se fecham as janelas ao anoitecer.</li>' +
    '<li>A leste, o <b>Vale da Desgraça</b>, onde Malgrath ensina os bruxos e até o trigo nasce de cabeça baixa.</li>' +
    '<li>A oeste, as <b>Florestas Élficas</b>, com Aelvaren nas árvores imensas e <b>Lithendel</b>, onde nascem os elfos.</li>' +
    '<li>A sudoeste, a <b>Floresta Encantada</b> e o <b>Pináculo de Marfim</b>, uma torre de oitenta metros que acende de noite.</li>' +
    '<li>No extremo sudeste, a <b>Selva Licantropa</b> e a tribo do Uivo Antigo.</li>' +
    '<li>Ao sul, a <b>Costa do Vapor e da Graxa</b>, com Porto Caldeira, Ferrugem e Vaporeira, onde os barcos remam sozinhos.</li>' +
    '</ul>' +
    '<p>Os cartógrafos me ensinaram também a ler o perigo. Perto dos berços e das cidades a terra é mansa; quanto mais longe, mais ela morde. Até a Montanha Negra, que embala os anões no sopé, guarda no coração bichos que nenhum aprendiz deve visitar.</p>' +
    '<h3>Notas do cronista</h3><p class="fnote"><span class="nb">✎</span>Ao copiar as seis histórias para este volume, reparei que em três delas aparece, de passagem, um homem de capa cinza: na ponte de Velmora, oferecendo um barco; nas galerias de Thrain, comprando o ferro que sobrou; nos portões de Ossária, na véspera, perguntando o caminho. Ninguém descreve o rosto. Todos descrevem a capa.</p>'  });

  add({ toc: 'Livro XVII — O primeiro fio', lv: 'XVII', eyebrow: 'Livro XVII', title: 'A vila de Karmika e o primeiro fio', start: true, body:
    '<p>Toda alma humana começa no mesmo lugar, e eu fui até lá para ouvir como começa. A vila de Karmika é pequena: uma fonte, uma praça de pedra, a estalagem, a forja, o templo e um guarda que não sai da porta. Não há heróis ali. Há gente que precisa de ajuda, e o primeiro fio de toda história é sempre esse: alguém precisando de você.</p>' +
    '<h3>Os que esperam na praça</h3>' +
    '<p><b>Garrick</b>, o guarda, é quem dá as primeiras caças, e começa pequeno, com as ratazanas rubras do cemitério. <b>Lúcia</b> procura o marido que sumiu perto da Igreja Abandonada. <b>Eldrin</b>, o sábio do templo, manda os novatos ao Cemitério Esquecido e às ruínas onde saem diabretes. <b>Doran</b>, o armeiro, ensina a fazer o primeiro machado. <b>Thorin</b>, o mercador anão, compra tudo e ri de tudo. E há a alquimista <b>Morwen</b>, a caçadora <b>Kaela</b> e o domador <b>Corwin</b>, que cuida das montarias. Os nomes de quem manda na vila soam a aventura; os nórdicos, só se ouvem entre os anões e no norte.</p>' });
  add({ lv: 'XVII', body:
    '<h3>O Caminho do Norte</h3>' +
    '<p>Os da vila contam a mesma sequência, com pequenas mudanças de quem conta. Primeiro as ratazanas, os coiotes da estrada e os lobos do leste. Depois o Guardião da Mata, uma árvore antiga que enlouqueceu e passou a atacar os lenhadores. Depois as sombras nas ruínas e, por fim, o que mora na igreja: o <b>Príncipe das Cinzas</b>. Quem chega ao fim dessa estrada faz o Juramento do Norte diante de Garrick, e a vila deixa de ser o seu mundo inteiro.</p>' +
    '<p>Notei uma coisa curiosa: ninguém em Karmika fica sem rumo. Quando uma tarefa termina, alguém já aponta a próxima: “vá falar com Fulano”, “tem gente precisando em outra cidade”, “você já fez tudo o que podia por aqui”. Os sacerdotes dizem que é o fio do Labirinto, que nunca se perde de vista.</p>' +
    '<h3>A chamada de Askavik</h3>' +
    '<p>Aos vinte e cinco, chega uma carta. Eldrin a entrega com a mão trêmula: Askavik chama. Lá o novato conhece o <b>Mestre Halvard</b>, da Escola de Guerra, as tecelagens das duas bandeiras, o mercado, a igreja e a loja de Elowen. E conhece a <b>Velha Gunnhild</b>, guardiã das relíquias, que o leva à Vidente.</p>' });
  add({ lv: 'XVII', body:
    '<h3>A Vidente dos Caminhos</h3>' +
