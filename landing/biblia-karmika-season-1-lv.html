    '<p>Fjallbrún māceklis atrod <b>Halfdan</b>, kurš aizbēga no klana. Viņš var to vest uz tiesu, palaist vaļā un samelot meistaram vai sodīt ar nāvi turpat uz vietas. Thorgrim nekad nesaka, kura bija pareizā atbilde. Viņš tikai saka, ka Acs redzēja.</p>' });
  add({ lv: 'XIX', body:
    '<h3>Pavediena sūtnis</h3>' +
    '<p>Sestajā pārbaudījumā klans sūta mācekli uz Askavik runāt ar paladīnu Aldric, Pavediena ordeņa sūtni. Karotājs izlemj, vai Kraukļa klans slēdz savienību ar Pavedienu, atsakās vai vispirms uzklausa Atšķetinātos. Ziemeļniekiem vēl nav karoga; varbūt viņi to saņems no tā rokām, kurš pa turieni ies garām.</p>' +
    '<h3>Hrimgard divkauja</h3>' +
    '<p>Hrimgard divkaujas vidū sāncensis nokrīt sniegā. Māceklis var gaidīt, kamēr viņš pieceļas, izmantot kritienu vai beigt neizšķirti. No trim Acs uzsmaida tikai diviem.</p>' +
    '<h3>Valhalla gaida</h3>' +
    '<p>Pēdējā pārbaudījumā Thorgrim tiek nāvīgi ievainots. Māceklis cīnās viņam līdzās līdz galam, vai pret viņa gribu aizvelk pie dziedniekiem, vai dāvā viņam godpilnu nāvi pēdējā divkaujā. Kas pabeidz, saņem <b>Kraukļa karotāja</b> titulu. Un pārējie septiņi ceļi? Es joprojām kāpju pa to ceļiem.</p>' +
    '<h3>Hronista piezīmes</h3><p class="fnote"><span class="nb">✎</span>Klana zālē virs troņa karājas sens vairogs ar vienu nosvītrotu vārdu un otru, iegrebtu pāri: Ulfar. Thorgrim saka, ka tas ir tikai vairogs. Cietokšņa kraukļi uz tā nenosēžas.</p>'  });

  add({ toc: 'XX grāmata — Ko nes līdzi', lv: 'XX', eyebrow: 'XX grāmata', title: 'Ko nes līdzi pa ceļu', start: true, body:
    '<p>Gājējs ir arī tas, ko viņš nes līdzi. Bibliotēka glabā sarakstus ar lietām, kas gājušas caur daudzām rokām, un retākajām ir vārdi. Ir septiņi retuma pakāpieni, no pelēkā parastā līdz maģiskajam, retajam, leģendārajam, episkajam. Virs tiem ir <b>unikālie</b>, kādas kultūras priekšmeti ar savu spēku, un <b>relikvijas</b>, kas maina cīņas veidu un dažreiz pat nav ieroči.</p>' +
    '<h3>Par kultūrām</h3>' +
    '<p>Ziemeļnieki stāsta par Mjölnir, Gungnir un Sleipnir zābakiem. Rūķi par Eitr aizsargu un Surtr ogli, kas aizdedzina visu, kam pieskaras. Paladīni par Excalibur un Marghar kausu, kas ik pa laikam vienreiz novērš nāvi. Mednieki par Van Rhal sudraba arbaletu. Vampīri klusi runā par Drakulas sirdi; vilkači par Pirmo gaudu ilkni; ragaņi par Grāmatu bez soļiem, kuras burvestības maksā nedaudz dzīvības. Relikvija gandrīz vienmēr nonāk pie kāda no savas kultūras, it kā zinātu, kura rokās krist.</p>' +
    '<p>Starp citu, nekas no tā nav rozā. Es pajautāju, kāpēc, un kāds rūķu kalējs paskatījās uz mani kā uz trako.</p>' });

  add({ toc: 'XXI grāmata — Tie, kas iet kopā', lv: 'XXI', eyebrow: 'XXI grāmata', title: 'Tie, kas iet kopā', start: true, body:
    '<p>Ilgu laiku es rakstīju par dvēselēm, kas staigāja vienas. Tā vairs nav. Šodien gājēji apvienojas grupās līdz sešiem, un grupa ir interesanta vērošanai: zvērs, ko nogāž viens, skaitās visiem, un uzdevums, ko pieņem viens, kā čuksts parādās arī pārējiem. Bet nevienu nenes uz rokām: grupā pieredzes starpība nedrīkst pārsniegt desmit līmeņus.</p>' +
    '<h3>Krauklis un dēlis</h3>' +
    '<p>Katrā ciemā ir dzelzs pastkaste ar kraukli virsū. Caur kraukli iet vēstules, zelts, priekšmeti un rēķini, un krauklis gaida to, kura nav mājās, lai nodotu, kad viņš atnāks. Uz Laukuma dēļa līdzās iedzīvotāju līgumiem gājēji pienaglo savus pasūtījumus, atstāj zeltu glabāšanā un gaida, kas tos izpildīs.</p>' });
  add({ lv: 'XXI', body:
    '<h3>Kad karogi krustojas</h3>' +
    '<p>Ārpus ciemiem Pavediens un Atšķetinātie uzbrūk viens otram, kad satiekas, un neviens nemaksā karmā par sava karoga aizstāvēšanu. Tomēr neviens nav spiests cīnīties. Ciemos zeme ir svēta, un neviens asmens negriež.</p>' +
    '<p>Starp viena karoga ļaudīm ir citādi. Viens otru nesavaino, ja vien neizlemj apzināti medīt savu pusi. Kas tā dara, tā vārds tiek rakstīts sarkanā, un Acs piedzen par katru cirtienu. Bet tas, kurš sit pretī, neko nav parādā.</p>' +
    '<p>Un ir divkauja, ko norunā divi, kas der jebkur un kurā neviens nemirst: zaudē tas, kurš pirmais nokrīt uz ceļiem. Rūķi to sauc par aprunāšanos.</p>' });

  add({ toc: 'XXII grāmata — Dzīvības pavediens', lv: 'XXII', eyebrow: 'XXII grāmata', title: 'Dzīvības pavediens', start: true, body:
    '<p>Ir tādi, kas domā, ka nāve Karmikā ir durvis, kas atveras tikai vienreiz. Tā nav gluži tā. Katru dvēseli, kas iet, pie ķermeņa tur pavediens, un pavedienam ir <b>trīs elpas</b>. Kas uz ceļa nokrīt, tas pieceļas pie savas mājas strūklakas: tas ir kritiens, un pavediens zaudē vienu elpu. Elpas atgriežas lēnām, viena katru dienu, kā guļoša cilvēka elpošana.</p>' +
    '<p>Līdz divdesmitajam līmenim, kamēr Acs vēl guļ, neviens pavedienu netērē. Marghar nepiedzen no tiem, kas vēl nav redzēti.</p>' +
    '<h3>Kad pavediens pārtrūkst</h3>' +
    '<p>Kas nokrīt bez nevienas elpas, tas <b>atstāj miesu</b>. Tie, kas to redzējuši, vienmēr stāsta vienu un to pašu: no kritušā ķermeņa izlec dzirkstele, nedaudz paaugas, sāk vibrēt un pēkšņi paceļas, ātra un tieva kā adata, līdz pazūd debesīs.</p>' +
    '<p>Tad dvēsele nonāk <b>labirinta centrā</b>, ko vecie sauc par <b>Slieksni</b>. Tā ir gaismas grīda, kas karājas pār Karmiku. No turienes augšas redzams viss labirints, cik tālu vien sniedz skats: mūri, kas paceļas un padodas, gaiteņi, kas aizveras un atveras, vietas, kas satumst melnā ceļā, un citas, kas kļūst gaišas. Tā ir pasaule, kas notiek, tagad, tur lejā.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Tie, kas gaida centrā</h3>' +
    '<p>Pa kreisi no atnācēja stāv <b>Orvalen, Pēdu Lasītājs</b>, kapucē, ar zizli un aukstu laternu. Gaismas pēdas griežas pie viņa kājām. Viņš ir tas, kurš izlasa beigušos dzīvi, soli pa solim, un kurš to atdod vai izdzēš.</p>' +
    '<p>Pa labi stāv <b>Sael, Tā, kas atgriezās</b>, vienīgā, kas sasniedza centru un atgriezās. Viņa tur zelta pavedienu, kas stiepjas no viņas rokas līdz tikko atnākušajai dvēselei, un viņa ir tā, kas vada atgriešanos.</p>' +
    '<p>Starp abiem un tālāko malu peld <b>Karmiskā Acs</b>, raugoties uz atnācēju. Un pašā dziļumā, zeltainā mirdzumā, saskatāms milzīgs, mierīgs siluets, noliecies pār kosmisku baseinu: <b>Marghar</b>, kas redz visu, kas notiek. Neviens nav redzējis viņu paceļam acis. Tur dvēsele sarunājas ar abām Esencēm un izvēlas, un izvēles ir tikai trīs.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Trīs atgriešanās</h3>' +
    '<ul class="plain">' +
    '<li><b>Atgriezties tajā pašā ķermenī.</b> Orvalen atdod pēdas tādas, kādas tās ir. Dvēsele atkal ieiet turpat, kur bija, nemainīta, un atgriežas parādā. Vecie to sauc par <b>Karmisko parādu</b>: puse no visa, ko dvēsele pēc tam iemācās, apmaksā to, ko tā nenogāja, līdz rēķins ir nokārtots.</li>' +
    '<li><b>Pārdzimt.</b> Orvalen izdzēš ķermeņa pēdas, un Sael aizved dvēseli līdz jaunam ķermenim. Dvēsele izvēlas citu tautu un citu seju un patur pārējo: vārdu, cik tālu jau nogājusi, ko nesa, zeltu, glabātavu un solījumus. Tikai klase paliek aiz muguras, un ceļu no jauna nolasa Hrefna. Vecā ķermeņa burvestības un spēks atgriežas kā brīvi punkti, lai dvēsele varētu salabot, ko sabojājusi.</li>' +
    '<li><b>Samaksāt ar Asaru.</b> Kas glabā Acs Asaru, tas to piedāvā Acij un samaksā par visu atgriešanos bez jebkāda parāda. Dvēsele atkal atrod ķermeni sava ceļa svētajā vietā: paladīns Ausmas abatijā, tehnokrāts Akadēmijā, vampīrs Grāfa pilī.</li>' +
    '</ul>' +
    '<h3>Pagātnes dzīves atbalss</h3>' +
    '<p>Kas pārdzimst un atgriežas tajā pašā ceļā, atrod atbalsi. Jaunais ķermenis nezina, bet dvēsele atceras un mācās <b>četras reizes ātrāk</b>, līdz sasniedz vietu, kur krita. Tur atbalss apklust, un ceļš atkal iet ierastajā solī. Akadēmiju meistari šos skolēnus atpazīst: viņi mācās kā tie, kas atceras.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Acs, kas redz un slēpj</h3>' +
    '<p>Kas uzkāpj Slieksnī, redz Aci no tuvuma un pamana kaut ko, par ko te lejā neviens nestāsta. No tās augšdaļas bez apstājas plūst zeltaina, dzīva enerģija, kas ceļas kā vīraka dūmi un aizsedz Marghar seju. No tās apakšdaļas tek tumša, bieza migla, tikpat zila kā Smilšu pulkstenis, kas lēnām nolaižas līdz labirintam un pazūd starp mūriem.</p>' +
    '<p>Tie, kas atgriezās, saka, ka tur saprata to, ko priesteri nekad nespēja izskaidrot: Acs, kas redz tevi, ir tas pats plīvurs, kas slēpj to, kurš skatās. Neviens neredz Marghar, jo viņa paša skatiens ir ceļā. Un karma nepaliek Acī. Tā visu laiku izplūst uz augšu un uz leju, katra puse ar savu patiesību: kas gaišo, ceļas zeltā, kas sver, nolaižas miglā.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Kāpēc viņš nerīkojas</h3>' +
    '<p>Es jautāju Sael, tajās nedaudzajās rindās, kas no viņas palikušas arhīvos, kāpēc Marghar neaptur ļauno. Pierakstītā atbilde ir garākā, kāda mums ir no kādas Esences:</p>' +
    '<blockquote>Jo viņš nerīkojas. Viņš neaptur, nenogalina, netiesā. Es nekad neesmu redzējusi viņu paceļam roku, ne lai glābtu, ne lai sodītu. Marghar ir gribēšana un vēlme gribēt. Viņš ir apstāšanās un vēlme apstāties. Viņš ir ceļš un viņš ir solis, un pirms abiem viņš ir griba iet. Rīkojas tas, kurš iet. Viņš tikai redz, un glabā, un kādu dienu atdod.</blockquote>' +
    '<p>Askavik vecie tajā lasa solījumu; Atšķetinātie, apsūdzību. Es lasu abus un nespēju izvēlēties.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Jautājums, uz kuru neviens neatbild</h3>' +
    '<p>Orvalen, kurš lasa pēdas kopš laikiem, kad vēl nebija vārdu, atstāja pierakstītu šaubu, ko es vilcinos pārrakstīt. Viņš prāto, vai Marghar nav arī Ahzur. Vai tas, ko saucam par ceļu dievu, nav bezgalīga sistēma, kas barojas pati ar sevi un pati sevi aprij, kā čūska, kas kož pati savā astē un ar savu ķermeni zīmē bezgalības zīmi. Ceļš un ceļa iznīcināšana, kas visu laiku vēro pati sevi.</p>' +
    '<p>Sael, kā saka, lika viņam apklust. Ne tāpēc, ka tie būtu meli, bet tāpēc, ka Marghar dzird visu un nekad neatbild.</p>' +
    '<h3>Un mēs</h3>' +
    '<p>Ja viss ir Marghar, tad arī mēs esam viņa daļa. Mēs esam gājēji, un mēs esam ceļš. Mēs esam bads, un mēs esam barība. Varbūt tieši tāpēc labirints pastāv: nevis lai mūs paslēptu uz visiem laikiem, bet lai dotu mums laiku izvēlēties, par ko no abiem kļūt, pirms atnāk Bads.</p>' +
    '<p>Es nespēju atbildēt ne uz ko no tā. Es pierakstu un eju tālāk, kā dara katrs gājējs.</p>' });
  add({ lv: 'XXII', body:
    '<h3>Tas esmu es</h3>' +
    '<p>Ierakstos mani visvairāk uzjautrina aina, kas atkārtojas katrā laukumā. Satiekas divi gājēji, un viens saka otram: tas esmu es, Brakka. Bet vai tu nebiji rūķis? Biju. Tagad esmu elfs.</p>' +
    '<p>Dvēsele ir tā pati, vārds ir tas pats, un karma arī. Karma, starp citu, nekad nepaliek kritušajā ķermenī: tā pieder dvēselei un šķērso visas dzīves kopā ar Asarām un parādiem.</p>' +
    '<p>Kas lūdz apskatīt kāda profilu, tur atrod pagātnes dzīves, vienu pēc otras: tautu, ceļu un to, cik tālu katra tika. Es, kurš protu lasīt ādu, labprātāk lasu šos sarakstus. Tie melo mazāk.</p>' +
    '<h3>Hronista piezīmes</h3><p class="fnote"><span class="nb">✎</span>Visi stāsti vēsta, ka Sael atgriezās no centra. Neviens nestāsta, ko viņa tur gāja darīt, ne arī, kas bija centrā pirms viņas. Un tie, kas Slieksnī kāpuši vairāk nekā vienu reizi, zvēr, ka vienā no reizēm viņa turēja divus pavedienus. Viņai jautāja par otru. Viņa pasmaidīja un neatbildēja.</p>'  });

  add({ toc: 'XXIII grāmata — Katra ceļa cena', lv: 'XXIII', eyebrow: 'XXIII grāmata', title: 'Katra ceļa cena', start: true, body:
    '<p>Es daudz staigāju, lai uzrakstītu šo grāmatu, un tas, ko iemācījos, ietilpst vienā rindā: <b>neviens ceļš nav par velti</b>. Katrs dod gājējam spēku, ko citi apskauž, un piedzen no viņa vājību, ko izārstēt prot tikai citi.</p>' +
    '<p>Akadēmiju meistariem nepatīk, ka to saka skaļi, jo tas izklausās pēc skolas vājuma. Es domāju pretēji. Tieši šis rēķins notur pasauli kājās: karotājam vajag burvi un ragani, vampīram vajag rūķi un tehnokrātu, vilkam vajag pat vampīru, un tas viņam sāp visvairāk. Neviens Karmikā ilgi nedzīvo viens. Kas mēģina, tas sajūk prātā, nomirst badā vai izdziest.</p>' +
    '<p>Un rēķins nepienāk vienas dienas laikā. Vecie to mēra <b>gājienos</b> un saka, ka gājējs izturot <b>divdesmit</b> ceļa gājienus, pirms viņa cena kļūst nepanesama. Pirmajos divpadsmit gandrīz neko nejūt. Pēc tam tā sver.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Par karotāju, kas dzird mirušos</h3>' +
    '<p>Ziemeļu karotājs tuvcīņā ir stiprākais no mums visiem, un tāpēc viņš nogalina visvairāk. Katra nāve atstāj viņā niknuma atlikumu. Vispirms nāk <b>trakums</b>, un viņš sit stiprāk, bet aizmirst aizsardzību. Pēc tam nāk <b>neprāts</b>, un tad parādās cena: neprātīgais karotājs grib darīt labu un nespēj, jo asinis runā skaļāk, un dvēsele lēnām satumst kā apsegta ogle.</p>' +
    '<p>Lai atgūtos, viņš izsaka Odinam līdzjūtību par kritušajiem un mērdē miesu <b>nomierināšanās rituālos</b>. Viņam vajag mērdēšanas un attīrīšanas vīrakus, un tos prot gatavot tikai burvji un ragaņi. Neviens no abiem tos nespēj pagatavot viens: burvim vajag <b>Mirušo pelnus</b>, ko vāc tikai raganis, un raganim vajag <b>Astrālās apgaismības smiltis</b>, ko glabā tikai burvis. Es redzēju arhimadzi Seline Smailē pērkam pelnus no Gorvatas raganas Grisolda ar tādu seju, it kā rītu etiķi. Un redzēju raganu taisām tādu pašu seju.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Par paladīnu, kurš šaubās</h3>' +
    '<p>Paladīna vājība nav zobenā vai vairogā. Tā ir jautājumā, ko viņš uzdod naktī pēc tik daudzām kaujām ar būtnēm un dēmoniem: <em>vai mans karš par mieru neizlej vairāk asiņu nekā paši nolādētie?</em> Šī <b>Šauba</b> aug ar katru nāvi, un vēl vairāk, ja mirušais bija cilvēks. Kad tā aug, Gaisma mazāk atsaucas viņa rokām; kad tā pārplūst, ticība svārstās, labās izvēles vairs nesver un karma aizplūst.</p>' +
    '<p>Zāles ir senas: <b>Gavēnis un lūgšana</b>. Paladīns ēd <b>Neraudzētu maizi</b>, ko cilvēku pavāri cep no <b>Bezrauga kviešiem</b>, kuru sēklu tehnokrāti pārveidoja misiņa siltumnīcā un ko uzdīgt spēj likt tikai elfu rokas, un dzer rūķu <b>Svēto vīnu</b>, kas kļūst svēts tikai ar <b>Svētās asaras lāsi</b>, ko Lithendel vecās sievas savāc pirms saullēkta. Piecas rokas vienā maltītē. Varbūt tieši tā ir atbilde Šaubai, nevis vīns.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Par vampīru un slāpēm</h3>' +
    '<p>Vampīrs ir nakts karalis: stiprāks, ātrāks, sitieni, kam acs tik tikko spēj sekot, un katra brūce, ko viņš atver, atdod viņam mazliet dzīvības. Bet saule viņu vājina un dedzina, tāpēc viņš meklē ēnu pilsētas, kā Tumšvārnu, vai biezus mežus. Un ir <b>slāpes</b>. Alķīmiķes <b>Atšķaidītās asinis</b> un dzīvnieku asinis tās kādu laiku maldina, katru reizi mazāk. Agri vai vēlu ķermenis prasa cilvēku asinis: cilvēka, rūķa vai elfa. Kas dzer no cilvēkiem, tas remdē slāpes un aptumšo dvēseli.</p>' +
    '<p>Vampīram, kas grib sekot labajam, ir ceļš, un tas ir dārgs: tehnokrātu <b>Automātiskā asins injekcija</b>, kas gatavota no <b>Koncentrētās asins nolaišanas</b>, ko rūķi vāc no donoriem Ogļkalves Asins nolaišanas namā. Neviens par to nemirst. Asins nolaidēja Hulda to obligāti pasaka katram, kas ienāk.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Par vilku un badu</h3>' +
    '<p>Likantrops ir lielāks un stiprāks par cilvēku, un dienā cīnās kā cilvēks, ar rungām, vālēm un rupjām helebardām. Zvēra veidols nāk tikai līdz ar nakti. Un zvēram ir <b>bads pēc cilvēku gaļas</b>, jebkuras tautas: cilvēku tas kāro visvairāk, rūķis ir grūti sakošļājams un elfs ir liess, gandrīz bez taukiem. Dzīvnieku gaļa to kādu laiku maldina, līdz dienai, kad vairs nepiepilda. Izsalcis vilks kļūst lēns un vājš. Kas ēd cilvēkus, tas remdē badu un notraipa dvēseli.</p>' +
    '<p>Vilkam, kas izvēlas labo, jānorij lepnums. Vienīgā gaļa, kas pabaro bez upura, ir <b>Gadsimtu delikatese</b>, gaļa, kas gadsimtiem žāvēta Tumšvārnas pagrabos, un to pārdod vampīri. Someljē Vasko pasniedz vilkam ar šķību smaidu un lūdz ēst ārā. Lepnākie sūta tehnokrātu vai rūķi to nopirkt viņu vietā.</p>' });
  add({ lv: 'XXIII', body:
    '<h3>Par tehnokrātu un misiņa sirdi</h3>' +
    '<p>Tehnokrāts neņem rokā ne zobenu, ne dunci, ne loku: viņš cīnās ar Akadēmijas ieročiem, ar cimdu, ar torņiem un ar sfēru, kas lido viņam līdzās un uzbrūk, dziedina grupu vai to aizsargā atkarībā no viņa stājas. Bet tas viss nāk no <b>personīgā reaktora</b> uz muguras, un reaktors nolietojas. <b>Reaktora kodols</b> ir dārgs un kalpo labi, astoņus gājienus pirmais, divdesmit Akadēmijas otrās klases kodols. Tukšam enerģija neatgriežas, un sfēra izdziest.</p>' +
    '<p>Kalējs izgatavo kodola korpusu, bet viens to nepabeidz: vajag alķīmiķa <b>Dzīvības šķidrumu</b> un <b>Arkāno kristālu</b>, ko burvji uzlādē Smailē. Tāpēc tehnokrātam no visiem visvairāk vajag tirdzniecību. Kas nepārdod, tas neiededz.</p>' +
    '<h3>Par tiem, kas lasa, tiem, kas slēdz paktus, un tiem, kas sargā</h3>' +
    '<p><b>Burvis</b> burvjo tik daudz, ka maģijas atbalss paliek viņa galvā. Ar laiku tā kļūst par <b>augstprātību</b>: viņš skatās uz vienkāršajiem no augšas, un maģija viņam rokā plaisā. Viņu dziedina, liekot kājas uz zemes, <b>Iezemēšanas rituālā</b>: Senās gaudas ādmīņu Zemes ziede un Ausmas abatijas Svētais ūdens. Nekas tā nepazemo burvi kā lūgt vilkam zemi no viņa alas.</p>' +
    '<p><b>Raganim</b> nav savas maģijas: viņš to aizņemas no Malgrath, un Malgrath ņem procentus. Kad parāds aug, patrons patur daļu viņa dzīvības un beigās atsūta <b>Pakta piedzinēju</b>. Parādu nomaksā ar <b>Ziedojumu</b>: Dēmona sirdi, ko izraut tā, lai nesapūtu, spēj tikai Helsingu klana mednieki, un Asins ragu, ko kaujas laukā piepildīt spēj tikai ziemeļu karotājs.</p>' +
    '<p><b>Dēmonu mednieks</b> kalpo Aravel, kura acs nekad neaizveras, un tāpēc viņš neguļ. Redze aizmiglojas, un pēc tam viņš katrā sejā redz dēmonu. Viņš aizmieg tikai ar <b>Sargāto miegu</b>: Bezsapņu miega pulveri, ko gatavo raganis, tieši tas, kuru viņš medī, un tehnokrātu Sardzes zvaniņu, kas iezvanās pats, ja kaut kas tuvojas.</p>' +
    '<h3>Par dzīvības cenu</h3>' +
    '<p>Man jautāja, cik Acī ir vērta viena dzīvība. Es atbildēju ar pašu zvēru rēķinu: kas ēd cilvēkus, nopērk divdesmit gājienus miera, un Acs piedzen tos divdesmit un vēl vienu, par dzīvību. Divdesmit viens. Un ja upuris bija gājējs, kura dvēsele atgriežas un atceras, Acs piedzen divkārši, jo tās ir divas dzīves: tā, kas beidzās, un tā, kurai būs jāsāk no jauna.</p>' +
    '<h3>Par līdzsvaru</h3>' +
    '<p>Es jautāju kādam meistaram, kāpēc akadēmijas pieņem tik augstu cenu. Viņš atbildēja, nepaceļot acis: <em>jo bez cenas stiprais kļūst par dievu, un dievam neviens nav vajadzīgs</em>.</p>' });

  add({ toc: 'XXIV grāmata — Par amatiem, radībām un debesīm', lv: 'XXIV', eyebrow: 'XXIV grāmata', title: 'Par amatiem, radībām un debesīm', start: true, body:
    '<p>Šī grāmata ir par mazām lietām, un tieši tāpēc patiesām. Neviens neatceras varoni zobena dēļ; viņu atceras pēc kalves, kur zobens kalts, pēc kaķa, kas gulēja viņam klēpī, un pēc nakts, kad mēness kļuva sarkans un viņš nebēga.</p>' +
    '<h3>Par amatu namiem</h3>' +
    '<p>Katram Karmikas ciemam un katrai pilsētai ap laukumu ir savi pieci amati. Neviens neēvelē dēļus krūmos. <b>Pilsētās</b>, kā Askavik un Karmika, katram amatam ir savs nams:</p>' +
    '<ul><li><b>Galdniecība</b>, atvērta baļķu nojume ar zāģiem pie sienas, rāmja zāģi virs baļķa un pedāļa virpu;</li><li><b>Kalve</b> ar akmens skursteni un vienmēr degošu arkveida muti, ādas plēšām un divām laktām;</li><li><b>Miecētava un drēbnieku darbnīca</b> ar krāsošanas kubliem un ādām uz auklas;</li><li><b>Aptieka</b> ar letes priekštelpu un destilācijas istabu aizmugurē;</li><li><b>Pavāru skola</b> ar ķieģeļu krāsni un mācekļu galdiem;</li><li>un <b>Tehnoloģiju nams</b> no kniedētām plāksnēm, ar Teslas spoli uz jumta, kas tehnokrātam kalpo par kalvi un darbagaldu.</li></ul>' +
    '<p><b>Ciemos</b> viss ir vienkāršāk: Cirtuves šķūnis, Brīvdabas kalve, Miecētāja galds, Aptieka un Aizmugures virtuve, kurā ieiet pa kroga sētas durvīm. Dienvidu tvaika ciemi glabā arī savu Misiņa darbnīcu.</p>' });
  add({ lv: 'XXIV', body:
    '<h3>Par Stalli un biedriem</h3>' +
    '<p>Dzīvnieks, ko tu nopērc, neceļo tavā mugursomā: tas dzīvo tavā <b>Stallī</b> un no turienes iznāk staigāt ar tevi. Katram ir vārds, ko vari mainīt, izsalkums un saikne. Izsalcis dzīvnieks atnes lēni un necīnās; dzīvnieks, kas tevi dievina, ātrāk atgriežas tev palīdzēt.</p>' +
    '<ul><li><b>Raibais kaķēns</b> un <b>Rudā lapsa</b>: kaujā viņi saceļ <b>Troksni</b>, un tas, kurš nāca tev virsū, uz mirkli apstājas.</li><li><b>Melnā kaķe</b> un <b>Pagraba pelīte</b>: <b>Oža</b> atrod to, kas nokritis tālu, un pīkstiens novērš uzmanību.</li><li><b>Vilkēns</b>: <b>Kodiens</b> uzbrucējam pa lieliem.</li><li><b>Raibais sivēns</b>: <b>Rušinās</b> zemē, kamēr tu atpūties, un dažreiz atnes ābolu, maizi vai dažas monētas.</li></ul>' +
    '<p>Mājdzīvnieks nēsā <b>Kaklasiksnu</b> un <b>Krūšu siksnas</b>. Kaklasiksna liek atnest ātrāk; krūšu siksnas liek prasmei atgriezties ātrāk, un dzelzs siksnas padara kodienu dziļāku. Mājdzīvniekus, kaklasiksnas un krūšu siksnas pērk pie <b>pieradinātāja Corwin</b>. Zirgus un sienu pie <b>krodzinieka Orm</b>: Bērais zirgs, Sirmais zirgs un Melnais kumeļš. Izsalcis zirgs skrien lēnāk.</p>' +
    '<p>Un mājdzīvnieks iet tev līdzi līdz pazemes dziļumiem. Uzticams dzīvnieks pie durvīm nepaliek.</p>' });
  add({ lv: 'XXIV', body:
    '<h3>Par debesīm, kas mainās</h3>' +
    '<p>Apmēram divreiz dienā visa pasaule maina krāsu. Pasaules notikumi katru dienu atnāk apmēram pusotru stundu agrāk, un nedēļā tie iziet cauri visām stundām, lai neviens vienmēr nepaliktu ārpusē.</p>' +
    '<p><b>Asins Mēness</b> laikā debesis atnākot asiņo, un pēc tam sārtums nosēžas, bet neaiziet. Tas izraisa:</p>' +

  add({ lv: 'XXIV', body:
    '<h3>Par zvēru vecumu</h3>' +
    '<p>Vecie mednieki saka: <em>kam virs galvas ir galvaskauss, tas nav domāts tev</em>. Zvērs piecus līmeņus augstāk sit gandrīz divreiz stiprāk; astoņus augstāk, vairāk nekā divreiz; nekad vairāk kā trīsreiz. Un tavs cirtiens no tā noslīd: tas zaudē spēku ar katru līmeņu starpību un dažreiz vienkārši netrāpa. Zvērs zem tava līmeņa, turpretī, sāpina mazāk. Tā nav ne veiksme, ne neveiksme, un tā neskaitās svētību rēķinā: tas ir zvēra vecums.</p>' +
    '<h3>Par ciema balsīm</h3>' +
    '<p>Karmikas ļaudis runā. Ne visu laiku, bet runā: komentē aukstumu, stundu, sarkano mēnesi, tavu kautiņu laukumā, asinis tavā sejā, tavu zirgu un tava kaķa vārdu. Viņi zina tavu karmu un neuzticas tavam ceļam. Sargs runā par vārtiem, kalējs par asmens asumu, krogs par sautējumu. Kas klausās vērīgi, iemācās vairāk ielās nekā grāmatās, ieskaitot šo.</p>' });
  add({ toc: 'XXV grāmata — Tie, kas nes karogu', lv: 'XXV', eyebrow: 'XXV grāmata', title: 'Tie, kas nes karogu', start: true, body:
    '<p>Piecpadsmitajā grāmatā es stāstīju par diviem karogiem kā par divām idejām. Bet neviena ideja pa ceļu neiet viena. Iet cilvēki. Un tieši lai iepazītu cilvēkus, kas nes katru karogu, es pēdējos gados nodilu zoles, no Austrvik līdz Kalnam, no Sudrholt līdz Ielejai, un arī zābakus, jo kāds rūķis lika man divreiz uzkāpt Ogļkalves mūrī, lai parādītu vienu ķieģeli.</p>' +
    '<p>Es atklāju, ka katram ceļam ir savs <b>nams</b>, vieta, kur ceļš dzīvo un kam ir vārds, un ka katram namam ir meistars, kurš to nepamet, tāpat kā karalis nepamet pili. Un es atklāju, ka bez meistariem katram ceļam ir kāds, kurš <b>iet</b>: nesējs, viens no nedaudzajiem, kas nes karogu tur, kur tas vēl nav nonācis. Ar tiem es gāju. Ne visi iet ar visiem: kad uzdevums ir zobena, sūta zobena vīru; kad vārda, sūta vārda vīru; kad noslēpuma, sūta mani, un tas daudz pasaka par to, ko viņi domā par noslēpumu.</p>' +
    '<h3>Pavediena nami</h3>' +
    '<p><b>Aureona ordenis</b> mīt Ausmas abatijā Austrvik, kur zvani jau trīssimt gadus modina pilsētu. Tā meistars ir <b>Lielmeistars Cassius</b>, vecs, sirsnīgs un nopietns, kurš katru iesācēju sagaida ar to pašu teikumu: ceļgals uz zemes nav pazemojums, tā ir atpūta. <b>Helsingu klans</b>, sudraba mednieki, mīt Sudraba bastionā Sudrholt un klausa <b>meistari Ilsa Van Rhal</b>, kuras ģimenei pieder Sudraba arbalets. <b>Smailes loks</b>, ko tauta sauc par Ziloņkaula torni, katru nakti iedegas Lumenhal, un to vada <b>Arhimags Aurelian Vesk</b>, līdzās viņam <b>Arhimadze Seline</b>, tā, kas pērk raganu pelnus ar tādu seju, it kā rītu etiķi.</p>' });
  add({ lv: 'XXV', body:
    '<h3>Atšķetināto nami</h3>' +
    '<p><b>Noktavaru nams</b>, ko svešie sauc par Grāfa galmu, stāv jau tūkstoš gadus Vampīru kalna pilī pār Tumšvārnu, un stāv trīs likumu dēļ, ko neviens no savējiem nelauž: nedzert no tiem, kas atrodas tā aizsardzībā, neradīt pēcnācējus bez Nama piekrišanas, nemelot Vecajam. Vecais ir <b>Grāfs Vladislav III</b>. Pie galda apkalpo <b>someljē Vasko</b>, kuram ir tūkstoš gadu vīna un divas minūtes pacietības un kurš vilkacim pasniedz ar šķību smaidu un šķīvi pie durvīm: “ārā, lūdzu, paklājs ir vecāks par jums”.</p>' +
    '<p><b>Seno gaudu bars</b> dzīvo Vilkaču džungļos, tam ir viens likums, neviens nepaliek aiz muguras, un viena māte, <b>Ulfrun, Alfa māte</b>. Es pavadīju nedēļu ar baru un aizgāju pārliecināts, ka vilkači un rūķi ir viena tauta ar dažādu kažoku: rupji, tieši, ēd skaļi, lamā to, ko mīl, un dara to, ko saka. Kāds kucēns man pajautāja, kādā garšā ir hronists. Es teicu, ka papīra. Viņš zaudēja interesi.</p>' +
    '<p><b>Gorvatas pakts</b> apvieno Posta ielejas ragaņus; tā patrons ir <b>Malgrath</b>, kurš ir princis, nevis meistars, un vecākā Paktā ir <b>ragana Grisolda</b>, kas vāc Mirušo pelnus un prasa par tiem tik, cik ļauj viņas etiķa seja.</p>' +
    '<h3>Kas staigā pa ēnas zemēm</h3>' +
    '<p>Es pamanīju, kas pārvietojas pa Tumšvārnu, Gaudām un Ieleju, nevienam neaizskarot. <b>Elfi</b>, jo pat vecākais vampīrs ciena to, kurš pēc dabas ir labs un galdam par liesu. <b>Tehnokrāti</b>, jo to, kurš labo pulksteni, nekož. <b>Cilvēki</b> nē: cilvēks tur ir medījums, un viņš to zina, un iet ātri. Un <b>rūķi</b> tur neiet, jo ienīst to ļaužu baru; bet viņi pārdod, un ēna kāpj uz Ogļkalvi pirkt dzelzi un donoru asinis Asins nolaišanas namā par to pašu cenu, ko maksā Pavediens. Es pajautāju kādam rūķim, kā var pārdot tam, ko ienīsti. “Netīrumi zem paklāja ir viņu problēma. Paklāju es nepārdodu. Dzelzi gan.”</p>' });
  add({ lv: 'XXV', body:
    '<h3>Nami, kas nezvēr</h3>' +
    '<p><b>Kraukļa klans</b> sargā Odina cietoksni Jarlsheim, <b>Thorgrim Dzelzsrokas</b> vadībā. Zālē ir divi izgrebti kraukļi, pa vienam katrā troņa pusē, un karotāji zvēr, ka tie ir Odina kraukļi: viens domā, otrs atceras. Thorgrim saka, ka karotājs, kurš klausās tikai vienu no abiem, sajūk prātā vai kļūst gļēvs, un ka visas dzīves varoņdarbs ir sēdēt pa vidu, kā Visu Tēvs. <b>Tvaika brālība</b> ir tas, kā tehnokrāti sevi sauc, kad neko nepārdod: Smēres akadēmija Katlu Ostā ar <b>Arhitekti Ylva</b> un Misiņa karavānu kompānija ar <b>faktori Brunna</b>, kura nogādā jebko jebkur un saka, ka ceļš nelūdzas.</p>' +
    '<p>Un ir Askavik, kas nav neviena ceļa nams un ir visu nams: Pavediena karaliskā audētava, ko vada <b>meistare Ingeborg</b>, un Atšķetināto audētava, ko vada <b>Corvina Atšķetinātāja</b>, katra savā vienas ielas pusē. Viņas nav sasveicinājušās divdesmit gadus, bet abas pērk diegu no viena tirgotāja, kurš abām pārdod ar to pašu smaidu un prasa no abām to pašu cenu, un tāpēc ir godīgākais cilvēks Askavik.</p>' +
    '<h3>Tie, kas palika vienkārši</h3>' +
    '<p>Pirms klašu nesējiem man jārunā par tiem, kas atteica Gaišreģei un palika tādi, kādi piedzima. Viņi nav mazāk. Dažās dienās viņi ir vairāk.</p>' +
    '<p><b>Vecais Ansgar</b>, Karmikas vecākais, atteica Gaišreģei trīs dzīves pēc kārtas un atceras visas trīs. Viņš sēž laukumā pie strūklakas un izlabo katra stāstu: “tā nebija”. Kad es jautāju, kāpēc viņš neizvēlējās ceļu, viņš atbildēja: “Izvēlējos. Izvēlējos palikt. Tas ir vienīgais ceļš, kurā tev neviens nepavēl, un tāpēc neviens tev nepalīdz. Var dzīvot.” Viņš saka, ka dotais vārds ir viss, kas cilvēkam ir, un tāpēc viņa vārds ir īss.</p>' });
  add({ lv: 'XXV', body:
    '<p><b>Būvmeistare Dagny Svinkāja</b> vada Ogļkalves Lielo būvi, jauno mūri, un visu mēra ar mērlenti, arī solījumus: “rūķa vārds ir bārdas matiņa garumā, divi pirksti; tavs iznāca pusotrs, nāc rīt”. Viņa lamā akmeni, lamā darbu vadītāju, aiz muguras lamā karali Thrain un jau uzcēlusi trīs tiltus, ko neviens neprasīja, jo “būs vajadzīgi”. Viņa tā ienīst netīrumus zem paklāja, ka viņai nav paklāja, un tomēr pārdod dzelzi gan Pavedienam, gan Atšķetinātajiem par to pašu cenu, jo bārdai nav karoga: “bizness ir bizness, vārds ir vārds, un paklājs ir viņu problēma”. Kad Pelnkalnā sabruka galerija un darbu vadītājs to noslēpa, viņa nokāpa viena, izvilka četrus apraktos un atstāja darbu vadītāju lejā līdz maiņas beigām, “lai iemācās, ko nozīmē slēpt”.</p>' +
    '<p><b>Lirien Vēllapa</b> ir Lithendel Vainaga sūtne un vienīgā būtne, ko esmu redzējis vienā nedēļā vakariņojam ar Grāfu, pusdienojam ar baru un dzeram tēju Gorvatā, nezaudējot ne matiņa. Viņa ir tīrā elfe, atteica Gaišreģei un ir gaidīta visos trijos ēnas namos, jo, kā tur saka, “elfs nemelo un nenobarojas”. Viņa runā maz, ar tik smalku ironiju, ka apvainotais pateicas. Iepriekšējā dzīvē, viņa man garāmejot pastāstīja, viņa bija vampīre. Atgriezās kā elfe. Viņa saka, ka savienības loks salūzt vienreiz, lai uzzinātu, ko tas ir vērts. Viņa man arī paskaidroja, ko Vainags piedod un ko nepiedod: tumšas karmas elfs, kas ceļ savu pilsētu starp ēnas ļaudīm un ko sauc par <b>melno elfu</b>, Lithendel nevienu neapvaino, jo arī tumsa ir kārtība, un mežs ciena kārtību. Ko mežs nepiedod, ir nodot savu dabu: kļūt par ko citu. “Es nodevu vienreiz. Samaksāju. Tāpēc man ļauj staigāt.”</p>' +
    '<h3>Aldric, kurš lasa vārdus</h3>' +
    '<p>Pirmais klases nesējs, ko satiku, bija <b>paladīns Aldric</b>, Pavediena ordeņa sūtnis Askavik. Esmu jau rakstījis, ka viņš ir sirsnīgs līdz sāpēm, un tā tas ir. Ko es nebiju rakstījis, ir tas, ko viņš glabā vairoga iekšpusē: kokā iegrebti, viens zem otra, katra cilvēka vārdi, ko viņam neizdevās pasargāt. Viņš tos lasa katru vakaru pirms miega, klusā balsī. “Jo Ordenis zvēr, ka neviens nešķērso viens. Viņi šķērsoja. Kādam jāiet līdzi, kaut vai pēc tam.” Tieši Aldric sagaida tos, kas ierodas Askavik, un rāda viņiem Labirintu tā, kā rāda māju: katrs gaitenis ir kāds, kas vēl elpo.</p>' });
  add({ lv: 'XXV', body:
    '<h3>Vesna Helsing, kura neguļ</h3>' +
    '<p><b>Medniece Vesna Helsing</b> nepiedzima kā Helsinga. Viņa piedzima ciemā, kura vairs nav, netālu no Sudrholt, un viņai bija seši gadi, kad perēklis to aiznesa. Bastions viņu uzņēma, kā uzņem visus nakts bāreņus, un viņa paņēma klana vārdu, kā paņem ieroci. Uz plaukstas locītavas viņa nēsā sardzes zvaniņu, kas iezvanās pats, ja kaut kas tuvojas, un neguļ vairāk par trim stundām naktī, jo Aravel neguļ nemaz. Viņa ir kodīga tā, kā padara tikai nogurums: paladīnus viņa acīs sauc par skautiem un saka, ka gaisma, kas gaida, kamēr briesmonis lūgs piedošanu, ir gaisma, kas nāk par vēlu. Katrs bārenis, ko Bastions uzņem, ir atkal viņas ciems. Tāpēc viņa neapstājas.</p>' +
    '<h3>Ísold Gaišspalva, kura pārraksta ar roku</h3>' +
    '<p>Smailē ir istaba, kur glabā grāmatas, ko neviens nedrīkst lasīt, un ir burve, kas tās pārraksta ar roku, vienu pēc otras, vājā gaismā. Tā ir <b>Ísold Gaišspalva</b>. “Jo kopija nemelo. Oriģināls dažreiz gan.” Viņa bija pirmā, ko dzirdēju sakām, ka kādā Torņa grimuārā pēdējā rindā ir nepareiza zilbe, un pirmā, kas pie tā vainoja Zerath puvi. Viņai ir salda augstprātība, tāda, kas zina vairāk un kam tas šķiet smieklīgi. Viņa smejas par mednieku un paladīnu, kad viņi strīdas, un abi viņu par to ienīst vienādā mērā, ko viņa uzskata par savu lielāko darbu. Kad es viņai to pateicu, viņa atbildēja, ka es to pārrakstot nepareizi.</p>' +
    '<h3>Lēdija Mirela, kura nekad nav lauzusi likumu</h3>' +
    '<p>Atšķetināto pusē balss, kas runā uz ceļiem, pieder <b>lēdijai Mirela</b>, Noktavaru nama mantiniecei. Pieklājīga kā asmens. Viņa zvērēja trīs Nama likumus piecpadsmit gadu vecumā un nekad nav lauzusi nevienu, kas starp tūkstošgadīgiem vampīriem ir retāk, nekā šķiet. Viņa uzskata vilkaci par dzīvnieku un saka to ar nevainojamu pieklājību, ko vilkacis uztver kā apvainojumu, un pamatoti. Tos, kas ierodas Askavik, viņa sagaida ielas otrā pusē ar vienu jautājumu: “Vai tu jau esi miris? Mirsi. Un atgriezīsies. Un atkal mirsi. Sauc to par aizsardzību, ja gribi.”</p>' });
  add({ lv: 'XXV', body:
    '<h3>Varg Lauztzobs, kurš nevienu neatstāj</h3>' +
    '<p><b>Varg Lauztzobs</b> ir Ulfrun otrais un, ja Ulfrun neklausās, bara rūķis. Viņš zaudēja kucēnu no sava metiena Helsingu klana sudrabam un nolauza savu zobu, kožot būrī, kurā to aiznesa. Viņš to neatlaida. Kopš tā laika viņš nevienu neatstāj aiz muguras, ne kritušo ienaidnieku, ne šķīvi. Viņš ienīst vampīru ar pirmā mēness naidu, bet sēž pie tā paša galda, kad Alfa māte pavēl, apmēram trīsdesmit sekundes ēd klusējot un tad prasa Vasko, vai vīns ir no vīnogām vai no cilvēkiem. Vasko nekad neatbild. Varg uzskata, ka tā ir atbilde.</p>' +
    '<h3>Ravena Piecklauzula, kura lasa sīko druku</h3>' +
    '<p>Jaunākā Gorvatas ragana paraksta tikai piecu klauzulu paktus. “Pārējais ir iedomība.” <b>Ravena Piecklauzula</b> lasa sīko druku labāk nekā pats Malgrath, un viņš to zina, tāpēc izmanto viņu, lai rakstītu to, ko citi paraksta. Viņa uzskata vampīru un vilku par diviem bērniem, kas kaujas pagalmā, un jau ir to abiem pateikusi, rakstiski, piecās klauzulās. Tieši viņa sastādīja pamieru starp Namu un Baru, un tieši viņa piedzina no abiem, kad viņi to lauza, tajā pašā naktī, ar procentiem, ko viņa sauc par “audzinošiem”.</p>' +
    '<h3>Brynhild Klusasmens, kura atgriezās no neprāta</h3>' +
    '<p>Kraukļa klanā ir čempione, kas runā maz un tikai par to, ko redzējusi. <b>Brynhild Klusasmens</b> ir Halfdan, Fjallbrún dezertiera, māsa, un viņa to nes, neslēpjot un nepaskaidrojot. Viņa vienreiz izgāja cauri kaujas neprātam un atgriezās, ko gandrīz neviens nespēj, un tāpēc tieši viņa māca jaunajiem stāju, kas aizsargā, un stāju, kas dziedina: “kas neprot apstāties, neprot sist”. Par Odina kraukļiem viņa saka, ka ir stāvējusi zem abiem un ka zem neviena labi neguļ. Kad Askavik viņai jautāja, kurā pusē Klanam jāstāv, viņa atbildēja, ka Pavedienam un Atšķetinātajiem vienlaikus ir taisnība un nav, un izgāja no zāles, pirms kāds lūdza paskaidrot.</p>' });
  add({ lv: 'XXV', body:
    '<h3>Anselm Rotha, kurš mēra</h3>' +
    '<p><b>Doktors Anselm Rotha</b> no Tvaika brālības grib izmērīt Labirintu. Ne sargāt, ne nojaukt: izmērīt. Viņš nēsā misiņa rādītāju, kas rāda “cik vēl atlicis”, un nekad nevienam nav teicis, cik atlicis līdz kam. Abus karogus viņš uzskata par divām dārgām māņticībām, un Kompāniju par vienīgo patiesību: kas nepārdod, tas neiededz. Tieši viņš izsniedz Akadēmijas mācekļiem pirmo lidojošo palīgu, šūnu vairogu un aproci un no katra prasa ziņojumu, ko neviens nelasa. Viņš katru dienu apglabā vienu leģendu un, kā saka Akadēmijā, reizi nedēļā vienu izrok, nevienam nesakot. Reiz es redzēju viņu stāvam melna akmens durvju priekšā un pierakstām. Es pajautāju, ko viņš pieraksta. “Ka tām nav roktura.” Un gāja tālāk.</p>' +
    '<h3>Par to, kas viņiem kopīgs</h3>' +
    '<p>Es gāju ar visiem vienpadsmit, nekad ar diviem vienlaikus, un beigās pamanīju to, ko neviens no viņiem neļautu man uzrakstīt, ja izlasītu iepriekš: visi nes sava ceļa brūci savā ķermenī, un visi domā, ka otra karogs ir tas, kas iznīcinās Karmiku. Visi grib to glābt. Tāpēc viņi cīnās. Nevienā no vienpadsmit es neredzēju ļaundari. Es redzēju vienpadsmit cilvēkus, kas slikti guļ, un trīs no viņiem, kas par to smejas.</p>' +
    '<p class="seal">Kad tev dos uzdevumu, gājēj, ievēro, kurš to dod. Tas var būt viens no viņiem.</p>' });
  add({"toc": "XXVI grāmata — Brīnumi un Redzējuma strūklakas", "lv": "XXVI", "eyebrow": "XXVI grāmata", "title": "Brīnumi un Redzējuma strūklakas", "start": true, "body": "<h3>Par monētu ūdenī</h3><p>Katrā Karmikas laukumā ir strūklaka, un katras strūklakas dibenā ir monētas. Ceļotāji domā, ka tā ir māņticība. Tā nav. Kas iemet monētu <b>Redzējuma strūklakā</b> un paliek kluss, redz visu vietu no augšas, kā to redz kraukļi un varbūt pats Marghar, un dzird vietas stāstu, ko stāsta tas, kurš to glabājis. Daudzreiz, atzīstos, tas, kurš to glabāja, biju es. Nespēju izskaidrot, kā mana balss nonāca ūdenī. Tehnokrāti saka, ka tā ir atbalss. Priesteri saka, ka tā ir žēlastība. Es saku, ka tas ir darbs, jo pierakstīju to es.</p><p>Katram ceļam ir sava pilsēta, un katrai pilsētai ir savs brīnums. Un katrā brīnumā ir Redzējuma strūklaka, jo neviens no tiem neietilpst acīs tam, kurš stāv tā pakājē. Lai redzētu, ko uzcēluši būvētāji, jāpaceļas, un monēta paceļas tavā vietā.</p><h3>Par Pavediena brīnumiem</h3><p><b>Ausmas abatija</b> Austrvik paceļ sauli un Aci pār pagalmu, kurā ietilpst ceļos nometusies pilsēta. Ausmas dienā gaisma nolaižas pār visu pagalmu, un iesācēji zvēr, ka jūt siltumu mugurā pat ar aizvērtām acīm.</p><p><b>Ziloņkaula smaile</b> Lumenhal ir balts tornis salu ezera vidū. No tālienes tā izskatās pēc bākas; no tuvuma, pēc kāpnēm, kas nebeidzas. Burvji kāpj gadiem. Tie, kas sasniedz virsotni, nestāsta, ko redzējuši, un tie, kas nesasniedz, stāsta par daudz.</p><p><b>Sudraba bastions</b> Sudrholt nav skaists, un ar to lepojas. Grāvis, mūris, torņi un tūkstoš divpadsmit akmeņi mūrī, vai tūkstoš vienpadsmit, atkarībā no tā, kurš skaita. Tas stāv pretī Nolādētajai zemei, kā vīrs stāv pretī sunim, kas vēl nav ierējies.</p><p><b>Odina cietoksnis</b> vainago Vikingu kalnu virs Jarlsheim. Kāpiens ir stāvs, sniegs nepiedod un medalus nebeidzas. Tur Thorgrim pieņem tos, kas grib zvērēt, un kas nokāpj zvērējis, nokāpj citāds: iet lēnāk un skatās tālāk.</p>"});
  add({"lv": "XXVI", "body": "<h3>Par Atšķetināto brīnumiem</h3><p><b>Grāfa pilij</b> Vampīru kalnā ir seši stāvi, un tikai divi no tiem redz debesis. Apakšā Galma katakombas un kameru pagrabs. Pirmajā stāvā bibliotēka, balles zāle ar iedegtām lustrām un klavieru istaba, kurā dienā neviens nespēlē. Augšā portretu galerija, kur gleznu acis seko garāmgājējam, un guļamistabu stāvs, desmitiem istabu, dažās gultu vietā zārki. Un pašā augšā Grāfa privātā zāle ar troni asins baseinā. Tieši tur, kā saka, pārstāj būt cilvēks.</p><p><b>Mātes koks</b> Senajās gaudās ir milzīgs alas koks, kas nogāzies džungļu vidū. Stumbrs ir Alfa mātes mājas, un dobums ir vesela sakņu un dzīvības zāle. Pusceļā uz to stāv statuja, pie kuras apstājas ikviens svešinieks: milzīga vilcene, kas zīda cilvēku bērnus. Vilkači statuju nepaskaidro. Viņi tikai saka, ka tāpēc bars nevienu nepamet.</p><p><b>Raganu tornis</b> Posta ielejā, Gorvatā, ir augsts, bet iespaidīgs ir tas, kas atrodas zem tā. Tornis zemē atver šahtu, kas iet lejup, cik tālu sniedz skats, un tilti, kas savieno ceļu ar pīlāru, ļauj redzēt dibenu: lavu, cilvēkus darbā un pašā lejā, tuvu dēmoniem, rituālus, ko Malgrath nevienam neļauj pierakstīt. Es mēģināju. Tinte uzvārījās.</p>"});
  add({"lv": "XXVI", "body": "<h3>Par to brīnumiem, kas nezvēr</h3><p><b>Katlu Osta</b>, smēres pilsēta, ir ar celtņiem, kas strādā paši, izceļot kravu no tvaika kravas kuģiem un noliekot to atpakaļ piestātnē. Smēres akadēmiju vainago divas milzīgas spoles, kas pa gaisu iededzina visu pilsētu, un starp akadēmijas stāviem ceļas iekārti dārzi, jo tehnokrāti vēlu, bet tomēr iemācījās, ka mašīna bez augiem rūsē no iekšpuses. Uz salas jūrā <b>Tehnokrātu bāka</b> griež sarkanu staru pār tvaikoņiem, un bākas sargātāja Dinorá skaita, kas ierodas un kas neatgriežas.</p><p><b>Ogļkalves vārti</b> ir lietas dzelzs durvis, izcirstas Melnajā kalnā. Pa kāpnēm kāpj, līdz pieskaras dzelzij, un vārti ieslīd klintī. Iekšā ir Lielā zāle ar troni Mātes kalves pakājē, kas saņem lavu no kalna dzīslām pa kanāliem, par kuriem neviens dzīvs rūķis nezina, kas tos izraka. Pie sienām dimanti un smaragdi. Un pašā dziļumā, starp diviem milzu rūķiem, kas izkalti ar pacelti cirvjiem viens pret otru, <b>Melnā kalna sirds</b>: milzīgs zils akmens, kas dažreiz kļūst sarkans. Rūķi saka, ka tas kļūst sarkans, kad kāds zālē melo. Es visu laiku klusēju.</p><p><b>Gaia, Svētais koks</b> Lithendel ir Māte Zeme, kas kļuvusi par koku, un elfu pilsēta dzīvo tās zaros. Ar liānu trošu ceļu uzbrauc līdz stāvam, kur burtiski staigā pa koku un redz Karmiku no augšas. Arī vilkaču Mātes koks kādreiz bija stāvošs koks. Elfiem nepatīk, ka to atgādina.</p><p class=\"seal\">Kad stāvēsi kāda no tiem priekšā, gājēj, iemet monētu. Brīnums nav radīts, lai to skatītu no apakšas.</p>"});
  add({"toc": "XXVII grāmata — Aureona klejotājs", "lv": "XXVII", "eyebrow": "XXVII grāmata", "title": "Aureona klejotājs", "start": true, "body": "<h3>Par paladīnu, kas nepaliek mājās</h3><p>Kas domā par paladīnu, domā par Abatiju, un Abatija ir māte. Bet Lielmeistaram Cassius ir noteikums, kas daudziem iesācējiem šķiet dīvains: tikko zvērējis paladīns nepaliek Austrvik. Viņš dodas prom. <b>Paladīns vispirms ir labā klejotājs</b>, un gaisma, kas neiet, kļūst par altāra sveci, skaistu un nederīgu.</p><p>Desmit Cilvēku zemju ciemos stāv veselas Aureona kapelas ar garīdznieku pie durvīm: Grenivik, Vestheim, Vatnaholt, Skógar, Myrbakki, Brekkuvik, Vindholt, Dalborg, Steinfoss un Lundr. Katram ciemam ir savs ļaunums, un neviens ļaunums nav līdzīgs citam. Klejotājs ierodas, uzklausa garīdznieku, stājas pretī tam, kas ložņā ap ciemu, un izlemj, ko darīt ar to, kas palicis. Katrs garīdznieks viņu sūta uz nākamo kapelu, un pēdējais sūta atpakaļ mājās.</p><h3>Par lieko noti</h3><p>Desmit kapelu garīdznieki ne visi pazīst cits citu, bet stāsta vienu un to pašu, katrs domājot, ka ir vienīgais: kapelas zvans kādā naktī nozvanīja <b>vienu noti par daudz</b>, noti, ko neviens nebija noskaņojis. Steinfoss man parādīja rūnu, kas ieskrāpēta bronzā zvana iekšpusē, kur neviena roka nesniedz. Es to pārkopēju. Tā nav neviena no sešām.</p><p>Kad Klejotājs atgriežas Abatijā, Cassius viņu sagaida stāvus un dod viņam <b>Aureona klejotāja</b> vārdu. Es jautāju Lielmeistaram par noti. Viņš atbildēja, ka arī gaismai ir jautājumi, un mainīja tēmu.</p>"});
  add({"toc": "XXVIII grāmata — Zvaniņš uz plaukstas locītavas", "lv": "XXVIII", "eyebrow": "XXVIII grāmata", "title": "Zvaniņš uz plaukstas locītavas", "start": true, "body": "<h3>Par sudrabu, kas ir parāds</h3><p>Sudraba bastionā meistare Ilsa Van Rhal pasniedz pirmo sudraba asmeni ar teikumu, ko katrs Helsings zina no galvas: <b>sudrabs nav dāvana, tas ir parāds</b>. Kas to saņem, tas kļūst parādā katru mierīgi nogulētu nakti kādam, kurš palika nomodā uz mūra.</p><p>Jaunos uz mūra ved <b>medniece Vesna Helsing</b>, kodīga un smieklīga tā, kā ir tie, kas gadiem nav gulējuši. Viņa māca trīs nakts stundas, zvana stundu, suņa stundu un stundu, kurā nevienam nevajadzētu būt nomodā, un katrā sardzē skaļi skaita mūra akmeņus, lai neaizmigtu. Viņa saka, ka to ir tūkstoš divpadsmit. Meistare saka tūkstoš vienpadsmit. Abas skaita katru nakti, un neviena nepiekāpjas.</p><h3>Par Sudrholt bāreni</h3><p>Sudrholt ir zēns vārdā <b>Pip</b>, kurš zaudēja ģimeni Nolādētās zemes zvēram un nespēj aizmigt, nedzirdot zvanu. Helsingi bērnus neadoptē; viņi saka, ka sudrabs nav vieta bērniem. Bet katru jaunu mednieku sūta parunāt ar Pip, un to, ko viņš zēnam saka, patiesību, gaidīšanu vai melus, Acs pieraksta pirms jebkura zvēra. Vēlāk ar Miega pulveri, kas negribīgi nopirkts no Gorvatas raganas, un Sardzes zvaniņu, kas nopirkts no Kompānijas, mednieki viņam izgudroja <b>Sargāto miegu</b>. Tā bija skaistākā lieta, ko esmu redzējis mednieku darām.</p>"});
  add({"lv": "XXVIII", "body": "<h3>Par rūnu kaulā</h3><p>Bastiona zālē karājas zvēra galvaskauss, Van Rhal, ģimenes pirmās medības. Kas skatās ar Instinktu, redz to, ko acis neredz: <b>sesto rūnu, ieskrāpētu kaula iekšpusē</b>. Ne virspusē: iekšpusē, kur neviens nazis neiekļūst. Pēc tam Helsingi sāka atvērt to zvēru galvaskausus, ko nogalināja. Visos ir rūna. Es tur jau biju bijis gadus agrāk un pierakstīju, nesaprotot. Vismaz pierakstīju.</p><h3>Par ciemu, kura vairs nav</h3><p>Vecajā kartē ir ciems Lysmark, kura nav jaunajā kartē. Kas aiziet līdz vietai, kur tas bija, un izmanto Instinktu, atrod meitenes garu ar sveci rokā. Atnācējam viņa saka tikai vienu: <b>tava svece nodzisa pēdējā</b>. Neviens nezina, kam viņa to saka.</p><h3>Par Aravel zvērestu</h3><p>Mednieks savu pirmo gadu noslēdz Aravel drupās, kur Aravel, Zaļajai Nomodai, bija pirmais altāris. Tur viņš līdzās Vesnai izsaka teikumu, kas zvērestam dod vārdu:</p><blockquote>Es neguļu, kamēr kāds mazs ir nomodā tumsā.</blockquote><p>Pēc tam mednieks nēsā mazu zvaniņu uz plaukstas locītavas. Tas neskan, lai kādu sauktu. Tas skan, lai atcerētos.</p>"});
  add({"toc": "XXIX grāmata — Zvērests", "lv": "XXIX", "eyebrow": "XXIX grāmata", "title": "Zvērests", "start": true, "body": "<h3>Par Askavik audētavu</h3><p>Ir diena, kad katrs ceļš zvēr savam karogam, un visi zvēr vienā vietā: Askavik <b>Audētavā</b>, kur auž abu frakciju apmetņus. Katrs zvēr savā veidā. Paladīns nometas ceļos. Vilkacis gaudo. Vampīrs paraksta ar asinīm un sūdzas par papīru. Raganis skaļi nolasa visu līgumu, divreiz, un izlabo komatu. Burvis jautā, vai drīkst pierakstīt. Un ziemeļu karotājs, kurš pēc Kraukļa tradīcijas nezvēr nevienam karogam, ir tas, kurš <b>šķīrējtiesā</b>: viņš stāv zāles vidū un pasaka, vai zvērests ir derīgs.</p><h3>Par Mēness pamieru</h3><p>Atšķetinātajiem ir pamiers, kas vecāks par karogiem: <b>Mēness pamiers</b>. Bezmēness naktī vilks un vampīrs viens otru nemedī, un raganis pieraksta, kas tika teikts, lai vēlāk neviens nevarētu teikt, ka teicis ko citu. Vilki par to ienīst ragani. Vampīri ienīst vilkus. Un pamiers turas gadsimtiem, kas daudz pasaka par naidu un maz par mieru.</p><h3>Par vietu, kur mana puse kļūdās</h3><p>Katram godīgam zvērestam ir jautājums, ko meistari skaļi neuzdod: kur mana puse kļūdās? Pavediens atbildi atrod <b>Grenivik</b>, kur kāds Ordeņa kapteinis sāka iekasēt aizsardzības naudu no tiem, kurus viņam bija jāaizsargā. Atšķetinātie atbildi atrod <b>Lundr</b>, kur viena brīvība kļuva par otra cietumu. Abas puses no turienes atgriežas klusākas.</p>"});
  add({"lv": "XXIX", "body": "<h3>Par Grenivik puvi</h3><p>Tieši tajā laikā puve sāka plūst lejup pa upi no Grenivik. Katrs ceļš to izlasīja savā veidā. Paladīns lūdzās un sajuta aukstumu. Vilkacis apostīja un neatpazina smaku, kas nekad agrāk nebija noticis. Vampīrs saviebās un teica, ka šīs asinis bijušas vecas jau pirms dzimšanas. Raganis lasīja, un tas, ko viņš izlasīja, bija burts: sens burts, vecāks par Malgrath, rakstīts tur, kur nebija papīra.</p><p>Visi domāja, ka tas ir Zerath, puves princis. Tam bija jēga, un tam, kam ir pārāk daudz jēgas, vajadzētu mūs biedēt.</p><h3>Par durvīm</h3><p>Zvēresta beigās katrā ceļā kāds runā par durvīm. Melna akmens durvis bez roktura ar Aci, kas iekalta ar nolaistiem plakstiņiem. Esmu jau stāstījis, ka tādas ir trīs: Aizmirstajā kapsētā, Ogļkalvē un Askavik bibliotēkā. Tagad es zinu, ka ir ceturtās. Par tām runāšu vēlāk, tilta grāmatā.</p>"});
  add({"toc": "XXX grāmata — Šķeltais galds", "lv": "XXX", "eyebrow": "XXX grāmata", "title": "Šķeltais galds", "start": true, "body": "<h3>Par karu, ko neviens nepiesaka</h3><p>Pēc zvērestiem pienāca laiks, ko vecie sauc par <b>Auksto karu</b>. Neviens neko nepieteica. Paladīns pavadīja karavānas līdz Ielejai un atgriezās, skaitot līķus, kas nepiederēja nevienam. Vampīrs iemācījās pirkt pulksteņus, jo Galms izlēma, ka tam, kurš dzīvo naktī, jāzina precīza saules stunda. Mednieks atvēra sudraba būrus un atrada tajos lietas, ko pats bija ieslodzījis. Katra puse darīja otrai to, par ko otru apsūdzēja.</p><h3>Par Askavik galdu</h3><p>Lai karš nekļūtu par karu, abu karogu meistari apsēdās pie viena galda Askavik padomes zālē. Tas ir <b>Šķeltais galds</b>, un vārds ir sens: akmens galds, pārplēsts uz pusēm, viena puse katram karogam. Cilvēki balso, burvis raksta protokolu, elfs ir starpnieks, rūķis atnes dzelzs galdu, kas neplīst, un Varg vienā no sēdēm ar pļauku pārplēsa dzelzs galdu.</p><p>Puse, kas uzvar pie Galda, veselu nedēļu paceļ savu karogu Askavik laukumā. Izklausās maz. Tā nav. Nedēļa ar karogu laukumā maina maizes cenu, sargu omu un to, kurš var izgulēties krogā.</p>"});
  add({"lv": "XXX", "body": "<h3>Par lieko krēslu</h3><p>Galda pirmajā sēdē bija viens krēsls par daudz. Neviens to nebija nolicis. Uz tā, rūpīgi salocīts, gulēja <b>pelēks apmetnis</b>. Sēdes beigās apmetņa vairs nebija, un neviens neredzēja, kā tas aizgāja.</p><p>Pēc tam es devos pakaļ apmetnim, un katrs ceļš to bija redzējis, pats nezinot. Tas bija tas, kurš pirka vampīru pulksteņus. Tas, kurš pārdeva sveces Abatijai. Tas, kurš maksāja skaldam, lai tas dziedātu nepareizo dziesmu. Vīrs bez smaržas, kam vilki nespēja sekot. Tas, kurš parakstīja Brālības kastes. Tas, kurš rakstīja ar to burtu, kas vecāks par Malgrath. Tas, kurš nesa barību zvēru perēklim. Tas, kurš bija izpētījis nodevu ceļu, un tas, kurš pasūtīja rūķiem zvanu ar Aci, kas iekalta ar aizvērtām acīm.</p><p>Neviens neatceras seju. Visi atceras apmetni.</p>"});
  add({"toc": "XXXI grāmata — Velmora, raudu tilts", "lv": "XXXI", "eyebrow": "XXXI grāmata", "title": "Velmora, raudu tilts", "start": true, "body": "<h3>Par ciemu, ko kartes izlaiž</h3><p><b>Tumšajā kanālā</b>, uz robežas starp Hrafnhöfn, kas pieder Pavedienam, un Tumšvārnu, kas pieder Atšķetinātajiem, ir zvejnieku ciems, ko kartogrāfi aizmirst uzzīmēt. To sauc <b>Velmora</b>. Tam ir divi krasti un viens vārds. Ausmas krasts rietumos ar gaišām mājām, laukumu un piestātni. Nakts krasts austrumos ar melniem jumtiem un sarkanām laternām, ko Grāfs redz no savas pils. Kapelas tur nav. Iedzīvotāji saka, ka tā viņiem nekad nav bijusi vajadzīga, un to sakot nolaiž acis.</p><p>Tur dzīvo Tilta sargātāja Edla; zvejnieks Tóki; vecā Rúna no Tīkliem, kas lāpa to, ko neviens cits vairs nelāpa; tirgotāja Hekla, kas pārdod abiem krastiem par vienu cenu; un laternu iededzinātājs Orri, kas iededz Nakts krasta laternas un saka, ka tās nodziest pašas, kad uz tilta kāds melo.</p><h3>Par tiltu</h3><p><b>Velmoras tilts</b> ir plata akmens arka, kas sastiprināta ar rūķu skavām, no laikiem pirms karaļa Thrain, bez neviena klana zīmes. Uz vidējā akmens ir uzraksts: <i>šeit iet pāri</i>. Pēdējie vārdi ir nokasīti. Vecākie saka, ka viss teikums bija <i>šeit iet pāri, un šeit paliek</i>.</p>"});
  add({"lv": "XXXI", "body": "<h3>Par pārcēlāju</h3><p>Zem tilta strādā <b>pārcēlājs Táraka</b>. Viņa vārds valodā, kas vecāka par mūsējo, nozīmē to, kurš pārceļ pāri, to, kurš atbrīvo, un arī acs zīlīti. Viņa laivas laterna vienmēr ir nodzisusi. Viņš ved mirušos uz vietu, no kuras atgriežas kā cilvēks, un neņem maksu. Es jautāju, kurš brauca pirms manis. Viņš pateica, un tas bija kāds no cita ceļa. Katram ceļotājam viņš teica to pašu: pirms tevis brauca kāds no cita ceļa.</p><h3>Par ceturtajām durvīm</h3><p>Tiltam ir trīs balsti. Vidējais tika uzcelts <b>ap</b> kaut ko. Kad balsts ieplaisāja, tajā gadā, kad puve plūda lejup pa upi un ciemi bēga uz Velmoru, tā iekšpusē parādījās melna akmens durvis bez roktura, ar Aci ar nolaistiem plakstiņiem. Tās ir vecākas par tiltu. Tās ir vecākas, man šķiet, par Velmoru.</p><p>Tajā gadā kāds aizslēdza tiltu ar ķēdi un sāka ņemt nodevu no bēgļiem. Nodevu iekasētājiem maksāja ar vecu naudu, kāds bez sejas. Pavediens pavadīja bēgļus. Atšķetinātie pārrāva ķēdi. Krauklis noturēja tilta vidu. Un es stāvēju, skatīdamies uz durvīm, un durvis, zvēru, skatījās pretī.</p><p class=\"seal\">Velmora ir vienīgā vieta, kurp jāiet visiem ceļiem. Ej. Un nelasi uzrakstu skaļi.</p>"});
  add({"toc": "XXXII grāmata — Par ģildēm un provincēm", "lv": "XXXII", "eyebrow": "XXXII grāmata", "title": "Par ģildēm un provincēm", "start": true, "body": "<h3>Par Ģilžu grāmatu</h3><p>Lumenhal atrodas Rātsnams, kolonnu pils ar pulksteņa torni un zvanu, kas iezvana pilsētas stundas. Iekšā, pieņemšanas zālē, <b>mērs Corvin Aldmar</b> glabā <b>Ģilžu grāmatu</b> uz pults, un tieši tajā katra Karmikas ģilde pastāv vai beidz pastāvēt. Viena kopija glabājas pie manis Lielajā bibliotēkā, jo mērs vairāk uzticas tintei nekā atmiņai, un es arī.</p><p>Ģildes dibināšana prasa maz un maksā daudz: trīs pieredzējušus dibinātājus, kas nogājuši pietiekami, lai kaut ko svērtu, un vienu <b>Marghar Asaru</b> uz galda. Visi trīs paraksta. Vārds vairs nekad nemainās. Karogs un simbols var mainīties; vārds ne, jo Grāmata nedzēš.</p><h3>Par slavu</h3><p>Ģilde aug <b>slavā</b>, un slava nāk no trim avotiem: daļa no tā, ko katrs biedrs iemācās ceļā, uzdevumi, ko ģilde izpilda kopā, un tas, ko biedri ziedo kasei. Slavena ģilde ir stiprāka visā: tās biedriem ir vairāk dzīvības, vairāk bojājumu, vairāk bruņu, viņi atgūstas ātrāk. Senie to sauc par stingru karogu. Es to saucu par cilvēkiem, kas neiet vieni.</p>"});
  add({"lv": "XXXII", "body": "<h3>Par Ģildes namu</h3><p>Kad ģilde sasniedz ceturto pakāpi, tā uzceļ savu <b>Namu</b>. Tās nav kazarmas: tas ir amatu un tirdzniecības nams. Tajā ir telpas katrai profesijai, ieroču zāle un ģildes priekšmeti, ko paši biedri pārdod, iznomā un aizdod cits citam. Neviens svešs Namu nepārvalda. Tas pieder spēlētājiem, un viņi to pārvalda.</p><h3>Par pili un provinci</h3><p>Piektajā pakāpē ģilde kļūst par <b>pili</b>, un pils iegūst ciemu. Katrs biedrs saņem zemes gabalu savai mājai, un pilsētu <b>aizstāv un uztur pati ģilde</b>, ar savām rokām, kad pienāk aplenkums. Apkārtējā zeme kļūst par ģildes provinci.</p><p>Svešie var nopirkt zemi provincē un tur dzīvot. Viņi maksā nodokli, un nodoklis nav sods: tā ir mūru aizsardzības cena. Kas nekad nav redzējis aplenktu provinci, tam nodoklis šķiet dārgs. Kas ir redzējis, maksā nesūdzoties.</p><p class=\"seal\">Ģilde nav tērzēšana ar karogu. Tā ir pilsēta, kuras būvniecība vēl nav pabeigta.</p>"});
  add({"toc": "XXXIII grāmata — Par krogiem un ratiem", "lv": "XXXIII", "eyebrow": "XXXIII grāmata", "title": "Par krogiem un ratiem", "start": true, "body": "<h3>Par Slapjo laktu</h3><p>Hronists, kurš nepazīst krogus, nepazīst pasauli, jo tieši tajos pasaule stāsta to, ko nestāsta hronistiem. Labākais no visiem ir <b>Slapjā lakta</b>, rūķu krogs. Tā ir akmens zāle ar alus mucu leti un veselu pudeļu sienu, ugunsbedri ar mežacūku uz iesma, gariem galdiem ar soliem un skatuvi, kur bards dzied, līdz kāds iemet ar kausu. Aiz letes <b>Hildigunn</b> lej tumšo alu. Pie bedres <b>Fróði</b> griež mežacūku. Virtuvē <b>Sif</b> vāra sautējumu, kas dziedē paģiras un sirdssāpes, tieši šādā secībā.</p><p>Stūrī ir apaļš galds, ko var rezervēt uz stundu par divdesmit monētām tiem, kas grib runāt, lai neviens nedzird. Es reiz to rezervēju. Dzirdēju visu no blakus galda.</p><h3>Par rūķa svētkiem</h3><p><b>Rūķu rati</b> brauc pa visiem ceļiem, pielādēti ar alu un grilētu gaļu. Kas samaksā, tas dabū svētkus: rati kļūst par telti, gaļa nonāk uz zemes, mucas atveras, skan mūzika, un ciema ļaudis dejo līdzi. Pēc kāda laika visi sāk saļimt un guļ tur, kur nokrita. No rīta rūķis jau ir prom un atstājis uz zemes vēstuli. Savējo es glabāju: <i>Kas par ballīti! Ceru, ka mani pakalpojumi jums patika. Es vienmēr esmu kaut kur tuvumā un sacelu jautrību.</i></p>"});
  add({"lv": "XXXIII", "body": "<h3>Par Misiņa karavānu</h3><p><b>Misiņa karavānu kompānija</b> pieder tehnokrātiem un pārdod to, ko ražo Akadēmija: vibrējošus asmeņus, elektrificētus asmeņus, šaujamieročus, torņus, kas salūst pēc dažām reizēm, un mazus robotus, kas palīdz celt mājas. Katri Karmikas rati maksā Kompānijai maksu par aizsardzību. Kad kādus aplaupa, Kompānija nosūta <b>trauksmi</b> visai pasaulei. Kas ir tuvumā, izvēlas, vai iet. Kas iet un aizstāv, saņem atlīdzību, ko maksā paši tirgotāji. No tiem, kas neiet, neviens neko neprasa. Acs prasa.</p><h3>Par tirgu, kas pieder gājējiem</h3><p>Gandrīz viss, kas Karmikā apgrozās, kāda savākts, izgatavots, pārvadāts vai uzbūvēts. Malkas cirtējs un galdnieks, kalnracis un kalējs, ādu novilcējs un šuvējs, zāļu vācējs un alķīmiķis, zvejnieks un pavārs. Kas neprot pats, pērk no tā, kurš prot. Pat mājas tiek pārdotas: Notariāts izsniedz īpašuma aktu, un akts nonāk izsolē kā jebkurš zobens.</p>"});
  add({"toc": "XXXIV grāmata — Ceļi, kas vēl guļ", "lv": "XXXIV", "eyebrow": "XXXIV grāmata", "title": "Ceļi, kas vēl guļ", "start": true, "body": "<p>Es saskaitīju astoņus ceļus, un astoņi ir tie, kas atveras šodien. Bet Ceļu Gaišreģe, kad iedzer vīnu, stāsta, ka trauka ūdenī redzējusi vairāk ceļu. Ceļus, kas vēl guļ, gaidot, kas tos pamodinās. Es pierakstu, ko dzirdēju, nesolot, ka zinu.</p><h3>Akmeņu loks</h3><p><b>Apburtā meža</b> sirdī, kur koku galotnes naktī mirdz, ir akmeņu loks, ko neviens nav uzcēlis. Tur, kā stāsta, daži iet klausīties, ko koki saka lēnām, un atgriežas, protot mainīt veidolu, saukt saknes un ērkšķus un dziedināt ar to, kas aug no zemes. Elfi viņus sauc par <b>druīdiem</b>. Viņi saka, ka mežam nav saimnieka, tam ir sargs.</p><h3>Bezsejas ģilde</h3><p>Askavik šķērsielās ir ģilde, kurai nav mītnes, tikai līgumi. Neviens neredz tās biedrus; visi viņus jūt. Tie, kas to pazīst, sauc to par <b>Bezsejas ģildi</b>, un tās ļaudis par <b>slepkavām</b>. Katrs līgums sver uz tā karmas, kurš maksā, un tā, kurš izpilda. Esmu dzirdējis, ka tā atteikusies no līguma tikai vienreiz. Pasūtītājs valkāja pelēku apmetni.</p><h3>Tie, kas ceļ augšā kritušo</h3><p>Kur visi redz beigas, daži redz izejvielu. <b>Hemaras kriptā</b>, Nolādētās zemes malā, runā par ļaudīm, kas ceļ augšā kaulus un piesien dvēseles pie pavediena. Tie ir <b>nekromanti</b>, un viss Pavediena ordenis viņus vajā, jo piesiet dvēseli ir pretēji tam, kā to sargāt.</p><p class=\"seal\">Kad šie ceļi pamodīsies, es būšu tur, lai to pierakstītu. Ja tie pamodīsies pirms manis, lai kāds to pieraksta manā vietā.</p>"});
  add({"toc": "Epilogs", "lv": "", "eyebrow": "Epilogs", "title": "Tas, kas vēl jāuzraksta", "start": true, "body": "<p>Šeit beidzas tas, ko es zinu par šo sezonu. Ceļš turpinās, un tas, kurš pa to ies, uzrakstīs trūkstošās nodaļas. Ja esi ticis līdz šejienei, paņem padomu, ko vēsturnieks dod katram ceļotājam: skaties, ko tu sēj.</p><p>Šī ir hroniku <b>Season I</b>. Tas, ko gājēji tajā darīs, kari, asaras, uzceltās pilsētas un tās, kas kritīs, nonāks nākamajā sējumā. Karmikas Bībele ir dzīva: spēle notiek grāmatā, un grāmata stāsta spēli.</p><p class=\"seal\">Ormund Salveth, Lielās bibliotēkas hronists</p>"});
  /* ===== EPISÓDIO II — A DÉCIMA VELA (selado: o caminho traçado da expansão, 26/10/2026) ===== */
  add = function (o) { P.push(o); };

  function illuminate(host) {

      if (ps[k].className) continue;

      if (n && n.nodeType === 3 && n.textContent.length > 1) {
        var ch = n.textContent.charAt(0), sp = document.createElement('span');
        sp.className = 'initial'; sp.setAttribute('data-l', ch); sp.textContent = ch;

  function fits(el) { minner.textContent = ''; minner.appendChild(el); return minner.scrollHeight <= minner.clientHeight + 1; }
  function bal(str) {
    return (str.match(/<[a-zA-Z][^>]*>/g) || []).length === (str.match(/<\/[a-zA-Z]+>/g) || []).length;
  }

      var words = inner.split(/\s+/);
      return { sets: [sents, words], wrap: function (a) { return '<p>' + a.join(' ') + '</p>'; }, join: ' ' };
    }
    if (el.tagName === 'UL') {

      var tag = '<ul' + (el.className ? ' class="' + el.className + '"' : '') + '>';
      return { sets: [lis], wrap: function (a) { return tag + a.join('') + '</ul>'; }, join: '' };
    }
    if (el.classList.contains('tw') && el.querySelector('tbody')) {
      var rows = Array.prototype.map.call(el.querySelectorAll('tbody tr'), function (x) { return x.outerHTML; });
      var head = el.querySelector('thead').outerHTML;

  function splitBlock(b, cur, sec, first) {

      }
      if (k > 0 && k < us.length) return [u.wrap(us.slice(0, k)), u.wrap(us.slice(k))];
    }

  }
  function paginate(sec, blocks) {

          if (fits(content(sec, cur.concat([b2]), pages.length === 0))) shr = b2;

      var held = [];

      if (cur.length) { pages.push(cur); cur = []; queue.unshift.apply(queue, held.concat([b])); continue; }
      cur = held;
      pages.push(cur.concat([b])); cur = [];
    }
    if (cur.length) pages.push(cur);
    if (!pages.length) pages.push([]);
    return pages;
  }

  }
  function dlLink() {

  function tocBlocks(w, secStart, tocStartPg) {

    });
    for (var j = 1; j <= NP; j++) if (j !== w) out.push('<a class="toc-link" data-go="' + tocStartPg[j] + '" href="#p' + tocStartPg[j] + '">' + (j < w ? '&#8249; ' : '') + 'Daļa ' + ROM[j] + ' — ' + ED.parts[j - 1].name + (j > w ? ' &#8250;' : '') + '</a>');

  }

  var pageList = [], tocStart = {}, N = 0;

  sections.forEach(function (sec, si) {
    var last = groups[groups.length - 1], mk = '<div class="secmark" data-m="' + si + '">' + RULE + '</div>';
    if (!sec.head && last && last.stream) { last.blocks.push(mk); last.blocks = last.blocks.concat(sec.blocks); last.secs.push(si); }
    else if (!sec.head) groups.push({ stream: true, tp: sec.tp, sec: { head: '', start: false }, secs: [si], blocks: [mk].concat(sec.blocks) });
    else groups.push({ tp: sec.tp, sec: sec, secs: [si], blocks: sec.blocks });
  });
  function PL() { var r = []; for (var w = 1; w <= NP; w++) r.push(w); return r; }
  function build() {
    var secPages = groups.map(function (g) { return paginate(g.sec, g.blocks); });
    var c = {}, tocPg = {}; for (var w0 = 1; w0 <= NP; w0++) c[w0] = 1;
    for (var iter = 0; iter < 4; iter++) {
      tocStart = {}; var acc = 1; for (var w1 = 1; w1 <= NP; w1++) { tocStart[w1] = acc; acc += c[w1]; }
      var base = acc, pg = base, secStart = [];
      secPages.forEach(function (sp, gi) {
        var g = groups[gi];
        g.secs.forEach(function (si) {
          var at = 0;
          if (g.stream) {
            for (var k = 0; k < sp.length; k++) {
              var ix = -1;
              for (var j = 0; j < sp[k].length; j++) if (sp[k][j].indexOf('data-m="' + si + '"') > -1) ix = j;
              if (ix > -1) { at = ix === sp[k].length - 1 ? k + 1 : k; break; }
            }
          }
          secStart[si] = pg + Math.min(at, sp.length - 1);
        });
        pg += sp.length;
      });
      var nc = {};
      PL().forEach(function (w) {
        var tsec = { head: tocHead(w), start: false };
        tsec.blocks = tocBlocks(w, secStart, tocStart);
        tocPg[w] = { sec: tsec, pages: paginate(tsec, tsec.blocks) };
        nc[w] = tocPg[w].pages.length;
      });
      var same = PL().every(function (w) { return nc[w] === c[w]; });
      c = nc;
      if (same) break;
    }
    pageList = [{ kind: 'cover', tp: 0 }];
    PL().forEach(function (w) {
      tocPg[w].pages.forEach(function (blocks, k) {
        pageList.push({ kind: 'toc', tp: w, which: w, sec: tocPg[w].sec, blocks: blocks, first: k === 0 });
      });
    });
    groups.forEach(function (g, gi) {
      secPages[gi].forEach(function (blocks, k) {
        pageList.push({ kind: 'sec', tp: g.tp, sec: g.sec, si: gi, pi: k, blocks: blocks, first: k === 0 });
      });
    });
    N = pageList.length - 1;
    minner.textContent = '';
  }

  function leaf(i) {
    var p = pageList[i], el = document.createElement('article');
    el.className = 'leaf' + (p.kind === 'cover' ? ' cover' : '');
    var folio = i > 0 ? '<div class="folio"><span>' + i + '</span></div>' : '';
    var rib = (p.kind === 'cover' || p.kind === 'toc') ? '' :
      '<button class="ribbon" data-go="' + tocStart[p.tp || 1] + '" aria-label="Atvērt saturu" title="Saturs"></button>';
    el.innerHTML = '<i class="side l"></i><i class="side r"></i><i class="base"></i>' +
      '<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>' +
      '<div class="inner" tabindex="-1"></div>' + folio + rib;
    var inner = el.querySelector('.inner');
    if (p.kind === 'cover') {
      inner.innerHTML = '<p class="sub">Karmikas hronikas</p>' + EYE +
        '<h1 class="title">Karmikas<br>Bībele</h1>' + RULE.replace('class="rule"', 'class="rule" style="margin:.2em auto"') +
        '<p class="ep"><span>Season I</span>Divi karogi</p>' +
        '<p class="sub">Ormund hronikas</p>' +
        '<p class="by">Ormund Salveth, Lielās bibliotēkas hronists</p>';
      el.insertAdjacentHTML('beforeend', '<button class="strap" aria-label="Atvērt grāmatu: atslēgt piekaramo slēdzeni"><span class="hint">Pieskaries slēdzenei</span><span class="band l"></span><span class="band r"></span>' +
        '<svg class="lock" viewBox="0 0 84 112" aria-hidden="true"><defs>' +
        '<linearGradient id="lkg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b909c"/><stop offset=".35" stop-color="#4d515c"/><stop offset="1" stop-color="#1d1f26"/></linearGradient>' +
        '<linearGradient id="lks" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2c34"/><stop offset=".4" stop-color="#9aa0ad"/><stop offset="1" stop-color="#2a2c34"/></linearGradient></defs>' +
        '<path class="shackle" d="M22 56 V34 a20 20 0 0 1 40 0 V56" fill="none" stroke="#14151a" stroke-width="12" stroke-linecap="round"/>' +
        '<path class="shackle" d="M22 56 V34 a20 20 0 0 1 40 0 V56" fill="none" stroke="url(#lks)" stroke-width="8" stroke-linecap="round"/>' +
        '<rect x="7" y="52" width="70" height="56" rx="9" fill="url(#lkg)" stroke="#0c0d11" stroke-width="2"/>' +
        '<rect x="12" y="57" width="60" height="46" rx="6" fill="none" stroke="rgba(190,196,210,.35)" stroke-width="1.4"/>' +
        '<g fill="#7b808d" stroke="#0c0d11" stroke-width=".8"><circle cx="16" cy="61" r="2.6"/><circle cx="68" cy="61" r="2.6"/><circle cx="16" cy="99" r="2.6"/><circle cx="68" cy="99" r="2.6"/></g>' +
        '<g class="runes" fill="none" stroke="#9d8bff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="42" cy="78" r="15"/><path d="M42 61 V63 M42 93 V95 M25 78 H27 M57 78 H59"/><path d="M20 66 l4 6 l-4 6 M64 66 l-4 6 l4 6 M24 98 h6 M54 98 h6"/></g>' +
        '<circle class="keyhole" cx="42" cy="75" r="5.2" fill="#0b0810"/><path class="keyhole" d="M39.4 78 H44.6 L46.4 90 H37.6 Z" fill="#0b0810"/>' +
        '<g fill="rgba(120,70,30,.35)"><circle cx="24" cy="92" r="3"/><circle cx="60" cy="68" r="2.2"/><circle cx="31" cy="64" r="1.6"/><circle cx="56" cy="95" r="2"/></g>' +
        '<path d="M12 56 H72" stroke="rgba(255,255,255,.28)" stroke-width="1.4"/></svg></button>');
    } else {
      inner.appendChild(content(p.sec, p.blocks, p.first));
    }
    return el;
  }

  var END = '<svg viewBox="0 0 300 38" fill="none" stroke="#d9a24f" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">' +
    '<path d="M6 19 H96 C104 19 108 10 116 10 C122 10 124 15 120 17"/><path d="M294 19 H204 C196 19 192 10 184 10 C178 10 176 15 180 17"/>' +
    '<path d="M30 19 H76" stroke-opacity=".5"/><path d="M270 19 H224" stroke-opacity=".5"/>' +
    '<path d="M150 5 L168 19 L150 33 L132 19 Z"/><path d="M150 12 L160 19 L150 26 L140 19 Z" fill="#d9a24f" stroke="none"/><path d="M148 17 L152 19 L148 21 Z" fill="#15101e" stroke="none"/>' +
    '<path d="M122 12 H130 L126 19 L130 26 H122 L126 19 Z" stroke-width="1.1"/><path d="M178 12 H170 L174 19 L170 26 H178 L174 19 Z" stroke-width="1.1"/>' +
    '<circle cx="12" cy="19" r="2" fill="#d9a24f" stroke="none"/><circle cx="288" cy="19" r="2" fill="#d9a24f" stroke="none"/></svg>';
  function finish(el) {
    var inner = el.querySelector('.inner');
    if (!inner) return;
    var old = inner.querySelector('.endorn');
    if (old) old.remove();
    if (el.classList.contains('cover')) return;
    var o = document.createElement('div');
    o.className = 'endorn';
    o.innerHTML = END;
    inner.appendChild(o);
    if (inner.scrollHeight > inner.clientHeight + 1) o.remove();
  }

  var cur = -1, busy = false;
  function ui() {
    countEl.textContent = cur === 0 ? 'Vāks' : cur + ' / ' + N;
    prevB.disabled = cur === 0;
    nextB.disabled = cur === N;
    try { history.replaceState(null, '', '#p' + cur); } catch (e) {}
    try { localStorage.setItem('karmika-page-lv', String(cur)); } catch (e) {}
  }
  function mount(i) {
    stage.textContent = '';
    var el = leaf(i);
    stage.appendChild(el);
    finish(el);
  }
  function show(i, instant) {
    i = Math.max(0, Math.min(N, i));
    if (i === cur && stage.firstChild) return;
    var old = stage.firstChild, dir = i > cur ? 1 : -1, el = leaf(i);
    cur = i;
    ui();
    if (!old || instant || reduce) { stage.textContent = ''; stage.appendChild(el); finish(el); return; }
    busy = true;
    var frames, target;
    el.style.zIndex = dir > 0 ? 1 : 3;
    old.style.zIndex = dir > 0 ? 3 : 1;
    stage.appendChild(el);
    finish(el);
    if (dir > 0) {
      target = old;
      frames = [{ transform: 'rotateY(0deg)', opacity: 1 }, { transform: 'rotateY(-100deg)', opacity: 0.2 }];
    } else {
      target = el;
      frames = [{ transform: 'rotateY(-100deg)', opacity: 0.2 }, { transform: 'rotateY(0deg)', opacity: 1 }];
    }
    var a = target.animate(frames, { duration: 650, easing: 'cubic-bezier(.45,.05,.25,1)', fill: 'both' });
    a.onfinish = a.oncancel = function () {
      if (old.parentNode) old.parentNode.removeChild(old);
      el.style.zIndex = '';
      try { a.cancel(); } catch (e) {}
      busy = false;
    };
  }
  function go(i) { if (!busy) show(i); }

  function anchorOf(i) {
    var p = pageList[i];
    if (!p) return { k: 'c' };
    if (p.kind === 'sec') return { k: 's', si: p.si, pi: p.pi };
    if (p.kind === 'toc') return { k: 't', w: p.which };
    return { k: 'c' };
  }
  function indexOfAnchor(a) {
    var best = 0;
    for (var i = 0; i < pageList.length; i++) {
      var p = pageList[i];
      if (a.k === 'c') return 0;
      if (a.k === 't' && p.kind === 'toc' && p.which === a.w) return i;
      if (a.k === 's' && p.kind === 'sec' && p.si === a.si && p.pi <= a.pi) best = i;
    }
    return best;
  }
  var rebuildTimer = null;
  function rebuild() {
    if (busy) { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 400); return; }
    var a = cur >= 0 ? anchorOf(cur) : null;
    build();
    if (a) { cur = indexOfAnchor(a); mount(cur); ui(); }
  }
  function rebuildSoon() { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 160); }
  window.addEventListener('resize', rebuildSoon);



  function openingSvg() {
    var wv = 'M-40 0 q10 -6 20 0' + new Array(19).join(' t20 0') + ' L340 300 L-40 300 Z';
    return '<svg viewBox="20 30 260 190" role="img" aria-label="O Olho Karmico se enche de karma e derrama uma lágrima">' +
      '<defs><linearGradient id="lqo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0bd"/><stop offset="1" stop-color="#f2b04a"/></linearGradient>' +
      '<clipPath id="evo"><polygon points="60,110 143,54 157,54 240,110 157,166 143,166"/></clipPath></defs>' +
      '<g clip-path="url(#evo)"><g transform="translate(0,172)"><animateTransform attributeName="transform" type="translate" values="0 172;0 60" dur="3s" fill="freeze" calcMode="spline" keySplines="0.35 0 0.2 1"/>' +
      '<g><animateTransform attributeName="transform" type="translate" values="-40 0;0 0" dur="2.2s" repeatCount="indefinite"/><path fill="url(#lqo)" d="' + wv + '"/></g></g></g>' +
      '<g fill="none" stroke="#d9a24f" stroke-width="14" stroke-linecap="butt" stroke-linejoin="bevel"><path d="M144 40 L40 110 L144 180"/><path d="M40 40 L40 180"/><path d="M156 40 L260 110 L156 180"/><path d="M260 40 L260 180"/></g>' +
      '<polygon points="150,94 166,110 150,126 134,110" fill="#0b0810" stroke="#f2b04a" stroke-width="3"><animate attributeName="stroke-width" values="3;9;3" begin="3s" dur="0.7s"/></polygon>' +
      '<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;1" begin="3.3s" dur="2s" fill="freeze"/>' +
      '<animateTransform attributeName="transform" type="translate" values="150 176;150 176;150 214" keyTimes="0;0.42;1" calcMode="spline" keySplines="0 0 1 1;0.55 0 1 0.45" begin="3.3s" dur="2s" fill="freeze"/>' +
      '<g><animateTransform attributeName="transform" type="scale" values="0;1;1" keyTimes="0;0.42;1" begin="3.3s" dur="2s" fill="freeze"/>' +
      '<circle r="13" fill="#ffe9ad" opacity="0.25"/><path d="M0 -11 C7 -2 8 6 0 8 C-8 6 -7 -2 0 -11 Z" fill="url(#lqo)"/></g></g>' +
      '<ellipse cx="150" cy="214" rx="2" ry="1" fill="none" stroke="#ffe9ad" stroke-width="1.4" opacity="0"><animate attributeName="rx" values="2;48" begin="5.2s" dur="1.1s" fill="freeze"/><animate attributeName="ry" values="1;9" begin="5.2s" dur="1.1s" fill="freeze"/><animate attributeName="opacity" values="0.9;0" begin="5.2s" dur="1.1s" fill="freeze"/></ellipse>' +
      '</svg>';
  }
  var unlocking = false;
  function unlockStrap(st, then) {
    if (unlocking) return;
    unlocking = true;
    if (reduce) { unlocking = false; then(); return; }
    st.classList.add('unlock');
    setTimeout(function () { st.classList.add('open'); }, 650);
    setTimeout(function () { unlocking = false; then(); }, 1750);
  }
  var opening = false;
  function playOpening(target) {
    if (opening) return;
    if (reduce) { go(target); return; }
    opening = true;
    var ov = document.createElement('div');
    ov.className = 'opening';
    ov.innerHTML = openingSvg() + '<p class="cap">Karma piepildās. Acs raud.</p><span class="skip">pieskaries, lai izlaistu</span>';
    book.appendChild(ov);
    var done = false;
    function end() {
      if (done) return; done = true;
      ov.classList.add('out');
      go(target);
      setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); opening = false; }, 850);
    }
    ov.addEventListener('click', end);
    setTimeout(end, 6600);
  }

  /* ---------- download em Markdown ---------- */
  var DL = null;
  function inl(n) {
    var out = '';
    n.childNodes.forEach(function (c) {
      if (c.nodeType === 3) { out += c.textContent; return; }
      if (c.nodeType !== 1) return;
      var t = c.tagName;
      if (c.classList && c.classList.contains('tag')) { out += ' [' + c.textContent.trim() + ']'; return; }
      if (t === 'SVG' || t === 'svg') return;
      var x = inl(c);
      if (t === 'B' || t === 'STRONG') out += '**' + x + '**';
      else if (t === 'EM' || t === 'I') out += '*' + x + '*';
      else out += x;
    });
    return out.replace(/\s+\n/g, '\n').replace(/[ \t]{2,}/g, ' ');
  }
  function blk(el) {
    var t = el.tagName, c = el.className || '';
    if (/secmark/.test(c) || /figwrap/.test(c) || t === 'svg') return '';
    if (t === 'H3') return '### ' + inl(el).trim() + '\n\n';
    if (t === 'P') return inl(el).trim() + '\n\n';
    if (t === 'UL') return Array.prototype.map.call(el.children, function (li) { return '- ' + inl(li).trim(); }).join('\n') + '\n\n';
    if (/tw/.test(c) && el.querySelector('table')) {
      var heads = Array.prototype.map.call(el.querySelectorAll('thead th'), function (h) { return inl(h).trim() || ' '; });
      var rows = Array.prototype.map.call(el.querySelectorAll('tbody tr'), function (r) {
        return '| ' + Array.prototype.map.call(r.children, function (d) { return inl(d).trim().replace(/\|/g, '/'); }).join(' | ') + ' |';
      });
      return '| ' + heads.join(' | ') + ' |\n|' + heads.map(function () { return ' --- |'; }).join('') + '\n' + rows.join('\n') + '\n\n';
    }
    return inl(el).trim() ? inl(el).trim() + '\n\n' : '';
  }
  function toMarkdown() {
    var out = '# Karmikas Bībele · Season I\n\n*Season I · Hronikas, Ormund Salveth, Lielās bibliotēkas hronists.*\n\nDokuments izveidots no grāmatas tiešsaistes versijas.\n\n';
    sections.forEach(function (sec) {
      if (sec.eyebrow) {
        var sub = /subtitle">(.*?)<\/h3>/.exec(sec.head);
        out += '\n## ' + (sec.eyebrow === sec.title ? '' : sec.eyebrow + ' — ') + sec.title + '\n\n' + (sub ? '*' + sub[1] + '*\n\n' : '');
      } else if (sec.toc) out += '\n## ' + sec.toc + '\n\n';
      sec.blocks.forEach(function (b) {
        var d = document.createElement('div'); d.innerHTML = b;
        Array.prototype.forEach.call(d.children, function (el) { out += blk(el); });
      });
    });
    return out.replace(/\n{3,}/g, '\n\n').trim() + '\n';
  }
  function offerDownload(kind) {
    if (!DL) return;
    if (kind === 'html' && SNAP) DL.save({ filename: 'karmikas-bibele-season-1.html', data: SNAP }).catch(function () {});
    else DL.save({ filename: 'karmikas-bibele-season-1.md', data: toMarkdown() }).catch(function () {});
  }
  if (window.claude && claude.use) {
    claude.use('downloads').then(function (d) { if (d) { DL = d; rebuildSoon(); } }).catch(function () {});
  }
  book.addEventListener('click', function (e) {
    var st = e.target.closest('.strap');
    if (st) { e.preventDefault(); e.stopPropagation(); unlockStrap(st, function () { playOpening(tocStart[1]); }); return; }
    var dl = e.target.closest('[data-dl]');
    if (dl) { e.preventDefault(); offerDownload(dl.getAttribute('data-dl')); return; }
    var t = e.target.closest('[data-go]');
    if (t) { e.preventDefault(); go(parseInt(t.getAttribute('data-go'), 10)); }
  });
  prevB.addEventListener('click', function () { go(cur - 1); });
  nextB.addEventListener('click', function () { go(cur + 1); });
  tocB.addEventListener('click', function () { go(tocStart[(pageList[cur] && pageList[cur].tp) || 1]); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(N);
  });
  var sx = null, sy = null;
  book.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  book.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? cur + 1 : cur - 1);
  }, { passive: true });
  window.addEventListener('hashchange', function () {
    var m = /^#p(\d+)$/.exec(location.hash);
    if (m) go(parseInt(m[1], 10));
  });

  build();
  var start = 0, mm = /^#p(\d+)$/.exec(location.hash || '');
  if (mm) start = parseInt(mm[1], 10);
  else { try { var sv = parseInt(localStorage.getItem('karmika-page-lv'), 10); if (sv >= 0 && sv <= N) start = sv; } catch (e) {} }
  show(start, true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(rebuildSoon);
})();
