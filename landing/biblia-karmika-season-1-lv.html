<title>Karmikas Bībele · Season I</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: um livro de uma página por vez, com moldura gravada, virada de página e sumário clicável */
:root {
  --bg: #08060d;
  --bg-2: #120c1c;
  --page: #15101e;
  --page-2: #1b1427;
  --ink: #eadfca;
  --muted: #a89a84;
  --gold: #d9a24f;
  --gold-lo: #7d5a2c;
  --violet: #8f7bff;
  --blood: #b3202f;
  --font-display: "Cinzel Decorative", "Cinzel", Georgia, serif;
  --font-label: "Cinzel", Georgia, serif;
  --font-body: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 40%, rgba(8,6,13,0) 30%, rgba(8,6,13,0.85) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='80' viewBox='0 0 120 80' fill='none' stroke='%23d9a24f' stroke-width='1.3' stroke-linejoin='bevel' opacity='0.16'><g id='e'><path d='M24 10 L14 20 L24 30 M14 10 V30 M36 10 L46 20 L36 30 M46 10 V30'/><path d='M30 16 L34 20 L30 24 L26 20Z' fill='%23d9a24f'/></g><use href='%23e' x='60' y='40'/></svg>");
  background-size: cover, 120px 80px;
  color: var(--ink);
  font-family: var(--font-body);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
.app { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
:root { --bw: min(100%, calc((100vh - 92px) * .8)); }
@supports (height: 100dvh) { :root { --bw: min(100%, calc((100dvh - 92px) * .8)); } }
.book { position: relative; flex: 1 1 auto; min-height: 0; width: var(--bw); container-type: inline-size; }
.stage { position: absolute; inset: 0; perspective: 2200px; }
.leaf {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, var(--page-2), var(--page) 55%);
  border: 1px solid var(--gold-lo);
  border-radius: 4px 10px 10px 4px;
  box-shadow: 0 18px 50px rgba(0,0,0,.65), inset 0 0 60px rgba(0,0,0,.45), -6px 0 0 -2px #0d0915, -10px 0 0 -4px #0a0710;
  transform-origin: left center;
  backface-visibility: hidden;
  overflow: hidden;
}
.leaf::before { /* moldura interna dupla */
  content: ""; position: absolute; inset: 8px; border: 1px solid var(--gold); opacity: .55; border-radius: 2px; pointer-events: none;
}
.leaf::after {
  content: ""; position: absolute; inset: 13px; border: 1px dotted var(--gold-lo); pointer-events: none;
}
.side {
  position: absolute; top: 34px; bottom: 46px; width: 28px; z-index: 1;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='96' viewBox='0 0 28 96' fill='none' stroke='%23d9a24f' stroke-width='1.4' stroke-linejoin='round'><path d='M4 14 L14 7 L24 14 L14 21 Z'/><path d='M14 11 L17 14 L14 17 L11 14Z' fill='%23d9a24f'/><path d='M8 36 H20 L14 48 L20 60 H8 L14 48 Z'/><path d='M14 72 C18 78 19 83 14 86 C9 83 10 78 14 72Z'/></svg>") center top / 28px 96px repeat-y;
  opacity: .7; pointer-events: none;
}
.side.l { left: 16px; } .side.r { right: 16px; }
.base {
  position: absolute; left: 50px; right: 50px; bottom: 16px; height: 28px; z-index: 1;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='28' viewBox='0 0 96 28' fill='none' stroke='%23d9a24f' stroke-width='1.4' stroke-linejoin='round'><path d='M4 14 L14 7 L24 14 L14 21 Z'/><path d='M14 11 L17 14 L14 17 L11 14Z' fill='%23d9a24f'/><path d='M42 6 H54 L48 14 L54 22 H42 L48 14Z'/><path d='M82 6 C86 11 87 16 82 20 C77 16 78 11 82 6Z'/></svg>") left center / 96px 28px repeat-x;
  opacity: .55; pointer-events: none;
}
.corner { position: absolute; width: 38px; height: 38px; z-index: 2; pointer-events: none;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='38' height='38' viewBox='0 0 38 38' fill='none' stroke='%23d9a24f' stroke-width='1.6'><path d='M3 36 V12 Q3 3 12 3 H36'/><path d='M9 9 L14 14 L9 19 L4 14Z' fill='%23d9a24f' stroke='none'/></svg>") no-repeat; }
.corner.tl { top: 5px; left: 5px; }
.corner.tr { top: 5px; right: 5px; transform: scaleX(-1); }
.corner.bl { bottom: 5px; left: 5px; transform: scaleY(-1); }
.corner.br { bottom: 5px; right: 5px; transform: scale(-1,-1); }
.inner {
  position: absolute; inset: 78px 52px 56px 52px; overflow-y: auto; z-index: 3; display: flex; flex-direction: column;
  font-size: clamp(1.05rem, 2.9cqi, 1.5rem); line-height: 1.46; padding: 4px 6px 4px 2px;
  scrollbar-width: thin; scrollbar-color: var(--gold-lo) transparent;
}
.inner > :first-child, .inner > div > :first-child { margin-top: 0; }
.inner p { margin: 0 0 .8em; text-wrap: pretty; hyphens: auto; }
.inner b, .inner strong { color: #f3e2bd; font-weight: 600; }
.inner em { color: #d8c8a6; }
.eyebrow { text-indent: .32em; font-family: var(--font-label); font-size: .63em; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); margin: 0 0 .4em; text-align: center; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.45em; line-height: 1.15; text-align: center; margin: 0 0 .2em; color: #f6e4bb; text-wrap: balance; text-shadow: 0 0 18px rgba(217,162,79,.25); }
h3 { clear: both; text-indent: .16em; font-family: var(--font-label); font-weight: 600; font-size: .84em; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 1.2em 0 .6em; text-align: center; text-wrap: balance; }
h3.subtitle { clear: none; margin: .2em 0 0; font-size: .87em; text-shadow: 0 0 14px rgba(217,162,79,.35); }
h3.subtitle + .rule { margin-bottom: 1.6em; }
.rule { display: block; margin: .5em auto 1.1em; width: 70%; height: 14px; }
.initial {
  float: left; width: 1.55em; height: 1.55em; margin: .1em .45em .04em 0; font-size: 2.9em; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; text-indent: 0; hyphens: none;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23f6dc8e'/><stop offset='.5' stop-color='%23d9a24f'/><stop offset='1' stop-color='%238a5a1f'/></linearGradient><g id='c' fill='none' stroke='url(%23g)' stroke-width='1.6' stroke-linecap='round'><path d='M13 36 C11 21 19 13 31 13 C38 13 39 20 34 22 C30 23 28 19 31 17'/><path d='M13 26 C17 26 20 29 20 33'/><path d='M22 13 C26 17 26 21 23 24'/><circle cx='31' cy='17' r='1.8' fill='%23c4342f' stroke='none'/></g></defs><rect width='100' height='100' fill='%23290c2c'/><path d='M0 0 L100 100 M100 0 L0 100 M50 0 L100 50 L50 100 L0 50Z' stroke='%23d9a24f' stroke-opacity='.16' fill='none'/><rect x='4' y='4' width='92' height='92' fill='none' stroke='url(%23g)' stroke-width='3'/><rect x='9' y='9' width='82' height='82' fill='none' stroke='url(%23g)' stroke-width='1'/><use href='%23c'/><use href='%23c' transform='translate(100 0) scale(-1 1)'/><use href='%23c' transform='translate(0 100) scale(1 -1)'/><use href='%23c' transform='translate(100 100) scale(-1 -1)'/><path d='M50 5 L55 10 L50 15 L45 10Z M50 85 L55 90 L50 95 L45 90Z M5 50 L10 45 L15 50 L10 55Z M85 50 L90 45 L95 50 L90 55Z' fill='url(%23g)'/></svg>") center / 100% 100% no-repeat;
  box-shadow: 0 0 18px rgba(217,162,79,.28), 0 2px 8px rgba(0,0,0,.6); border-radius: 2px;
  background-color: #290c2c;
  color: transparent;
  position: relative;
}
.initial::before {
  content: attr(data-l); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 1.12em; transform: translate(calc(var(--dx, 0) * 1em), calc(var(--dy, 0) * 1em)); background: linear-gradient(180deg, #fff3c6 0%, #e6b459 45%, #9a6422 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 1px 0 rgba(0,0,0,.75)) drop-shadow(0 0 4px rgba(217,162,79,.45));
}
.folio { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; z-index: 4; pointer-events: none; }
.folio span { display: inline-block; background: var(--page); padding: 1px 22px; font-family: var(--font-label); font-size: .78rem; letter-spacing: .24em; color: var(--gold); }
.ribbon {
  position: absolute; top: -2px; right: 52px; z-index: 5; width: clamp(34px, 5.2cqi, 48px); height: clamp(70px, 10.5cqi, 100px); border: 0; padding: 0; cursor: pointer;
  background: linear-gradient(#a3202f, #6e1420); clip-path: polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);
  transition: height .2s;
}
.ribbon:hover, .ribbon:focus-visible { height: clamp(82px, 12.5cqi, 116px); outline: none; }
.ribbon:focus-visible { filter: drop-shadow(0 0 4px var(--gold)); }

/* capa */
.cover .inner { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .4rem; overflow-y: auto; }
.cover .title { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 7vw, 3.1rem); line-height: 1.05; color: #f6e4bb; text-shadow: 0 0 26px rgba(217,162,79,.4); margin: .1em 0 0; }
.cover .sub { font-family: var(--font-label); letter-spacing: .3em; font-size: .78rem; text-transform: uppercase; color: var(--gold); margin: 0; }
.cover .ep { margin: .35em 0 .25em; display: flex; flex-direction: column; align-items: center; gap: .2em; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.05rem, 3.6vw, 1.55rem); letter-spacing: .08em; color: #f3dfae; text-shadow: 0 0 18px rgba(217,162,79,.45); }
.cover .ep span { font-family: var(--font-label); font-size: .5em; letter-spacing: .42em; text-transform: uppercase; color: var(--gold); padding: 0 .2em .1em; border-bottom: 1px solid var(--gold-lo); }
.cover .by { font-style: italic; color: var(--muted); margin: .6em 0 0; font-size: 1.15rem; }
.cover svg.sigil { width: min(78%, 330px); height: auto; filter: drop-shadow(0 0 16px rgba(217,162,79,.35)); }
.open-btn, .nav button, .nav .toc-btn {
  font-family: var(--font-label); letter-spacing: .2em; text-transform: uppercase; font-size: .78rem; cursor: pointer;
  color: var(--ink); background: transparent; border: 1px solid var(--gold-lo); padding: 10px 18px; border-radius: 2px;
}
.open-btn { margin-top: 1rem; border-color: var(--gold); color: #f6e4bb; }
.open-btn:hover, .nav button:hover:not(:disabled) { background: rgba(217,162,79,.14); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* sumário */
.toc { list-style: none; margin: 0; padding: 0; }
.toc li { margin: 0; }
.toc a { display: flex; align-items: baseline; gap: .5rem; padding: .32em 0; color: var(--ink); text-decoration: none; font-size: 1.15rem; cursor: pointer; }
.toc a .dots { flex: 1; border-bottom: 1px dotted var(--gold-lo); transform: translateY(-4px); min-width: 12px; }
.toc a .n { font-family: var(--font-label); font-size: .85rem; color: var(--gold); letter-spacing: .1em; }
.toc a:hover { color: #fff1cf; }
.toc a:hover .dots { border-color: var(--gold); }
.toc .lv { font-family: var(--font-label); font-size: .68rem; letter-spacing: .26em; color: var(--gold); text-transform: uppercase; margin-right: .2rem; }

/* detalhes de conteúdo */
.colors { list-style: none; padding: 0; margin: .6em 0 1em; display: grid; gap: .5em; }
.colors li { display: flex; align-items: center; gap: .8em; }
.sw { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); }
.fig { display: block; margin: .6em auto 1em; width: min(60%, 210px); height: auto; }
blockquote { margin: .8em 0; padding: .2em 0 .2em 1em; border-left: 2px solid var(--gold-lo); font-style: italic; color: #d8c8a6; }
ul.plain { margin: .3em 0 1em; padding-left: 1.15em; }
ul.plain li { margin: 0 0 .45em; }
.seal { text-align: center; font-style: italic; color: var(--muted); margin-top: 1em; }


.inner > div { flex: none; }
.endorn { margin-top: auto; padding-top: 18px; flex: none; text-align: center; }
.endorn svg { width: min(78%, 300px); height: 38px; display: block; margin: 0 auto; }

.toc-row { display: flex; align-items: baseline; gap: .5rem; padding: .3em 0; color: var(--ink); text-decoration: none; font-size: 1.12rem; cursor: pointer; }
.toc-row .lv { font-family: var(--font-label); font-size: .68rem; letter-spacing: .26em; color: var(--gold); text-transform: uppercase; min-width: 2.2em; }
.toc-row .dots { flex: 1; border-bottom: 1px dotted var(--gold-lo); transform: translateY(-4px); min-width: 12px; }
.toc-row .n { font-family: var(--font-label); font-size: .85rem; color: var(--gold); letter-spacing: .1em; }
.toc-row:hover { color: #fff1cf; }
.toc-row:hover .dots { border-color: var(--gold); }
.figwrap { text-align: center; margin: .5em 0 .8em; }
.secmark { margin: 1.6em 0 .2em; }
.secmark .rule { margin: 0 auto; }
.inner > div > .secmark:first-child { display: none; }
.figwrap { --u: min(.95px, .13cqi); margin: .9em 0 1em; }
.figwrap svg { width: auto; max-width: 100%; }
.figwrap svg.hour { height: calc(var(--u) * 410); display: block; margin: 0 auto; }
.figwrap svg.eye { display: block; margin: 0 auto; }
.figwrap svg.eye { height: calc(var(--u) * 160); }
.figwrap svg.eye.tear { height: calc(var(--u) * 255); }
/* manual: etiquetas e tabelas */
.tag { display: inline-block; font-family: var(--font-label); font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; padding: 1px 6px; border: 1px solid; border-radius: 2px; vertical-align: .12em; white-space: nowrap; font-style: normal; }
.tag.d { color: var(--gold); border-color: var(--gold-lo); }
.tag.p { color: #b9acff; border-color: #6a5db5; }
.tag.o { color: #f08a9a; border-color: #8c3a4a; }
.tw { overflow-x: auto; margin: .4em 0 1em; }
table { border-collapse: collapse; width: 100%; font-size: .98rem; line-height: 1.3; }
th { font-family: var(--font-label); font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); text-align: left; font-weight: 400; padding: 4px 8px 6px 0; border-bottom: 1px solid var(--gold-lo); }
td { padding: 6px 8px 6px 0; border-bottom: 1px dotted rgba(125,90,44,.6); vertical-align: top; }
.part-note { text-align: center; font-style: italic; color: var(--muted); }
.legend { display: grid; gap: .5em; margin: 1em 0; }
.legend div { display: flex; gap: .7em; align-items: baseline; }
.toc-part { font-family: var(--font-label); font-size: .74rem; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); margin: 1em 0 .2em; text-align: center; }
.toc-link { display: block; text-align: center; margin-top: 1.2em; color: var(--gold); font-family: var(--font-label); font-size: .78rem; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; text-decoration: none; }

/* barra de navegação */
.nav { flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; width: var(--bw); }
.nav .count { font-family: var(--font-label); letter-spacing: .2em; font-size: .8rem; color: var(--muted); min-width: 92px; text-align: center; }
.nav button:disabled { opacity: .35; cursor: default; }

@media (max-width: 520px) {
  .initial { font-size: 2.6em; }
  .inner { inset: 62px 40px 52px 40px; font-size: 1.04rem; line-height: 1.4; }
  .side { width: 22px; } .side.l { left: 14px; } .side.r { right: 14px; }
  .side { background-size: 22px 76px; }
  .base { left: 40px; right: 40px; }
  h2 { font-size: 1.35em; }
  .ribbon { right: 40px; }
  .nav { flex-wrap: nowrap; gap: 6px; }
  .nav button, .open-btn { padding: 9px 9px; letter-spacing: .06em; font-size: .72rem; white-space: nowrap; }
  .nav .count { min-width: 58px; letter-spacing: .08em; font-size: .72rem; }
}


.strap { position: absolute; left: -4px; right: -4px; bottom: 7%; height: 84px; z-index: 8; padding: 0; border: 0; background: none; cursor: pointer; display: block; }
.strap .band { position: absolute; top: 12px; bottom: 12px; width: 50.2%; transition: transform .9s cubic-bezier(.5,0,.3,1);
  background: linear-gradient(180deg, #6a4023 0%, #4a2a17 40%, #34200f 100%);
  box-shadow: inset 0 2px 0 rgba(255,214,150,.18), inset 0 -3px 0 rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.6); }
.strap .band::before, .strap .band::after { content: ""; position: absolute; left: 6px; right: 6px; height: 0; border-top: 2px dashed rgba(236,196,130,.55); }
.strap .band::before { top: 8px; } .strap .band::after { bottom: 8px; }
.strap .band.l { left: 0; border-radius: 0 3px 3px 0; } .strap .band.r { right: 0; border-radius: 3px 0 0 3px; }
.strap .lock { position: absolute; left: 50%; top: 50%; width: 88px; height: 117px; margin: -64px 0 0 -44px; overflow: visible; z-index: 2;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.7)); transition: transform .25s, filter .25s; animation: lockGlow 4.5s ease-in-out infinite; }
.strap:hover .lock, .strap:focus-visible .lock { transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(255,207,122,.9)) drop-shadow(0 4px 6px rgba(0,0,0,.7)); }
.strap .shackle { transform-origin: 62px 56px; transition: transform .5s cubic-bezier(.3,1.4,.5,1); }
@keyframes lockGlow { 0%, 70%, 100% { filter: drop-shadow(0 4px 6px rgba(0,0,0,.7)); } 85% { filter: drop-shadow(0 0 12px rgba(255,207,122,.95)) drop-shadow(0 4px 6px rgba(0,0,0,.7)); } }
.strap.unlock .lock { animation: none; }
.strap.unlock .shackle { transform: translateY(-14px) rotate(-26deg); }
.strap .runes { animation: lockRune 3.2s ease-in-out infinite; filter: drop-shadow(0 0 3px #8f7bff); }
@keyframes lockRune { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.strap.unlock .runes { animation: none; opacity: 1; stroke: #fff1bd; filter: drop-shadow(0 0 5px #ffcf7a); }
.strap.unlock .keyhole { fill: #fff1bd; }
.strap.open .lock { transition: transform .9s cubic-bezier(.5,0,1,.6), opacity .9s; transform: translateY(160px) rotate(35deg); opacity: 0; }
.strap.open .band.l { transform: translateX(-102%); } .strap.open .band.r { transform: translateX(102%); }
.strap:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
.strap.unlock .hint { opacity: 0; transition: opacity .3s; }
.strap .hint { position: absolute; left: 0; right: 0; top: -44px; text-align: center; font-family: var(--font-label); font-size: .64rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); opacity: .8; }
@media (max-width: 520px) { .strap { height: 62px; } .strap .lock { width: 66px; height: 88px; margin: -50px 0 0 -33px; } }
@media (prefers-reduced-motion: reduce) { .strap .lock, .strap .band, .strap .shackle { transition: none; animation: none; } }
@keyframes runeGlow { 0%, 60%, 100% { opacity: .62; filter: none; } 72% { opacity: 1; filter: drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 12px rgba(217,162,79,.85)); } 86% { opacity: .8; filter: drop-shadow(0 0 3px rgba(217,162,79,.5)); } }
@keyframes runeGlowB { 0%, 55%, 100% { opacity: .5; filter: none; } 68% { opacity: .95; filter: drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 12px rgba(217,162,79,.85)); } 82% { opacity: .7; filter: drop-shadow(0 0 3px rgba(217,162,79,.5)); } }
@keyframes runeDrift { 0%, 100% { background-position: 0 0; } 50% { background-position: 0 7px; } }
@keyframes runeDriftB { 0%, 100% { background-position: 0 0; } 50% { background-position: 8px 0; } }
@keyframes leafGlow { 0%, 62%, 100% { border-color: var(--gold-lo); } 74% { border-color: var(--gold); } }
.side { animation: runeGlow 11s ease-in-out infinite, runeDrift 7s ease-in-out infinite; }
.side.r { animation-delay: 3.6s, -2.5s; }
.base { animation: runeGlowB 13s ease-in-out infinite 1.8s, runeDriftB 9s ease-in-out infinite; }

    '<p>Paši vecākie stāsta, ka bija laiks pirms visiem laikiem un ka tas nebija ne tumšs, ne gaišs, jo nebija neviena, kas saskatītu atšķirību.</p>' +
    '<p>Nebija ceļa, jo nebija soļa. Nebija soļa, jo neviens nebija gājis. Un nebija apstāšanās, jo neviens nebija kustējies, lai pārstātu kustēties. Bija tikai <b>Pirms</b>: vesels noslēpums bez virziena, bez steigas un bez mērķa.</p>' +
    '<p>Tieši Pirms iekšienē Marghar iedomājās. Viņš vēl neko nedarīja. Viņš tikai iedomājās par iešanu. Un ar to pietika: doma atvēra telpu, lai kāds vai kaut kas varētu iet.</p>' });
  add({ lv: 'I', body:
    '<h3>Par Badu, kas arī gribēja iet</h3>' +
    '<p>Bet Marghar domu sadzirdēja ne tikai tie, kas to bija pelnījuši. Pirms iekšienē bija kaut kas, kas nekad nebija bijis nekas cits kā kāre. Tas bija ieslodzīts kā trakulīgs suns, kas redz medījumu žoga otrā pusē; kā vilkacis, kas saož smaržu, bet neatrod taku; kā vampīrs, kas ož asinis, bet neatrod durvis. Gribēt, bet bez ceļa, pa kuru gribēt. Tie, kas to ienīst, tie, kas to pielūdz, un tie, kas no tā baidās, sauc to par <b>Ahzur, Bezsoli</b>. Tā īsto vārdu nezina neviens.</p>' +
    '<p>Kad Marghar iedomājās par iešanu, arī Ahzur kāre izrāvās brīvībā. Labais kļuva brīvs iezīmēt savu virzienu. Bet ļaunais tajā pašā mirklī ieguva ceļu, pa kuru sasniegt savu ļaunumu: taisnu, ātru un visiem atvērtu ceļu. Un šī taisnā ceļa galā stāvēja tie, kas vēl neprata iet.</p>' });
  add({ lv: 'I', body:
    '<h3>Par labirintu</h3>' +
    '<p>Marghar redzēja. Viņš netiesāja, neuzvarēja, neieslodzīja, jo neko no tā viņš nedara. Bet viņš redzēja un radīja <b>ceļus</b>, daudzskaitlī. Kur bija taisne, viņš izveidoja krustojumus; kur bija steiga, viņš izveidoja līkumus; kur bija vienas durvis, viņš izveidoja tūkstoš durvju. Katrs ceļš ir izvēle, un katra izvēle ir siena starp Ahzur un mums, gājējiem, kuri vēl neesam gatavi to satikt. Tāpēc ļaunais mūs atrod tik lēni.</p>' +
    '<p>Tātad ceļi nav tikai brīvība. Tie ir labirints, kurā mēs esam paslēpti. Ikviens, kurš staigā pa Karmiku, ir gājējs, un katru gājēju, vai viņš to zina vai nē, no Bada sargā siena, ko uzcēla Marghar.</p>' +
    '<h3>Par karmu</h3>' +
    '<p>Bet ir tādi, kas negrib slēpties. Daži vēlas, lai viņu ceļš krustotos ar Ahzur ceļu, un meklē to atklāti. Citi pavada dzīvi, palīdzot Marghar sajaukt ļaunuma būtību, novirzot to prom no negatavām dvēselēm. No šīs vēlmes, abās pusēs, dzima <b>karma</b>: smagums tiem, kas palīdz maldināt Badu, un smagums tiem, kas pasniedz sevi kā mielastu, baudot to, ka Bads viņus aprij.</p>' +
    '<p>Tāpēc karma nav sods. Tā ir cena par to, ka nostājies pretī tam, kas palika ieslodzīts Pirms, vai nu lai to slēptu, vai lai to barotu.</p>' });
  add({ lv: 'I', body:
    '<h3>Par Bada bērniem</h3>' +
    '<p>Piesardzīgākie priesteri saka, ka Ahzur nekad nav atrasts vesels un varbūt nekad netiks atrasts. Tas, ko dvēseles atrod, ir veidi, kā tas iemācījies iet: pakts, neprāts, pelni, viltus, mielasts, aizmirstība, puve, ķēde un nodevība. Tos tradīcija sauc par elles prinčiem, un par tiem es runāšu vēlāk.</p>' +
    '<h3>Par divu veidu dvēselēm</h3>' +
    '<p>Tie, kas tuvojas Badam, dalās divās tautās, kas gandrīz nekad nerunā viena ar otru. Ir <b>Novirzītāji</b>, kas dzīvo, lai novirzītu: tie auž viltus ceļus, sargā negatavos, notur labirintu stāvus. Un ir <b>Viesi</b>, kas piedāvā sevi mielastam: tie atver durvis, atstāj pēdas un rod baudu tajā, ka tiek aprīti. Abi maksā karmā, un Marghar abus redz vienādi.</p>' +
    '<p>Viņš nesaka, kuram no abiem ir taisnība. Saka, ka tad, kad viens no viņiem izdara kaut ko, ko labirints nebija paredzējis, Acs raud.</p>' });
  add({ lv: 'I', body:
    '<h3>Par ceļu un iešanu</h3>' +
    '<p>Ir kaut kas, ko senās hronikas atkārto un ko visa mūsu kultūra iemācījusies atkārtot līdzi: <b>ceļš un iešana tika radīti kopā</b>, Marghar acu priekšā. Ceļš nepastāvēja, pirms kāds pa to gāja, un gājējs nepastāvēja pirms ceļa. Tāpēc labais un ļaunais, kādus mēs tos pazīstam, dzima vienā mirklī un no viena žesta.</p>' +
    '<p>No tā izriet secinājums, pie kura nonāca priesteri, rakstveži un pat zagļi: dzīve ir mācīšanās. Mācīties izvairīties un palīdzēt izvairīties; vai mācīties atrast un palīdzēt atrast.</p>' +
    '<h3>Par ironiju</h3>' +
    '<p>Un te slēpjas ironija, ko tempļu meistari labprātāk nepaskaidro. Atrast nav labi, un izvairīties nav slikti. Tā ir karma, ko nes pati karma: mēs tiecamies pēc labā, izvairoties no ļaunā, un darām ļaunu, vienkārši atrodot ļauno.</p>' +
    '<p>Tas šķiet netaisnīgi, un varbūt tā arī ir. Bet ceļus veido tie, kas iet, un neviens neiet, neatstājot aiz sevis zemi.</p>' });
  add({ lv: 'I', body:
    '<p>Ja tev prasīs likumu vienā teikumā, tas ir vecākais, ko zinu: <b>kas iesēts, tas tiks atdots</b>. Zemnieki to sauc par sēju; priesteri par karmu; tehnokrāti par varbūtību; ticīgie par apgādību; un zagļi par veiksmi, līdz dienai, kad viņi pārstāj smaidīt.</p>' +
    '<h3>Par Aci</h3>' +
    '<p>Marghar nav sejas, ko kāds varētu aprakstīt, bet viņam ir simbols, un šis simbols ir acs. Iedomājies divus K, kas pagriezti viens pret otru un starp sevi veido rombu. Tā ir <b>Karmiskā Acs</b>, un nejauc to ar priekšmetu: tas ir pats karmas dabiskais likums, kurā valda Marghar.</p>' +
    '<p>Kamēr dvēsele dzīvo, Acs to pavada, un katra izvēle, katrs spriedums, katrs pakts, katrs žēlsirdības vai cietsirdības žests iekrīt tajā. Tas, kas iekrīt Acī, ir <b>šķidrs</b>, jo tam vēl tiek pievienots. Dzīvā karma vēl var augt, tikt novirzīta, tikt apmainīta pret citu. Nekas nav aizzīmogots, kamēr cilvēks elpo.</p>' +
    '<p>Iesētā karma ir šķidra, jo tā, tāpat kā ūdens, mainās. Un tāpat kā šķidrums pieņem trauka formu, karma veidojas un pārvēršas atbilstoši gājējam, kas to nes: viens un tas pats darbs vienā dvēselē sver tā, bet citā citādi.</p>' +
    '<p>Būs, kas jautās, vai Acs tiesā. Tā netiesā, tā redz. Un to, ko redz, tā glabā.</p>' +
    '<h3>Hronista piezīmes</h3><p class="fnote"><span class="nb">✎</span>Vecie saka “laiks pirms visiem laikiem”. Orvalen tajos fragmentos, kas no viņa palikuši, raksta citādi: “arī Pirms bija savs pirms, un tieši no turienes viņš atnāca skatīties”. Par to neesmu atradis vairs ne rindiņas, un nezinu arī, kas ir šis “viņš”.</p><p class="fnote"><span class="nb">✎</span>Visā pasaulē Aci zīmē atvērtu. Es zinu tikai vienu vietu, kur tā ir aizvērta: melna akmens durvis bez roktura ar iekaltu aci ar nolaistiem plakstiņiem. Par tām es runāšu šajā sējumā vairāk nekā vienu reizi, jo vairāk nekā vienu reizi man par tām stāstīja.</p>'  });

  add({ toc: 'II grāmata — Dievi, kas iet pa ceļu', lv: 'II', eyebrow: 'II grāmata', title: 'Dievi, kas iet pa ceļu', start: true, body:
    '<p>Marghar valda, bet neiet. Iet citi, un katrs no viņiem izvēlējās ceļu un iet pa to kopš laikiem, kad vēl nebija neviena, kas sekotu. Tieši šos ceļus mirstīgie vēlāk sāka saukt par <b>Ceļiem</b>.</p>' +
    '<h3>Augstie dievi</h3>' +
    '<p><b>Auréon, Varenais</b>, debesu gaismas kungs, ir paladīnu dievs. Saka, ka viņa baznīca dzima no zvēresta: ka starp ļauno un neaizsargāto vienmēr stāvēs kāds. Viņa priesteri māca, ka gaisma nav tīrība, tā ir atbildība.</p>' +
    '<p><b>Odin, Visu Tēvs</b>, ir ziemeļu karotāju dievs. Viņš mīt tur, kur ir auksti, un tam, kas viņu meklē, jākāpj līdz ledainajiem apgabaliem. Viņš nesola ērtības, viņš sola visu mūžu, kas veltīts spēkam un godam.</p>' +
    '<p><b>Hemara, Sārtā Māte</b>, ir asiņu un vampīrisma valdniece. Kas ilgi dzird viņas vārdu, tas sāk just slāpes. Tradīcija vēsta, ka viņa nekad nevienu nav piespiedusi, viņa tikai gaidīja.</p>' });
  add({ lv: 'II', body:
    '<p><b>Selvar, Bara Tēvs</b>, ir vilkaču dievs. Viņa likums ir bara likums: kas ir iekšā, tas tiek sargāts līdz nāvei; kas ir ārā, tas ir vai nu medījums, vai sabiedrotais.</p>' +
    '<p><b>Arquelon, Arkānais Rakstvedis</b>, ir burvju dievs. Saka, ka viņš uzrakstīja pirmo varas vārdu un pavada mūžību, to labojot. Viņa mācekļi tic, ka zināšanas ir vienīgā žēlsirdība, kas nekad neizsīkst.</p>' +
    '<p><b>Mekhanos, Lielais Mehānisms</b>, ir tehnokrātu dievs. Viņam nepatīk, ka viņu sauc par dievu; viņš dod priekšroku vārdam “projekts”. Viņa ticīgie uzskata, ka pasaule ir mašīna, kas nemitīgi tiek pilnveidota, un ka to uzlabot nozīmē lūgt.</p>' +
    '<p><b>Aravel, Zaļā Nomoda</b>, ir dēmonu mednieku dievs. Viņa acs nekad neaizveras, un tie, kas viņam kalpo, dzīvo modrībā, vajājot to, kas slēpjas pasaules ēnās.</p>' });
  add({ lv: 'II', body:
    '<h3>Elles prinči</h3>' +
    '<p>Ceļa otrā malā stāv tie, kurus tradīcija sauc par prinčiem, nevis dieviem, jo viņi ir atkarīgi no tiem, kas viņu priekšā noliecas. Katrs ir <b>Ahzur šķautne</b>, veids, kā Pirms Bads iemācījies iet. Viņu ir deviņi, un ir tādi, kas saka, ka vēl ne visi.</p>' +
    '<p><b>Malgrath, Paktu kungs</b>, ir ragaņu patrons. Viņš nekad nemelo līgumā, un tieši tāpēc tie, kas to paraksta, nožēlo.</p>' +
    '<p><b>Vhaelor, Neprāta dēmonam</b>, nav sekotāju, viņam ir upuri. Viņš ir viens no lielajiem Karmikas pasauļu ienaidniekiem, un nogalināt kādu no viņa avatāriem ir varoņdarbs, kas pelnījis dziesmu pat vampīram.</p>' +
    '<p><b>Orrukh, Pelnu Rijējs</b>, parādās, kad daudzas dvēseles kopā kļūst smagas. Saka, ka viņš barojas ar pazudušo pilsētu kopējo karmu.</p>' });
  add({ lv: 'II', body:
    '<p><b>Sythra, Čuksta balss</b>, staigā pa vārdiem. Viņa nemelo: viņa izvēlas, ko teikt, un katram apsola tieši to, ko tas jau gribēja dzirdēt.</p>' +
    '<p><b>Gorvak, Bezgalīgais Mielasts</b>, ir šķautne, kas vistuvākā tīrajam Badam. Viņš neko neprasa; viņš tikai klāj galdu. Viņš ir Viesu patrons, to, kas piedāvā sevi baudai tikt aprītiem.</p>' +
    '<p><b>Nyxael, Nakts bez Atbalsīm</b>, staigā pa aizmirstību. Viņa izdzēš vārdus, sejas un parādus no to atmiņas, kas cieš, bet no Acs nekas netiek izdzēsts.</p>' });
  add({ lv: 'II', body:
    '<p><b>Zerath, Puves karalis</b>, staigā pa to, kas pūst lēnām: slimību, postu, pilsētām, kas sapūst no iekšpuses, pirms sabrūk.</p>' +
    '<p><b>Ishkara, Važu Dāma</b>, staigā pa varu. Viņa ir pakļāvēju patrone, to, kas citus padara par zemi zem savām kājām.</p>' +
    '<p><b>Morvek, Zvērestu Lauzējs</b>, staigā pa nodevību. Saka, ka viņš gaida blakus katram zvērestam un ka kritušie paladīni viņu pazīst vārdā.</p>' });
  add({ lv: 'II', body:
    '<h3>Ceļa Esences</h3>' +
    '<p>Ja prinči ir Bada šķautnes, tad pretējai pusei prinču nav. Tai ir <b>Esences</b>: būtnes, kas valdīšanas vietā palīdzēja. Tās neprasa ne saliektu ceļgalu, ne zvērestu. Tradīcija tās iedala trīs amatos.</p>' +
    '<p><b>Tās, kas atšķetināja labirintu.</b> <b>Ilmara, Soļu Kartogrāfe</b>, pirmā kartēja ceļu soli pa solim. <b>Orvalen, Pēdu Lasītājs</b>, iemācījās zemē izlasīt, kur Ahzur jau bija gājis. <b>Sael, Tā, kas atgriezās</b>, ir vienīgā dvēsele, kas, kā saka, sasniedza labirinta centru un atgriezās, lai pastāstītu.</p>' });
  add({ lv: 'II', body:
    '<p><b>Arhitekti.</b> Viņi būvē un labo karmiskos ceļus. <b>Brannor, Ceļu Mūrnieks</b>, liek akmeņus tur, kur ceļš paveras. <b>Lythaen, Tiltu Audēja</b>, sašuj ceļus, kas plīst. <b>Dhurgan, Dzīslu Lāpītājs</b>, ir kalējs, kas salabo to, ko laiks un Bads saēd.</p>' +
    '<p><b>Aizvērēji.</b> Viņi aizver ceļus, kad princis, Ahzur šķautne, ir gandrīz klāt. <b>Caldris, Durvju Aizzīmogotājs</b>. <b>Merith, Pēdējās Durvis</b>. <b>Aldun, Sliekšņa Sargs</b>.</p>' +
    '<p>Neviena Esence neuzvar Ahzur. Aizvērt nozīmē atlikt, un salabot nozīmē iegūt laiku. Bet saka, ka tieši viņu dēļ labirints joprojām stāv.</p>' +
    '<p>Tieši tāpēc Esences tiek medītas. Tāpat kā gājēji paveic brīnišķīgus varoņdarbus, izraidot no pasaules, kaut vai uz īsu brīdi, kādu ļaunu princi, tā gājēji Ahzur karmiskajā pusē alkst nogalināt Esenci, lai paveiktu savējo. Kas nogalina Arhitektu, tas izsit caurumu labirintā, un kas nogalina Aizvērēju, tas atstāj durvis vaļā, lai princis varētu iziet cauri.</p>' });
  add({ lv: 'II', body:
    '<h3>Kā dievi izturas pret mirstīgajiem</h3>' +
    '<p>Neviens dievs neielaužas neviena dvēselē. Pastāv <b>zvērests</b>: mirstīgais pietuvojas, apsola, un dievs atbild ar <b>veltēm</b>. Pretī mirstīgais pieņem <b>solījumus</b> un <b>aizliegumus</b>: ko darīt un ko nekad nedarīt.</p>' +
    '<p>Arī dieviem ir savi naidi, un ticīgie tos manto. Tam, kas kalpo vienam, jāzina, kam otrs nekad nepiedos.</p>' +
    '<p>Priesteri čukst jautājumu: vai arī dievi pļauj to, ko sējuši? Marghar to nekad nav teicis, bet atbilde ir jā. Kad krīt tumsas princis, Esence vai dievs, ziņas izskrien pa visu pasauli, stāstot par tā diženo varoņdarbu, kurš to nogāza, un saka, ka tas ir saticis savu karmu. Viņi pazūd uz simt gājieniem, bet viņu ietekme paliek. Šīs būtnes bezgalīgos ceļojumos un dzīvēs ir sakrājušas tik daudz karmas, ka viņu nāve uzsprāgst karmiskā enerģijā, kurai nav kur palikt. Šī enerģija nolasa klātesošo karmu un pārvēršas priekšmetos, kas darināti katram, atbilstoši katra karmai.</p>' +
    '<h3>Hronista piezīmes</h3><p class="fnote"><span class="nb">✎</span>Prinču zālē, trešajā Bibliotēkas pagrabstāvā, sienā izcirstas desmit nišas. Deviņās akmenī iekalts vārds. Desmitajā nav vārda nekāda, un tā ir vienīgā, kurā nekrājas putekļi.</p><p class="fnote"><span class="nb">✎</span>Es saskaitīju deviņas Esences, kā skaita visi. Bet vecākajās Ilmaras himnās, ko dzied elfu ciemos, ir pants ar vārdu, ko neviens nespēj izrunāt līdz galam: dziedātājai vienmēr pietrūkst elpas pie vienas un tās pašas zilbes, un pants sākas no jauna.</p>'  });

  add({ toc: 'III grāmata — Sēt un pļaut', lv: 'III', eyebrow: 'III grāmata', title: 'Sēt un pļaut', start: true, body:
    '<p>Karmikas pasaule pirms jebkādām robežām dalās divos dvēseles gadalaikos: tajā, kas sēj, un tajā, kas pļauj.</p>' +
    '<h3>Sējas laiks</h3>' +
    '<p>Kamēr dvēsele dzīvo, tā sēj. Katrs solis ir sēkla: ģilde, kurā tā iestājās, skola, kurā tā mācījās, ienaidnieks, ko tā saudzēja, nevainīgais, ko tā nesaudzēja. Nogalināt arī nozīmē sēt, un pat sīkas izvēles, ja izdarītas apzināti, tiek skaitītas.</p>' +
    '<p>Šajā laikā Acs ir atvērta horizontāli, un karma ir šķidra, tā vēl ceļas, vēl jaucas. Kas dzīvo ilgi, redz, kā Acs piepildās.</p>' + EYE_FILL });
  add({ lv: 'III', body:
    '<h3>Smilšu pulkstenis</h3>' +
    '<p>Kad dvēsele mirst, simbols pagriežas. Abi K nostājas stāvus, un Acs kļūst par <b>Smilšu pulksteni</b>. Stāvošais K nenes sevī smilšu pulksteni; tas pats ir smilšu pulkstenis.</p>' + HOUR +
    '<p>Un tad notiek svarīgākais, ko es zinu par karmu: <b>šķidrums izžūst</b>. Tas, kas bija šķidrs, kļūst par smiltīm, un smiltis sāk birt caur K apakšējo kaklu. Kamēr šķidrums bija šķidrs, tas vēl varēja mainīties. Smiltis nemainās. Tas ir izdarīts, un nav kur bēgt.</p>' });
  add({ lv: 'III', body:
    '<p>Tad dvēsele saņem to, ko iesējusi, graudu pa graudam. Kāds Auréon priesteris man reiz teica: “Atalgojums ir sauss, jo par to vairs nevar kaulēties.” Smilšu pulkstenim pilnībā jāiztukšojas, pirms simbols atkal pagriežas, un tikai tad dvēsele var no jauna radīt karmu.</p>' +
    '<p>Tas iztukšojas divējādi, un der tas, kas notiek pirmais: caur sekām, kad tas, kas iesēts, beidzot notiek, vai caur laiku, kad smiltis vienkārši beidzas. Tam, kurš nes daudz karmas, priekšā var būt, teiksim, piecdesmit gājieni. Šajā laikā ar viņu notiek lietas, cilvēki pārstāj viņu mīlēt un viņu apciemo kaitīgas ietekmes. Visur viņam seko simbols, karmiskā gājēja zīme. Viņš var kļūt par vajāšanas līgumu mērķi vai saņemt atlaides un labvēlības par atriebībām, ko pasaule uzskatīja par vajadzīgām.</p>' +
    '<h3>Atgriešanās</h3>' +
    '<p>Dvēsele atgriežas savā ceļojumā, un gājējs no jauna izvēlas savu rasi un iezīmē savu ceļu. Bet viņš neatgriežas tukšs. Viņš nes līdzi to, kas bija: mednieka nogalināts vampīrs var piedzimt no jauna ar neizskaidrojamām slāpēm vai ar riebumu pret ķiplokiem; vilkacis var mosties, dzirdot gaudas, ko neviens cits nedzird. Un ir tādi, kas zina. Seno ģilžu pravieši un mistiķi atpazīst noteiktas dvēseles, un dažas no tām tiek medītas par to, kas tās bija.</p>' +
    '<p>Kas spēlē gadiem, tas nodzīvo daudzas dzīves, un katras stāsts tiks izstāstīts no jauna un piedzīts no jauna nākamajās dzīvēs.</p>' +
    '<p>Nedomā, ka Smilšu pulkstenis šķir svētos no grēciniekiem. Tas nepazīst ne labo, ne ļauno, tikai darbību un atbildi. Gājējam, kas darīja to, ko mēs saucam par ļaunu, un kas tikai pavēra ceļus, kuri izpostīja citus, būs sava karma, kas jāsamaksā. Bet arī tas, kurš visu darīja skaisti un palīdzēja daudziem, atgriežas ar karmu, kas jāsamaksā. Daudzi no pretējās karmas izsludinās maksu par viņa galvu, un citi viņam dos atlaides varenām mantām. Acs redz, un nekas vairāk.</p>' });
  add({ lv: 'III', body:
    '<h3>Karmiskā Asara</h3>' + EYE_TEAR +
    '<p>Smilšu pulksteņa gaitai ir viens izņēmums, un tas ir pats kārotākais Karmikā.</p>' +
    '<p>Kad kāds paveic dziesmas cienīgu varoņdarbu, labu vai ļaunu, Acs raud. Asara krīt no apakšējās virsotnes, un to sauc par <b>Karmisko Asaru</b>. To neiegūst ar varoņdarbu daudzumu, bet ar vēsturiskiem varoņdarbiem: labsirdīgs vampīrs, maigs vilkacis, raganis, kas izmanto dēmonus pret ļauno, paladīns, kas nododas sātaniskajam, mednieks, kas vajā varonīgus paladīnus, tas, kurš uzvar leģendu, tas, kurš sevi upurē nevainojami. Katrs no tiem gāja tur, kur labirints nebija paredzējis.</p>' +
    '<p>Šeit ir vērts runāt par Marghar. Neskaitāmus laikmetus viņš turpināja radīt ceļus visām karmiskajām iespējām, un nekas, ko gājējs darīja, nešķita izbēgam no viņa paredzētā. Bet ļoti reti kāds no mums, kas staigā pa Karmiku, izdara to, kas nebija paredzēts. Šo jauno ceļu burtiski rada gājējs: savā neaizmirstamajā varoņdarbā viņš paņem sev Marghar enerģiju, jo bez tās neviens ceļš nerodas, un pats iezīmē neiespējamu ceļu, ko nebija paredzējis pat senais pirms senā.</p>' +
    '<p>Tā nav zagļa zādzība. Tā ir koka zādzība, kas velk no zemes barību, lai pastāvētu, un varbūt tā ir tā pati karma, kas tam, kurš domāja pirmais. Šī izsauktā enerģija Marghar sagādā sāpes, bet viņu neievaino, jo viņš ir senāks par brūci, kas radās uz ceļa, un senāks par baudu, kas radās uz ceļa. Viņu tas aizkustina, un viņš raud pašas redzošās Acs asaru. Viņa redzēta un no viņa nākusi, tā ir varena.</p>' +
    '<p><b>Tam, kurš to saņēmis</b>, tā dod iespēju atdzīvoties pēc nāves, tik drīz nešķērsojot karmisko vainu. Tikai dvēsele, kas to izcīnījusi, var to tā izmantot. <b>Pasaulē</b> to var pārdot, un tad tā kļūst par priekšmetu: tā paceļ ģildi, kaļ unikālus priekšmetus, ir varenu dziru sastāvdaļa, kalpo par izejvielu un spekulācijas valūtu, un no tās var rasties Taisnības Āmurs vai zobens kā leģendās.</p>' +
    '<p>Vecie to apkopo tā: Asara ir Marghar aizkustinājums. Viņš reti aizkustinās, un, kad tā notiek, pasaule ir vērtīgāka par zeltu.</p>' +
    '<h3>Hronista piezīmes</h3><p class="fnote"><span class="nb">✎</span>Galerijās es vaicāju, kurš pirmais lika Acij raudāt. Bibliotēkas vecākajā ierakstā datums un vārds ir nokasīti ar nazi. No varoņdarba palicis tikai viens vārds, pēdējais rindā: atgriezās.</p>'  });

  add({ toc: 'IV grāmata — Tautas', lv: 'IV', eyebrow: 'IV grāmata', title: 'Tautas', start: true, body:
    '<p>Ikviens kaut kur sāk, un Karmikā katra dvēsele sāk vienā no trim tautām. Neviens nepiedzimst kā vampīrs, burvis vai paladīns. Piedzimst kā cilvēks, rūķis vai elfs, mazā ciematā, un viss pārējais ir sekas.</p>' +
    '<h3>Cilvēki</h3>' +
    '<p>Mēs esam visvairāk un vismazāk īpaši, un varbūt tāpēc visbrīvākie. Neviens ceļš mums nav svešs, neviens ceļš neprasa mūsu ādu. Cilvēki būvē: mājas, tilti, mūri un veselas pilsētas ir cilvēku roku darbs. Un daudzi, kad dvēsele pēc nāves atgriežas, izvēlas atgriezties kā cilvēki, tā ka gandrīz katrs no mums dziļi sevī nes visu sākumu.</p>' +
    '<h3>Rūķi</h3>' +
    '<p>Kalnu, kalves un ietiepības tauta. Rūķi, kurus esmu pazinis, tic, ka tam, kas darīts ar rokām, nav vajadzīgs attaisnojums. Rūķis dēmonu mednieks vai raganis nav aizliegts, tikai rets, un esmu dzirdējis, ka viņa tauta uz viņu skatās kā uz brāli, kas iziet no alas.</p>' });
  add({ lv: 'IV', body:
    '<h3>Elfi</h3>' +
    '<p>Elfi pieder skaistajiem mežiem, kur kokiem ir atmiņa un amatiem ir ritms. Elfs, kas kļūst par vampīru vai vilkaci, nodod vairāk nekā sevi: viņš nodod savu tautu. Viņš to drīkst darīt, un daudzi to jau ir darījuši, bet cenu piedzen karmā, nevis likumā.</p>' +
    '<h3>Kas ir šķērslis un kas ir vaina</h3>' +
    '<p>Es jautāju daudziem priesteriem, vai likums kādam aizliedz ceļu viņa rases dēļ. Atbilde vienmēr bija tā pati: neviens likums neaizliedz, viss tiek piedzīts. Daba durvis neaizver, tā tikai atstāj uz tām uzrakstītu cenu.</p>' });

  add({ toc: 'V grāmata — Astoņi ceļi', lv: 'V', eyebrow: 'V grāmata', title: 'Astoņi ceļi', start: true, body:
    '<p>Karmikas dvēseles neizvēlas profesiju, tās par kaut ko kļūst. Neviens nepamostas kādā rītā kā paladīns: jāiestājas baznīcā, jāmācās, jākalpo, jāpierāda sevi. Katrs ceļš prasa piederību, gājumu un gandrīz vienmēr ceļojumu uz tāliem novadiem. Un līdz pirmajiem divdesmit līmeņiem visi izdzīvo, kā prot, bez jebkāda ceļa.</p>' +
    '<h3>Paladīns</h3>' +
    '<p>Lai kļūtu par paladīnu, jāiestājas Auréon baznīcā, jākļūst par priesteri un tikai tad par atbrīvotāju no ļaunā. Viņš tērpjas debesu gaismā un ienīst briesmoņus.</p>' +
    '<h3>Ziemeļu karotājs</h3>' +
    '<p>Viņš mācās ziemeļu kaujas akadēmijā ledainajos kalnos un velta dzīvi Odinam. Viņš ir stingrs, lepns un, pēc vilkaču domām, nepanesams.</p>' });
  add({ lv: 'V', body:
    '<h3>Vampīrs</h3>' +
    '<p>Neviens to neizvēlas uzreiz. Viņu iekož, vai viņš pieņem kodienu, un sāk dzīvot no Hemaras slāpēm. Vampīrs ienīst vilkačus, paladīnus un labā burvjus.</p>' +
    '<h3>Vilkacis</h3>' +
    '<p>Viņš iestājas vilkaču ģildē un pārvēršas. Bars ir viņa likums. Viņš ienīst vampīrus, zagļus un ziemeļu karotājus.</p>' +
    '<h3>Dēmonu mednieks</h3>' +
    '<p>Mednieku skolās izglītots, viņš vajā visu dēmonisko: vampīrus, vilkačus, sātaniskus burvjus un ragaņus. Viņš var būt arī algotais mednieks.</p>' +
    '<h3>Raganis</h3>' +
    '<p>Viņš slēdz paktus ar elles prinčiem. Viņa sāncensība nav ārpus ļaunā, tā ir tā iekšienē, starp tiem pašiem, kas tam kalpo. Viņš var pārdot vampīrisma rituālus un gatavot varas dziras.</p>' });
  add({ lv: 'V', body:
    '<h3>Burvis</h3>' +
    '<p>Viņš ilgi mācās un kļūst par kādu, kas liec realitāti. Viņa sāncensība ir labā klēpī, starp tiem, kas seko gaismai dažādos veidos. Viņš veic dziedināšanas rituālus apgabalos ar sliktu karmisko rādītāju.</p>' +
    '<h3>Tehnokrāts</h3>' +
    '<p>Viņš iestājas Karmikas tehnoloģiju akadēmijā un iznāk ar mašīnām paša ķermenī. Viņš ir visneitrālākais no visiem, jo viņš ir pasaules tirgotājs: pārdod, labo, uzlabo pilsētas, ienes automatizāciju un, ja grib, medī atlīdzības.</p>' +
    '<h3>Sāncensības</h3>' +
    '<p>Naids starp ceļiem ir daudzu stāstu kapakmens. Vampīri un vilkači cīnās kopš pirmā mēness. Paladīni nepiedod briesmoņiem, un mednieki nepiedod nevienam, kas ož pēc elles. Bet ceļa naids ir tieksme, nevis liktenis. Ir vampīri, kas sargā ciemus, un paladīni, kas samaitājas, un tas, kurš izdara negaidīto, dažreiz liek Acij raudāt.</p>' });

  add({ toc: 'VI grāmata — Karmas krāsas', lv: 'VI', eyebrow: 'VI grāmata', title: 'Karmas krāsas', start: true, body:
    '<p>Šķidrumam, kas piepilda Aci, nav vienas krāsas. Katra izvēle iekrāso to, kas tajā iekrīt, un veterāna Acs ir kā vitrāža: visu dzīvi var izlasīt tikai pēc krāsām.</p>' +
    '<ul class="colors">' +
    '<li>' + sw('#b3202f', '#b3202f') + '<span><b>Asinis</b>, vampīrisms</span></li>' +
    '<li>' + sw('#2b1a3d', '#7b5fa8', '#8d6fc0') + '<span><b>Melnā enerģija</b>, raganība</span></li>' +
    '<li>' + sw('#fff0c2', '#ffd36a') + '<span><b>Debesu gaisma</b>, paladīns</span></li>' +
    '<li>' + sw('#3dff8a', '#3dff8a') + '<span><b>Spilgti zaļš</b>, dēmonu mednieks</span></li>' +
    '<li>' + sw('#2a4bff', '#2a4bff') + '<span><b>Spilgti tumšzils</b>, tehnokrāts</span></li>' +
    '<li>' + sw('#46bcff', '#46bcff') + '<span><b>Spilgti gaišzils</b>, burvis</span></li>' +
    '<li>' + sw('#8b5a2b', '#8b5a2b') + '<span><b>Brūns</b>, vilkacis</span></li>' +
    '<li>' + sw('#ffb000', '#ffb000') + '<span><b>Dzintardzeltens</b>, ziemeļu karotājs</span></li>' +
    '</ul>' +
    '<p>Vilkacim ir zemes un kažoka krāsa, un ziemeļu karotājam senā dzintara krāsa, ugunskuru un Odina zelta krāsa. Man tās vairs nav jāredz sapņos.</p>' +
    '<p>Tikai nesajauc divas gaismas, kas šķiet māsas. Paladīna gaisma ir balta ar zeltu, un tai ir mistisks, debešķīgs izskats. Burvja gaisma ir ledus balta, un tai ir stihisks izskats. Viena nāk no augšas, otra nāk no lietu dabas.</p>' });
  add({ lv: 'VI', body:
    '<h3>Kad krāsas saskaitās</h3>' +
    '<p>Krāsas viena otru neizdzēš. Neviens neizdzēš vampīra asinis ar debesu gaismu; notiek tā, ka abas sadzīvo, un no tām dzimst trešā. Kombinācijas rakstvežus aizrauj visvairāk, jo katra summa stāsta stāstu: mednieks, kas dzēra asinis, burvis, kas noslēdza paktu, tehnokrāts, kas nožēloja.</p>' +
    '<p>Vairāk krāsu, vairāk smaguma. Tā, kurš daudz saskaitījis, karmiskā vaina ir smaga, jo ir vairāk ko pļaut.</p>' +
    '<h3>Kad ceļu nodod</h3>' +
    '<p>Ceļu nodod, un krāsa mainās. Kad paladīns krīt, debesu gaisma izbalē, un tas, kas nāk pēc tam, nav nevainīgs. Kas nodod rasi, ģildi vai zvērestu, maksā divreiz: ar jauno krāsu un ar vecās krāsas smagumu.</p>' +
    '<h3>Hronista piezīmes</h3><p class="fnote"><span class="nb">✎</span>Rakstveži pieraksta astoņas krāsas, un es arī. Bet kādas ļoti vecas krāsu grāmatas malā kāds gaišākā tintē pierakstījis devīto: pelēku, kas nav nevienas krāsas sajaukums. Neviens ceļš nedod šo krāsu. Tomēr šādas krāsas apmetņus esmu redzējis.</p>'  });

  add({ toc: 'VII grāmata — Karmikas zeme', lv: 'VII', eyebrow: 'VII grāmata', title: 'Karmikas zeme', start: true, body:
    '<p>Karmika ir visa pasaule, nevis tikai karaliste. Kartes, ko esmu redzējis, saskan trīs lietās: ir vismaz četras lielas pilsētas; katrai no tām apkārt ir sešas mazas pilsētas; un starp tām izkaisīti mazi ciemati.</p>' +
    '<p>Ciemati ir tur, kur mēs dzimstam. Tur dzīve sākas gandrīz kā izdzīvošana, un tam, kas grib kļūt par kaut ko, jādodas prom. Mazās pilsētas glabā zemākā līmeņa skolas, kur apgūst katra amata pirmos soļus. Lielās pilsētas mitina augstā līmeņa skolas, un tas, kurš līdz tām nonāk, jau ir kāds.</p>' +
    '<h3>Pasaule, kas biedē</h3>' +
    '<p>Starp pilsētām ceļš ir bīstams. Ir meži tik biezi, ka diena kļūst par krēslu; tumšas alas, kur kaut kas elpo; baznīcas un mauzoleji, ko pametuši priesteri, kas kļuva ļauni; kriptas, kapsētas un izpostītas pilsētas, no kurām neviens neatgriežas bez stāsta, ko negrib stāstīt.</p>' });
  add({ lv: 'VII', body:
    '<h3>Pasaule, kas uzņem</h3>' +
    '<p>Bet Karmika nav tikai ēna. Ir skaisti lauki, kur gaisma kavējas pie apvāršņa, un ir ledaini kalni, ziemeļu karotāju mājas, kur sniegs mirdz kā sudrabs. Ir tehnoloģiska pilsēta steampunk stilā, kur tvaiks ceļas stabos un zobrati griežas līdz rītausmai, tehnokrātu mājas. Ir skaistie elfu meži, salu novadi, kas gaida jūrasbraucējus, un svētie lauki, kur Auréon baznīca rūpējas par tiem, kas ierodas ievainoti.</p>' +
    '<p>Tiem, kas raksta par Karmiku, ir ieradums stāstīt tikai par tumsu. Es lūdzu neaizmirst: tumsa sver vairāk, jo pastāv skaistais, un skaistais ir vērtīgāks, jo turpat līdzās ir tumsa. Pat svētajos laukos var ierasties ļaunais, un rituālos dziedināta zeme var atkal uzziedēt.</p>' +
    '<h3>Hronista piezīmes</h3><p class="fnote"><span class="nb">✎</span>Lielā karte tika pārrakstīta trīs reizes. Visās trijās kopijās, neko nesarunājuši, pārrakstītāji uzzīmēja to pašu mazo apli Cilvēku zemju centrā, kur nekā nav. Kad viņiem jautāja, neviens neatcerējās, ka to būtu darījis.</p>'  });

  add({ toc: 'VIII grāmata — Amati un tirgotāji', lv: 'VIII', eyebrow: 'VIII grāmata', title: 'Amati, tirgotāji un Godīguma pakts', start: true, body:
    '<p>Pasaule, kas ilgst gadiem, nedzīvo tikai no zobeniem. Kādam jāsēj kvieši, jāceļ māja, jākaļ asmens un jānes maize uz pilsētu. Karmikā katrai dvēselei ir amats, kas atbilst tam, ko tā prot, un pat darbs atstāj zīmi Acī.</p>' +
    '<h3>Kurš ko dara</h3>' +
    '<p><b>Elfi</b> strādā ar to, ko dod mežs. <b>Cilvēki</b> būvē. <b>Rūķi</b> medī dzīslas un kaļ, kā paši saka. <b>Karotāji</b> un <b>dēmonu mednieki</b> var kļūt par algotajiem medniekiem vai izvēlēties spēka un zemkopības darbus. <b>Ragaņi</b> ņem maksu par vampīrisma rituāliem un gatavo varenas dziras. <b>Burvji</b> ar saviem rituāliem dziedina apgabalus ar sliktu karmisko rādītāju. Un <b>tehnokrāts</b> dara visu: tirgotājs, kalējs, inženieris, tas, kurš pilsētās ienes automatizāciju.</p>' });
  add({ lv: 'VIII', body:
    '<h3>Pasaules tirgotājs</h3>' +
    '<p>Tehnokrāts ir visneitrālākais no visiem, un iemesls ir vienkāršs: nevar pārdot visiem, esot kāda ienaidnieks. Tāpēc Karmikas tirgotāji un kalēji ievēro bargus godīguma noteikumus, ko es saucu par Paktu.</p>' +
    '<p>Tirgotājs nedrīkst vienlaikus tirgoties ar vampīru ģildi un ar vilkaču ģildi. Nedrīkst pārdot informāciju. Nedrīkst uzskrūvēt cenas. Nedrīkst nodot pazemes grupas, kas viņu pavadīja.</p>' +
    '<h3>Alkatības smagums</h3>' +
    '<p>Ir tirgotāji, kas krāj bagātību uz dzīvību rēķina, ir nodevēji un ir pakļāvēji. Acs redz tos visus, un smagums, ko tie nes, nav mazs. Bet ir otra puse: tehnokrāts, kas izmanto prātu, lai uzlabotu pilsētu, ienestu gaismu, novilktu tiltu, uzbūvētu mašīnu, kas pabaro tūkstoš mutes, iesēj sēklu, kas kādu dienu pie viņa atgriežas.</p>' +
    '<p>Vēl ir zaglis. Tas ir cilvēku un elfu amats. Rūķi, tik smagi un stingri, zādzību uzskata par kaut ko pret savu dabu. Bet esmu dzirdējis par Mazo Mēri, veiklu rūķi, kas staigāja pa krogiem, zogot visu, kas slēpās zem jostas augstuma, un tas nebija maz.</p>' +
    '<p>Ceļu amatiem ir savas cenas. <b>Paladīns</b> pirms zobena ir ticības dziednieks: lūdz, lauž lāstus un, tāpat kā burvis, atbrīvo veselas pilsētas no karmas, kas tās smacē. Viņš var būt postītājs vai būt mūris. <b>Vampīrs</b> ir izcils smalku drēbju audējs, un burvji un ragaņi pērk tikai viņa darinātās. Viņš gatavo arī vīnu un ēdienus, kas prasa pacietību, retus sierus un kūpinātu gaļu. <b>Vilkacis</b> ļoti labi būvē un auž biezas drēbes, karotāju un paladīnu drēbes, kuri no viņa daudz pērk. Viņš zvērus pieradina labāk par cilvēku, jo runā valodā, kas tuvāka dzīvnieku valodai.</p>' });

  add({ toc: 'IX grāmata — Ģildes, skolas un kari', lv: 'IX', eyebrow: 'IX grāmata', title: 'Ģildes, skolas, baznīcas un kari', start: true, body:
    '<p>Karma nepieder tikai vienam. Visa ģilde nes savu izvēļu smagumu, un to, ko viens biedrs iesēj, nedaudz pļauj visi. Tāpēc saprātīgi vadoņi rūpīgi izvēlas, ko uzņemt.</p>' +
    '<p>Lielākās un senākās ģildes par nopelniem var saņemt piešķīrumu: kļūt par <b>skolu</b>. Tā ir vampīru, vilkaču, dēmonu mednieku skolas un lielas pilntiesīgas baznīcas. Pamatskolas pieder pasaulei. Piešķirtās pieder to atmiņām, kuri tās izcīnīja.</p>' +
    '<p>Bija tādi, kas baidījās, ka tas aizvērs durvis jaunajiem. Bet veterāni, kurus esmu pazinis, atkārto vienu teikumu: to, kurš ierodas tagad, nedrīkst atstāt aiz durvīm. Varenajām ģildēm ir pienākums mācīt, nevis tikai tiesības valdīt.</p>' });
  add({ lv: 'IX', body:
    '<h3>Kad paceļas karogi</h3>' +
    '<p>Un ir kari. Dēmonu mednieku skola, kam uzbrūk vilkači, sauc visus medniekus kaujā. Aicinājums pie ieročiem liek skanēt paladīnu zvaniem visās pilsētās. Iestādes karo cita pret citu, un tas, kurš izvēlas pusi, sēj kopīgu karmu.</p>' +
    '<p>Daudzi no šiem notikumiem rodas arī kā PvE notikumi, kas dzimuši no katra spēlētāja stāsta, kuros vairāki ieiet vienā instancē, lai kopā izdzīvotu šo atmiņu.</p>' });

  add({ toc: 'X grāmata — Garais gājums', lv: 'X', eyebrow: 'X grāmata', title: 'Garais gājums', start: true, body:
    '<p>Lai sasniegtu ceļa virsotni, vajag laiku, un Karmika nevienu nesteidzina. Pirmie divdesmit līmeņi ir izdzīvošanai: bez ceļa, bez titula, tikai cilvēks un pasaule. Pēc šī sliekšņa dvēsele gatavojas; trīsdesmitajā līmenī, Gaišreģes priekšā, tā izvēlas, un ceļš paveras. Divdesmitajā līmenī gaisma pārklāj visu gājēja priekšā, un karmiskā Acs atveras. Un kad šī dvēsele mirst, Acs un tās šķidrums izžūst, tā pagriežas un kļūst par Smilšu pulksteni.</p>' +
    '<p>Pēc tam kāpšana ilgst gadiem. Rakstveži runā par divsimto līmeni dvēselei un trīssimt piecdesmito līmeni ceļam, un īsceļu, ko es zinātu, nav. Kāpienā tiek iztērētas daudzas dzīves un arī daudzas nāves. Dvēseles līmenis un ceļa līmenis prasa vienādu pūļu summu: sasniegt divsimto maksā tikpat, cik sasniegt amata trīssimt piecdesmito, tāpēc amats kāpj vieglāk nekā dzīve. Tomēr spēlētājam, kas neatpūšas, tas prasa kādus divus gadus. Un jo augstāk, jo vairāk kāpiens atmaksājas: paladīns, kas pāriet no trīssimtā līmeņa uz trīssimt pirmo, iegūst daudz vairāk spēka, gara un varas savās burvestībās nekā tad, kad pārgāja no trīsdesmitā uz trīsdesmit pirmo.</p>' +
    '<p>Starp tik daudzām dzīvēm dzimst jautājums, kas mani interesē visvairāk un uz ko neatbild neviens skaitlis: <b>vai dvēsele mācās?</b> Acs redzēs, un vēsturnieks arī.</p>' +
    '<p>Un ir kāds kāpiena likums, ko maz kas iemācās agri. Kas grib sasniegt ceļa virsotni, to nepaveic vienā dzīvē: jānodzīvo daudzas dzīves tajā pašā ceļā. Paladīnam jāatdzimst kā paladīnam desmitiem, varbūt simtiem dzīvju, līdz viņš kļūst par ordeņa paladīnu. Katru reizi, kad gājējs atkal izvēlas to pašu ceļu, viņa punkti iegūst reizinātāju, viens un viena desmitā, viens un trīs desmitās, pusotrs, līdz trīskāršai robežai. Un tas, kurš maina ceļu, nesāk no nulles: viņš nes līdzi punktus, kas līdzinās viņa personīgajam līmenim, jo viņš mācījies daudzās dažādās pieredzēs. Tas pats attiecas uz amatiem: kas iepriekšējā dzīvē bijis kalējs vai audējs, tas no jauna mācās ātrāk, kā tas, kuram ir dabiska dotība.</p>' });

  add({ toc: 'XI grāmata — Lielā bibliotēka', lv: 'XI', eyebrow: 'XI grāmata', title: 'Lielā bibliotēka un Dzīvā hronika', start: true, body:
    '<p>Karmikas sirdī, centrālajā pilsētā, paceļas Lielā bibliotēka, tik milzīga, ka neviens nekad nav izstaigājis visas tās galerijas. Ir rakstu rituļu gaiteņi, karšu zāles un istaba, kurā lappuses raksta pašas sevi. Tieši šeit es strādāju.</p>' +
    '<p>Mans amats ir vienkārši izsakāms un smagi veicams: kad Acs raud, kādam tas jāpieraksta. Katru Marghar izlieto <b>Karmisko Asaru</b> pierakstu es, ar tā vārdu, kurš to izcīnījis, ar varoņdarbu, kas to izraisījis, un ar dienu, kad tā kritusi. Marghar neraksta; rakstu es.</p>' +
    '<p>Kas grib pārbaudīt savu asaru vai uzzināt par kāda cita asaru, lai meklē mani galerijās.</p>' });
  add({ lv: 'XI', body:
    '<h3>Hronika, kas nebeidzas</h3>' +
    '<p>Šī grāmata nekad nebūs pabeigta. Katru karu, kas tiek izcīnīts, katru skolu, kas nonāk citās rokās, katru paladīnu armiju, kas atsaucas aicinājumam, katru unikālu karotāju, ko pasaule iepazīst, katru vēsturisku asaru es pierakstu, un rodas jauna lappuse.</p>' +
    '<p>Vārdi, kas šeit ierakstīsies, būs to vārdi, kas to izdzīvoja: ģildes, kas kļuva slavenas, varoņi, kas mainīja kara gaitu, dvēseles, kuru varoņdarbs lika raudāt pašai Acij. Dažas no lappusēm, ko tu lasi, uzrakstījuši spēlētāji, paši to nezinot.</p>' +
    '<blockquote>Kas iesēj kaut ko lielu, to lasīs tie, kas nāks pēc tam.</blockquote>' +
    '<p>Esi pats kāda nodaļa.</p>' });

  add({ lv: 'XI', body:
    '<h3>Par sešām rūnām</h3>' +
    '<p>Bibliotēkas pārrakstītāji raksta ar sešām rūnām, un es tās zīmēju šeit, jo lasītājs tās atradīs katras Karmikas svētās grāmatas ietvarā, teleportācijas akmeņu pamatnē un aplī, ko burvis novelk pirms burvestības.</p>' +
    '<div class="figwrap"><svg class="runes6" viewBox="0 0 296 56" role="img" aria-label="Sešas Karmikas rūnas: Asara, Karmiskā Acs, Smilšu pulkstenis, Labirints, Bads un Sprauga, kas mirdz"><defs><radialGradient id="frg"><stop offset="0" stop-color="#ffe9ad" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9ad" stop-opacity="0"/></radialGradient></defs><ellipse cx="270" cy="28" rx="26" ry="26" fill="url(#frg)"><animate attributeName="opacity" values=".25;.8;.25" dur="5s" repeatCount="indefinite"/></ellipse><g transform="translate(6 8) scale(1.45)"><path d="M14 3 C17 9 21 13.5 21 18 A7 7 0 0 1 7 18 C7 13.5 11 9 14 3Z" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M14 3 C17 9 21 13.5 21 18 A7 7 0 0 1 7 18 C7 13.5 11 9 14 3Z" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(54 8) scale(1.45)"><path d="M4 4 V24 M24 4 V24 M12 4 L6.5 14 L12 24 M16 4 L21.5 14 L16 24 M8.5 14 Q14 9 19.5 14 Q14 19 8.5 14Z" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M4 4 V24 M24 4 V24 M12 4 L6.5 14 L12 24 M16 4 L21.5 14 L16 24 M8.5 14 Q14 9 19.5 14 Q14 19 8.5 14Z" fill="none" stroke="#15101e" stroke-width="1"/><path d="M14 12 a2 2 0 1 0 0.01 0Z" fill="#d9a24f"/></g><g transform="translate(102 8) scale(1.45)"><path d="M7 4 H21 L14 14 L21 24 H7 L14 14 Z" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M7 4 H21 L14 14 L21 24 H7 L14 14 Z" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(150 8) scale(1.45)"><path d="M5 24 V4 H23 V23.5 H8.5 V7.5 H19.5 V20 H12 V11 H16 V16.5" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M5 24 V4 H23 V23.5 H8.5 V7.5 H19.5 V20 H12 V11 H16 V16.5" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(198 8) scale(1.45)"><path d="M11.5 7.2 A8.3 8.3 0 1 0 16.5 7.2 M11.5 7.2 C11 5.4 9.8 4.2 8.2 3.6 M16.5 7.2 C17 5.4 18.2 4.2 19.8 3.6" fill="none" stroke="#d9a24f" stroke-width="2.7"/><path d="M11.5 7.2 A8.3 8.3 0 1 0 16.5 7.2 M11.5 7.2 C11 5.4 9.8 4.2 8.2 3.6 M16.5 7.2 C17 5.4 18.2 4.2 19.8 3.6" fill="none" stroke="#15101e" stroke-width="1"/></g><g transform="translate(246 8) scale(1.45)" class="hot"><path d="M11.4 2.6 V18.8 M16.6 9.2 V25.4 M6.6 10.4 C9.2 10.4 11.4 11.8 12.8 14 C14.2 16.2 16.4 17.6 21.4 17.6" fill="none" stroke="#f6dc8e" stroke-width="2.7"/><path d="M11.4 2.6 V18.8 M16.6 9.2 V25.4 M6.6 10.4 C9.2 10.4 11.4 11.8 12.8 14 C14.2 16.2 16.4 17.6 21.4 17.6" fill="none" stroke="#15101e" stroke-width="1"/></g></svg></div><p class="runecap">Asara · Acs · Smilšu pulkstenis · Labirints · Bads · <b>(bez vārda)</b></p>' +
    '<p><b>Asarai</b>, <b>Karmiskajai Acij</b>, <b>Smilšu pulkstenim</b>, <b>Labirintam</b> un <b>Badam</b> ir vārds un vēsture, un par katru es runāju. Sestajai vārda nav. Tā izskatās kā divi nesakritīgi asmeņi, viens augstāks par otru, ar pavedienu, kas tek starp tiem, un mācekļi to sauc par Spraugu, jo tāda tā izskatās. Priesteri to novelk kristībās un templiešu iesvētīšanā; burvji aplī; mūrnieku meistari katra teleportācijas akmens pamatnē. Rituāls bez tās, saka visi, neiedarbojas. Neviens no viņiem nevar pateikt, kāpēc. Es arī nevaru.</p>' +
    '<p>Es vaicāju pieciem meistariem no piecām mājām. Lielmeistars Cassius teica, ka tā ir liturģijas daļa, un par liturģiju nestrīdas. Arhimags Vesk teica, ka tā ir aizdare un ka katram aplim vajag aizdari. Grāfs teica, ka Nams to lieto tūkstoš gadus un tūkstoš gadi nekļūdās. Ulfrun ierūcās. Arhitekte Ylva teica, ka, ja tas strādā, viņa neapstāsies jautāt. Es pierakstīju visas piecas atbildes un pamanīju, ka neviena no tām nebija atbilde.</p>' +
    '<p>Pārrakstītāji to zīmē pēdējo, ar aizvērtām acīm. Es jautāju, no kurienes šī paraža. Neviens nespēja man pateikt.</p>' +
    '<h3>Hronista piezīmes</h3><p class="fnote"><span class="nb">✎</span>Piecām rūnām es devu vārdus. Sestajai, ko pārrakstītāji zīmē pēdējo un ar aizvērtām acīm, vārda nav, un rituāls bez tās neiedarbojas. Senākajos teleportācijas akmeņos tā ir nodilusi nepareizi: nevis no ārpuses, no rokām, kas to aizskar, bet tā, it kā tā būtu spiesta no iekšpuses. Es to piedēvēju ceļotājiem. Nezinu, kāpēc.</p>' });
  add({ toc: 'XII grāmata — Smiltis un pasaules darbs', lv: 'XII', eyebrow: 'XII grāmata', title: 'Smiltis un pasaules darbs', start: true, body:
    '<h3>Par laiku, ko skaita graudos</h3>' +
    '<p>Mirstīgie laiku mēra nevis dienās, bet smiltīs, jo skaitīt viņus iemācīja Smilšu pulkstenis. Katra smilts ilgst četras stundas, un dienā to ir sešas. Neviena nezūd: arī to, kas netika izmantots, Acs pieraksta.</p>' +
    '<p>Ir divu veidu smiltis. <b>Gājēja smiltis</b> ir viņa paša: treniņš skolā, pirmais uzdevums, garais kāpiens no viena līmeņa uz nākamo. Uzdevums var maksāt vienu smilti un tikt pabeigts ātrāk, ja darītājs to dara labi, jo smilts ir robeža, nevis sods. <b>Pasaules smiltis</b> pieder visiem un birst pat tad, kad neviens neskatās: tilti, kas paceļas, mājas, kas pievienojas pilsētai, veikali, ko iekārto tehnokrāts, attīrīšanas, ko uztur burvji.</p>' +
    '<h3>Pilsēta, kas saslima</h3>' +
    '<p>Stāsta par pilsētu, uz kuru uzkrita smaga karma. Ūdens satumsa, migla neatstāja ielas, un labība sapuva pirms ražas. Tiem, kam tur bija māja vai kas tur mācījās, nācās meklēt īstus burvjus, un burvji nosauca cenu: trīsdesmit piecas attīrīšanas smiltis bez pārtraukuma. Simt četrdesmit stundas, gandrīz sešas dienas, kurās kādam jātur rokas uz rituāla, kamēr pilsēta gaida.</p>' +
    '<p>Neviens šīs dienas nenopirka. Nopirka rokas, un tas, kurš steidzas, atklāj, ka tas ir viens un tas pats. Vairāk burvju ap rituālu saīsina termiņu, bet nekad līdz nullei, jo melnajam ūdenim ir sava griba. Ja burvji nogurst un apstājas, ūdens atkal satumst.</p>' +
    '<h3>Dēlis un Pakts</h3>' +
    '<p>Katras pilsētas centrā ir Pasūtījumu dēlis. Tas, kuram vajag ādas, zāles, nogalinātu briesmoni, atgrieztu cilvēku vai strādniekus būvei, uzraksta pasūtījumu tur, atstāj samaksu Godīguma pakta glabāšanā un gaida. Kas pieņem, tas iet, izpilda un saņem. Ja neviens neizpilda, samaksa atgriežas pie īpašnieka.</p>' +
    '<p>Bet Dēlis ir arī spogulis. Attīrīšanas pasūtījums Acs svaros sver maz. Nāves pasūtījums sver uz tā, kurš maksāja, uz tā, kurš nogalināja, un uz pilsētas, kas ļāva papīram palikt pienaglotam. No kāda veca līgumdarbinieka es iemācījos, ka Dēlis ir godīgākā saruna, kāda pilsētai ir pašai ar sevi.</p>' +
    '<p>Neviens ceļš pilsētu nepaceļ viens. Burvis attīra, cilvēks būvē, vilkacis nes, vampīrs skrien naktī, tehnokrāts projektē un pārdod. Tā pasaule turas kājās: ar to, cik ļoti katram vajag otru.</p>' +
    '<h3>Hronista piezīmes</h3><p class="fnote"><span class="nb">✎</span>Monēta, ko iemet Strūklakās, nekad nesasniedz dibenu. Kāds tehnokrāts no Katlu Ostas nolaida virvi ar zvaniņu galā, cik tālu virve sniedza. Zvaniņš neieskanējās. Kad viņš virvi izvilka, tā bija slapja tikai līdz pusei.</p>'  });

  add({ toc: 'XIII grāmata — Tie, kas tikai iet', lv: 'XIII', eyebrow: 'XIII grāmata', title: 'Tie, kas tikai iet', start: true, body:
    '<h3>Par gājēju, kas nekļūst ne par ko</h3>' +
    '<p>Ir patiesība, ko rakstveži aizmirsa ierakstīt pirmajās lappusēs: Karmikā neviens nav spiests neko darīt. Gājējs dara, ko grib, un iet ir vienīgais noteikums. Daudzi nekad nekļūs par vampīriem, ne burvjiem, ne paladīniem. Viņi būs cilvēki, elfi vai rūķi līdz pēdējai dienai, un tas nav maz.</p>' +
    '<p>Ir tādi, kas dzīvo piedzīvojumu dēļ. Ir <b>asaru mednieki</b>, kas pavada dzīvi, dzenoties pēc varoņdarba, ko labirints nebija paredzējis, cerot ieraudzīt Aci raudam. Ir tādi, kas krāj dzīves, vienu pēc otras, kā krāj grāmatas. Un ir tādi, kas dzīvo stabilitātes dēļ, garās spēles dēļ, un atstāj savu zīmi akmenī, kokā un lopos.</p>' +
    '<h3>Ko būvē katra tauta</h3>' +
    '<p>Cilvēks ir lielais būvētājs. Viņš var sākt ar medībām, pēc tam uzcelt šķūni, gaļas veikalu, skolu. Ierodas citi cilvēki un ceļ mājas, un tur, kur nekā nebija, rodas ciems, pilsētiņa un ar laiku liela pilsēta. Viņš audzē lopus, aitas un suņus. Viņš nolīgst karotājus, burvjus un tehnokrātus, un tie atved ražas novākšanas mašīnas un palīdzību būvēm.</p>' +
    '<p>Elfs paplašina mežu. Viņš ceļ pilsētas kokos un soli pa solim attīra lielus Karmikas plašumus. Rūķis nokāpj kalnos un rok dziļi, vai dodas uz citām pilsētām. Viņš brūvē alu un cep gaļu, kas ir daudz vērta, viņam ir alus darītavas, kas ceļo uz ciemu un ģilžu svētkiem, un viņš ir prasmīgs kalējs un tirgotājs.</p>' +
    '<h3>Neizvēlēšanās briesmas</h3>' +
    '<p>Bet tas, kurš neizvēlas neko, neizvēlas arī to, kas ar viņu notiek. Vampīrs var viņam uzbrukt un padarīt par vampīru pret viņa gribu, vilkacis var viņu iekost. Raganis var viņu nolaupīt sātaniskam rituālam vai vampīrs pārvēršanai. Viņš mirst, un sāpīgā nāve atgriežas kopā ar dvēseli. Nākamajā dzīvē gājējs, nezinot kāpēc, atceras, kurš viņu aizveda, un var meklēt atriebību.</p>' +
    '<p>Tāpēc to pilsētām, kas tikai dzīvo, vajag mūrus, un mūriem vajag kādu, kas tos aizstāv.</p>' +
    '<h3>Hronista piezīmes</h3><p class="fnote"><span class="nb">✎</span>Bibliotēkā ir gājējs, kas parakstās tikai kā Lume. Viņa ieraksts aptver trīs tautas un astoņus ceļus, vienu pēc otra, un viņš nekad nav zvērējis vienam karogam divreiz pēc kārtas. Viņa saraksta pēdējā rindā tauta un ceļš ir tukši, un datums, kas vēl nav pienācis.</p>'  });

  add({ toc: 'XIV grāmata — Dvēseles zīmes', lv: 'XIV', eyebrow: 'XIV grāmata', title: 'Dvēseles zīmes', start: true, body:
    '<h3>Ko atceras āda</h3>' +
    '<p>Dvēsele pēc nāves atgriežas, un gājējs no jauna izvēlas, par ko grib būt: cilvēks, elfs vai rūķis, un pēc tam, ja grib, cits ceļš. Bet iepriekšējās dzīves nepazūd. Kas lūgs apskatīt kāda profilu, tur atradīs viņa pagātnes dzīves, vienu pēc otras, ar katras varoņdarbiem.</p>' +
    '<p>Un ir lietas, ko nāve neaiznes. Cēls varoņdarbs pavada gājēju un kļūst par ķermeņa daļu. Nodevība, Asara, varonīgs darbs pārvēršas <b>rētās</b> vai <b>tetovējumos</b>, un augstākie no tiem par <b>mirdzumiem</b> un <b>aurām</b>. Tie paliek, lai cik reizes viņš mirtu.</p>' +
    '<p>Es mēdzu teikt Bibliotēkas mācekļiem, ka gājējs var mainīt vārdu, tautu un karogu, bet nevar apmānīt to, kurš prot lasīt ādu. Es protu.</p>' +
    '<h3>Hronista piezīmes</h3><p class="fnote"><span class="nb">✎</span>Kāda tetovētāja no Tumšvārnas man zvērēja, ka dažas zīmes parādās pirms varoņdarba, nevis pēc. Viņa man parādīja kāda jaunekļa plaukstas locītavu ar asaru, kas zem ādas uzzīmēta tieva kā mats. Viņš nekad nebija licis Acij raudāt. Nezinu, kas ar viņu notika.</p>'  });

  add({ toc: 'XV grāmata — Divi karogi', lv: 'XV', eyebrow: 'XV grāmata', title: 'Divi karogi: Pavediens un Atšķetinātie', start: true, body:
    '<p>Pirmajā grāmatā es stāstīju, ka senie dalīja dvēseles Novirzītājos un Viesos. Tā bija priesteru saruna. Bet priesteru sarunas agri vai vēlu iegūst karogu, un šodien tas, kurš staigā pa Karmikas ceļiem, redz divus karogus plīvojam pāri pilsētām. Vecākie saka, ka <b>no to sadursmes dzima pati karma</b>, un es, kurš tikai pierakstu, neesmu atradis iemeslu šaubīties.</p>' +
    '<h3>Pavediena ordenis</h3>' +
    '<p>“<b>Neviens nešķērso viens.</b>” Tā saka Pavediena ordeņa ļaudis, un to viņi izšuj uz sava nakts zilā vairoga ar zelta malu: apaļš labirints un zelta pavediens, kas tek pa tā gaiteņiem no pamatnes līdz Acij centrā. Viņi sargā Marghar Labirintu. Viņiem katrs gaitenis, kas paliek stāvam, ir dvēsele, ko Bezsolis neatrod pirms laika.</p>' +
    '<p>Viņu taisnīgums ir vienkāršs: nevienu nemet Badam, pirms viņš ir gatavs. Viņu gods ir vēl vienkāršāks: pavedienu nekad negriež, un kas ieiet Labirintā ar kādu no viņiem, tas neiznāk viens, pat ne miris. Paladīni, dēmonu mednieki un burvji nes zelta pavedienu.</p>' });
  add({ lv: 'XV', body:
    '<h3>Atšķetinātie</h3>' +
    '<p>“<b>Katrs mūris ir meli.</b>” Atšķetināto vairogs ir melns un ieplaisājis, ar sārtu malu: labirints, salauzts gabalos, zobaina mute centrā, pārgriezts pavediens ar izspūrušiem galiem un divi asmeņi, sakrustoti aizmugurē. Viņi grib pārgriezt pavedienu un nojaukt mūrus. Viņiem Labirints ir būris, kas dvēseli atkal atdod ratam, dzīvi pēc dzīves, un Bads ir vienīgās durvis uz āru: īsta brīvība, pat brīvība nomirt uz visiem laikiem.</p>' +
    '<p>Viņu taisnīgums: nevienu nedrīkst sargāt pret viņa paša gribu. Viņu gods: nekad nemelot sev, un kas iet līdz mutei, tas iet ar atvērtām acīm, negrūžot tos, kas negrib iet. Vampīri, ragaņi un vilkači valkā pārgriezto pavedienu. Nesajauc: ne katrs Atšķetinātais ir Viesis. Daudzi negrib tikt aprīti; viņi grib tikai tikt ārā.</p>' });
  add({ lv: 'XV', body:
    '<h3>Kur katrs kļūdās</h3>' +
    '<p>Es jautāju abām pusēm, kuram taisnība, un abas man atbildēja ar vienādu pārliecību. Tāpēc es neuzticos nevienai no atbildēm. Pavediena ordenis kļūdās, kad aizsardzība kļūst par cietumu un citu vietā izlemj, ko nozīmē “būt gatavam”. Atšķetinātie kļūdās, kad nojauc mūri, aizmirstot, ka Bads nejautā, kurš gribēja iziet.</p>' +
    '<blockquote>Tie, kas aizstāv Labirintu, saka: Bads aprīs visu, līdz nepaliks neviens. Tie, kas grib to nojaukt, jautā: kas tā par brīvību, kurā es dzīvoju bezgalīgā lokā, labirinta iekšienē? Vai tas ir taisnīgums? Vai tā ir labestība?</blockquote>' +
    '<p>Šajā hronikā nav labās un ļaunās puses, un nebūs. Abos karogos ir apbrīnojami un kļūdaini tēli, un gājējam jāspēj saprast abus un šaubīties par abiem.</p>' +
    '<h3>Tie, kas nezvēr karogam</h3>' +
    '<p>Pirmā klase ir arī pirmais zvērests: kas kļūst par paladīnu, mednieku vai burvi, tas iestājas Pavedienā; kas kļūst par vampīru, vilkaci vai ragani, tas iestājas Atšķetinātajos. Divi ceļi paliek ārpusē. <b>Ziemeļu karotājs</b> ir haotisks un neitrāls: viņš slāpst pēc asinīm un nebaidās no nāves, un neviens labirints viņam nešķiet sargāšanas vai postīšanas vērts. <b>Tehnokrāts</b> ir patiesi neitrāls: viņš tic zinātnei un domā, ka var iet savu ceļu tālu no māņticības, pat dzīvojot tās vidū. Pēc klases sasniegšanas katrs izpilda sava meistara uzdevumu, kas apstiprina viņa nostāju.</p>' +
    '<h3>Par tautām un zvērestu</h3>' +
    '<p>Katra tauta nes karogiem savu solīšanas veidu. Cilvēks ir neitrāls, un tāpēc dotais vārds ir viss, kas viņam paliek: “ja mums nebūs izteiktā vārda stingrības, kas paliks pasaulē?”. Rūķis ir haotisks, bet haoss nav nekārtība: rūķa solījums ir kā rūķa bārda, to neviens neaizskar. Un elfs pēc dabas ir labs; elfs, kas kļūst par vampīru, vienā reizē salauž veselu savienības loku.</p>' +
    '<p>Priekšmetus ar ģerboni auž tikai katras puses karaliskās audētavas Askavikā, un tos drīkst valkāt tikai tie, kas jau zvērējuši, pēc trīsdesmitā. Ar laiku, saka, tie ir vērtīgāki kā skaistums nekā kā bruņas. Bet neviens, ko es pazīstu, nav tāpēc novilcis savu apmetni.</p>' });

  add({ toc: 'XVI grāmata — Kartogrāfu karte', lv: 'XVI', eyebrow: 'XVI grāmata', title: 'Karte, ko uzzīmēja kartogrāfi', start: true, body:
    '<p>Septītajā grāmatā es runāju par Karmiku tā, kā runā ceļotāji, no dzirdētā. Kopš tā laika Bibliotēkas kartogrāfi ir pabeiguši lielo karti, un es beidzot varu pateikt, kur kas atrodas. Viņi man iemācīja amata pirmo likumu: vispirms reljefs, tad ūdeņi, kas tek lejā no kalniem, tad meži, kas seko ūdenim, un tikai pēdējie ceļi, kas ir tirdzniecības maršruti un met līkumus tāpat kā tirgotāji.</p>' +
    '<h3>Cilvēku zemes</h3>' +
    '<p>Centrā ir Cilvēku zemes ar desmitiem ciemu. Tur atrodas <b>Karmika</b>, ciems, kurā dzimst cilvēki, ar strūklaku laukumā un ziņojumu dēli blakus sargam. Uz ziemeļiem no tā paceļas <b>Askavik</b>, akadēmiju pilsēta, kurp jebkura tauta dodas izvēlēties, par ko kļūs. Un vienā tumšā šo pašu zemju ielejā <b>Pamestā katedrāle</b>, par kuru runāšu vēlāk.</p>' });
  add({ lv: 'XVI', body:
    '<h3>Apkārtējās zemes</h3>' +
    '<ul class="plain">' +
    '<li>Ziemeļrietumos <b>Vikingu kalns</b>: fjordi, jarli, Odina cietoksnis un Jarlsheim, Skjoldvik un Hrimgard ciemi, kur sniegs nekūst, tikai pārvietojas.</li>' +
    '<li>Ziemeļaustrumos <b>Melnais kalns</b>, vulkāns, kas naktī krāc, ar lavu un dimantu dzīslām. Tā pakājē atrodas <b>Ogļkalve</b>, kur dzimst rūķi, un augstāk Pelnkalns.</li>' +
    '<li>Aiz Melnā kalna paslēpies <b>Vampīru kalns</b> ar Grāfa pili un Tumšvārnas ciemu. Tur logus aizver līdz ar krēslu.</li>' +
    '<li>Austrumos <b>Posta ieleja</b>, kur Malgrath māca ragaņus un pat kvieši aug ar nolaistu galvu.</li>' +
    '<li>Rietumos <b>Elfu meži</b> ar Aelvaren milzīgajos kokos un <b>Lithendel</b>, kur dzimst elfi.</li>' +
    '<li>Dienvidrietumos <b>Apburtais mežs</b> un <b>Ziloņkaula smaile</b>, astoņdesmit metru augsts tornis, kas naktī iedegas.</li>' +
    '<li>Tālajos dienvidaustrumos <b>Vilkaču džungļi</b> un Senās gaudas cilts.</li>' +
    '<li>Dienvidos <b>Tvaika un smēres krasts</b> ar Katlu Ostu, Rūsu un Tvaicēni, kur laivas airē pašas.</li>' +
    '</ul>' +
    '<p>Kartogrāfi man iemācīja arī lasīt briesmas. Tuvu šūpuļiem un pilsētām zeme ir rāma; jo tālāk, jo vairāk tā kož. Pat Melnais kalns, kas savā pakājē šūpo rūķus, sirdī glabā radības, ko neviens māceklis nedrīkstētu apmeklēt.</p>' +
    '<h3>Hronista piezīmes</h3><p class="fnote"><span class="nb">✎</span>Pārrakstot sešus stāstus šajā sējumā, es pamanīju, ka trijos no tiem garāmejot parādās vīrs pelēkā apmetnī: uz Velmora tilta, piedāvājot laivu; Thrain galerijās, pērkot pāri palikušo dzelzi; pie Ossária vārtiem, iepriekšējā vakarā, jautājot ceļu. Neviens neapraksta seju. Visi apraksta apmetni.</p>'  });

  add({ toc: 'XVII grāmata — Pirmais pavediens', lv: 'XVII', eyebrow: 'XVII grāmata', title: 'Karmikas ciems un pirmais pavediens', start: true, body:
    '<p>Katra cilvēka dvēsele sākas vienā un tajā pašā vietā, un es aizgāju turp, lai dzirdētu, kā tā sākas. Karmikas ciems ir mazs: strūklaka, akmens laukums, krogs, kalve, templis un sargs, kas neatiet no vārtiem. Tur nav varoņu. Tur ir cilvēki, kam vajag palīdzību, un katra stāsta pirmais pavediens vienmēr ir tas pats: kādam vajag tevi.</p>' +
    '<h3>Tie, kas gaida laukumā</h3>' +
    '<p><b>Garrick</b>, sargs, dod pirmās medības un sāk ar mazumiņu, ar kapsētas sarkanajām žurkām. <b>Lúcia</b> meklē vīru, kas pazuda pie Pamestās baznīcas. <b>Eldrin</b>, tempļa gudrais, sūta jaunpienācējus uz Aizmirsto kapsētu un drupām, no kurām līst sīkvelni. <b>Doran</b>, ieroču kalējs, māca izgatavot pirmo cirvi. <b>Thorin</b>, rūķu tirgotājs, pērk visu un smejas par visu. Un ir alķīmiķe <b>Morwen</b>, medniece <b>Kaela</b> un dzīvnieku pieradinātājs <b>Corwin</b>, kas rūpējas par jājamdzīvniekiem. To vārdi, kas ciemā noteic, skan pēc piedzīvojuma; ziemeļnieku vārdus dzird tikai starp rūķiem un ziemeļos.</p>' });
  add({ lv: 'XVII', body:
    '<h3>Ziemeļu ceļš</h3>' +
    '<p>Ciema ļaudis stāsta to pašu secību, ar nelielām izmaiņām atkarībā no stāstītāja. Vispirms žurkas, ceļa koijoti un austrumu vilki. Pēc tam Meža sargs, sens koks, kas sajuka prātā un sāka uzbrukt malkas cirtējiem. Pēc tam ēnas drupās un visbeidzot tas, kas mīt baznīcā: <b>Pelnu princis</b>. Kas sasniedz šī ceļa galu, tas Garrick priekšā dod Ziemeļu zvērestu, un ciems pārstāj būt visa viņa pasaule.</p>' +
    '<p>Es pamanīju ko dīvainu: neviens Karmikā nepaliek bez virziena. Kad viens uzdevums beidzas, kāds jau norāda nākamo: “ej parunā ar to un to”, “citā pilsētā kādam vajag palīdzību”, “šeit tu esi izdarījis visu, ko varēji”. Priesteri saka, ka tas ir Labirinta pavediens, ko nekad nepazaudē no redzesloka.</p>' +
    '<h3>Askavik aicinājums</h3>' +
    '<p>Divdesmit piektajā līmenī pienāk vēstule. Eldrin to pasniedz ar trīcošu roku: Askavik aicina. Tur jaunpienācējs iepazīst <b>meistaru Halvard</b> no Kara skolas, abu karogu audētavas, tirgu, baznīcu un Elowen veikalu. Un viņš iepazīst <b>Veco Gunnhild</b>, relikviju sargātāju, kas viņu aizved pie Gaišreģes.</p>' });
  add({ lv: 'XVII', body:
    '<h3>Ceļu Gaišreģe</h3>' +
    '<p><b>Hrefna</b> dzīvo stāvošu akmeņu svētvietā, aiz violetas gaismas plīvura, un viņas priekšā bezgalīgi birst smilšu strūkla. Marghar nav priesteru, bet ir tie, kas viņam seko labprātīgi, un Hrefna ir viena no tiem. Viņa seko Esencēm, tām, kas iet līdzās Marghar, un tauta par Ceļu dievieti sauc to, kurai viņa visvairāk dedzina sveces: Ilmara, Soļu Kartogrāfe, kas pirmā kartēja labirintu. Viņai pieder Atgriešanās rullis, kas atver gaismas ceļu līdz mājas strūklakai.</p>' +
    '<p>Viņa uzdod divpadsmit jautājumus. “Ievainots vilks naktī šķērso tavu ceļu. Tu…” “Ko tu visvairāk baidies zaudēt?” “Aizslēgtu durvju priekšā tu…” Katra atbilde sver par labu diviem vai trim ceļiem, un līdz tam savāktā karma sver līdzi. Beigās viņa nosauc spēcīgāko ceļu un otro un atdod izvēli atpakaļ:</p>' +
    '<blockquote>Tas, ko es redzēju, ir tas, uz ko sliecas tava dvēsele, nevis ķēde. Karmikā izvēlas tu.</blockquote>' +
    '<p>Kas piekrīt, tas dodas ceļā pie meistara: <b>Thorgrim Dzelzsroka</b> Odina cietoksnī; <b>Lielmeistars Cassius</b> Ausmas abatijā; <b>Ilsa Van Rhal</b> Sudraba bastionā; <b>Arhitekte Ylva</b> Askavik akadēmijā; <b>Grāfs Vladislav III</b> Kalnā; <b>Ulfrun, Alfa māte</b>, Senajās gaudās; <b>Arhimags Aurelian Vesk</b> Smailē; un <b>Malgrath</b> Ielejā. Kas dod priekšroku gaidīt, tas paliek cilvēks, un ir tādi, kas tā pavada visu dzīvi, ceļot mājas, mūrus un ģildes.</p>' +
    '<h3>Hronista piezīmes</h3><p class="fnote"><span class="nb">✎</span>Purvāju līgavai ir tas pats vārds, kas Sārtajai Mātei. Ciema ļaudis saka, ka tā ir sakritība, ka Hemara tajos laikos bija parasts vārds. Kalna vampīri, cik man zināms, nekad neizrunā savas dievietes vārdu, šķērsojot purvājus.</p><p class="fnote"><span class="nb">✎</span>Es saskaitīju Hrefnas sveces. To ir desmit. Es jautāju, kam pieder desmitā, vienīgā, ko viņa nekad neaizdedz. Viņa atbildēja, ka, kad atcerēsies, pastāstīs.</p>'  });

  add({ toc: 'XVIII grāmata — Pamestā katedrāle', lv: 'XVIII', eyebrow: 'XVIII grāmata', title: 'Pamestā katedrāle', start: true, body:
    '<p>Netālu no Karmikas ir katedrāle, ko dienā vairs neviens neapmeklē. Tā piederēja baznīcai un pēc tam bīskapam, kurš pārstāja lūgties Auréon un sāka klāt galdu kādam citam. Pie durvīm, saistīta ar važām, kas nav no šīs pasaules, gaida <b>māsa Ysolde</b>, zilgans gars, kas lūdz garāmgājējiem attīrīt jomu.</p>' +
    '<h3>Upura trauks</h3>' +
    '<p>Mirušie tur iekšā nepaliek miruši. Tāpēc nevienas durvis neatveras, nogalinot visus: katrā stāvā ir <b>Upura trauks</b>, kas pildās ar to asinīm, kas tur krīt. Zombiji dod maz, maitēdāji vairāk, un kriptu sargi piepilda kausu vienā reizē. Līdz pēdējām durvīm vajag <b>sešsimt sešdesmit sešus litrus</b>: simt vienpadsmit pirmajā stāvā, simt sešdesmit sešus otrajā, divsimt divdesmit divus trešajā un simt sešdesmit septiņus ceturtajā.</p>' });
  add({ lv: 'XVIII', body:
    '<h3>Kritušais bīskaps</h3>' +
    '<p>Trīs kriptu sargi nes trīs zīmogus: Kriptu bende, Kaulu princis un Mauzoleja sargs. Kas savāc visus trīs un piepilda kausu, tas dziļumā atrod <b>Kritušo bīskapu</b>. Viņš paceļ zizli un saka, ka Gorvak ir izsalcis un ka viņš ir mute. Kad viņš asiņo, viņš sauc kriptu ganāmpulku; kad asiņo vairāk, sauc maitēdājus un princi.</p>' +
    '<p>Gorvak, Bezgalīgais Mielasts, par kuru runāju otrajā grāmatā, nekad neko neprasa. Viņš tikai klāj galdu. Katedrāle ir pierādījums, ka kāds vienmēr pieņem ielūgumu.</p>' +
    '<h3>Hronista piezīmes</h3><p class="fnote"><span class="nb">✎</span>Ysolde vienmēr skaita mērus skaļi, kamēr trauki pildās. Kas pamet Katedrāli pirms beigām, dzird viņu sākam no nulles. Viņas važas ir melnas un aukstas kā Ishkaras važas, bet tām ir viens posms, tikai viens, no zelta. Ishkara zeltu nelieto.</p>'  });

  add({ toc: 'XIX grāmata — Kraukļa klans', lv: 'XIX', eyebrow: 'XIX grāmata', title: 'Kraukļa klans', start: true, body:
    '<p>No astoņiem ceļiem pirmais, kam Bibliotēka varēja sekot no tuvuma, bija karotāja ceļš. Es uzkāpu Odina cietoksnī pakaļ Thorgrim Dzelzsrokam, Kraukļa klana ieroču meistaram, un pierakstīju desmit pārbaudījumus, ko viņš dod tiem, kas ierodas. Katrā no tiem Acs vērtē nevis to, kas izdarīts, bet kāpēc.</p>' +
    '<h3>Zvērests</h3>' +
    '<p>Pirmais pārbaudījums ir zvērēt. Zvēr par tiem, kas nevar cīnīties, vai par klanu un Odinu, vai par paša slavu, un Acs katru no trim solījumiem sver citādi. Pēc tam nāk Skjoldvik fjords, staigājošie mirušie un dzelzs cietoksnim.</p>' +
    '<h3>Dezertieris</h3>' +
